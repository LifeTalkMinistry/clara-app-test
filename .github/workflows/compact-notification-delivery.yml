name: Compact Notification Delivery

on:
  push:
    branches:
      - fix/compact-notification-delivery

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/compact-notification-delivery
          fetch-depth: 0

      - name: Apply compact delivery patch
        run: node .github/scripts/compact-notification-delivery.mjs

      - name: Verify notification contracts
        run: |
          git diff --check
          node --test tests/notification-runtime-contracts.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/compact-notification-delivery.yml .github/scripts/compact-notification-delivery.mjs
          git add src/components/notifications/NotificationSettingsPanel.jsx tests/notification-runtime-contracts.test.mjs
          git commit -m "Compact phone notification delivery controls"
          git push origin HEAD:fix/compact-notification-delivery
