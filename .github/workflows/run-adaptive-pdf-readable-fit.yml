name: Run adaptive PDF readable-fit validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-adaptive-pdf-readable-fit.yml"
      - ".github/workflows/run-adaptive-pdf-readable-fit.yml"
      - "src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx"

permissions:
  contents: write

jobs:
  patch-build-and-clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and apply adaptive readable-fit patch
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-adaptive-pdf-readable-fit.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          start = lines.index("          python <<'PY'") + 1
          end = lines.index("          PY", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines[start:end]
          )
          Path("/tmp/apply-adaptive-readable-fit.py").write_text(
              script,
              encoding="utf-8",
          )
          PY
          python /tmp/apply-adaptive-readable-fit.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build default target
        run: npm run build

      - name: Build web target
        run: npm run build:web

      - name: Commit validated reader-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-adaptive-pdf-readable-fit.yml
          git rm .github/workflows/run-adaptive-pdf-readable-fit.yml
          git add src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx
          git commit -m "Improve adaptive PDF fit readability"
          git push origin ${{ github.event.pull_request.head.ref }}
