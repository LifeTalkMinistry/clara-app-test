name: Apply Money Schedule inline Add

on:
  push:
    branches:
      - fix/money-schedule-inline-add-direct
    paths:
      - ".github/workflows/apply-money-schedule-inline-add.yml"
      - "scripts/apply_money_schedule_inline_add.py"

permissions:
  contents: write

jobs:
  apply-inline-add:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/money-schedule-inline-add-direct

      - name: Apply inline Add update
        run: python scripts/apply_money_schedule_inline_add.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused Money Schedule regression tests
        run: node --test tests/clara-log-expense-flow-source.test.mjs

      - name: Build check
        run: npm run build

      - name: Remove one-time patch helpers
        run: |
          rm .github/workflows/apply-money-schedule-inline-add.yml
          rm scripts/apply_money_schedule_inline_add.py

      - name: Commit verified inline Add update
        run: |
          if git diff --quiet; then
            echo "No Money Schedule inline Add changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Money Schedule Add direct and inline"
          git push origin HEAD:fix/money-schedule-inline-add-direct
