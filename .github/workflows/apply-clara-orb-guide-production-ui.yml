name: Apply and verify CLARA Orb Guide

on:
  push:
    branches:
      - fix/real-clara-orb-guide-production-ui
    paths:
      - .github/workflows/apply-clara-orb-guide-production-ui.yml

permissions:
  contents: write

jobs:
  apply-build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/real-clara-orb-guide-production-ui
          fetch-depth: 0
          persist-credentials: true

      - name: Restore reviewed refactor script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scripts
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/dcea3fbea584fe315bb38aa0e0c628b2211f8c9f --jq .content \
            | tr -d '\n' \
            | base64 -d \
            > scripts/apply_clara_orb_guide_refactor.py

      - name: Apply strict refactor
        run: python3 scripts/apply_clara_orb_guide_refactor.py

      - name: Check patch formatting
        run: git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Commit verified implementation
        run: |
          rm -f scripts/apply_clara_orb_guide_refactor.py
          rm -f .github/workflows/apply-clara-orb-guide-production-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use production UI in CLARA orb guide"
          git push origin HEAD:fix/real-clara-orb-guide-production-ui
