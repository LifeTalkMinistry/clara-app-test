name: Apply verified Money Schedule inline Add

on:
  push:
    branches:
      - fix/money-schedule-inline-add-verified
    paths:
      - .github/workflows/apply-clara-orb-guide-production-ui.yml

permissions:
  contents: write

jobs:
  apply-build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/money-schedule-inline-add-verified
          fetch-depth: 0
          persist-credentials: true

      - name: Apply Money Schedule inline Add update
        run: python3 scripts/apply_money_schedule_inline_add.py

      - name: Check patch formatting
        run: git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused Money Schedule regression tests
        run: node --test tests/clara-log-expense-flow-source.test.mjs

      - name: Build production application
        run: npm run build

      - name: Restore workflow and remove one-time patcher
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/apply-clara-orb-guide-production-ui.yml
          rm -f scripts/apply_money_schedule_inline_add.py

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Money Schedule Add direct and inline"
          git push origin HEAD:fix/money-schedule-inline-add-verified
