name: Fix native Orb means UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[native-orb-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch native Orb hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path

          orb = Path('src/components/community/ClaraOrbPage.jsx')
          text = orb.read_text()
          old = '''          <p className="mt-2 text-[12px] font-semibold tracking-[0.01em] text-white/48 sm:text-[13px]">
            Tap CLARA to start
          </p>'''
          if old not in text:
              raise SystemExit('Expected Tap CLARA block not found')
          text = text.replace(old, '''          <div
            data-clara-orb-means-placeholder="true"
            className="mt-2 text-[11px] font-extrabold tracking-[0.005em] text-white/42"
            aria-live="polite"
          >
            — · Means score
          </div>''', 1)

          css_anchor = '''        .clara-orb-status-copy,
        .clara-orb-idle-copy {
          transition: opacity 150ms ease, transform 180ms cubic-bezier(.22,1,.36,1), color 150ms ease;
        }
'''
          css_extra = '''        .clara-orb-status-copy,
        .clara-orb-idle-copy {
          transition: opacity 150ms ease, transform 180ms cubic-bezier(.22,1,.36,1), color 150ms ease;
        }

        .clara-orb-idle-copy:has([data-clara-orb-means-metric="true"]) [data-clara-orb-means-placeholder="true"] {
          display: none;
        }
'''
          if css_anchor in text and 'data-clara-orb-means-placeholder="true"] {' not in text:
              text = text.replace(css_anchor, css_extra, 1)
          orb.write_text(text)

          runtime = Path('src/runtime/installClaraOrbGreeting.js')
          r = runtime.read_text()
          old_null = '''  let root = idleCopy.querySelector(`[${MEANS_METRIC_ATTR}="true"]`);
  if (!snapshot) {
    root?.remove();
    return null;
  }
'''
          new_null = '''  let root = idleCopy.querySelector(`[${MEANS_METRIC_ATTR}="true"]`);
  if (!snapshot) {
    root?.remove();
    return null;
  }
'''
          # Keep the metric data-gated; the React placeholder owns the neutral state.
          if old_null in r:
              r = r.replace(old_null, new_null, 1)
          runtime.write_text(r)
          PY

      - name: Commit native Orb fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "LifeTalk Ministry"
          git config user.email "96472293+LifeTalkMinistry@users.noreply.github.com"
          git add src/components/community/ClaraOrbPage.jsx src/runtime/installClaraOrbGreeting.js
          git commit -m "Fix native Orb hierarchy and Means slot [native-orb-fixed]"
          git push origin main
