name: Patch dashboard theme persistence hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard-theme-persistence-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardThemePersistence into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardThemePersistence from "@/components/fresh/main-dashboard/dashboard-theme/useDashboardThemePersistence";\n'
          import_anchor = 'import useDashboardThemeClasses from "@/components/fresh/main-dashboard/dashboard-theme/useDashboardThemeClasses";\n'

          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Dashboard theme classes import anchor not found. Refusing to patch Dashboard.jsx.")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          block_start = '  useEffect(() => {\n    const themeKey = normalizeString(\n      selectedDashboardTheme?.key ||\n'
          block_end = '  const refreshTimeoutRef = useRef(null);\n'

          if block_start in text:
              start_index = text.index(block_start)
              end_index = text.index(block_end, start_index)
              old_block = text[start_index:end_index]
              required_tokens = [
                  'persistDashboardTheme(userId, themeKey);',
                  'dispatchClaraEvent("clara-dashboard-theme-updated", detail);',
                  'dispatchClaraEvent("clara-theme-selected", detail);',
                  'dispatchClaraEvent("clara-theme-change", detail);',
                  'document.documentElement.dataset.dashboardTheme = themeKey;',
                  'document.body.dataset.theme = themeKey;',
                  '}, [selectedDashboardTheme, userId]);',
              ]
              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("Dashboard theme persistence block does not match expected content. Refusing to patch Dashboard.jsx.")
              replacement = (
                  "  useDashboardThemePersistence({\n"
                  "    selectedDashboardTheme,\n"
                  "    userId,\n"
                  "  });\n\n"
              )
              text = text[:start_index] + replacement + text[end_index:]
          elif 'useDashboardThemePersistence({' not in text:
              raise SystemExit("Dashboard theme persistence block not found and hook is not wired. Refusing to patch Dashboard.jsx.")

          unused_import_line = '  persistDashboardTheme,\n'
          if unused_import_line in text:
              text = text.replace(unused_import_line, '', 1)

          if 'useDashboardThemePersistence({' not in text:
              raise SystemExit("useDashboardThemePersistence was not wired. Refusing to continue.")
          if 'persistDashboardTheme(userId, themeKey);' in text:
              raise SystemExit("Old dashboard theme persistence call still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-dashboard-theme-persistence-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-dashboard-theme-persistence-hook.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Wire dashboard theme persistence hook"
          git push
