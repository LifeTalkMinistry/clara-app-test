name: Validate unified membership display

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/validate-unified-membership-display.yml
      - .github/scripts/unify-membership-display.mjs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply display patch
        run: node .github/scripts/unify-membership-display.mjs
      - name: Install dependencies
        run: npm ci
      - name: Lint Settings panel
        run: npx eslint src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx
      - name: Build production app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: validation-placeholder
          VITE_GEMINI_API_KEY: validation-placeholder
      - name: Package validated component
        run: |
          mkdir -p validated/src/components/fresh/main-dashboard/dashboard-panels/settings
          cp src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx validated/src/components/fresh/main-dashboard/dashboard-panels/settings/
      - uses: actions/upload-artifact@v4
        with:
          name: unified-membership-display
          path: validated
          retention-days: 1
