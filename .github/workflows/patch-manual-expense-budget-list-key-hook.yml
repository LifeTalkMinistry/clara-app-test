name: Patch manual expense budget list key hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-manual-expense-budget-list-key-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useManualExpenseBudgetListKey into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useManualExpenseBudgetListKey from "@/components/fresh/main-dashboard/finance-form/useManualExpenseBudgetListKey";\n'
          import_anchor = 'import useDashboardManualExpenseValidation from "@/components/fresh/main-dashboard/finance-form/useDashboardManualExpenseValidation";\n'
          fallback_anchor = 'import useDashboardFinanceUiState from "@/components/fresh/main-dashboard/finance-form/useDashboardFinanceUiState";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Manual expense budget list key import anchor not found. Refusing to patch Dashboard.jsx.")

          if 'useManualExpenseBudgetListKey({' not in text:
              pattern = re.compile(
                  r'  const setManualExpenseBudgetListKey = useCallback\(\(nextValue\) => \{\n'
                  r'    setFinanceForm\(\(prev\) => \(\{\n'
                  r'      \.\.\.prev,\n'
                  r'      budgetListKey: nextValue,\n'
                  r'      unplannedReason:\n'
                  r'        nextValue === "__unplanned__" \? prev\.unplannedReason : "",\n'
                  r'      undocumentedReason:\n'
                  r'        nextValue === "__undocumented__" \? prev\.undocumentedReason : "",\n'
                  r'      undocumentedNote:\n'
                  r'        nextValue === "__undocumented__" \? prev\.undocumentedNote : "",\n'
                  r'      notes:\n'
                  r'        nextValue === "__unplanned__" \|\| nextValue === "__undocumented__"\n'
                  r'          \? prev\.notes\n'
                  r'          : "",\n'
                  r'    \}\)\);\n'
                  r'    setBudgetListOpen\(false\);\n'
                  r'  \}, \[\]\);\n\n',
                  re.DOTALL,
              )

              replacement = (
                  '  const setManualExpenseBudgetListKey = useManualExpenseBudgetListKey({\n'
                  '    setFinanceForm,\n'
                  '    setBudgetListOpen,\n'
                  '  });\n\n'
              )

              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("Manual expense budget list key callback block not found. Refusing to patch Dashboard.jsx.")

          if 'useManualExpenseBudgetListKey({' not in text:
              raise SystemExit("useManualExpenseBudgetListKey was not wired. Refusing to continue.")
          if 'const setManualExpenseBudgetListKey = useCallback((nextValue) => {' in text:
              raise SystemExit("Old setManualExpenseBudgetListKey callback still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-manual-expense-budget-list-key-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-manual-expense-budget-list-key-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire manual expense budget list key hook"
          git push
