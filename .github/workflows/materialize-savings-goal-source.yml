name: Materialize Savings Goal Source

on:
  push:
    branches:
      - agent/remove-savings-build-transform

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-savings-build-transform
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Materialize managed Savings Goal behavior
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { transformSavingsGoalsManagedBalance } from "./src/build/savingsGoalManagedBalanceTransform.js";

          const pagePath = "src/pages/SavingsGoalsIntegrated.jsx";
          const original = readFileSync(pagePath, "utf8");
          const materialized = transformSavingsGoalsManagedBalance(original);
          if (materialized === original) {
            throw new Error("Savings Goal managed-balance transform made no changes.");
          }
          writeFileSync(pagePath, materialized);
          NODE

      - name: Remove build-time rewriting and update test suite
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const vitePath = "vite.config.js";
          let vite = readFileSync(vitePath, "utf8");
          const transformImport = 'import { savingsGoalManagedBalancePlugin } from "./src/build/savingsGoalManagedBalanceTransform.js";\n';
          const transformedPlugins = "  plugins: [savingsGoalManagedBalancePlugin(), react()],";
          if (!vite.includes(transformImport) || !vite.includes(transformedPlugins)) {
            throw new Error("Vite Savings Goal transform wiring was not found.");
          }
          vite = vite.replace(transformImport, "").replace(transformedPlugins, "  plugins: [react()],");
          writeFileSync(vitePath, vite);

          const packagePath = "package.json";
          const pkg = JSON.parse(readFileSync(packagePath, "utf8"));
          const oldTest = "tests/savings-goal-managed-balance-transform.test.mjs";
          const directSourceTest = "tests/savings-goal-managed-balance-source.test.mjs";
          const debtTest = "tests/debt-obligation-integrity.test.mjs";
          const parts = String(pkg.scripts.test || "").split(/\s+/).filter(Boolean).filter((part) => part !== oldTest);
          if (!parts.includes(directSourceTest)) parts.push(directSourceTest);
          if (!parts.includes(debtTest)) parts.push(debtTest);
          pkg.scripts.test = parts.join(" ");
          writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          cat > tests/savings-goal-managed-balance-source.test.mjs <<'TEST'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { existsSync, readFileSync } from "node:fs";

          const readSource = (relativePath) =>
            readFileSync(new URL(`../${relativePath}`, import.meta.url), "utf8");

          const page = readSource("src/pages/SavingsGoalsIntegrated.jsx");
          const vite = readSource("vite.config.js");

          test("managed Savings Goal balance behavior lives in source code", () => {
            assert.match(page, /const handleReleaseSavings = async/);
            assert.match(page, /const handleCorrectSavingsBalance = async/);
            assert.match(page, /walletCapacity=\{getGoalWalletCapacity\(detailGoal\)\}/);
            assert.match(page, /onReleaseSavings=\{handleReleaseSavings\}/);
            assert.match(page, /onCorrectSavingsBalance=\{handleCorrectSavingsBalance\}/);
            assert.match(page, /Manage Saved Amount/);
            assert.match(page, /Savings balance needs correction/);
          });

          test("Vite no longer rewrites Savings Goals during compilation", () => {
            assert.doesNotMatch(vite, /savingsGoalManagedBalancePlugin|savingsGoalManagedBalanceTransform/);
            assert.equal(
              existsSync(new URL("../src/build/savingsGoalManagedBalanceTransform.js", import.meta.url)),
              false,
            );
          });
          TEST

          cat > tests/debt-obligation-integrity.test.mjs <<'TEST'
          import test from "node:test";
          import assert from "node:assert/strict";
          import {
            DEBT_OBLIGATION_RECORD_KIND,
            estimateDebtPayoffMonths,
            getDebtObligationMode,
            getNextDebtDueDate,
            isActiveDebtObligation,
            isDebtLinkedExpense,
            summarizeDebtObligationsPure,
          } from "../src/lib/debtObligationMath.js";

          test("legacy paid balances stay inactive while recurring obligations remain active", () => {
            const legacyPaid = {
              recordKind: DEBT_OBLIGATION_RECORD_KIND,
              status: "active",
              totalDebt: 0,
              monthlyDebt: 2500,
            };
            assert.equal(getDebtObligationMode(legacyPaid), "balance");
            assert.equal(isActiveDebtObligation(legacyPaid), false);
            assert.equal(isActiveDebtObligation({ ...legacyPaid, obligationMode: "recurring" }), true);
          });

          test("completed balances are excluded from current debt pressure", () => {
            const summary = summarizeDebtObligationsPure([
              {
                recordKind: DEBT_OBLIGATION_RECORD_KIND,
                status: "active",
                obligationMode: "balance",
                totalDebt: 50000,
                monthlyDebt: 6000,
              },
              {
                recordKind: DEBT_OBLIGATION_RECORD_KIND,
                status: "completed",
                obligationMode: "balance",
                totalDebt: 0,
                monthlyDebt: 4000,
              },
            ], { income: 30000 });
            assert.equal(summary.activeCount, 1);
            assert.equal(summary.monthlyDebt, 6000);
            assert.equal(summary.debtRatio, 20);
          });

          test("payoff math handles interest and negative amortization", () => {
            const withoutInterest = estimateDebtPayoffMonths({ balance: 10000, monthlyPayment: 1000, annualInterestRate: 0 });
            const withInterest = estimateDebtPayoffMonths({ balance: 10000, monthlyPayment: 1000, annualInterestRate: 24 });
            const impossible = estimateDebtPayoffMonths({ balance: 100000, monthlyPayment: 1000, annualInterestRate: 24 });
            assert.equal(withoutInterest, 10);
            assert.ok(withInterest > withoutInterest);
            assert.equal(impossible, Number.POSITIVE_INFINITY);
          });

          test("monthly due dates roll forward and debt expenses remain identifiable", () => {
            const next = getNextDebtDueDate({ dueDate: "2025-01-31" }, new Date("2026-02-10T00:00:00"));
            assert.equal(next?.getFullYear(), 2026);
            assert.equal(next?.getMonth(), 1);
            assert.equal(next?.getDate(), 28);
            assert.equal(isDebtLinkedExpense({ linked_target_type: "debt" }, []), true);
            assert.equal(isDebtLinkedExpense({ category: "Home Credit" }, [{ title: "Home Credit" }]), true);
            assert.equal(isDebtLinkedExpense({ category: "Groceries" }, [{ title: "Home Credit" }]), false);
          });
          TEST

          rm -f src/build/savingsGoalManagedBalanceTransform.js
          rm -f tests/savings-goal-managed-balance-transform.test.mjs
          rm -f .github/workflows/materialize-savings-goal-source.yml

      - name: Install dependencies
        run: npm ci

      - name: Run repository tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json vite.config.js src/pages/SavingsGoalsIntegrated.jsx src/build tests .github/workflows/materialize-savings-goal-source.yml
          git commit -m "Materialize Savings Goal balance logic"
          git push origin HEAD:agent/remove-savings-build-transform
