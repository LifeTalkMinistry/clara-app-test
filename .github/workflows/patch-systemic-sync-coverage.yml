name: Patch systemic cross-device sync coverage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-systemic-sync-coverage.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply persistence-layer sync hardening
        shell: bash
        run: |
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/lib/localFinanceStore.js")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''let dbPromise = null;

function getIndexedDb() {''',
                  '''let dbPromise = null;

export const CLARA_LOCAL_FINANCE_UPDATED_EVENT = "clara-local-finance-updated";
const MUTATION_PREFLIGHT_HOOK = "__claraPrepareServerFinanceMutation";

async function prepareServerFinanceMutation(localUserId, context = {}) {
  const hook = globalThis?.[MUTATION_PREFLIGHT_HOOK];
  if (typeof hook !== "function") return null;

  try {
    return await hook({
      localUserId,
      ...context,
    });
  } catch {
    // CLARA remains offline-first. A failed preflight must not prevent a local write.
    return null;
  }
}

function dispatchLocalFinanceUpdated(detail = {}) {
  if (typeof window === "undefined") return;
  window.dispatchEvent(
    new CustomEvent(CLARA_LOCAL_FINANCE_UPDATED_EVENT, {
      detail: {
        source: "local_finance_store",
        ...detail,
      },
    })
  );
}

function getIndexedDb() {''',
              ),
              (
                  '''  if (typeof callback !== "function") {
    throw new Error("A local finance transaction callback is required.");
  }

  const db = await openLocalFinanceDb();''',
                  '''  if (typeof callback !== "function") {
    throw new Error("A local finance transaction callback is required.");
