          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected source block was not found:\n{old[:240]}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          cat > tests/systemic-sync-coverage.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs/promises";

          const localStoreSource = await fs.readFile(
            new URL("../src/lib/localFinanceStore.js", import.meta.url),
            "utf8",
          );
          const bridgeSource = await fs.readFile(
            new URL("../src/components/CloudVaultSyncBridge.jsx", import.meta.url),
            "utf8",
          );
          const snapshotSource = await fs.readFile(
            new URL("../src/lib/cloud-vault-snapshot.js", import.meta.url),
            "utf8",
          );

          test("every private IndexedDB write reaches the online sync bridge", () => {
            assert.match(localStoreSource, /CLARA_LOCAL_FINANCE_UPDATED_EVENT/);
            assert.match(localStoreSource, /__claraPrepareServerFinanceMutation/);
            assert.match(localStoreSource, /mode === "readwrite"[\s\S]*prepareServerFinanceMutation/);
            assert.match(localStoreSource, /dispatchLocalFinanceUpdated\([\s\S]*operation: "transaction"/);
            assert.match(localStoreSource, /operation: "upsert"/);
            assert.match(localStoreSource, /operation: "soft_delete"/);
            assert.match(localStoreSource, /operation: "hard_delete"/);
            assert.match(localStoreSource, /operation: "clear_private_data"/);
            assert.match(localStoreSource, /operation: "clear_vault"/);
          });

          test("localStorage-backed features and foreground devices trigger sync", () => {
            assert.match(bridgeSource, /prototype\.setItem = patchedSetItem/);
            assert.match(bridgeSource, /prototype\.removeItem = patchedRemoveItem/);
            assert.match(bridgeSource, /clara:syncable-local-storage-changed/);
            assert.match(bridgeSource, /window\.addEventListener\("focus"/);
            assert.match(bridgeSource, /visibilitychange/);
            assert.match(bridgeSource, /FOREGROUND_SYNC_INTERVAL_MS/);
            assert.match(bridgeSource, /__claraPrepareServerFinanceMutation/);
          });

          test("device-only check-in state remains excluded from account sync", () => {
            assert.match(bridgeSource, /\^clara_daily_check_in_/);
            assert.match(snapshotSource, /DEVICE_ONLY_STORAGE_KEY_PATTERN\s*=\s*\/\^clara_daily_check_in_\/i/);
          });
          EOF

          rm .github/workflows/patch-systemic-sync-coverage.yml

      - name: Run targeted sync tests
        shell: bash
        run: |
          node --test \
            tests/systemic-sync-coverage.test.mjs \
            tests/budget-reset-cross-device-sync.test.mjs \
            tests/cloud-vault-sync.test.mjs

      - name: Commit systemic sync hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/localFinanceStore.js tests/systemic-sync-coverage.test.mjs .github/workflows/patch-systemic-sync-coverage.yml
          git diff --cached --check
          git commit -m "Cover all local feature writes in account sync"
          git push origin HEAD:main
