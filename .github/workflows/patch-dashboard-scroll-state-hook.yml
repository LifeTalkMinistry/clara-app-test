name: Patch dashboard scroll state hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard-scroll-state-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardScrollState into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardScrollState from "@/components/fresh/main-dashboard/shell/useDashboardScrollState";\n'
          import_anchor = 'import useDashboardPanelNavigation from "@/components/fresh/main-dashboard/shell/useDashboardPanelNavigation";\n'
          fallback_anchor = 'import useDashboardShellReady from "@/components/fresh/main-dashboard/shell/useDashboardShellReady";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Dashboard scroll state import anchor not found. Refusing to patch Dashboard.jsx.")

          state_line = '  const [isDashboardScrollable, setIsDashboardScrollable] = useState(false);\n'
          scroll_block = (
              '  const {\n'
              '    dashboardScrollRef,\n'
              '    dashboardContentRef,\n'
              '    dashboardScrollTimersRef,\n'
              '    isDashboardScrollable,\n'
              '    setIsDashboardScrollable,\n'
              '  } = useDashboardScrollState();\n'
          )

          if scroll_block not in text:
              if state_line not in text:
                  raise SystemExit("isDashboardScrollable state line not found. Refusing to patch Dashboard.jsx.")
              text = text.replace(state_line, scroll_block, 1)

          for old_line in [
              '  const dashboardScrollRef = useRef(null);\n',
              '  const dashboardContentRef = useRef(null);\n',
              '  const dashboardScrollTimersRef = useRef([]);\n',
          ]:
              if old_line in text:
                  text = text.replace(old_line, '', 1)

          cleanup_pattern = re.compile(
              r'  useEffect\(\(\) => \{\n'
              r'    return \(\) => \{\n'
              r'      dashboardScrollTimersRef\.current\.forEach\(\(timerId\) => \{\n'
              r'        clearTimeout\(timerId\);\n'
              r'      \}\);\n'
              r'      dashboardScrollTimersRef\.current = \[\];\n'
              r'    \};\n'
              r'  \}, \[\]\);\n\n',
              re.DOTALL,
          )
          text = cleanup_pattern.sub('', text, count=1)

          if 'useDashboardScrollState();' not in text:
              raise SystemExit("useDashboardScrollState was not wired. Refusing to continue.")
          if state_line in text:
              raise SystemExit("Old isDashboardScrollable state still exists after patch. Refusing to continue.")
          if 'const dashboardScrollRef = useRef(null);' in text:
              raise SystemExit("Old dashboardScrollRef declaration still exists after patch. Refusing to continue.")
          if 'const dashboardContentRef = useRef(null);' in text:
              raise SystemExit("Old dashboardContentRef declaration still exists after patch. Refusing to continue.")
          if 'const dashboardScrollTimersRef = useRef([]);' in text:
              raise SystemExit("Old dashboardScrollTimersRef declaration still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-dashboard-scroll-state-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-dashboard-scroll-state-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire dashboard scroll state hook"
          git push
