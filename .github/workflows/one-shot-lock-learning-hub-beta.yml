name: One-shot lock Learning Hub during beta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-lock-learning-hub-beta.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Lock Learning Hub for non-admin users
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/Community.jsx')
          text = path.read_text()
          old = '''  const activeView = VALID_VIEWS.has(requestedView) ? requestedView : "orb";\n  const adminOnlyForCurrentUser = !isAdmin && ADMIN_ONLY_VIEWS.has(activeView);\n  const gateCurrentView =\n    !isAdmin &&\n    !hasProductAccess &&\n    activeView !== "settings";\n  const hubOpen = activeView === "home" && searchParams.get("learning") === "hub";\n'''
          new = '''  const activeView = VALID_VIEWS.has(requestedView) ? requestedView : "orb";\n  const hubOpen = activeView === "home" && searchParams.get("learning") === "hub";\n  const adminOnlyForCurrentUser =\n    !isAdmin && (ADMIN_ONLY_VIEWS.has(activeView) || hubOpen);\n  const gateCurrentView =\n    !isAdmin &&\n    !hasProductAccess &&\n    activeView !== "settings";\n'''
          if old not in text:
              raise SystemExit('Expected Community access block not found; refusing unsafe patch')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify Learning Hub beta boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/pages/Community.jsx', 'utf8');
          if (!source.includes('ADMIN_ONLY_VIEWS.has(activeView) || hubOpen')) {
            throw new Error('Learning Hub is not included in the admin-only beta boundary');
          }
          if (!source.includes('activeView === "home" && searchParams.get("learning") === "hub"')) {
            throw new Error('Learning Hub direct URL detection is missing');
          }
          console.log('Learning Hub beta lock verified.');
          NODE

      - name: Commit surgical repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-lock-learning-hub-beta.yml
          git add src/pages/Community.jsx
          git commit -m "Lock Learning Hub during beta"
          git push origin HEAD:main
