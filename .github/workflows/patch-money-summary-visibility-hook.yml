name: Patch money summary visibility hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-money-summary-visibility-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useMoneySummaryVisibility into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useMoneySummaryVisibility from "@/components/fresh/main-dashboard/money-summary/useMoneySummaryVisibility";\n'
          import_anchor = 'import DashboardMoneySummary from "@/components/fresh/main-dashboard/money-summary/DashboardMoneySummary";\n'

          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Money summary import anchor not found. Refusing to patch Dashboard.jsx.")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          block_start = (
              '  const [moneySummaryVisible, setMoneySummaryVisible] = useState(() =>\n'
              '    readMoneySummaryVisibility("guest")\n'
              '  );\n\n'
              '  const toggleMoneySummaryVisibility = useCallback((event) => {\n'
          )
          block_end = '  const navigate = useNavigate();\n'

          if block_start in text:
              start_index = text.index(block_start)
              end_index = text.index(block_end, start_index)
              old_block = text[start_index:end_index]
              required_tokens = [
                  'persistMoneySummaryVisibility(nextVisible, userId || "guest");',
                  'setMoneySummaryVisible((current) => {',
                  'event?.nativeEvent?.stopImmediatePropagation?.();',
                  'return nextVisible;',
                  '}, []);',
              ]
              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("Money summary visibility block does not match expected content. Refusing to patch Dashboard.jsx.")
              text = text[:start_index] + text[end_index:]
          elif 'useMoneySummaryVisibility(userId)' not in text:
              raise SystemExit("Money summary visibility block not found and hook is not wired. Refusing to patch Dashboard.jsx.")

          user_id_line = '  const userId = user?.id || null;\n'
          hook_block = (
              '  const [moneySummaryVisible, toggleMoneySummaryVisibility] =\n'
              '    useMoneySummaryVisibility(userId);\n'
          )

          if hook_block not in text:
              if user_id_line not in text:
                  raise SystemExit("userId line not found. Refusing to patch Dashboard.jsx.")
              text = text.replace(user_id_line, user_id_line + hook_block, 1)

          for unused_line in [
              '  persistMoneySummaryVisibility,\n',
              '  readMoneySummaryVisibility,\n',
          ]:
              if unused_line in text:
                  text = text.replace(unused_line, '', 1)

          if 'useMoneySummaryVisibility(userId)' not in text:
              raise SystemExit("useMoneySummaryVisibility was not wired. Refusing to continue.")
          if 'setMoneySummaryVisible' in text:
              raise SystemExit("setMoneySummaryVisible still exists after patch. Refusing to continue.")
          if 'readMoneySummaryVisibility("guest")' in text:
              raise SystemExit("Old money summary visibility initializer still exists after patch. Refusing to continue.")
          if 'persistMoneySummaryVisibility(nextVisible' in text:
              raise SystemExit("Old money summary visibility persistence still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-money-summary-visibility-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-money-summary-visibility-hook.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Wire money summary visibility hook"
          git push
