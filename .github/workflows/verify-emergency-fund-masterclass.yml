name: Verify Emergency Fund Masterclass

on:
  pull_request:
    branches:
      - main
    paths:
      - "api/clara-masterclass-gemini.js"
      - "src/components/community/BudgetMasterclassRuntime.jsx"
      - "src/components/community/masterclass/**"
      - "src/components/fresh/main-dashboard/carousel/EmergencyFundCardStorageWalletMoveConfirm.jsx"
      - "src/lib/clara-budget-masterclass-ai.js"
      - "src/lib/clara-emergency-fund-masterclass*"
      - "src/lib/clara-masterclass-*"
      - "tests/emergency-fund-card-flow-regression.test.mjs"
      - "tests/emergency-fund-masterclass-architecture.test.mjs"
      - ".github/workflows/verify-emergency-fund-masterclass.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Emergency Fund and Masterclass regressions
        run: |
          node --test \
            tests/emergency-fund-card-flow-regression.test.mjs \
            tests/emergency-fund-masterclass-architecture.test.mjs

      - name: Lint Masterclass integration authority
        run: |
          npx eslint \
            api/clara-masterclass-gemini.js \
            src/components/community/BudgetMasterclassRuntime.jsx \
            src/components/community/masterclass/ClaraMasterclassLanguageGate.jsx \
            src/components/community/masterclass/ClaraMasterclassPrimitives.jsx \
            src/components/community/masterclass/ClaraMasterclassRuntime.jsx \
            src/components/fresh/main-dashboard/carousel/EmergencyFundCardStorageWalletMoveConfirm.jsx \
            src/lib/clara-budget-masterclass-ai.js \
            src/lib/clara-masterclass-ai.js \
            src/lib/clara-masterclass-registry.js \
            src/lib/clara-emergency-fund-masterclass*.js

      - name: Build production bundle
        run: npx vite build --base=./
