name: Apply CLARA About cleanup

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.event.issue.title == '[CLARA] Apply About cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply surgical About-section cleanup
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx")
          text = path.read_text(encoding="utf-8")
          original = text

          helper_import = '} from "@/utils/dashboard/dashboardHelpers";\n'
          package_import = 'import appPackage from "../../../../../../package.json";\n'
          if package_import not in text:
              if helper_import not in text:
                  raise SystemExit("Dashboard helper import anchor not found")
              text = text.replace(helper_import, helper_import + package_import, 1)

          runtime_anchor = 'const dashboardRuntimeSurvivalExpenses = { clear: () => {} };\n'
          if 'const appVersion =' not in text:
              if runtime_anchor not in text:
                  raise SystemExit("Runtime constant anchor not found")
              text = text.replace(
                  runtime_anchor,
                  runtime_anchor + '\nconst appVersion = appPackage.version || "1.0.0";\n',
                  1,
              )

          info_tile = '''
  const InfoTile = ({ label, value }) => (
    <div className="rounded-2xl border border-white/15 bg-black/15 p-3">
      <p className="text-[10px] font-black uppercase tracking-[0.16em] text-white/35">{label}</p>
      <p className="mt-1 truncate text-sm font-black text-white">{value}</p>
    </div>
  );
'''
          if info_tile not in text:
              raise SystemExit("InfoTile block not found")
          text = text.replace(info_tile, "", 1)

          normalize_anchor = '  const normalizeLegalInfoRow = (row, fallback) => ({\n'
          display_config = '''  const aboutClaraDisplayTitles = {
    mission: "Mission",
    vision: "Vision",
    privacy_policy: "Privacy Policy",
    terms_of_use: "Terms of Use",
    clara_difference: "App Information",
  };

  const aboutClaraDisplayOrder = [
    "mission",
    "vision",
    "privacy_policy",
    "terms_of_use",
    "clara_difference",
  ];

'''
          if 'const aboutClaraDisplayTitles =' not in text:
              if normalize_anchor not in text:
                  raise SystemExit("Legal row normalization anchor not found")
              text = text.replace(normalize_anchor, display_config + normalize_anchor, 1)

          old_rows_memo = '''  const aboutClaraRows = useMemo(() => {
    const savedRows = Array.isArray(legalInfoRows) ? legalInfoRows : [];

    return defaultAboutClaraRows.map((fallback) => {
      const saved = savedRows.find((row) => row?.section_key === fallback.section_key);
      return normalizeLegalInfoRow(saved, fallback);
    });
  }, [legalInfoRows]);
'''
          new_rows_memo = '''  const aboutClaraRows = useMemo(() => {
    const savedRows = Array.isArray(legalInfoRows) ? legalInfoRows : [];

    return defaultAboutClaraRows
      .map((fallback) => {
        const saved = savedRows.find((row) => row?.section_key === fallback.section_key);
        return normalizeLegalInfoRow(saved, fallback);
      })
      .sort(
        (left, right) =>
          aboutClaraDisplayOrder.indexOf(left.section_key) -
          aboutClaraDisplayOrder.indexOf(right.section_key)
      );
  }, [legalInfoRows]);
'''
          if old_rows_memo not in text:
              raise SystemExit("About rows memo block not found")
          text = text.replace(old_rows_memo, new_rows_memo, 1)

          text = text.replace(
              'throw new Error("Admin permission is required to update Legal & Information content.");',
              'throw new Error("Admin permission is required to update Information content.");',
          )
          text = text.replace(
              'message: "Legal & Information content updated.",',
              'message: "Information content updated.",',
          )
          text = text.replace(
              'setLegalInfoError(error?.message || "Unable to save Legal & Information content right now.");',
              'setLegalInfoError(error?.message || "Unable to save Information content right now.");',
          )

          about_row_start = text.index('  const AboutClaraRow = ({ row }) => {')
          about_row_end = text.index('  const LegalInformationEditField', about_row_start)
          about_row = '''  const AboutClaraRow = ({ row, isLast }) => {
    const isOpen = activeAboutInfo === row.section_key;
    const displayTitle = aboutClaraDisplayTitles[row.section_key] || row.title;

    return (
      <div className={isLast ? "" : "border-b border-white/10"}>
        <button
          type="button"
          onClick={() => setActiveAboutInfo((current) => (current === row.section_key ? null : row.section_key))}
          className="flex w-full items-center justify-between gap-3 px-4 py-3 text-left transition hover:bg-white/[0.045] active:scale-[0.99]"
          aria-expanded={isOpen}
        >
          <p className="min-w-0 flex-1 break-words text-sm font-bold text-white">
            {displayTitle}
          </p>

          <ChevronRight
            className={`h-4 w-4 shrink-0 text-white/35 transition duration-200 ${
              isOpen ? "rotate-90 text-emerald-200" : ""
            }`}
          />
        </button>

        <div
          className={`grid transition-all duration-200 ease-out ${
            isOpen ? "grid-rows-[1fr] opacity-100" : "grid-rows-[0fr] opacity-0"
          }`}
        >
          <div className="min-h-0 overflow-hidden">
            <div className="border-t border-white/10 bg-black/15 px-4 py-4">
              {row.body
                .split(/\n{2,}/)
                .map((paragraph, index) => (
                  <p
                    key={`${row.section_key}-${index}`}
                    className={`${index > 0 ? "mt-3 rounded-2xl border border-emerald-300/15 bg-emerald-400/10 p-3 text-emerald-50/85" : "text-white/70"} text-sm leading-6`}
                  >
                    {paragraph}
                  </p>
                ))}
            </div>
          </div>
        </div>
      </div>
    );
  };

'''
          text = text[:about_row_start] + about_row + text[about_row_end:]

          about_page_start = text.index('  const renderAboutPage = () => (')
          about_page_end = text.index('  const renderActiveSetting', about_page_start)
          about_page = '''  const renderAboutPage = () => (
    <div className="space-y-5">
      <div className="space-y-4">
        <button
          type="button"
          onClick={() => {
            setActiveSetting(null);
            setActiveAboutInfo(null);
            setSettingsNotice(null);
          }}
          className="inline-flex items-center gap-2 rounded-full border border-white/15 bg-white/8 px-3 py-2 text-[11px] font-bold text-white/70 transition hover:bg-white/12"
        >
          <ArrowDown className="h-3.5 w-3.5 rotate-90" />
          Settings
        </button>

        <div className="px-1">
          <h2 className="text-xl font-black tracking-tight text-white">About CLARA</h2>
        </div>
      </div>

      <section className="rounded-[28px] border border-white/15 bg-[radial-gradient(circle_at_top_left,rgba(34,211,238,0.12),transparent_38%),radial-gradient(circle_at_bottom_right,rgba(139,92,246,0.12),transparent_42%),rgba(255,255,255,0.045)] p-5 shadow-[0_18px_50px_rgba(0,0,0,0.18)] backdrop-blur-xl">
        <p className="text-2xl font-black tracking-tight text-white">CLARA</p>
        <p className="mt-1 text-sm font-bold text-cyan-100/80">Personal Money Coach</p>

        <p className="mt-4 text-sm font-semibold leading-6 text-white/70">
          <span className="block">Understand your spending.</span>
          <span className="block">Make better money decisions.</span>
        </p>

        <p className="mt-5 border-t border-white/10 pt-3 text-[11px] font-semibold text-white/38">
          Version {appVersion}
        </p>
      </section>

      <section className="space-y-3">
        <div className="flex items-center justify-between gap-3 px-1">
          <h3 className="text-sm font-black text-white">Information</h3>

          {canEditLegalInformation && !legalInfoEditMode ? (
            <button
              type="button"
              onClick={startLegalInformationEdit}
              className="inline-flex shrink-0 items-center gap-1.5 rounded-full border border-emerald-300/15 bg-emerald-400/10 px-3 py-2 text-[11px] font-bold text-emerald-100 transition hover:bg-emerald-400/15 active:scale-[0.98]"
            >
              <Edit className="h-3.5 w-3.5" />
              Edit
            </button>
          ) : null}
        </div>

        {legalInfoError ? (
          <div className="rounded-2xl border border-rose-300/20 bg-rose-400/10 px-4 py-3 text-xs leading-5 text-rose-100">
            {legalInfoError}
          </div>
        ) : null}

        {legalInfoLoading && !legalInfoEditMode ? (
          <div className="rounded-2xl border border-white/12 bg-white/[0.03] px-4 py-3 text-xs text-white/45">
            Loading information...
          </div>
        ) : null}

        {legalInfoEditMode ? (
          <div className="space-y-3">
            <div className="rounded-2xl border border-emerald-300/15 bg-emerald-400/10 px-4 py-3">
              <p className="text-xs font-bold text-emerald-50">Admin editing mode</p>
              <p className="mt-1 text-[11px] leading-5 text-emerald-50/65">
                Edit the information content below. Changes are saved to Supabase and shown to all users.
              </p>
            </div>

            {legalInfoDraftRows.map((row, index) => (
              <LegalInformationEditField key={row.section_key} row={row} index={index} />
            ))}

            <div className="sticky bottom-3 z-10 grid grid-cols-2 gap-2 rounded-[22px] border border-white/15 bg-[#071120]/92 p-2 shadow-[0_20px_55px_rgba(0,0,0,0.35)] backdrop-blur-xl">
              <button
                type="button"
                onClick={cancelLegalInformationEdit}
                disabled={legalInfoSaving}
                className="rounded-2xl border border-white/15 bg-white/[0.055] px-4 py-3 text-sm font-bold text-white/70 transition hover:bg-white/[0.08] disabled:cursor-not-allowed disabled:opacity-50"
              >
                Cancel
              </button>
              <button
                type="button"
                onClick={saveLegalInformationContent}
                disabled={legalInfoSaving}
                className="rounded-2xl bg-gradient-to-r from-emerald-400 via-emerald-500 to-green-600 px-4 py-3 text-sm font-black text-white shadow-[0_12px_34px_rgba(16,185,129,0.24)] transition hover:scale-[1.01] disabled:cursor-not-allowed disabled:opacity-60"
              >
                {legalInfoSaving ? "Saving..." : "Save"}
              </button>
            </div>
          </div>
        ) : (
          <div className="overflow-hidden rounded-[24px] border border-white/12 bg-white/[0.03]">
            {aboutClaraRows.map((row, index) => (
              <AboutClaraRow
                key={row.section_key}
                row={row}
                isLast={index === aboutClaraRows.length - 1}
              />
            ))}
          </div>
        )}
      </section>
    </div>
  );

'''
          text = text[:about_page_start] + about_page + text[about_page_end:]

          forbidden = [
              "Understand CLARA’s purpose, direction, and the principles behind the app.",
              "Built to help users see where their money goes, understand why they spend, and build better financial discipline one decision at a time.",
              "Mission, vision, and build information can be rendered here directly so the user stays inside settings.",
              '<InfoTile label="Experience" value="Mobile" />',
          ]
          remaining = [value for value in forbidden if value in text]
          if remaining:
              raise SystemExit(f"Old About content still present: {remaining}")

          required = [
              "Personal Money Coach",
              "Understand your spending.",
              "Make better money decisions.",
              "Version {appVersion}",
              ">Information</h3>",
              'clara_difference: "App Information"',
              'onClick={() => setActiveAboutInfo',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f"Required About content missing: {missing}")

          if text == original:
              raise SystemExit("No About-section changes were produced")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build

      - name: Commit source and remove one-time workflow
        run: |
          rm .github/workflows/apply-clara-about-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx .github/workflows/apply-clara-about-cleanup.yml
          git commit -m "Simplify CLARA About section"
          git push origin main
