name: Verify Supabase-Free Runtime

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase runtime stays removed
        run: node --test tests/no-supabase-runtime.test.mjs

      - name: Compile production app without lifecycle test fanout
        run: npx vite build --base=./
