          git config user.email "actions@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx .github/workflows/clara-pdf-carousel-patch.yml
          git commit -m "fix: buffer PDF page switching carousel"
          git push origin HEAD:main

      - name: Restore reader and remove temporary workflow after failure
