    setPdfZoomScale(PDF_MIN_ZOOM_SCALE);
    setAnnouncedZoomPercentage(100);
    clearGestureTracking();
    clearTapTracking();
    transitionLockRef.current = false;
  }, [
    clearGestureTracking,
    clearTapTracking,
    resetPdfCarouselState,
  ]);

  const togglePdfZoom''',
              "reader reset",
