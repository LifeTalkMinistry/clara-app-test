name: Install CLARA Buy Check communication attitudes

on:
  push:
    paths:
      - ".github/workflows/install-clara-buy-check-attitudes.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch active Buy Check UI and intelligence
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/install_clara_attitudes.py
          python /tmp/install_clara_attitudes.py
          git diff --check

      - name: Commit implementation and remove installer
        shell: bash
        run: |
          rm -f .github/workflows/install-clara-buy-check-attitudes.yml
          git config user.name "LifeTalk Ministry"
          git config user.email "96472293+LifeTalkMinistry@users.noreply.github.com"
          git add -A src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx src/lib/clara-buy-check-expert-ai.js .github/workflows/install-clara-buy-check-attitudes.yml
          git commit -m "Add selectable CLARA Buy Check attitudes"
          git push origin main
