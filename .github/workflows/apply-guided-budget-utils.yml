name: Apply guided budget utilities
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-guided-budget-utils.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write guided budget utilities
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64, zlib
          payload = ""
          target = Path("src/pages/monthly-budget-plan/guided/budgetGuidedUtils.js")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(zlib.decompress(base64.b64decode(payload)))
          PYCODE
      - name: Commit guided budget utilities
        run: |
          rm -f .github/workflows/apply-guided-budget-utils.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add guided budget utilities" && git push origin main)
