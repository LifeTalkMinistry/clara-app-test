name: Diagnose Schedule Guide panel structure

on:
  push:
    paths:
      - ".github/workflows/patch-schedule-guide-plumbing-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run patch and capture output
        shell: bash
        run: |
          mkdir -p .github/patch-diagnostics
          python scripts/oneoff/patch_schedule_guide_panel_structure.py > .github/patch-diagnostics/schedule-guide.log 2>&1 || true

      - name: Commit diagnostics and any patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/patch-diagnostics/schedule-guide.log src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardSchedulePanel.jsx
          git commit -m "Diagnose Schedule Guide structure patch"
          git push origin HEAD:main
