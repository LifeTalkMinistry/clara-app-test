name: Patch Schedule Guide panel structure

on:
  push:
    paths:
      - ".github/workflows/patch-schedule-guide-plumbing-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply structure patch
        run: python scripts/oneoff/patch_schedule_guide_panel_structure.py

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardSchedulePanel.jsx
          git commit -m "Add Schedule Guide markers"
          git push origin HEAD:main
