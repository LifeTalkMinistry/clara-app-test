name: CLARA page-turn PR validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .clara-page-turn-trigger

permissions:
  contents: write

jobs:
  patch-build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false

      - name: Extract and run surgical patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          sed -n "/python <<'PY'/,/^[[:space:]]*PY$/p" .github/workflows/clara-page-turn-surgical.yml \
            | sed '1d;$d;s/^          //' > /tmp/clara-page-turn-patch.py
          python <<'PY'
          from pathlib import Path

          patch_path = Path("/tmp/clara-page-turn-patch.py")
          script = patch_path.read_text(encoding="utf-8")
          old_call = "replace_once(old_page, new_page, 'animated page wrapper')"
          robust_call = '''page_start_marker = "                          <Page\\n"
page_end_marker = "                          />"
if text.count(page_start_marker) != 1:
    raise SystemExit(
        f"animated page wrapper start: expected exactly one match, found {text.count(page_start_marker)}"
    )
page_start = text.index(page_start_marker)
page_end = text.index(page_end_marker, page_start) + len(page_end_marker)
page_block = text[page_start:page_end]
indented_page_block = "\\n".join(f"  {line}" for line in page_block.splitlines())
wrapper = (
    '                          <div\\n'
    '                            className="relative shrink-0"\\n'
    '                            style={pdfPaperStyle}\\n'
    '                          >\\n'
    f'{indented_page_block}\\n'
    '                            <div\\n'
    '                              aria-hidden="true"\\n'
    '                              className="pointer-events-none absolute inset-y-0"\\n'
    '                              style={pdfPaperEdgeStyle}\\n'
    '                            />\\n'
    '                          </div>'
)
text = text[:page_start] + wrapper + text[page_end:]'''
          if script.count(old_call) != 1:
              raise SystemExit(
                  f"wrapper patch call: expected exactly one match, found {script.count(old_call)}"
              )
          patch_path.write_text(script.replace(old_call, robust_call, 1), encoding="utf-8")
          PY
          python /tmp/clara-page-turn-patch.py > /tmp/clara-page-turn-patch.log 2>&1

      - name: Upload patch diagnostic
        if: steps.patch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: clara-page-turn-patch-diagnostic
          path: |
            /tmp/clara-page-turn-patch.log
            /tmp/clara-page-turn-patch.py
          if-no-files-found: error
          retention-days: 1

      - name: Stop after patch failure
        if: steps.patch.outcome == 'failure'
        run: |
          cat /tmp/clara-page-turn-patch.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build validation 1
        run: npm run build

      - name: Build validation 2
        run: npm run build

      - name: Confirm surgical diff
        shell: bash
        run: |
          rm -f .clara-page-turn-trigger .clara-page-turn-error.log
          allowed='^(src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx|.clara-page-turn-trigger|.clara-page-turn-error.log)$'
          unexpected="$(git status --short | sed 's/^...//' | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
          git diff --check
          test -z "$(git diff --name-only -- package.json package-lock.json)"

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "CLARA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx .clara-page-turn-trigger .clara-page-turn-error.log
          git commit -m "Add premium PDF paper swipe transition"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
