name: Apply budget reset handler updater

on:
  push:
    branches:
      - fix/budget-reset-boundary
    paths:
      - scripts/apply_runner.mjs
      - .github/workflows/apply-atomic-budget-reset.yml

permissions:
  contents: write

jobs:
  apply-budget-reset-handler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply handler update
        run: node scripts/apply_runner.mjs
      - name: Clean temporary files
        run: |
          git rm -f scripts/apply_runner.mjs scripts/connector-write-test.js tmp-connector-write-test.txt || true
          git checkout HEAD~1 -- .github/workflows/apply-atomic-budget-reset.yml || true
      - name: Commit handler update
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix budget reset boundary handler"
          git push
