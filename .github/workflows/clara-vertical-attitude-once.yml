name: CLARA vertical attitude selector one-off

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clara-vertical-attitude-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --ff-only origin main
      - name: Patch Buy Check attitude selector
        env:
          REPLACEMENT_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os

          path = Path('src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx')
          source = path.read_text(encoding='utf-8')
          start_marker = 'function BuyCheckAttitudeSelector({ value, onChange }) {'
          end_marker = 'const BUY_CHECK_ACKNOWLEDGMENTS = ['
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = base64.b64decode(os.environ['REPLACEMENT_B64']).decode('utf-8')
          updated = source[:start] + replacement + source[end:]
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Validate patch syntax whitespace
        run: git diff --check
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name "CLARA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx
          git rm .github/workflows/clara-vertical-attitude-once.yml
          git commit -m "Stack CLARA attitude selector vertically"
          git pull --rebase origin main
          git push origin HEAD:main
