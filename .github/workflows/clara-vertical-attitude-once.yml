name: CLARA vertical attitude selector one-off

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clara-vertical-attitude-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --ff-only origin main
      - name: Patch Buy Check attitude selector
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'absolute bottom-[72px] right-0 z-40 w-[min(336px,calc(100vw-28px))] rounded-[18px] border border-blue-200/16 bg-[#050d1f]/98 p-2 shadow-[0_20px_58px_rgba(0,0,0,0.5),inset_0_1px_0_rgba(255,255,255,0.04)] backdrop-blur-2xl',
                  'absolute bottom-[72px] right-0 z-40 w-[164px] rounded-[18px] border border-blue-200/16 bg-[#050d1f]/98 p-2 shadow-[0_20px_58px_rgba(0,0,0,0.5),inset_0_1px_0_rgba(255,255,255,0.04)] backdrop-blur-2xl',
              ),
              (
                  'flex items-center gap-1.5',
                  'grid gap-1.5',
              ),
              (
                  'min-w-0 flex-1 rounded-[12px] px-1.5 py-2.5 text-center text-[10.5px] font-black tracking-[-0.02em] transition active:scale-[0.97]',
                  'w-full rounded-full border px-4 py-2.5 text-center text-[11px] font-black tracking-[-0.02em] transition active:scale-[0.97]',
              ),
              (
                  'bg-[#ffd84a]/12 text-[#ffe783] shadow-[inset_0_0_0_1px_rgba(255,216,74,0.32)]',
                  'border-[#ffd84a]/80 bg-[#ffd84a]/10 text-[#ffe783]',
              ),
              (
                  'text-blue-50/68 hover:bg-white/[0.045] hover:text-white/90',
                  'border-blue-100/28 bg-white/[0.015] text-blue-50/80 hover:border-blue-100/44 hover:bg-white/[0.045] hover:text-white/95',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name "CLARA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx
          git rm .github/workflows/clara-vertical-attitude-once.yml
          git commit -m "Stack CLARA attitude selector vertically"
          git pull --rebase origin main
          git push origin HEAD:main
