name: Apply and validate Money Left orb guide

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.number == 126 &&
       github.event.comment.body == '/run-orb-validator') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 126)
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/guide-orb-real-surfaces
          fetch-depth: 0

      - name: Confirm implementation bundle
        run: test -f .github/patch-parts/guide-orb-01.part

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patch-parts/guide-orb-*.part > /tmp/guide-orb-bundle.b64
          base64 -d /tmp/guide-orb-bundle.b64 > /tmp/guide-orb-bundle.tar.gz
          mkdir -p /tmp/guide-orb-bundle
          tar -xzf /tmp/guide-orb-bundle.tar.gz -C /tmp/guide-orb-bundle

      - name: Apply implementation bundle
        shell: bash
        run: |
          set -o pipefail
          node /tmp/guide-orb-bundle/apply.mjs 2>&1 | tee /tmp/guide-orb-apply.log

      - name: Upload validator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-orb-validator-diagnostics
          path: |
            /tmp/guide-orb-bundle
            /tmp/guide-orb-apply.log
          if-no-files-found: warn
          retention-days: 1

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/patch-parts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: use production surfaces in the Money Left orb guide'
          git push origin HEAD:fix/guide-orb-real-surfaces
