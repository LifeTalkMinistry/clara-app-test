name: Validate complete Money Left orb guide

on:
  push:
    branches:
      - fix/complete-real-clara-orb-guide
    paths:
      - scripts/patch_clara_orb_core.py
      - .github/workflows/guide-orb-ready-validator.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[orb-core-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/complete-real-clara-orb-guide
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply strict core migration
        run: python scripts/patch_clara_orb_core.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: apply CLARA orb core refactor [orb-core-applied]'
          git push origin HEAD:fix/complete-real-clara-orb-guide
