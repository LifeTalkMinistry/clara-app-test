name: Keep Daily Check-In device-only

on:
  push:
    branches:
      - fix/device-only-daily-check-in
    paths:
      - ".github/scripts/keep-daily-check-in-device-only.mjs"
      - ".github/workflows/keep-daily-check-in-device-only.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect-device-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/device-only-daily-check-in
          fetch-depth: 0

      - name: Apply device-only Daily Check-In boundary
        run: node .github/scripts/keep-daily-check-in-device-only.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run focused sync and backup regressions
        run: node --test tests/cloud-vault-sync.test.mjs tests/local-data-export.test.mjs tests/daily-check-in.test.mjs

      - name: Run full regression suite
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/cloud-vault-snapshot.js src/lib/server-finance-sync.js tests/cloud-vault-sync.test.mjs tests/local-data-export.test.mjs package.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Daily Check-In sync changes were produced."
            exit 0
          fi
          git commit -m "Keep Daily Check-In device-only"
          git push origin HEAD:fix/device-only-daily-check-in
