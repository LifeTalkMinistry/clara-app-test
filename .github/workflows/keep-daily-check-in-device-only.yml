name: Keep Daily Check-In device-only

on:
  push:
    branches:
      - fix/device-only-daily-check-in
    paths:
      - ".github/workflows/keep-daily-check-in-device-only.yml"
      - "src/lib/cloud-vault-snapshot.js"
      - "src/lib/server-finance-sync.js"
      - "tests/cloud-vault-sync.test.mjs"
      - "tests/local-data-export.test.mjs"
      - "tests/daily-check-in.test.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect-device-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/device-only-daily-check-in
          fetch-depth: 0

      - name: Run focused verification and record output
        shell: bash
        run: |
          set +e
          mkdir -p .github/verified
          npm ci > /tmp/daily-check-install.log 2>&1
          install_status=$?

          if [ "$install_status" -eq 0 ]; then
            node --test tests/cloud-vault-sync.test.mjs tests/local-data-export.test.mjs tests/daily-check-in.test.mjs > /tmp/daily-check-focused.log 2>&1
            focused_status=$?
          else
            focused_status=99
          fi

          {
            echo "install=$install_status"
            echo "focused=$focused_status"
            if [ "$install_status" -ne 0 ]; then
              echo "--- install output ---"
              cat /tmp/daily-check-install.log
            fi
            if [ "$focused_status" -ne 99 ]; then
              echo "--- focused output ---"
              cat /tmp/daily-check-focused.log
            fi
          } > .github/verified/daily-check-in-device-only.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/verified/daily-check-in-device-only.txt
          git commit -m "Record focused Daily Check-In verification"
          git push origin HEAD:fix/device-only-daily-check-in

          if [ "$install_status" -ne 0 ] || [ "$focused_status" -ne 0 ]; then
            exit 1
          fi
