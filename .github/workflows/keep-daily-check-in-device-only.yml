name: Keep Daily Check-In device-only

on:
  push:
    branches:
      - fix/device-only-daily-check-in
    paths:
      - ".github/workflows/keep-daily-check-in-device-only.yml"
      - "src/lib/cloud-vault-snapshot.js"
      - "src/lib/server-finance-sync.js"
      - "tests/cloud-vault-sync.test.mjs"
      - "tests/local-data-export.test.mjs"
      - "tests/daily-check-in.test.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect-device-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/device-only-daily-check-in
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Run focused sync and backup regressions
        run: node --test tests/cloud-vault-sync.test.mjs tests/local-data-export.test.mjs tests/daily-check-in.test.mjs

      - name: Run full regression suite
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Record successful verification
        run: |
          mkdir -p .github/verified
          printf '%s\n' "Daily Check-In device-only tests and production build passed." > .github/verified/daily-check-in-device-only.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/verified/daily-check-in-device-only.txt
          if git diff --cached --quiet; then
            echo "Verification marker already exists."
            exit 0
          fi
          git commit -m "Verify Daily Check-In device-only boundary"
          git push origin HEAD:fix/device-only-daily-check-in
