name: Final CLARA PDF white flash fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    if: github.event.pull_request.head.ref == 'clara-pdf-white-flash-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply surgical white-flash fix
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx')
          text = path.read_text(encoding='utf-8')

          old_effect = '''  useEffect(() => {
    if (!isOpen) return;
    setIsReaderMenuOpen(false);
    resetPdfToFit({ announce: false });
    setPdfPageAspectRatio(0);
    scrollToTop();
  }, [
    activePdfPath,
    isOpen,
    material?.id,
    pdfReloadKey,
    resetPdfToFit,
    safePageIndex,
    scrollToTop,
  ]);'''

          new_effect = '''  useEffect(() => {
    if (!isOpen) return;
    setIsReaderMenuOpen(false);
    resetPdfToFit({ announce: false });
    setPdfPageAspectRatio(0);
    scrollToTop();
  }, [
    activePdfPath,
    isOpen,
    material?.id,
    pdfReloadKey,
    resetPdfToFit,
    scrollToTop,
  ]);'''

          old_aspect = '''    setPdfPageAspectRatio((currentAspectRatio) =>
      Math.abs(currentAspectRatio - nextAspectRatio) < 0.001
        ? currentAspectRatio
        : nextAspectRatio,
    );'''

          new_aspect = '''    setPdfPageAspectRatio((currentAspectRatio) =>
      currentAspectRatio > 0 ? currentAspectRatio : nextAspectRatio,
    );'''

          if text.count(old_effect) != 1:
              raise RuntimeError('Expected exactly one page-reset effect')
          if text.count(old_aspect) != 1:
              raise RuntimeError('Expected exactly one page aspect-ratio updater')

          text = text.replace(old_effect, new_effect, 1)
          text = text.replace(old_aspect, new_aspect, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build web app
        run: npm run build:web

      - name: Verify and commit validated fix
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/clara-pdf-white-flash-fix.yml
          git rm .github/workflows/clara-pdf-white-flash-final.yml
          git rm .clara-pdf-white-flash-fix-trigger

          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            ".clara-pdf-white-flash-fix-trigger"
            ".github/workflows/clara-pdf-white-flash-final.yml"
            ".github/workflows/clara-pdf-white-flash-fix.yml"
            "src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx"
          )

          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[@]}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx
          git commit -m "fix: prevent white PDF canvas flash after page changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
