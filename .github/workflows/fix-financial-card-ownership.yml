name: Fix financial card ownership

on:
  push:
    branches:
      - fix/financial-card-ownership
    paths:
      - ".github/scripts/finalize-financial-card-ownership.mjs"
      - ".github/workflows/fix-financial-card-ownership.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/finalize-financial-card-ownership.mjs"
      - ".github/workflows/fix-financial-card-ownership.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/financial-card-ownership
          fetch-depth: 0

      - name: Finalize financial card ownership
        run: node .github/scripts/finalize-financial-card-ownership.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run focused ownership regression
        run: node --test tests/financial-card-ownership-regression.test.mjs

      - name: Run full regression and production build
        run: npm run build

      - name: Commit verified financial card finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No financial card finalization changes were produced."
            exit 0
          fi
          git commit -m "Finalize financial card ownership"
          git push origin HEAD:fix/financial-card-ownership
