name: Temporary canonical display name cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run canonical display name cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate Settings identity authority
        run: python3 scripts/canonical-display-name-cleanup.py
      - name: Verify canonical identity authority
        run: node --test tests/canonical-display-name-authority.test.mjs
      - name: Commit surgical cleanup and retire temporary helper
        shell: bash
        run: |
          rm .github/workflows/_temporary-canonical-display-name-cleanup.yml
          rm scripts/canonical-display-name-cleanup.py
          git config user.name "CLARA Principal Engineer"
          git config user.email "96472293+LifeTalkMinistry@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate canonical display name authority [skip ci]"
          git push origin HEAD:main
