name: Temporary canonical display name cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run canonical display name cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove duplicate Settings identity authority
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          settings_path = Path('src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx')
          source = settings_path.read_text()

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              source = source.replace(old, new, 1)

          def sub_once(pattern, replacement, label):
              global source
              source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')

          replace_once('  Home,\n', '', 'remove Home icon import')
          replace_once(
              'import { signOutFromClaraBackend } from "@/lib/clara-backend-client";\n',
              'import { signOutFromClaraBackend } from "@/lib/clara-backend-client";\nimport {\n  fetchCanonicalClaraProfile,\n  resolveCanonicalDisplayName,\n} from "@/lib/canonical-clara-profile";\n',
              'add canonical profile import',
          )
          replace_once(
              'import DashboardMeLifePanel from "@/components/fresh/main-dashboard/dashboard-panels/me/DashboardMeLifePanel";\n',
              '',
              'remove embedded ME panel import',
          )
          replace_once('  "profile",\n', '', 'remove profile detail key')

          replace_once(
              '''\n  const initialDisplayName =\n    user?.full_name ||\n    user?.display_name ||\n    user?.nickname ||\n    user?.user_metadata?.full_name ||\n    user?.user_metadata?.name ||\n    user?.email?.split("@")?.[0] ||\n    "";\n''',
              '\n',
              'remove Settings display-name fallback authority',
          )
          replace_once(
              '  const [profileName, setProfileName] = useState(initialDisplayName);\n',
              '  const [canonicalProfile, setCanonicalProfile] = useState(null);\n',
              'replace Settings profile-name state',
          )
          replace_once(
              '  const [savingProfile, setSavingProfile] = useState(false);\n',
              '',
              'remove Settings profile save state',
          )
          replace_once(
              '''\n  useEffect(() => {\n    setProfileName(initialDisplayName);\n  }, [initialDisplayName]);\n''',
              '\n',
              'remove Settings profile-name synchronization',
          )

          replace_once(
              'const displayName = profileName?.trim() || initialDisplayName || "Your CLARA account";\n',
              '''  useEffect(() => {\n    let mounted = true;\n    setCanonicalProfile(null);\n\n    fetchCanonicalClaraProfile()\n      .then((profile) => {\n        if (mounted) setCanonicalProfile(profile || null);\n      })\n      .catch((error) => {\n        console.warn("Canonical CLARA profile unavailable in Settings:", error);\n        if (mounted) setCanonicalProfile(null);\n      });\n\n    return () => {\n      mounted = false;\n    };\n  }, [user?.id]);\n\nconst canonicalDisplayName = resolveCanonicalDisplayName(canonicalProfile);\nconst displayName = canonicalDisplayName || "Your CLARA account";\n''',
              'read Settings header from canonical profile',
          )

          sub_once(
              r'\n  const handleSaveProfile = useCallback\(async \(\) => \{.*?\n  \}, \[profileName, user\?\.email, user\?\.id\]\);\n',
              '\n',
              'remove Settings display-name writer',
          )

          sub_once(
              r'\n        \{\n          key: "profile",\n          title: "Profile information",.*?\n        \},',
              '',
              'remove Profile information Settings row',
          )

          replace_once(
              '''      const senderName =\n        displayName ||\n        user?.user_metadata?.full_name ||\n        user?.user_metadata?.name ||\n        user?.email ||\n        "CLARA User";\n''',
              '      const senderName = canonicalDisplayName || "CLARA User";\n',
              'use canonical name for Settings support sender',
          )
          replace_once(
              '''  }, [\n    displayName,\n    onOpenMessages,\n    supportEmail,\n    supportMessage,\n    supportTopic,\n    user?.email,\n    user?.id,\n    user?.user_metadata?.full_name,\n    user?.user_metadata?.name,\n  ]);\n''',
              '''  }, [\n    canonicalDisplayName,\n    onOpenMessages,\n    supportEmail,\n    supportMessage,\n    supportTopic,\n    user?.email,\n    user?.id,\n  ]);\n''',
              'update support dependency list',
          )

          sub_once(
              r'\n  const renderProfilePage = \(\) => \(.*?\n  \);\n\n  const renderNotificationsPage',
              '\n  const renderNotificationsPage',
              'remove Settings Profile information detail page',
          )
          replace_once(
              '    if (activeSetting === "profile") return renderProfilePage();\n',
              '',
              'remove stale profile detail render path',
          )

          forbidden = [
              'profileName',
              'handleSaveProfile',
              'savingProfile',
              'title: "Profile information"',
              'activeSetting === "profile"',
              'placeholder="Enter your name"',
          ]
          for token in forbidden:
              if token in source:
                  raise SystemExit(f'Settings duplicate identity authority still contains: {token}')

          if 'fetchCanonicalClaraProfile()' not in source or 'resolveCanonicalDisplayName(canonicalProfile)' not in source:
              raise SystemExit('Settings canonical profile reader was not installed')

          settings_path.write_text(source)

          css_path = Path('src/settings-cleanup.css')
          css = css_path.read_text()
          obsolete = '''/*\n * Keep the account identity card and Profile information row visible.\n * They show which email is signed in and provide the explicit account/profile entry.\n */\n\n/* remove unnecessary subtitle on the Profile information detail page */\n#root .space-y-4:has(input[placeholder="Enter your name"]) > .mb-4.space-y-4 > div.rounded-\\[28px\\] > p.mt-2 {\n  display: none !important;\n}\n\n'''
          if obsolete not in css:
              raise SystemExit('obsolete Profile information CSS block was not found')
          css_path.write_text(css.replace(obsolete, '', 1))

          local_test_path = Path('tests/settings-local-only-regression.test.mjs')
          test_source = local_test_path.read_text()
          old_test = '''test("Settings keeps the signed-in account identity and Profile entry visible", () => {\n  assert.match(activeSettingsSource, /title: "Profile information"/);\n  assert.match(activeSettingsSource, /description: "Name, email, and your ME life & money profile"/);\n  assert.match(activeSettingsSource, /user\\?\\.email \\|\\| "CLARA user"/);\n  assert.match(activeSettingsSource, /activeSetting === "profile"/);\n  assert.match(\n    settingsCleanupSource,\n    /Keep the account identity card and Profile information row visible/\n  );\n  assert.doesNotMatch(settingsCleanupSource, /remove large profile hero card/);\n  assert.doesNotMatch(settingsCleanupSource, /remove redundant profile information row/);\n  assert.doesNotMatch(settingsCleanupSource, /section:first-of-type/);\n});'''
          new_test = '''test("Settings presents canonical account identity without owning a second profile editor", () => {\n  assert.match(activeSettingsSource, /fetchCanonicalClaraProfile/);\n  assert.match(activeSettingsSource, /resolveCanonicalDisplayName\\(canonicalProfile\\)/);\n  assert.match(activeSettingsSource, /user\\?\\.email \\|\\| "CLARA user"/);\n  assert.doesNotMatch(activeSettingsSource, /title: "Profile information"/);\n  assert.doesNotMatch(activeSettingsSource, /activeSetting === "profile"/);\n  assert.doesNotMatch(activeSettingsSource, /handleSaveProfile|profileName|placeholder="Enter your name"/);\n  assert.doesNotMatch(settingsCleanupSource, /Profile information detail page|Enter your name/);\n});'''
          if test_source.count(old_test) != 1:
              raise SystemExit('settings-local-only profile regression block did not match')
          local_test_path.write_text(test_source.replace(old_test, new_test, 1))

          integrity_path = Path('tests/settings-integrity-regression.test.mjs')
          integrity = integrity_path.read_text()
          old_integrity = '''test("profile Settings writes the display name through the CLARA backend account", () => {\n  assert.match(localFacadeSource, /async updateUser\\(\\{ data \\} = \\{\\}\\)/);\n  assert.match(localFacadeSource, /updateCurrentBackendProfile/);\n  assert.match(profileClientSource, /backendRequest\\("\\/api\\/users\\/me"/);\n  assert.match(profileClientSource, /method: "PATCH"/);\n});'''
          new_integrity = '''test("legacy profile compatibility writes through the canonical CLARA Profile", () => {\n  assert.match(localFacadeSource, /async updateUser\\(\\{ data \\} = \\{\\}\\)/);\n  assert.match(localFacadeSource, /updateCurrentBackendProfile/);\n  assert.match(profileClientSource, /updateCanonicalClaraDisplayName/);\n  assert.doesNotMatch(profileClientSource, /\\/api\\/users\\/me/);\n});'''
          if integrity.count(old_integrity) != 1:
              raise SystemExit('settings-integrity legacy profile regression block did not match')
          integrity_path.write_text(integrity.replace(old_integrity, new_integrity, 1))

          authority_test = Path('tests/canonical-display-name-authority.test.mjs')
          authority_test.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\n\nconst readSource = (relativePath) => readFileSync(new URL(`../${relativePath}`, import.meta.url), "utf8");\nconst settings = readSource("src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx");\nconst orbGreeting = readSource("src/runtime/installClaraOrbGreeting.js");\nconst canonicalClient = readSource("src/lib/canonical-clara-profile.js");\nconst compatibilityClient = readSource("src/lib/profile-backend-client.js");\nconst communityProfile = readSource("src/pages/CommunityProfile.jsx");\n\ntest("Community Profile remains the display-name writer", () => {\n  assert.match(communityProfile, /\\/api\\/community\\/profile\\/me/);\n  assert.match(communityProfile, /display_name: form\\.display_name/);\n});\n\ntest("Settings has no independent display-name editor or stale detail route", () => {\n  assert.match(settings, /fetchCanonicalClaraProfile/);\n  assert.match(settings, /resolveCanonicalDisplayName\\(canonicalProfile\\)/);\n  assert.doesNotMatch(settings, /title: "Profile information"|handleSaveProfile|profileName|activeSetting === "profile"/);\n});\n\ntest("Orb greeting reads the canonical CLARA profile rather than auth metadata storage", () => {\n  assert.match(orbGreeting, /fetchCanonicalClaraProfile/);\n  assert.match(orbGreeting, /resolveCanonicalFirstName/);\n  assert.doesNotMatch(orbGreeting, /clara_backend_user_v1|BACKEND_USER_KEY|user_metadata/);\n});\n\ntest("all compatibility name writes target the canonical Community Profile field", () => {\n  assert.match(canonicalClient, /backendRequest\\("\\/api\\/community\\/profile\\/me"/);\n  assert.match(canonicalClient, /body: \\{ display_name: cleanName \\}/);\n  assert.match(compatibilityClient, /updateCanonicalClaraDisplayName/);\n  assert.doesNotMatch(compatibilityClient, /\\/api\\/users\\/me/);\n});\n''')
          PY

      - name: Verify display-name authority regressions
        run: node --test tests/canonical-display-name-authority.test.mjs tests/settings-local-only-regression.test.mjs tests/settings-integrity-regression.test.mjs

      - name: Commit surgical cleanup and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/_temporary-canonical-display-name-cleanup.yml
          git config user.name "CLARA Principal Engineer"
          git config user.email "96472293+LifeTalkMinistry@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx src/settings-cleanup.css tests/settings-local-only-regression.test.mjs tests/settings-integrity-regression.test.mjs tests/canonical-display-name-authority.test.mjs .github/workflows/_temporary-canonical-display-name-cleanup.yml
          git commit -m "Consolidate canonical display name authority [skip ci]"
          git push origin HEAD:main
