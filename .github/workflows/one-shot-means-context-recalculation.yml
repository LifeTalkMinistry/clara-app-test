name: One-shot Means context recalculation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-means-context-recalculation.yml"
      - "scripts/fix_means_score_transfer_baseline.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply migrated Means baseline repair
        run: python scripts/fix_means_score_transfer_baseline.py

      - name: Run focused regression tests
        run: node --test tests/means-score-transfer-baseline-regression.test.mjs tests/means-score-context-baseline-regression.test.mjs

      - name: Restore workflow and remove one-shot script
        run: |
          git checkout HEAD^ -- .github/workflows/one-shot-means-context-recalculation.yml
          rm -f scripts/fix_means_score_transfer_baseline.py

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source change needed."
            exit 0
          fi
          git commit -m "Fix migrated Means Score baseline authority"
          git push origin HEAD:main
