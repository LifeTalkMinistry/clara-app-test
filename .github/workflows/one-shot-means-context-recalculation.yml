name: One-shot Means context recalculation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-means-context-recalculation.yml"
      - "scripts/fix_means_context_recalculation.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install context-aware Means baseline v2
        run: python scripts/fix_means_context_recalculation.py

      - name: Add Means regression coverage
        shell: bash
        run: |
          cat > tests/means-context-baseline-regression.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const source = fs.readFileSync("src/runtime/installClaraOrbGreeting.js", "utf8");

          function score(financialRunway, upcoming, requiredRunway, plannedAssumedSinceLock = 0, realizedOffset = 0) {
            if (!(requiredRunway > 0)) return financialRunway > 0 ? 100 : 0;
            const scoreRoom = financialRunway - upcoming - plannedAssumedSinceLock + realizedOffset;
            return Math.round(((requiredRunway + scoreRoom) / requiredRunway) * 100);
          }

          test("Means baseline v2 refreshes when declared financial context changes", () => {
            assert.match(source, /clara:means-cycle-baseline:v2/);
            assert.match(source, /function buildMeansPlanFingerprint/);
            assert.match(source, /parsed\.planFingerprint/);
            assert.match(source, /planFingerprint,/);

            // Test 1: incomplete setup cannot freeze 100.
            assert.equal(score(12000, 8000, 8000), 150);

            // Test 2: adding another 1,000 requirement lowers the score.
            assert.equal(score(12000, 9000, 9000), 133);

            // Test 3: deleting that context restores the prior score.
            assert.equal(score(12000, 8000, 8000), 150);
          });

          test("realizing an already-known planned payment stays neutral", () => {
            const before = score(12000, 8000, 8000);
            const afterPlannedPayment = score(11000, 7000, 8000);
            assert.equal(before, 150);
            assert.equal(afterPlannedPayment, before);
          });

          test("unplanned spending lowers Means while new pay cycles use independent keys", () => {
            assert.equal(score(10000, 8000, 8000), 125);
            assert.match(source, /meansCycleBaselineStorageKey\(owner, cycleStart, cycleEnd\)/);
            assert.match(source, /:\$\{cycleStart\}:\$\{cycleEnd\}/);
          });

          test("canonical financial update sources still trigger recalculation", () => {
            assert.match(source, /window\.addEventListener\(FINANCE_DATA_UPDATED_EVENT, handleFinanceRefresh\)/);
            assert.match(source, /window\.addEventListener\(INCOME_HUB_UPDATED_EVENT, handleFinanceRefresh\)/);
            assert.match(source, /window\.addEventListener\(DEBT_OBLIGATIONS_UPDATED_EVENT, handleFinanceRefresh\)/);
            assert.match(source, /window\.addEventListener\(CLARA_MONEY_ROUTINE_UPDATED_EVENT, handleFinanceRefresh\)/);
            assert.match(source, /window\.addEventListener\("clara:schedule:create-event", handleFinanceRefresh\)/);
          });
          EOF

      - name: Verify patch invariants
        shell: python
        run: |
          from pathlib import Path
          source = Path("src/runtime/installClaraOrbGreeting.js").read_text()
          assert 'clara:means-cycle-baseline:v2' in source
          assert 'clara:means-cycle-baseline:v1' not in source
          assert 'buildMeansPlanFingerprint' in source
          assert 'String(parsed.planFingerprint || "") === fallback.planFingerprint' in source
          assert 'plannedDebtPaidInsideCycle' in source
          assert 'realizedBuyCheckMeansOffset' in source
          assert 'planFingerprint,' in source

      - name: Syntax check Means runtime
        run: node --check src/runtime/installClaraOrbGreeting.js

      - name: Install dependencies
        run: npm ci

      - name: Run Means regression tests
        run: node --test tests/means-context-baseline-regression.test.mjs

      - name: Run full production build
        run: npm run build

      - name: Commit verified fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/installClaraOrbGreeting.js tests/means-context-baseline-regression.test.mjs
          if git diff --cached --quiet; then
            echo "No source change needed."
            exit 0
          fi
          git commit -m "Refresh Means baseline when financial context changes"
          git push origin HEAD:main
