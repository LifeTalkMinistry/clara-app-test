name: Verify Device Transfer

on:
  push:
    branches: [main]
    paths:
      - "src/components/device-transfer/**"
      - "src/lib/device-transfer-*.js"
      - "src/pages/DataExport.jsx"
      - "tests/device-transfer-safety.test.mjs"
      - "tests/cloud-vault-sync.test.mjs"
      - "tests/settings-local-only-regression.test.mjs"
      - ".github/workflows/verify-device-transfer.yml"
  pull_request:
    paths:
      - "src/components/device-transfer/**"
      - "src/lib/device-transfer-*.js"
      - "src/pages/DataExport.jsx"
      - "tests/device-transfer-safety.test.mjs"
      - "tests/cloud-vault-sync.test.mjs"
      - "tests/settings-local-only-regression.test.mjs"
      - ".github/workflows/verify-device-transfer.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Run transfer safety regressions
        run: >-
          node --test
          tests/device-transfer-safety.test.mjs
          tests/cloud-vault-sync.test.mjs
          tests/settings-local-only-regression.test.mjs
      - name: Build production app
        run: npx vite build --base=./
