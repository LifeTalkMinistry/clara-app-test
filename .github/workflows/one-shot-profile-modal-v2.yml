name: One-shot Profile modal v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-profile-modal-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make Profile modal-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/Community.jsx')
          text = path.read_text()

          text = text.replace('import CommunityProfile from "./CommunityProfile";\n', '', 1)
          text = text.replace(
              'function CommunityShellHeader({ activeView, unreadCount }) {',
              'function CommunityShellHeader({ activeView, unreadCount, onOpenProfile }) {',
              1,
          )

          profile_pattern = re.compile(
              r'        <Link\n          to="/community\?view=profile"[\s\S]*?        </Link>'
          )
          profile_button = '''        <button
          type="button"
          onClick={onOpenProfile}
          className="clara-community-nav-item relative inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-[#6f83b4]/22 bg-[linear-gradient(135deg,rgba(35,170,190,0.78),rgba(88,70,214,0.82))] text-[10px] font-black tracking-[-0.01em] text-white/95 shadow-[0_8px_22px_rgba(65,76,180,0.16)] transition-all duration-200 hover:border-white/20 max-[420px]:h-9 max-[420px]:w-9 max-[420px]:text-[9px] sm:h-12 sm:w-12 sm:text-[11px]"
          aria-label="Open CLARA Profile preview"
          title="ME"
        >
          ME
        </button>'''
          text, count = profile_pattern.subn(profile_button, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Profile nav link, replaced {count}')

          modal = '''function ProfileUnderConstructionModal({ onClose }) {
  return (
    <div
      className="fixed inset-0 z-[220] grid place-items-center bg-[#020817]/72 px-5 backdrop-blur-md"
      role="dialog"
      aria-modal="true"
      aria-labelledby="clara-profile-construction-title"
      onClick={onClose}
    >
      <section
        className="relative w-full max-w-sm overflow-hidden rounded-[30px] border border-[#71f4ea]/18 bg-[radial-gradient(circle_at_50%_0%,rgba(43,225,216,0.12),transparent_34%),linear-gradient(180deg,#0a1830_0%,#071225_100%)] px-6 pb-7 pt-8 text-center shadow-[0_28px_90px_rgba(0,0,0,0.58),0_0_40px_rgba(43,225,216,0.08)]"
        onClick={(event) => event.stopPropagation()}
      >
        <button
          type="button"
          onClick={onClose}
          className="absolute right-4 top-4 grid h-9 w-9 place-items-center rounded-full border border-white/10 bg-white/[0.04] text-lg font-light text-white/55 transition hover:bg-white/[0.08] hover:text-white"
          aria-label="Close Profile notice"
        >
          ×
        </button>

        <div className="mx-auto grid h-16 w-16 place-items-center rounded-[22px] border border-[#5eead4]/18 bg-[#0b2034] shadow-[0_0_32px_rgba(43,225,216,0.12)]">
          <Wrench className="h-7 w-7 text-[#8ffff8]/80" aria-hidden="true" />
        </div>
        <p className="mt-5 text-[10px] font-black uppercase tracking-[0.24em] text-[#8ffff8]/48">CLARA PROFILE</p>
        <h2 id="clara-profile-construction-title" className="mt-2 text-[26px] font-black tracking-[-0.04em] text-white">
          Under Construction
        </h2>
        <p className="mx-auto mt-3 max-w-[17rem] text-[13px] font-semibold leading-6 text-white/48">
          We’re rebuilding Profile for a more personal CLARA experience. It isn’t part of the current release yet.
        </p>
        <div className="mt-6 rounded-2xl border border-[#5eead4]/10 bg-[#5eead4]/[0.045] px-4 py-3">
          <p className="text-[10px] font-black uppercase tracking-[0.17em] text-[#8ffff8]/58">Coming in a future CLARA update</p>
        </div>
        <button
          type="button"
          onClick={onClose}
          className="mt-5 h-12 w-full rounded-2xl border border-[#69f0e7]/20 bg-[linear-gradient(135deg,rgba(37,191,212,0.28),rgba(99,86,232,0.28))] text-sm font-black text-white shadow-[0_10px_28px_rgba(42,104,180,0.16)] transition hover:border-[#69f0e7]/35"
        >
          Got it
        </button>
      </section>
    </div>
  );
}

'''
          anchor = 'function UnderConstructionView() {'
          if anchor not in text:
              raise SystemExit('UnderConstructionView anchor missing')
          text = text.replace(anchor, modal + anchor, 1)

          state_anchor = '  const [notifications, setNotifications] = useState([]);\n'
          if state_anchor not in text:
              raise SystemExit('State anchor missing')
          text = text.replace(
              state_anchor,
              state_anchor + '  const [profileModalOpen, setProfileModalOpen] = useState(false);\n',
              1,
          )

          header_anchor = '      <CommunityShellHeader activeView={activeView} unreadCount={unreadCount} />'
          if header_anchor not in text:
              raise SystemExit('Header render anchor missing')
          text = text.replace(
              header_anchor,
              '''      <CommunityShellHeader
        activeView={activeView}
        unreadCount={unreadCount}
        onOpenProfile={() => setProfileModalOpen(true)}
      />''',
              1,
          )

          style_anchor = '      `}</style>\n\n'
          if style_anchor not in text:
              raise SystemExit('Style close anchor missing')
          text = text.replace(
              style_anchor,
              style_anchor + '''      {profileModalOpen ? (
        <ProfileUnderConstructionModal onClose={() => setProfileModalOpen(false)} />
      ) : null}

''',
              1,
          )

          route_pattern = re.compile(
              r'      \) : activeView === "profile" \? \(\n        <div className="clara-community-profile-view[\s\S]*?        </div>\n      \) : \('
          )
          text, count = route_pattern.subn(
              '      ) : activeView === "profile" ? (\n        <UnderConstructionView />\n      ) : (',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one Profile route branch, replaced {count}')

          path.write_text(text)
          PY

      - name: Verify Profile boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/pages/Community.jsx', 'utf8');
          const required = [
            'function ProfileUnderConstructionModal({ onClose })',
            'onOpenProfile={() => setProfileModalOpen(true)}',
            'onClick={onOpenProfile}',
            'activeView === "profile" ? (\n        <UnderConstructionView />',
          ];
          required.forEach((token) => {
            if (!source.includes(token)) throw new Error(`Missing ${token}`);
          });
          if (source.includes('to="/community?view=profile"')) throw new Error('Profile still navigates');
          if (source.includes('CommunityProfile />')) throw new Error('Legacy Profile still renders');
          console.log('Profile modal-only boundary verified');
          NODE

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-profile-modal-v2.yml
          git add src/pages/Community.jsx
          git commit -m "Make Profile under construction"
          git push origin HEAD:main

# trigger
