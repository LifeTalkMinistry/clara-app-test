name: Replace legacy coaching dashboard entry

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/replace-coaching-calendar-entry.yml"

permissions:
  contents: write

jobs:
  replace-entry:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Replace legacy walkthrough entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          component_path = Path("src/components/fresh/main-dashboard/learning-hub/LearningHub.jsx")
          source = component_path.read_text(encoding="utf-8")
          original = source

          source = source.replace(
              '} from "react";\n',
              '} from "react";\nimport { useNavigate } from "react-router-dom";\n',
              1,
          )
          source = source.replace('import { Capacitor } from "@capacitor/core";\n', '')
          source = source.replace(
              'import { CalendarClock, ScrollText } from "lucide-react";\n',
              'import { CalendarDays, ScrollText } from "lucide-react";\n',
          )
          source = source.replace(
              'import { WELCOME_SESSION_FORM_URL } from "@/lib/welcome-session-schedule";\n',
              '',
          )
          source = source.replace(
              'import GuidedOnboardingIntroDialog from "./ui/GuidedOnboardingIntroDialog";\n',
              '',
          )

          source, count = re.subn(
              r'\nfunction openWelcomeSessionForm\(url\) \{.*?\n\}\n\nfunction ClaraGuideButton',
              '\nfunction ClaraGuideButton',
              source,
              flags=re.S,
          )
          assert count == 1, f"Expected one legacy form helper, found {count}"

          coaching_button = '''function CoachingCalendarButton({ onClick }) {
            return (
              <button
                type="button"
                onClick={onClick}
                data-clara-coaching-calendar-button="true"
                className="clara-learning-motion relative inline-flex h-9 w-9 shrink-0 items-center justify-center overflow-visible rounded-full border border-cyan-200/20 bg-[rgba(6,18,38,0.68)] text-cyan-50 shadow-[0_10px_26px_rgba(0,0,0,0.22),0_0_24px_rgba(34,211,238,0.10),inset_0_1px_0_rgba(255,255,255,0.08)] backdrop-blur-xl transition hover:border-cyan-200/36 hover:bg-white/[0.09] active:scale-[0.96]"
                aria-label="Open CLARA Coaching Calendar"
                title="CLARA Coaching Calendar"
              >
                <span className="pointer-events-none absolute inset-0 rounded-full bg-[radial-gradient(circle_at_top_left,rgba(45,212,191,0.22),transparent_48%),radial-gradient(circle_at_bottom_right,rgba(99,102,241,0.24),transparent_52%)]" />
                <CalendarDays className="relative z-10 h-4 w-4 text-cyan-100/85" />
                <span className="absolute -right-2 -top-2 z-20 rounded-full border border-emerald-100/25 bg-emerald-300 px-1.5 py-0.5 text-[7px] font-black leading-none text-emerald-950 shadow-[0_8px_18px_rgba(52,211,153,0.28)]">
                  30m
                </span>
              </button>
            );
          }'''

          source, count = re.subn(
              r'function GuidedOnboardingButton\(.*?\n\}\n\nfunction DailyTipGuideBubble',
              coaching_button + '\n\nfunction DailyTipGuideBubble',
              source,
              flags=re.S,
          )
          assert count == 1, f"Expected one legacy dashboard button, found {count}"

          source = source.replace(
              '}) {\n  const [shouldLoadHub, setShouldLoadHub] = useState(false);',
              '}) {\n  const navigate = useNavigate();\n  const [shouldLoadHub, setShouldLoadHub] = useState(false);',
              1,
          )
          source = source.replace(
              '  const [isGuidedOnboardingIntroOpen, setIsGuidedOnboardingIntroOpen] =\n    useState(false);\n',
              '',
          )
          source = source.replace('  const guidedOnboardingButtonRef = useRef(null);\n', '')

          source, count = re.subn(
              r'\n  const closeGuidedOnboardingIntro = useCallback\(.*?\n  \);\n\n  const handleCloseHub',
              '\n  const handleCloseHub',
              source,
              flags=re.S,
          )
          assert count == 1, f"Expected one legacy close callback, found {count}"

          source, count = re.subn(
              r'\n  useEffect\(\(\) => \{\n    if \(!isGuideMode && !shouldLoadHub\) return;\n    setIsGuidedOnboardingIntroOpen\(false\);\n  \}, \[isGuideMode, shouldLoadHub\]\);\n',
              '\n',
              source,
          )
          assert count == 1, f"Expected one legacy dialog reset effect, found {count}"

          source, count = re.subn(
              r'\n  const handleGuidedOnboardingClick = \(\) => \{.*?\n  \};\n\n  const handleOpenGuidedOnboardingForm = \(\) => \{.*?\n  \};\n',
              '\n  const handleOpenCoachingCalendar = () => {\n    navigate("/welcome-session");\n  };\n',
              source,
              flags=re.S,
          )
          assert count == 1, f"Expected one pair of legacy handlers, found {count}"

          source, count = re.subn(
              r'<GuidedOnboardingButton\s+buttonRef=\{guidedOnboardingButtonRef\}\s+isOpen=\{isGuidedOnboardingIntroOpen\}\s+onClick=\{handleGuidedOnboardingClick\}\s*/>',
              '<CoachingCalendarButton onClick={handleOpenCoachingCalendar} />',
              source,
          )
          assert count == 1, f"Expected one legacy button usage, found {count}"

          source, count = re.subn(
              r'\n\s*<GuidedOnboardingIntroDialog\s+open=\{isGuidedOnboardingIntroOpen && !isGuideMode && !shouldLoadHub\}\s+onClose=\{closeGuidedOnboardingIntro\}\s+onContinue=\{handleOpenGuidedOnboardingForm\}\s*/>',
              '',
              source,
          )
          assert count == 1, f"Expected one legacy dialog usage, found {count}"

          assert source != original, "Learning Hub source did not change"
          assert 'navigate("/welcome-session")' in source
          assert "GuidedOnboardingIntroDialog" not in source
          assert "openWelcomeSessionForm" not in source
          assert "WELCOME_SESSION_FORM_URL" not in source
          component_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/coaching-scheduling.test.mjs")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              'const scheduleModule = fs.readFileSync("src/lib/welcome-session-schedule.js", "utf8");\n',
              'const scheduleModule = fs.readFileSync("src/lib/welcome-session-schedule.js", "utf8");\nconst learningHubEntry = fs.readFileSync(\n  "src/components/fresh/main-dashboard/learning-hub/LearningHub.jsx",\n  "utf8"\n);\n',
              1,
          )
          new_test = '''\n\ntest("dashboard coaching shortcut opens the authoritative coaching calendar directly", () => {
            assert.match(learningHubEntry, /useNavigate/);
            assert.match(learningHubEntry, /navigate\("\\/welcome-session"\)/);
            assert.match(learningHubEntry, /Open CLARA Coaching Calendar/);
            assert.match(learningHubEntry, /data-clara-coaching-calendar-button/);
            assert.doesNotMatch(
              learningHubEntry,
              /GuidedOnboardingIntroDialog|openWelcomeSessionForm|window\.open/
            );
          });'''
          anchor = '\n\ntest("current active appointment takes priority over recent history", () => {'
          assert anchor in tests, "Could not find coaching test insertion point"
          tests = tests.replace(anchor, new_test + anchor, 1)
          test_path.write_text(tests, encoding="utf-8")

          legacy_dialog = Path(
              "src/components/fresh/main-dashboard/learning-hub/ui/GuidedOnboardingIntroDialog.jsx"
          )
          if legacy_dialog.exists():
              legacy_dialog.unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Commit verified coaching calendar entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/learning-hub/LearningHub.jsx \
            tests/coaching-scheduling.test.mjs \
            src/components/fresh/main-dashboard/learning-hub/ui/GuidedOnboardingIntroDialog.jsx
          git commit -m "Open coaching calendar directly from dashboard"
          git push origin main
