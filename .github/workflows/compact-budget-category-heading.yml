name: Compact budget category heading
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compact-budget-category-heading.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/monthly-budget-plan/MonthlyBudgetPlanGuided.jsx')
          source = path.read_text()
          old = '''                    <p className="text-sm font-black">Categories added</p>
                    <p className="mt-0.5 text-xs font-semibold text-white/38">
                      {fmt(categoryAllocated)} assigned across {budgetOptions.length} {budgetOptions.length === 1 ? "category" : "categories"}.
                    </p>'''
          new = '''                    <p className="text-sm font-black">
                      {fmt(allocated)} allocated · {budgetOptions.length} {budgetOptions.length === 1 ? "category" : "categories"} · {fmt(left)} left
                    </p>
                    <p className="mt-0.5 text-xs font-semibold text-white/38">Exact allocated items</p>'''
          if old not in source:
              raise SystemExit('Heading marker not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - run: |
          rm -f .github/workflows/compact-budget-category-heading.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Compact budget category heading" && git push origin main)
