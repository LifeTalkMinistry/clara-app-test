name: Verify provider removal

on:
  push:
    branches:
      - provider-removal-verify-main

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Remove temporary verifier
        run: rm -f .github/workflows/verify-provider-removal.yml

      - name: Prove legacy provider string is absent
        shell: bash
        run: |
          needle='supa''base'
          if grep -RniI --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "$needle" .; then
            echo "Legacy provider references remain."
            exit 1
          fi

      - name: Commit verified lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verification changes to commit."
          else
            git commit -m "Finalize provider removal on latest main"
            git push origin HEAD:provider-removal-verify-main
          fi
