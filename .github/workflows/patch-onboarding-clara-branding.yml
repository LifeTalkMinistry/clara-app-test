name: Patch onboarding CLARA brand-name treatment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-onboarding-clara-branding.yml
      - scripts/patch_onboarding_clara_branding.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply branded CLARA name treatment
        run: python scripts/patch_onboarding_clara_branding.py

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify affected onboarding sources
        run: npx eslint src/components/ClaraBrandName.jsx src/pages/onboarding/UniversalOnboarding.jsx src/pages/onboarding/FoundingBetaWelcome.jsx

      - name: Verify Vite production compile
        run: npx vite build --base=./

      - name: Commit branded CLARA name treatment
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/onboarding/UniversalOnboarding.jsx src/pages/onboarding/FoundingBetaWelcome.jsx
          git commit -m "Use CLARA brand colors for onboarding name mentions"
          git push origin main
