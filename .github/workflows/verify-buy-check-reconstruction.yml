name: Verify Buy Check Architecture

on:
  pull_request:
    branches: [main]
    paths:
      - "api/clara-gemini.js"
      - "src/lib/clara-buy-check-*.js"
      - "src/lib/clara-gemini-*.js"
      - "src/lib/clara-spending-decision-ai.js"
      - "src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlay*.jsx"
      - "src/components/fresh/main-dashboard/assistant/ClaraLifeProfilePortal.jsx"
      - "src/components/fresh/main-dashboard/assistant/buy-check/*.jsx"
      - "src/components/fresh/main-dashboard/assistant/useClaraBuyCheck*.js"
      - "src/pages/Profile.jsx"
      - "tests/buy-check-*.test.mjs"
      - "tests/life-profile-navigation-layout.test.mjs"
      - "package.json"
      - ".github/workflows/verify-buy-check-reconstruction.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Buy Check facts, Gemini authority, and Life Profile layout
        run: node --test tests/buy-check-context-facts.test.mjs tests/buy-check-gemini-authority.test.mjs tests/life-profile-navigation-layout.test.mjs

      - name: Lint Buy Check architecture
        run: npm run lint:buy-check

      - name: Build production app
        run: npx vite build --base=./
