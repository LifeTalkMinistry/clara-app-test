name: Verify Buy Check Reconstruction

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/clara-buy-check-*.js"
      - "src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlay*.jsx"
      - "src/components/fresh/main-dashboard/assistant/buy-check/*.jsx"
      - "src/components/fresh/main-dashboard/assistant/buyCheckReasonInterpreter*.js"
      - "src/components/fresh/main-dashboard/assistant/useClaraBuyCheck*.js"
      - "tests/buy-check-*.test.mjs"
      - "package.json"
      - ".github/workflows/verify-buy-check-reconstruction.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic Buy Check tests
        run: npm test

      - name: Lint Buy Check reconstruction
        run: npm run lint:buy-check

      - name: Build production app
        run: npm run build
