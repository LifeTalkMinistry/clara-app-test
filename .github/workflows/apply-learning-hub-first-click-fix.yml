name: Apply Learning Hub first-click fix

on:
  push:
    branches:
      - fix/learning-hub-first-click
    paths:
      - ".github/scripts/apply-learning-hub-first-click-fix.mjs"
      - ".github/workflows/apply-learning-hub-first-click-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/learning-hub-first-click
          fetch-depth: 0

      - name: Apply focused first-click fix
        run: node .github/scripts/apply-learning-hub-first-click-fix.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression
        run: node --test tests/learning-hub-first-click.test.mjs

      - name: Run full regression suite
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/components/fresh/main-dashboard/learning-hub/LearningHub.jsx src/components/fresh/main-dashboard/learning-hub/ui/LearningHubToggleButton.jsx src/runtime/installLearningHubOpenSound.js tests/learning-hub-first-click.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Learning Hub first-click fix is already present."
            exit 0
          fi
          git commit -m "Stabilize Learning Hub first click"
          git push origin HEAD:fix/learning-hub-first-click
