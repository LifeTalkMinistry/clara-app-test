name: Validate committed feature locks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - committed-daily-tip-learning-hub-lock

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: build-validation-key
          VITE_GEMINI_API_KEY: build-validation-key
          VITE_GEMINI_MODEL: gemini-2.5-flash
