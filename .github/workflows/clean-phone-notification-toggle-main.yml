name: Clean Phone Notification Toggle Main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clean-phone-notification-toggle-main.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply clean On Off toggle patch
        run: node .github/scripts/clean-phone-notification-toggle.mjs

      - name: Verify notification contracts
        run: |
          git diff --check
          node --test tests/notification-runtime-contracts.test.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Verify production compilation
        run: npx vite build --base=./

      - name: Commit verified repair and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clean-phone-notification-toggle-main.yml .github/scripts/clean-phone-notification-toggle.mjs
          git add src/components/notifications/NotificationSettingsPanel.jsx tests/notification-runtime-contracts.test.mjs
          git commit -m "Simplify phone notifications to On Off toggle"

          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Push attempt ${attempt}"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo "Could not fast-forward main after repeated retries." >&2
          exit 1
