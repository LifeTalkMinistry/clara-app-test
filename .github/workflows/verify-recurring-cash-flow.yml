name: Verify recurring cash flow

on:
  pull_request:
    paths:
      - "src/lib/recurringCashFlowRepository.js"
      - "src/components/financial-carousel/cards/investment/ui/**"
      - "src/components/fresh/main-dashboard/budget/**"
      - "src/components/fresh/main-dashboard/dashboard-panels/schedule/**"
      - "src/components/fresh/main-dashboard/shell/**"
      - "tests/recurring-cash-flow-*.test.mjs"
      - ".github/workflows/verify-recurring-cash-flow.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Run recurring cash flow tests
        run: node --test tests/recurring-cash-flow-dates.test.mjs tests/recurring-cash-flow-budget.test.mjs
      - name: Build application
        shell: bash
        run: |
          if ! npm run build > recurring-build.log 2>&1; then
            echo "BUILD_FAILED"
            tail -80 recurring-build.log
            exit 1
          fi
          tail -20 recurring-build.log
