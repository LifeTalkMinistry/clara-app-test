name: Validate Income Source Menu Full Repository

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-income-source-menu-full.yml"

permissions:
  contents: write

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validations and record results
        run: |
          set +e
          npm run lint > /tmp/full-lint.log 2>&1
          full_lint_exit=$?

          npx eslint src/components/financial-carousel/cards/investment/ui/InvestmentCardView.jsx > /tmp/component-lint.log 2>&1
          component_lint_exit=$?

          npm run build > /tmp/production-build.log 2>&1
          production_build_exit=$?
          set -e

          investment_card_mentions=$(grep -c "InvestmentCardView.jsx" /tmp/full-lint.log || true)

          {
            echo "full_lint_exit=${full_lint_exit}"
            echo "component_lint_exit=${component_lint_exit}"
            echo "production_build_exit=${production_build_exit}"
            echo "investment_card_mentions_in_full_lint=${investment_card_mentions}"
            echo
            echo "--- full lint tail ---"
            tail -n 50 /tmp/full-lint.log
            echo
            echo "--- component lint output ---"
            cat /tmp/component-lint.log
            echo
            echo "--- production build tail ---"
            tail -n 30 /tmp/production-build.log
          } > .github/income-menu-validation-result.txt

          printf '%s\n' "${component_lint_exit}" > /tmp/component-lint-exit
          printf '%s\n' "${production_build_exit}" > /tmp/production-build-exit

      - name: Publish validation result to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/income-menu-validation-result.txt
          git commit -m "chore: record income menu validation results"
          git push

      - name: Require modified component lint and production build
        run: |
          test "$(cat /tmp/component-lint-exit)" -eq 0
          test "$(cat /tmp/production-build-exit)" -eq 0
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: gemini-2.5-flash
