name: Buy Check Single Render Fix

on:
  push:
    branches: [fix-buy-check-single-render-20260626]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-buy-check-single-render-20260626
          fetch-depth: 1
          show-progress: false
      - run: node .github/scripts/fix-buy-check-single-render.mjs
      - run: git diff --check
      - run: npm ci
      - run: npm run build:web
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Buy Check opening race at source"
          git push origin HEAD:fix-buy-check-single-render-20260626
