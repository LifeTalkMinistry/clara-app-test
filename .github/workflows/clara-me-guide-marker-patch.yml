name: CLARA Me Guide marker patch

on:
  push:
    paths:
      - ".github/workflows/clara-me-guide-marker-patch.yml"

permissions:
  contents: write

jobs:
  patch-markers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add scoped setup-gate markers
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/components/fresh/main-dashboard/dashboard-panels/me/FinancialClimateUniversalScreen.jsx")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '    <div className="relative isolate flex h-full min-h-0 flex-col overflow-hidden rounded-[30px] bg-[#071226] px-4 pb-4 pt-4 shadow-[inset_0_0_0_1px_rgba(255,255,255,.055)]">',
                  '    <div\n      data-clara-life-stage-setup-gate="true"\n      className="relative isolate flex h-full min-h-0 flex-col overflow-hidden rounded-[30px] bg-[#071226] px-4 pb-4 pt-4 shadow-[inset_0_0_0_1px_rgba(255,255,255,.055)]"\n    >',
              ),
              (
                  '      <div className="relative z-10 flex min-h-0 flex-1 items-center justify-center px-1 py-4">',
                  '      <div\n        data-clara-life-stage-setup-layout="true"\n        className="relative z-10 flex min-h-0 flex-1 items-center justify-center px-1 py-4"\n      >',
              ),
              (
                  '        <section className="w-full max-w-[332px] overflow-hidden rounded-[30px] border border-white/[0.10] bg-[linear-gradient(180deg,rgba(8,47,73,.96),rgba(15,23,42,.98)_56%,rgba(24,12,68,.96))] p-5 text-center shadow-[0_26px_84px_rgba(0,0,0,.36),0_0_54px_rgba(125,211,252,.14),inset_0_1px_0_rgba(255,255,255,.09)]">',
                  '        <section\n          data-clara-life-stage-setup-card="true"\n          className="w-full max-w-[332px] overflow-hidden rounded-[30px] border border-white/[0.10] bg-[linear-gradient(180deg,rgba(8,47,73,.96),rgba(15,23,42,.98)_56%,rgba(24,12,68,.96))] p-5 text-center shadow-[0_26px_84px_rgba(0,0,0,.36),0_0_54px_rgba(125,211,252,.14),inset_0_1px_0_rgba(255,255,255,.09)]"\n        >',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one marker target, found {count}: {old[:72]}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          PY

          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/dashboard-panels/me/FinancialClimateUniversalScreen.jsx
          git commit -m "Add Me guide setup layout markers"
          git push origin HEAD:main
