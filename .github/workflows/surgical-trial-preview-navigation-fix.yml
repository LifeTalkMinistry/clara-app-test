name: Surgical trial preview navigation repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/surgical-trial-preview-navigation-fix.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair locked preview composition
        run: |
          python3 - <<'PY'
          from pathlib import Path

          community = Path('src/pages/Community.jsx')
          text = community.read_text()

          redirect = '''  useEffect(() => {\n    if (\n      checkingProductAccess ||\n      isAdmin ||\n      hasProductAccess ||\n      activeView === "orb" ||\n      activeView === "settings"\n    ) {\n      return;\n    }\n\n    const nextParams = new URLSearchParams(searchParams);\n    nextParams.set("view", "orb");\n    nextParams.delete("learning");\n    setSearchParams(nextParams, { replace: true });\n  }, [\n    activeView,\n    checkingProductAccess,\n    hasProductAccess,\n    isAdmin,\n    searchParams,\n    setSearchParams,\n  ]);\n\n'''
          if redirect not in text:
              raise SystemExit('locked-view redirect block not found')
          text = text.replace(redirect, '', 1)

          gate_branch = '''      ) : gateCurrentView ? (\n        <ClaraTrialAccessGate\n          trial={trial}\n          checking={checkingProductAccess}\n          error={productAccessError}\n          onRedeem={redeemTrialCode}\n          onRetry={refreshAccess}\n        />\n      ) : adminOnlyForCurrentUser ? ('''
          if gate_branch not in text:
              raise SystemExit('trial replacement branch not found')
          text = text.replace(gate_branch, '''      ) : adminOnlyForCurrentUser ? (''', 1)

          content_start = '      {activeView === "settings" ? (\n'
          if content_start not in text:
              raise SystemExit('Community content start not found')
          text = text.replace(
              content_start,
              '''      <div\n        className="relative flex min-h-0 flex-1 overflow-hidden"\n        data-clara-community-content-stack="true"\n      >\n        <div\n          className="flex min-h-0 flex-1"\n          inert={gateCurrentView ? "" : undefined}\n          aria-hidden={gateCurrentView ? "true" : undefined}\n          data-clara-trial-preview-page={gateCurrentView ? "true" : undefined}\n        >\n          {activeView === "settings" ? (\n''',
              1,
          )

          content_end = '''      )}\n    </div>\n  );\n}'''
          replacement_end = '''          )}\n        </div>\n\n        {gateCurrentView ? (\n          <div\n            className="absolute inset-0 z-[80] flex min-h-0"\n            data-clara-trial-gate-layer="true"\n          >\n            <ClaraTrialAccessGate\n              trial={trial}\n              checking={checkingProductAccess}\n              error={productAccessError}\n              onRedeem={redeemTrialCode}\n              onRetry={refreshAccess}\n            />\n          </div>\n        ) : null}\n      </div>\n    </div>\n  );\n}'''
          if content_end not in text:
              raise SystemExit('Community content end not found')
          text = text.replace(content_end, replacement_end, 1)
          community.write_text(text)

          gate = Path('src/components/community/ClaraTrialAccessGate.jsx')
          text = gate.read_text()
          text = text.replace('import ClaraOrbPage from "@/components/community/ClaraOrbPage";\n', '', 1)
          text = text.replace(
              'className="relative flex min-h-0 w-full flex-1 items-center justify-center overflow-y-auto bg-[#010217] px-5 py-8 text-white"',
              'className="relative flex min-h-0 w-full flex-1 items-center justify-center overflow-y-auto bg-[linear-gradient(180deg,rgba(1,2,23,0.10),rgba(1,2,23,0.24))] px-5 py-8 text-white"',
              1,
          )
          preview = '''      <div\n        className="pointer-events-none absolute inset-0 z-0 flex min-h-0 select-none"\n        aria-hidden="true"\n        inert=""\n        data-clara-trial-preview-content="true"\n      >\n        <ClaraOrbPage onActivate={() => {}} />\n      </div>\n\n      <div\n        aria-hidden="true"\n        className="pointer-events-none absolute inset-0 z-10 bg-[radial-gradient(circle_at_50%_16%,rgba(52,91,255,0.08),transparent_34%),radial-gradient(circle_at_50%_76%,rgba(235,185,52,0.035),transparent_34%),linear-gradient(180deg,rgba(1,2,23,0.18),rgba(1,2,23,0.38))]"\n        data-clara-trial-preview-scrim="true"\n      />\n\n'''
          if preview not in text:
              raise SystemExit('embedded Orb preview block not found')
          text = text.replace(preview, '', 1)
          old_card = 'bg-[linear-gradient(160deg,rgba(13,24,55,.96),rgba(5,9,31,.985)_56%,rgba(22,12,43,.97))] p-6 shadow-[0_28px_90px_rgba(0,0,0,.48),0_0_44px_rgba(66,111,255,.08)] backdrop-blur-2xl'
          new_card = 'bg-[linear-gradient(160deg,rgba(13,24,55,.78),rgba(5,9,31,.84)_56%,rgba(22,12,43,.80))] p-6 shadow-[0_28px_90px_rgba(0,0,0,.48),0_0_44px_rgba(66,111,255,.08)] backdrop-blur-md'
          if old_card not in text:
              raise SystemExit('trial card surface not found')
          text = text.replace(old_card, new_card, 1)
          gate.write_text(text)

          runtime = Path('src/lib/clara-product-runtime-access.js')
          runtime.write_text('''export const CLARA_PRODUCT_ACCESS_CHANGED_EVENT = "clara:product-access-changed";\n\nconst STYLE_ID = "clara-product-runtime-access-style";\nlet productLocked = true;\n\nfunction ensureRuntimeBoundaryStyles() {\n  if (typeof document === "undefined" || document.getElementById(STYLE_ID)) return;\n\n  const style = document.createElement("style");\n  style.id = STYLE_ID;\n  style.textContent = `\n    html[data-clara-product-locked="true"] #clara-daily-awareness-streak-banner,\n    html[data-clara-product-locked="true"] #clara-weekly-cross-check-reminder,\n    html[data-clara-product-locked="true"] #clara-weekly-cross-check-day-setup {\n      display: none !important;\n      pointer-events: none !important;\n    }\n  `;\n  document.head.appendChild(style);\n}\n\nfunction publishRuntimeState(source = "unknown") {\n  if (typeof document !== "undefined") {\n    ensureRuntimeBoundaryStyles();\n    document.documentElement.dataset.claraProductLocked = productLocked ? "true" : "false";\n  }\n\n  if (typeof window !== "undefined") {\n    window.dispatchEvent(\n      new CustomEvent(CLARA_PRODUCT_ACCESS_CHANGED_EVENT, {\n        detail: { locked: productLocked, source },\n      })\n    );\n  }\n}\n\nexport function isClaraProductRuntimeLocked() {\n  return productLocked;\n}\n\nexport function setClaraProductRuntimeAccess(hasAccess, source = "product-access") {\n  const nextLocked = !Boolean(hasAccess);\n  const changed = nextLocked !== productLocked;\n  productLocked = nextLocked;\n\n  if (changed || typeof document !== "undefined") {\n    publishRuntimeState(source);\n  }\n\n  return !productLocked;\n}\n\nif (typeof document !== "undefined") {\n  ensureRuntimeBoundaryStyles();\n  document.documentElement.dataset.claraProductLocked = "true";\n}\n''')

          tests = Path('tests/trial-gate-runtime-boundary.test.mjs')
          tests.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\n\nasync function source(path) {\n  return readFile(new URL(`../${path}`, import.meta.url), "utf8");\n}\n\ntest("trial gate leaves TopNav fully browsable while product content stays locked", async () => {\n  const runtime = await source("src/lib/clara-product-runtime-access.js");\n  const community = await source("src/pages/Community.jsx");\n\n  assert.match(runtime, /let productLocked = true/);\n  assert.doesNotMatch(runtime, /clara-community-shell-header/);\n  assert.doesNotMatch(runtime, /header\\.inert/);\n  assert.match(community, /data-clara-community-content-stack="true"/);\n  assert.match(community, /data-clara-trial-preview-page=\\{gateCurrentView/);\n  assert.match(community, /data-clara-trial-gate-layer="true"/);\n  assert.doesNotMatch(community, /nextParams\\.set\\("view", "orb"\\)/);\n});\n\ntest("trial banner overlays the actual selected page instead of mounting a second Orb", async () => {\n  const gate = await source("src/components/community/ClaraTrialAccessGate.jsx");\n  const community = await source("src/pages/Community.jsx");\n\n  assert.doesNotMatch(gate, /import ClaraOrbPage from/);\n  assert.doesNotMatch(gate, /data-clara-trial-preview-content/);\n  assert.match(gate, /rgba\\(1,2,23,0\\.10\\)/);\n  assert.match(gate, /rgba\\(13,24,55,\\.78\\)/);\n  assert.match(community, /inert=\\{gateCurrentView \\? "" : undefined\\}/);\n  assert.match(community, /<ClaraTrialAccessGate/);\n});\n\ntest("daily awareness cannot persist a check-in before product access is active", async () => {\n  const daily = await source("src/runtime/installDailyAwarenessStreak.js");\n\n  const lockGuard = daily.indexOf("if (isClaraProductRuntimeLocked())");\n  const checkIn = daily.indexOf("const result = performDailyCheckIn");\n\n  assert.ok(lockGuard >= 0, "daily streak must check the shared product lock");\n  assert.ok(checkIn >= 0, "daily streak check-in must still exist");\n  assert.ok(lockGuard < checkIn, "product lock must be checked before daily persistence");\n  assert.match(daily, /CLARA_PRODUCT_ACCESS_CHANGED_EVENT/);\n  assert.match(daily, /removeBanner\\(\\)/);\n});\n\ntest("product access hook publishes fail-closed and activation states to runtimes", async () => {\n  const hook = await source("src/hooks/useClaraProductAccess.js");\n\n  assert.match(hook, /setClaraProductRuntimeAccess\\(false, "checking-access"\\)/);\n  assert.match(hook, /setClaraProductRuntimeAccess\\(false, "access-check-failed"\\)/);\n  assert.match(hook, /nextTrial\\.status === "active"/);\n  assert.match(hook, /"trial-redeemed"/);\n  assert.match(hook, /hasProductAccess/);\n});\n''')
          PY

      - name: Run focused regression
        run: node --test tests/trial-gate-runtime-boundary.test.mjs

      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/surgical-trial-preview-navigation-fix.yml
          git add src/pages/Community.jsx src/components/community/ClaraTrialAccessGate.jsx src/lib/clara-product-runtime-access.js tests/trial-gate-runtime-boundary.test.mjs
          git commit -m "Fix trial preview navigation and content layering"
          git push origin HEAD:main
