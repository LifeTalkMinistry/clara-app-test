name: Apply Wallets Create Premium UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-wallets-create-premium.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-wallets-create-modal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --rebase origin main

      - name: Patch Wallets.jsx Create Wallet modal
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/pages/Wallets.jsx';
          let text = fs.readFileSync(file, 'utf8');
          const nl = text.includes('\r\n') ? '\r\n' : '\n';
          text = text.replace(/\r\n/g, '\n');

          const start = text.indexOf('      <Dialog open={addOpen} onOpenChange={setAddOpen}>');
          const end = text.indexOf('      <Dialog open={addMoneyOpen} onOpenChange={setAddMoneyOpen}>', start);
          if (start === -1 || end === -1) throw new Error('Create Wallet dialog block not found in Wallets.jsx');

          const replacement = String.raw`      <Dialog open={addOpen} onOpenChange={setAddOpen}>
        <DialogContent className="overflow-hidden rounded-[32px] border border-white/10 bg-[#030A14] p-0 text-white shadow-[0_30px_90px_rgba(0,0,0,0.62),0_0_44px_rgba(16,185,129,0.13)] sm:max-w-[520px]">
          <div className="relative">
            <div className="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_top_left,rgba(16,185,129,0.22),transparent_34%),radial-gradient(circle_at_bottom_right,rgba(34,211,238,0.14),transparent_38%),linear-gradient(180deg,rgba(8,20,36,0.98),rgba(3,10,20,1))]" />
            <div className="pointer-events-none absolute -left-20 top-10 h-56 w-56 rounded-full bg-emerald-400/12 blur-3xl" />
            <div className="pointer-events-none absolute -right-24 bottom-0 h-64 w-64 rounded-full bg-cyan-400/10 blur-3xl" />

            <div className="relative border-b border-white/10 px-5 py-5">
              <button
                type="button"
                onClick={() => setAddOpen(false)}
                className="absolute right-4 top-4 flex h-11 w-11 items-center justify-center rounded-2xl border border-white/10 bg-white/[0.06] text-white/70 shadow-[0_12px_30px_rgba(0,0,0,0.24)] transition hover:bg-white/[0.10] hover:text-white active:scale-95"
                aria-label="Close create wallet"
              >
                <X className="h-4.5 w-4.5" />
              </button>

              <DialogHeader className="pr-14 text-left">
                <div className="mb-3 inline-flex w-fit items-center gap-2 rounded-full border border-emerald-300/15 bg-emerald-400/10 px-3 py-1 text-[10px] font-bold uppercase tracking-[0.18em] text-emerald-100/85">
                  Wallet setup
                </div>
                <DialogTitle className="text-xl font-bold tracking-tight text-white">
                  Where will your money live?
                </DialogTitle>
                <p className="mt-1.5 text-sm leading-6 text-white/65">
                  Create a new money container inside your CLARA system.
                </p>
              </DialogHeader>
            </div>

            <div className="relative space-y-5 px-5 py-5">
              <div className="rounded-[28px] border border-white/10 bg-white/[0.04] p-4 shadow-[inset_0_1px_0_rgba(255,255,255,0.06),0_18px_50px_rgba(0,0,0,0.22)] backdrop-blur-2xl">
                <div className="space-y-4">
                  <div className="space-y-2">
                    <p className="text-sm font-semibold text-white/86">Wallet name</p>
                    <Input
                      placeholder="e.g. GCash, Cash, Payroll"
                      value={form.name}
                      onChange={(e) =>
                        setForm((prev) => ({ ...prev, name: e.target.value }))
                      }
                      className="h-12 rounded-2xl border-white/15 bg-white/[0.07] text-white shadow-[inset_0_1px_0_rgba(255,255,255,0.05)] placeholder:text-white/35 focus-visible:border-emerald-300/45 focus-visible:ring-emerald-400/25"
                    />
                    <p className="text-xs leading-5 text-white/45">
                      This name will appear on your wallet carousel.
                    </p>
                  </div>

                  <div className="space-y-2">
                    <p className="text-sm font-semibold text-white/86">Wallet type</p>
                    <Select
                      value={form.type}
                      onValueChange={(v) => setForm((prev) => ({ ...prev, type: v }))}
                    >
                      <SelectTrigger className="h-12 rounded-2xl border-white/15 bg-white/[0.07] text-white shadow-[inset_0_1px_0_rgba(255,255,255,0.05)] focus:border-emerald-300/45 focus:ring-emerald-400/25">
                        <SelectValue />
                      </SelectTrigger>
                      <SelectContent className="rounded-2xl border-white/10 bg-[#061426] text-white shadow-[0_20px_60px_rgba(0,0,0,0.55)]">
                        {walletTypes.map((t) => (
                          <SelectItem key={t} value={t}>
                            {walletIcons[t]} {t.replaceAll("_", " ")}
                          </SelectItem>
                        ))}
                      </SelectContent>
                    </Select>
                    <p className="text-xs leading-5 text-white/45">
                      Choose the closest type so CLARA can organize your money clearly.
                    </p>
                  </div>

                  <div className="space-y-2">
                    <p className="text-sm font-semibold text-white/86">Starting balance</p>
                    <div className="relative">
                      <span className="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-sm font-bold text-emerald-100/75">
                        ₱
                      </span>
                      <Input
                        type="number"
                        placeholder="0.00"
                        value={form.starting_balance}
                        onChange={(e) =>
                          setForm((prev) => ({
                            ...prev,
                            starting_balance: e.target.value,
                          }))
                        }
                        className="h-12 rounded-2xl border-white/15 bg-white/[0.07] pl-9 text-white shadow-[inset_0_1px_0_rgba(255,255,255,0.05)] placeholder:text-white/35 focus-visible:border-emerald-300/45 focus-visible:ring-emerald-400/25"
                      />
                    </div>
                  </div>
                </div>
              </div>

              <Button
                onClick={handleAddWallet}
                disabled={isCreatingWallet}
                className="h-13 min-h-[54px] w-full rounded-2xl bg-gradient-to-r from-emerald-400 via-emerald-500 to-green-600 text-sm font-bold text-white shadow-[0_14px_34px_rgba(16,185,129,0.32)] transition hover:scale-[1.01] hover:from-emerald-300 hover:to-green-500 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-60"
              >
                {isCreatingWallet ? "Creating..." : "Create wallet →"}
              </Button>

              <Button
                type="button"
                onClick={() => setAddOpen(false)}
                className="h-12 w-full rounded-2xl border border-white/10 bg-white/[0.045] text-sm font-semibold text-white/72 shadow-[inset_0_1px_0_rgba(255,255,255,0.04)] transition hover:bg-white/[0.08] hover:text-white"
              >
                Cancel
              </Button>
            </div>
          </div>
        </DialogContent>
      </Dialog>

`;

          text = text.slice(0, start) + replacement + text.slice(end);
          if (nl === '\r\n') text = text.replace(/\n/g, '\r\n');
          fs.writeFileSync(file, text);
          NODE

      - name: Commit Wallets.jsx premium create modal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Wallets.jsx
          if git diff --cached --quiet; then
            echo "Wallets.jsx already patched."
          else
            git commit -m "Upgrade create wallet modal to premium CLARA UI"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web
        run: npm run build:web
