name: Patch profile update listener hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-profile-update-listener-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardProfileUpdateListener into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardProfileUpdateListener from "@/components/fresh/main-dashboard/profile/useDashboardProfileUpdateListener";\n'
          import_anchor = 'import useDashboardOnlineStatusNotice from "@/components/fresh/main-dashboard/finance-notices/useDashboardOnlineStatusNotice";\n'
          fallback_anchor = 'import useFinanceDataErrorNotice from "@/components/fresh/main-dashboard/finance-notices/useFinanceDataErrorNotice";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Profile listener import anchor not found. Refusing to patch Dashboard.jsx.")

          if 'useDashboardProfileUpdateListener({' not in text:
              replacement = (
                  '  useDashboardProfileUpdateListener({\n'
                  '    setProfileData,\n'
                  '    setNickname,\n'
                  '    scheduleRefresh,\n'
                  '  });\n\n'
              )

              pattern = re.compile(
                  r'  useEffect\(\(\) => \{\n'
                  r'    const handleProfileUpdated = \(event\) => \{.*?'
                  r'    window\.addEventListener\("clara-profile-updated", handleProfileUpdated\);\n\n'
                  r'    return \(\) => \{\n'
                  r'      window\.removeEventListener\("clara-profile-updated", handleProfileUpdated\);\n'
                  r'    \};\n'
                  r'  \}, \[scheduleRefresh\]\);\n\n',
                  re.DOTALL,
              )

              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("Profile update listener effect pattern not found. Refusing to patch Dashboard.jsx.")

          if 'useDashboardProfileUpdateListener({' not in text:
              raise SystemExit("useDashboardProfileUpdateListener was not wired. Refusing to continue.")
          if 'window.addEventListener("clara-profile-updated", handleProfileUpdated);' in text:
              raise SystemExit("Old profile update listener still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-profile-update-listener-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-profile-update-listener-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire dashboard profile update listener hook"
          git push
