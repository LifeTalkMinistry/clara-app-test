name: Run top nav surgery on working branch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-top-nav-surgery-branch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-working-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix-top-nav-ownership
          fetch-depth: 0

      - name: Apply top nav surgery
        run: |
          node .github/scripts/apply-dashboard-top-nav-surgery.mjs
          node .github/scripts/apply-settings-react-ownership.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Commit verified refactor to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No top nav ownership changes were produced."
            exit 0
          fi
          git commit -m "Refactor dashboard top nav ownership"
          git push origin HEAD:fix-top-nav-ownership
