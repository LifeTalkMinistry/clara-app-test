name: Patch dashboard initial load hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard-initial-load-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardInitialLoad into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardInitialLoad from "@/components/fresh/main-dashboard/hooks/useDashboardInitialLoad";\n'
          import_anchor = 'import useLatestValueRef from "@/components/fresh/main-dashboard/hooks/useLatestValueRef";\n'
          fallback_anchor = 'import useDashboardScheduledRefresh from "@/components/fresh/main-dashboard/finance-notices/useDashboardScheduledRefresh";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Initial load import anchor not found. Refusing to patch Dashboard.jsx.")

          if 'useDashboardInitialLoad(loadDashboardData);' not in text:
              pattern = re.compile(
                  r'  useEffect\(\(\) => \{\n'
                  r'    loadDashboardData\(\);\n'
                  r'  \}, \[loadDashboardData\]\);\n\n',
                  re.DOTALL,
              )
              text, count = pattern.subn('  useDashboardInitialLoad(loadDashboardData);\n\n', text, count=1)
              if count != 1:
                  raise SystemExit("Initial dashboard load effect block not found. Refusing to patch Dashboard.jsx.")

          if 'useDashboardInitialLoad(loadDashboardData);' not in text:
              raise SystemExit("useDashboardInitialLoad was not wired. Refusing to continue.")
          if 'loadDashboardData();\n  }, [loadDashboardData]);' in text:
              raise SystemExit("Old initial load effect still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-dashboard-initial-load-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-dashboard-initial-load-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire dashboard initial load hook"
          git push
