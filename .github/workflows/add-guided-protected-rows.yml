name: Add guided protected rows
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-guided-protected-rows.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/monthly-budget-plan/MonthlyBudgetPlanGuided.jsx')
          source = path.read_text()
          marker = '''  const protectedAmount = firstAmount(
    plan.totalProtectedCommitments,
    plan.protected_commitments_total,
  );'''
          addition = marker + '''
  const protectedRows = (plan.budgetDisplayCategories || plan.displayCategories || []).filter(
    (item) => item?.isProtectedCommitment || item?.is_protected_commitment,
  );'''
          if marker not in source:
              raise SystemExit('Protected marker not found')
          source = source.replace(marker, addition, 1)
          source = source.replace('            {budgetOptions.length > 0 ? (', '            {budgetOptions.length > 0 || protectedRows.length > 0 ? (', 1)
          path.write_text(source)
          PY
      - run: |
          rm -f .github/workflows/add-guided-protected-rows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Prepare guided protected rows" && git push origin main)
