name: Patch Learning Hub reader options button
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-learning-reader-options-button.yml'
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reader options placement
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          modal_path = Path('src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx')
          css_path = Path('src/index.css')

          modal = modal_path.read_text()

          old_class = 'className="absolute inset-x-0 z-30 mx-auto flex h-11 min-h-11 w-11 min-w-11 items-center justify-center rounded-full border border-white/[0.14] bg-black/55 text-white/85 shadow-[0_10px_30px_rgba(0,0,0,0.32)] backdrop-blur-xl transition hover:bg-black/70 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300/70 focus-visible:ring-offset-2 focus-visible:ring-offset-[#080a0f]"'
          new_class = 'className="absolute z-30 flex h-11 min-h-11 w-11 min-w-11 items-center justify-center rounded-full border border-white/[0.14] bg-black/55 text-white/85 shadow-[0_10px_30px_rgba(0,0,0,0.32)] backdrop-blur-xl transition hover:bg-black/70 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300/70 focus-visible:ring-offset-2 focus-visible:ring-offset-[#080a0f]"'

          if old_class not in modal:
              raise SystemExit('Expected reader options button className was not found.')
          modal = modal.replace(old_class, new_class, 1)

          style_pattern = re.compile(
              r'(?P<indent>\s*)style=\{\{\n'
              r'\s*top: "max\(0\.75rem, env\(safe-area-inset-top\)\)",\n'
              r'\s*left: 0,\n'
              r'\s*right: 0,\n'
              r'\s*marginInline: "auto",\n'
              r'\s*transform: "none",\n'
              r'\s*\}\}',
              re.MULTILINE,
          )

          def style_replacement(match):
              indent = match.group('indent')
              inner = f'{indent}  '
              return (
                  f'{indent}style={{{{\n'
                  f'{inner}top: "max(0.75rem, env(safe-area-inset-top))",\n'
                  f'{inner}right: "max(0.85rem, env(safe-area-inset-right))",\n'
                  f'{inner}left: "auto",\n'
                  f'{inner}marginInline: 0,\n'
                  f'{inner}opacity: 0.5,\n'
                  f'{inner}transform: "none",\n'
                  f'{indent}}}}}'
              )

          modal, style_count = style_pattern.subn(style_replacement, modal, count=1)
          if style_count != 1:
              raise SystemExit(f'Expected to patch exactly one reader options style block, patched {style_count}.')

          modal_path.write_text(modal)

          css = css_path.read_text()
          css_override = '''
/* CLARA Learning Hub PDF reader: keep the top options button quiet and away from the reading center. */
#root button[aria-label="Open reader options"][aria-controls="clara-reader-options"] {
  left: auto !important;
  right: max(0.85rem, env(safe-area-inset-right)) !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
  opacity: 0.5 !important;
  transform: none !important;
}
'''
          if css_override in css:
              css = css.replace(css_override, '\n', 1)
              css_path.write_text(css)
          PY
      - name: Commit patch
        run: |
          rm -f .github/workflows/patch-learning-reader-options-button.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Move Learning Hub reader options button" && git push)
