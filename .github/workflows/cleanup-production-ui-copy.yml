name: Cleanup production UI copy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-production-ui-copy.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove user-facing developer/testing copy
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceRequired(filePath, from, to) {
            let content = fs.readFileSync(filePath, 'utf8');
            if (!content.includes(from)) {
              throw new Error(`Expected block not found in ${filePath}`);
            }
            content = content.split(from).join(to);
            fs.writeFileSync(filePath, content);
          }

          function replaceOptional(filePath, from, to) {
            if (!fs.existsSync(filePath)) return;
            let content = fs.readFileSync(filePath, 'utf8');
            if (!content.includes(from)) return;
            content = content.split(from).join(to);
            fs.writeFileSync(filePath, content);
          }

          const settingsPath = 'src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx';

          replaceRequired(
            settingsPath,
            'const shouldShowBillingDates = membershipState.isActiveCommitted && !membershipState.isDeveloperPreview && hasBillingDates;',
            'const shouldShowBillingDates = membershipState.isActiveCommitted && hasBillingDates;'
          );

          replaceRequired(
            settingsPath,
            `const billingDetailsMessage =\n  membershipState.membershipStatus === "loading"\n    ? "Syncing membership…"\n    : membershipState.isDeveloperPreview\n      ? "Developer preview does not create billing dates or modify your real membership."\n      : membershipState.isActiveCommitted\n        ? billingLoading || !hasBillingDates\n          ? "Billing details are syncing."\n          : ""\n      : membershipState.isPendingActivation\n        ? billingLoading\n          ? "Activation details are syncing."\n          : "Activation is awaiting confirmation."\n        : "No active billing. You will only be charged after starting and activating your commitment.";`,
            `const billingDetailsMessage =\n  membershipState.membershipStatus === "loading"\n    ? "Syncing membership…"\n    : membershipState.isActiveCommitted\n      ? billingLoading || !hasBillingDates\n        ? "Billing details are syncing."\n        : ""\n      : membershipState.isPendingActivation\n        ? billingLoading\n          ? "Activation details are syncing."\n          : "Activation is awaiting confirmation."\n        : "No active billing. You will only be charged after starting and activating your commitment.";`
          );

          replaceRequired(
            settingsPath,
            `        {membershipState.isDeveloperPreview ? (\n          <span className="rounded-full border border-cyan-300/20 bg-cyan-400/10 px-2.5 py-1 text-[9px] font-black uppercase tracking-[0.14em] text-cyan-100">\n            Developer Preview\n          </span>\n        ) : null}\n`,
            ''
          );

          const budgetPath = 'src/components/BudgetCard.jsx';
          replaceOptional(
            budgetPath,
            'import { useEffect, useRef, useState } from "react";\n',
            ''
          );
          replaceOptional(
            budgetPath,
            'import { writeDeveloperMembershipPreview } from "@/lib/membership";\n',
            ''
          );
          replaceOptional(
            budgetPath,
            '  const cardRef = useRef(null);\n  const [showPlanPreview, setShowPlanPreview] = useState(false);\n\n',
            ''
          );

          fs.rmSync('.github/workflows/cleanup-production-ui-copy.yml', { force: true });
          NODE

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx src/components/BudgetCard.jsx .github/workflows/cleanup-production-ui-copy.yml
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
          else
            git commit -m "Remove user-facing developer copy"
            git push
          fi
