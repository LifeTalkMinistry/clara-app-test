name: Fix Settings logout source

on:
  push:
    paths:
      - ".github/workflows/fix-settings-logout-source.yml"
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-settings-logout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move logout into Program
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx';
          let source = fs.readFileSync(path, 'utf8');

          const rowsNeedle = `          : []),
      ],
    },
  ];`;

          const rowsReplacement = `          : []),
        {
          key: "logout",
          title: signingOut ? "Logging out..." : "Log out",
          description: "Sign out of this CLARA account",
          icon: LogOut,
          action: handleLogout,
        },
      ],
    },
  ];`;

          if (!source.includes(rowsNeedle)) {
            throw new Error('Program rows insertion point was not found.');
          }

          source = source.replace(rowsNeedle, rowsReplacement);

          const standaloneLogout = `

      <section className="space-y-2">
        <button
          type="button"
          onClick={handleLogout}
          disabled={signingOut}
          className="flex min-h-14 w-full items-center justify-center gap-2 rounded-[24px] border border-rose-300/25 bg-[radial-gradient(circle_at_top_left,rgba(244,63,94,0.18),transparent_34%),rgba(244,63,94,0.10)] px-4 py-4 text-sm font-black text-rose-100 shadow-[0_14px_40px_rgba(244,63,94,0.10)] transition hover:bg-rose-500/18 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-55"
        >
          <LogOut className="h-4 w-4" />
          {signingOut ? "Logging out..." : "Log out"}
        </button>
        <p className="px-2 text-center text-[10px] font-semibold leading-4 text-white/55">
          Your financial records stay on this device. Log in again anytime.
        </p>
      </section>`;

          if (!source.includes(standaloneLogout)) {
            throw new Error('Standalone logout section was not found.');
          }

          source = source.replace(standaloneLogout, '');
          fs.writeFileSync(path, source);
          NODE

      - name: Remove one-time workflow and push
        run: |
          rm .github/workflows/fix-settings-logout-source.yml
          git config user.name "LifeTalkMinistry"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Render logout inside Program settings group"
          git push origin main
