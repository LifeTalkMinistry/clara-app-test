name: Fix savings linked Manual Log sync

on:
  push:
    paths:
      - '.github/workflows/fix-savings-linked-manual-log-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair savings totals and future Manual Log linkage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) One source of truth for savings aliases + conservative historical repair.
          repair = Path('src/lib/savingsGoalLinkedExpenseRepair.js')
          repair.write_text(r'''const SAVINGS_BUDGET_PREFIX = "protected-savings-";

const numberValue = (value) => {
  if (typeof value === "number") return Number.isFinite(value) ? value : 0;
  const parsed = Number(String(value ?? "").replace(/php/gi, "").replace(/[₱,\s]/g, ""));
  return Number.isFinite(parsed) ? parsed : 0;
};

const text = (value) => String(value ?? "").trim();
const normalized = (value) =>
  text(value)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();

const activeRows = (rows = []) =>
  (Array.isArray(rows) ? rows : []).filter((row) => !row?.deletedAt && !row?.deleted_at);

export const getCanonicalSavingsAmount = (goal = {}) => {
  const candidates = [
    goal?.saved_amount,
    goal?.savedAmount,
    goal?.current_amount,
    goal?.currentAmount,
    goal?.saved,
    goal?.current,
    goal?.amount_saved,
    goal?.amountSaved,
    goal?.progress_amount,
    goal?.amount,
  ];
  for (const candidate of candidates) {
    if (candidate === undefined || candidate === null || candidate === "") continue;
    return Math.max(0, numberValue(candidate));
  }
  return 0;
};

const getGoalId = (goal = {}) => text(goal?.id || goal?.goal_id || goal?.key);
const getGoalTitle = (goal = {}) =>
  normalized(goal?.title || goal?.name || goal?.goal_name || goal?.label);

const getExpenseAmount = (expense = {}) =>
  Math.abs(numberValue(expense?.amount ?? expense?.spent ?? expense?.value ?? expense?.total));

const getExpenseBudgetKey = (expense = {}) =>
  text(
    expense?.budgetListKey ||
      expense?.budget_list_key ||
      expense?.budget_category_id ||
      expense?.budgetCategoryId,
  );

const getExpenseLinkedType = (expense = {}) =>
  normalized(
    expense?.linked_target_type ||
      expense?.linkedTargetType ||
      expense?.protection_type ||
      expense?.protectionType,
  );

const getExpenseLinkedId = (expense = {}) =>
  text(
    expense?.linked_target_id ||
      expense?.linkedTargetId ||
      expense?.source_savings_goal_id ||
      expense?.sourceSavingsGoalId,
  );

const getExpenseIdentityText = (expense = {}) =>
  normalized(
    expense?.budget_category ||
      expense?.budgetCategory ||
      expense?.expense_category ||
      expense?.category ||
      expense?.title ||
      expense?.name,
  );

const hasSavingsUseActivity = (goal = {}) => {
  const logs = [
    goal?.savingsActivityLog,
    goal?.savings_activity_log,
    goal?.activityLog,
    goal?.activity_log,
  ].find(Array.isArray) || [];
  return logs.some((entry) => {
    const type = normalized(entry?.type || entry?.action || entry?.event_type || entry?.eventType);
    return type === "use" || type === "withdraw" || type === "withdrawal" || type === "spent";
  });
};

const expenseLinksToGoal = (expense = {}, goal = {}) => {
  const goalId = getGoalId(goal);
  if (!goalId) return false;

  const linkedType = getExpenseLinkedType(expense);
  const linkedId = getExpenseLinkedId(expense);
  if (linkedType === "savings" && linkedId && linkedId === goalId) return true;
  if (linkedId && linkedId === goalId) return true;

  const budgetKey = getExpenseBudgetKey(expense);
  if (budgetKey === `${SAVINGS_BUDGET_PREFIX}${goalId}`) return true;

  // Legacy Manual Log rows did not persist the synthetic protected key. For those
  // records only, exact title/category equality is the safest backwards-compatible link.
  const goalTitle = getGoalTitle(goal);
  return Boolean(goalTitle && getExpenseIdentityText(expense) === goalTitle);
};

export const getLinkedSavingsExpenseTotal = (goal = {}, expenses = []) =>
  activeRows(expenses).reduce((sum, expense) => {
    return expenseLinksToGoal(expense, goal) ? sum + getExpenseAmount(expense) : sum;
  }, 0);

export const reconcileSavingsGoalWithLinkedExpenses = (goal = {}, expenses = []) => {
  const stored = getCanonicalSavingsAmount(goal);
  const linkedExpenseTotal = getLinkedSavingsExpenseTotal(goal, expenses);

  // Linked savings expenses are a minimum proof of money that has been allocated to
  // this goal. Do not enforce that floor after a recorded withdrawal/use, because a
  // legitimate withdrawal can make the current saved balance lower than contributions.
  const repaired = hasSavingsUseActivity(goal)
    ? stored
    : Math.max(stored, linkedExpenseTotal);

  return {
    ...goal,
    saved_amount: repaired,
    savedAmount: repaired,
    current_amount: repaired,
    currentAmount: repaired,
    saved: repaired,
    current: repaired,
    amount_saved: repaired,
    amountSaved: repaired,
    linkedSavingsExpenseTotal: linkedExpenseTotal,
    linked_savings_expense_total: linkedExpenseTotal,
  };
};

export const reconcileSavingsGoalsWithLinkedExpenses = (goals = [], expenses = []) =>
  activeRows(goals).map((goal) => reconcileSavingsGoalWithLinkedExpenses(goal, expenses));
''')

          # 2) Hydrate Dashboard/Savings from repaired savings state.
          path = Path('src/hooks/useFinancialData.js')
          src = path.read_text()
          old = '''import { getEffectiveDemoFinanceLocalUserId } from "@/lib/demo/activeDemoProfile";\n'''
          new = '''import { getEffectiveDemoFinanceLocalUserId } from "@/lib/demo/activeDemoProfile";\nimport { reconcileSavingsGoalsWithLinkedExpenses } from "@/lib/savingsGoalLinkedExpenseRepair";\n'''
          if old not in src:
            raise SystemExit('useFinancialData import anchor not found')
          src = src.replace(old, new, 1)

          old = '''    const safeSavingsGoals = sortByOldest(removeDeletedRows(rawSavingsGoals));\n'''
          new = '''    const safeSavingsGoals = sortByOldest(\n      reconcileSavingsGoalsWithLinkedExpenses(removeDeletedRows(rawSavingsGoals), safeExpenses),\n    );\n'''
          if old not in src:
            raise SystemExit('safeSavingsGoals anchor not found')
          src = src.replace(old, new, 1)
          path.write_text(src)

          # 3) Dashboard helper must read canonical savings fields before legacy aliases.
          path = Path('src/utils/dashboard/dashboardHelpers.js')
          src = path.read_text()
          old = '''export const getSavingsSaved = (\n  savings = {}\n) => {\n  return safeNumber(\n    savings?.saved ??\n    savings?.current_amount ??\n    savings?.amount ??\n    0\n  );\n};\n\nexport const getSavingsTarget = (\n  savings = {}\n) => {\n  return safeNumber(\n    savings?.target ??\n    savings?.goal ??\n    savings?.target_amount ??\n    0\n  );\n};\n'''
          new = '''export const getSavingsSaved = (\n  savings = {}\n) => {\n  return safeNumber(\n    savings?.saved_amount ??\n    savings?.savedAmount ??\n    savings?.current_amount ??\n    savings?.currentAmount ??\n    savings?.saved ??\n    savings?.current ??\n    savings?.amount_saved ??\n    savings?.amountSaved ??\n    savings?.progress_amount ??\n    savings?.amount ??\n    0\n  );\n};\n\nexport const getSavingsTarget = (\n  savings = {}\n) => {\n  return safeNumber(\n    savings?.target_amount ??\n    savings?.targetAmount ??\n    savings?.target ??\n    savings?.goal ??\n    savings?.goal_amount ??\n    0\n  );\n};\n'''
          if old not in src:
            raise SystemExit('dashboard savings helper anchor not found')
          src = src.replace(old, new, 1)
          path.write_text(src)

          # 4) Every Savings Goal edit keeps old/new aliases synchronized.
          path = Path('src/pages/SavingsGoalsIntegrated.jsx')
          src = path.read_text()
          old = '''    saved_amount: savedAmount,\n    savedAmount,\n    current_amount: savedAmount,\n    currentAmount: savedAmount,\n'''
          new = '''    saved_amount: savedAmount,\n    savedAmount,\n    current_amount: savedAmount,\n    currentAmount: savedAmount,\n    saved: savedAmount,\n    current: savedAmount,\n    amount_saved: savedAmount,\n    amountSaved: savedAmount,\n'''
          if old not in src:
            raise SystemExit('normalizeGoal savings aliases anchor not found')
          src = src.replace(old, new, 1)
          path.write_text(src)

          # 5) Future Manual Log rows persist the exact protected target instead of
          # depending on a later title guess.
          path = Path('src/components/fresh/main-dashboard/finance-actions/useDashboardFinanceActionHandlers.js')
          src = path.read_text()
          old = '''    const selectedBudget = manualExpenseBudgetOptions.find(\n      (item) => String(item.key) === String(financeForm.budgetListKey)\n    );\n    const reason = normalizeString(financeForm.unplannedReason || financeForm.notes);\n'''
          new = '''    const selectedBudgetKey = normalizeString(financeForm.budgetListKey);\n    const protectedDisplayRows = Array.isArray(monthlyBudgetPlan?.budgetDisplayCategories)\n      ? monthlyBudgetPlan.budgetDisplayCategories\n      : Array.isArray(monthlyBudgetPlan?.budget_display_categories)\n        ? monthlyBudgetPlan.budget_display_categories\n        : [];\n    const selectedBudget =\n      manualExpenseBudgetOptions.find(\n        (item) => String(item.key) === String(selectedBudgetKey)\n      ) ||\n      protectedDisplayRows.find(\n        (item) => String(item?.key || item?.id || "") === String(selectedBudgetKey)\n      ) ||\n      null;\n    const selectedBudgetRaw = selectedBudget?.budget || selectedBudget || {};\n    const selectedProtectionType = normalizeLower(\n      selectedBudget?.protectionType ||\n        selectedBudget?.protection_type ||\n        selectedBudgetRaw?.linked_target_type ||\n        selectedBudgetRaw?.linkedTargetType ||\n        selectedBudgetRaw?.protection_type ||\n        selectedBudgetRaw?.protectionType ||\n        ""\n    );\n    const savingsGoalIdFromKey = selectedBudgetKey.startsWith("protected-savings-")\n      ? selectedBudgetKey.slice("protected-savings-".length)\n      : "";\n    const linkedSavingsGoalId = normalizeString(\n      selectedBudgetRaw?.source_savings_goal_id ||\n        selectedBudgetRaw?.sourceSavingsGoalId ||\n        selectedBudgetRaw?.linked_target_id ||\n        selectedBudgetRaw?.linkedTargetId ||\n        savingsGoalIdFromKey\n    );\n    const linkedDebtId = normalizeString(\n      selectedBudgetRaw?.source_debt_id ||\n        selectedBudgetRaw?.sourceDebtId ||\n        (selectedProtectionType === "debt"\n          ? selectedBudgetRaw?.linked_target_id || selectedBudgetRaw?.linkedTargetId\n          : "")\n    );\n    const linkedTargetType = ["savings", "emergency", "debt"].includes(selectedProtectionType)\n      ? selectedProtectionType\n      : savingsGoalIdFromKey\n        ? "savings"\n        : selectedBudgetKey === "protected-emergency-fund"\n          ? "emergency"\n          : linkedDebtId\n            ? "debt"\n            : "";\n    const linkedTargetId =\n      linkedTargetType === "savings"\n        ? linkedSavingsGoalId\n        : linkedTargetType === "debt"\n          ? linkedDebtId\n          : "";\n    const reason = normalizeString(financeForm.unplannedReason || financeForm.notes);\n'''
          if old not in src:
            raise SystemExit('manual expense selectedBudget anchor not found')
          src = src.replace(old, new, 1)

          old = '''      const budgetCategory = isUnplanned\n        ? "Unplanned Spending"\n        : isUndocumented\n          ? "Undocumented Spending"\n          : selectedBudget.title;\n'''
          new = '''      const budgetCategory = isUnplanned\n        ? "Unplanned Spending"\n        : isUndocumented\n          ? "Undocumented Spending"\n          : getBudgetListTitle(selectedBudgetRaw || selectedBudget);\n'''
          if old not in src:
            raise SystemExit('manual expense budgetCategory anchor not found')
          src = src.replace(old, new, 1)

          old = '''      const expensePayload = {\n        amount,\n        wallet_id: wallet.id,\n        category: budgetCategory,\n        need_type: needType,\n        planning_status: planningStatus,\n'''
          new = '''      const hasLinkedProtectedTarget =\n        !isUnplanned && !isUndocumented && Boolean(linkedTargetType);\n      const expensePayload = {\n        amount,\n        wallet_id: wallet.id,\n        category: budgetCategory,\n        budget_category: budgetCategory,\n        budgetListKey: !isUnplanned && !isUndocumented ? selectedBudgetKey : "",\n        budget_list_key: !isUnplanned && !isUndocumented ? selectedBudgetKey : "",\n        budget_category_id:\n          !isUnplanned && !isUndocumented\n            ? normalizeString(selectedBudget?.id || selectedBudgetRaw?.id || selectedBudgetKey) || null\n            : null,\n        linked_target_type: hasLinkedProtectedTarget ? linkedTargetType : null,\n        linkedTargetType: hasLinkedProtectedTarget ? linkedTargetType : null,\n        linked_target_id: hasLinkedProtectedTarget && linkedTargetId ? linkedTargetId : null,\n        linkedTargetId: hasLinkedProtectedTarget && linkedTargetId ? linkedTargetId : null,\n        source_savings_goal_id:\n          hasLinkedProtectedTarget && linkedTargetType === "savings" ? linkedSavingsGoalId || null : null,\n        sourceSavingsGoalId:\n          hasLinkedProtectedTarget && linkedTargetType === "savings" ? linkedSavingsGoalId || null : null,\n        source_debt_id:\n          hasLinkedProtectedTarget && linkedTargetType === "debt" ? linkedDebtId || null : null,\n        sourceDebtId:\n          hasLinkedProtectedTarget && linkedTargetType === "debt" ? linkedDebtId || null : null,\n        need_type: needType,\n        planning_status: planningStatus,\n'''
          if old not in src:
            raise SystemExit('manual expense payload anchor not found')
          src = src.replace(old, new, 1)

          # The save callback now reads monthlyBudgetPlan display rows directly.
          old = '''    manualExpenseBudgetOptions,\n    pendingExpenses,\n'''
          new = '''    manualExpenseBudgetOptions,\n    monthlyBudgetPlan,\n    pendingExpenses,\n'''
          if old not in src:
            raise SystemExit('manual expense dependency anchor not found')
          src = src.replace(old, new, 1)
          path.write_text(src)

          # 6) Regression tests: exactly the user's scenario plus withdrawal safety.
          test = Path('tests/savings-linked-manual-log-regression.test.mjs')
          test.write_text(r'''import test from "node:test";
import assert from "node:assert/strict";
import { readFileSync } from "node:fs";
import {
  getLinkedSavingsExpenseTotal,
  reconcileSavingsGoalWithLinkedExpenses,
} from "../src/lib/savingsGoalLinkedExpenseRepair.js";

test("linked Church Expansion expenses repair a stale savings total to 2500", () => {
  const goal = {
    id: "church-expansion",
    title: "Church Expansion",
    target_amount: 5000,
    saved_amount: 1502,
    saved: 1502,
  };
  const expenses = [
    { id: "e1", amount: 751, category: "Church Expansion" },
    { id: "e2", amount: 1749, category: "Church Expansion" },
  ];

  assert.equal(getLinkedSavingsExpenseTotal(goal, expenses), 2500);
  const repaired = reconcileSavingsGoalWithLinkedExpenses(goal, expenses);
  assert.equal(repaired.saved_amount, 2500);
  assert.equal(repaired.saved, 2500);
  assert.equal(repaired.current_amount, 2500);
});

test("explicit protected savings key links to exact goal id", () => {
  const goal = { id: "goal-1", title: "Same Name", saved_amount: 0 };
  const expenses = [
    { amount: 500, budget_list_key: "protected-savings-goal-1" },
    { amount: 300, linked_target_type: "savings", linked_target_id: "goal-1" },
  ];
  assert.equal(getLinkedSavingsExpenseTotal(goal, expenses), 800);
});

test("recorded savings use prevents contribution floor from undoing a withdrawal", () => {
  const goal = {
    id: "goal-1",
    title: "Goal",
    saved_amount: 1200,
    savingsActivityLog: [{ type: "use", amount: 800 }],
  };
  const expenses = [{ amount: 2000, category: "Goal" }];
  const repaired = reconcileSavingsGoalWithLinkedExpenses(goal, expenses);
  assert.equal(repaired.saved_amount, 1200);
});

test("dashboard and Manual Log source keep canonical savings linkage", () => {
  const helpers = readFileSync(new URL("../src/utils/dashboard/dashboardHelpers.js", import.meta.url), "utf8");
  const actions = readFileSync(new URL("../src/components/fresh/main-dashboard/finance-actions/useDashboardFinanceActionHandlers.js", import.meta.url), "utf8");
  const savingsPage = readFileSync(new URL("../src/pages/SavingsGoalsIntegrated.jsx", import.meta.url), "utf8");
  assert.ok(helpers.indexOf("savings?.saved_amount") < helpers.indexOf("savings?.saved ??"));
  assert.match(actions, /source_savings_goal_id/);
  assert.match(actions, /budget_list_key/);
  assert.match(actions, /linked_target_type/);
  assert.match(savingsPage, /saved: savedAmount/);
});
''')

          workflow = Path('.github/workflows/fix-savings-linked-manual-log-sync.yml')
