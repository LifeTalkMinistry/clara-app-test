name: Capture Memory retirement test output

on:
  push:
    branches:
      - eradicate-memory-system
    paths:
      - ".github/workflows/debug-memory-retirement-tests.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse retirement patch locally
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/eradicate-clara-memory-system.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(workflow[start:end])) + '\n'
          Path('/tmp/retire-memory.py').write_text(script)
          PY
          python /tmp/retire-memory.py

      - name: Install dependencies
        run: npm ci

      - name: Capture test output
        run: |
          set +e
          npm test > retirement-test-output.txt 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > retirement-test-exit-code.txt
          cat retirement-test-output.txt

      - name: Publish diagnostic output on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retirement-test-output.txt retirement-test-exit-code.txt
          git commit -m "Capture Memory retirement test diagnostics"
          git push origin eradicate-memory-system
