name: Verify Manual Schedule No AI

on:
  pull_request:
    paths:
      - "src/components/fresh/main-dashboard/dashboard-panels/schedule/**"
      - "tests/schedule-manual-no-ai.test.mjs"
      - ".github/workflows/verify-manual-schedule-no-ai.yml"
  push:
    branches:
      - main
    paths:
      - "src/components/fresh/main-dashboard/dashboard-panels/schedule/**"
      - "tests/schedule-manual-no-ai.test.mjs"
      - ".github/workflows/verify-manual-schedule-no-ai.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify manual scheduler contract
        run: node --test tests/schedule-manual-no-ai.test.mjs

      - name: Build production app
        run: npx vite build --base=./
