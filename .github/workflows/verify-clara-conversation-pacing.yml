name: Verify CLARA Conversation Pacing

on:
  pull_request:
    paths:
      - "src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx"
      - "src/components/fresh/main-dashboard/assistant/ClaraLogExpenseOverlayV2.jsx"
      - "src/components/fresh/main-dashboard/assistant/ClaraWeeklyMoneyCheckOverlayV2.jsx"
      - "src/components/community/masterclass/ClaraMasterclassRuntime.jsx"
      - "src/components/community/masterclass/ClaraMasterclassPrimitives.jsx"
      - "src/lib/clara-conversation-pacing.js"
      - "tests/clara-conversation-pacing-regression.test.mjs"
      - "tests/clara-log-expense-flow-source.test.mjs"
      - ".github/workflows/verify-clara-conversation-pacing.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical CLARA chat pacing
        run: node --test tests/clara-conversation-pacing-regression.test.mjs tests/clara-log-expense-flow-source.test.mjs

      - name: Build production app
        run: npm run build
