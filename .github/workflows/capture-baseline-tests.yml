name: Capture baseline regression status

on:
  push:
    branches:
      - eradicate-memory-system
    paths:
      - ".github/workflows/capture-baseline-tests.yml"

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run tests at pre-retirement base
        run: |
          git worktree add /tmp/clara-baseline 4e0162a680a3663705c4dd1ad9505ab27b4626c7
          cd /tmp/clara-baseline
          npm ci
          set +e
          npm test > "$GITHUB_WORKSPACE/baseline-test-output.txt" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/baseline-test-exit-code.txt"

      - name: Publish baseline diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline-test-output.txt baseline-test-exit-code.txt
          git commit -m "Capture baseline test diagnostics"
          git push origin eradicate-memory-system
