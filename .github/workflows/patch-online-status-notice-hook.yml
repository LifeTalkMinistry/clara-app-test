name: Patch online status notice hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-online-status-notice-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardOnlineStatusNotice into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardOnlineStatusNotice from "@/components/fresh/main-dashboard/finance-notices/useDashboardOnlineStatusNotice";\n'
          import_anchor = 'import useFinanceDataErrorNotice from "@/components/fresh/main-dashboard/finance-notices/useFinanceDataErrorNotice";\n'
          fallback_anchor = 'import FinanceInlineAlert from "@/components/fresh/main-dashboard/finance-notices/FinanceInlineAlert";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Finance notice import anchor not found. Refusing to patch Dashboard.jsx.")

          block_start = '  useEffect(() => {\n    const handleOffline = () => {\n      setFinanceNotice({\n        message: "You’re offline. CLARA is using saved data.",\n'
          block_end_candidates = [
              '  useEffect(() => {\n    const handleVisibilityChange = () => {\n',
              '  const markOnboardingCompleted = useCallback(async () => {\n',
              '  const handleRefreshDashboard = useCallback(async () => {\n',
              '  const dashboardFinancialSnapshot = useMemo(() => {\n',
          ]

          if block_start in text:
              start_index = text.index(block_start)
              end_index = -1
              for candidate in block_end_candidates:
                  candidate_index = text.find(candidate, start_index + len(block_start))
                  if candidate_index != -1:
                      if end_index == -1 or candidate_index < end_index:
                          end_index = candidate_index
              if end_index == -1:
                  raise SystemExit("Online status notice block end not found. Refusing to patch Dashboard.jsx.")

              old_block = text[start_index:end_index]
              required_tokens = [
                  'window.addEventListener("offline", handleOffline);',
                  'window.addEventListener("online", handleOnline);',
                  'window.removeEventListener("offline", handleOffline);',
                  'window.removeEventListener("online", handleOnline);',
                  'loadDashboardData({ background: true });',
              ]
              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("Online status notice block does not match expected content. Refusing to patch Dashboard.jsx.")

              replacement = (
                  "  useDashboardOnlineStatusNotice({\n"
                  "    setFinanceNotice,\n"
                  "    loadDashboardData,\n"
                  "  });\n\n"
              )
              text = text[:start_index] + replacement + text[end_index:]
          elif 'useDashboardOnlineStatusNotice({' not in text:
              raise SystemExit("Online status notice block not found and hook is not wired. Refusing to patch Dashboard.jsx.")

          if 'useDashboardOnlineStatusNotice({' not in text:
              raise SystemExit("useDashboardOnlineStatusNotice was not wired. Refusing to continue.")
          if 'You’re offline. CLARA is using saved data.' in text:
              raise SystemExit("Old offline notice text still exists after patch. Refusing to continue.")
          if 'window.addEventListener("offline", handleOffline);' in text:
              raise SystemExit("Old offline listener still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-online-status-notice-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-online-status-notice-hook.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Wire dashboard online status notice hook"
          git push
