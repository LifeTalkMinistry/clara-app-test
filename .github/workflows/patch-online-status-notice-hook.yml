name: Patch online status notice hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-online-status-notice-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardOnlineStatusNotice into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardOnlineStatusNotice from "@/components/fresh/main-dashboard/finance-notices/useDashboardOnlineStatusNotice";\n'
          import_anchor = 'import useFinanceDataErrorNotice from "@/components/fresh/main-dashboard/finance-notices/useFinanceDataErrorNotice";\n'
          fallback_anchor = 'import FinanceInlineAlert from "@/components/fresh/main-dashboard/finance-notices/FinanceInlineAlert";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Finance notice import anchor not found. Refusing to patch Dashboard.jsx.")

          if 'useDashboardOnlineStatusNotice({' not in text:
              replacement = (
                  "  useDashboardOnlineStatusNotice({\n"
                  "    setFinanceNotice,\n"
                  "    loadDashboardData,\n"
                  "  });\n\n"
              )

              pattern = re.compile(
                  r'  useEffect\(\(\) => \{\n'
                  r'    if \(typeof window !== "undefined"\) return undefined;\n\n'
                  r'    const handleOffline = \(\) => \{.*?'
                  r'    window\.addEventListener\("offline", handleOffline\);\n'
                  r'    window\.addEventListener\("online", handleOnline\);\n\n'
                  r'    return \(\) => \{\n'
                  r'      window\.removeEventListener\("offline", handleOffline\);\n'
                  r'      window\.removeEventListener\("online", handleOnline\);\n'
                  r'    \};\n'
                  r'  \}, \[loadDashboardData\]\);\n\n',
                  re.DOTALL,
              )

              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("Online status notice effect pattern not found. Refusing to patch Dashboard.jsx.")

          if 'useDashboardOnlineStatusNotice({' not in text:
              raise SystemExit("useDashboardOnlineStatusNotice was not wired. Refusing to continue.")
          if 'window.addEventListener("offline", handleOffline);' in text:
              raise SystemExit("Old offline listener still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-online-status-notice-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-online-status-notice-hook.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Wire dashboard online status notice hook"
          git push
