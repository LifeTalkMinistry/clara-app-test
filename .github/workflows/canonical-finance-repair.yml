name: Canonical finance repair

on:
  push:
    branches:
      - chore/canonical-finance-source-of-truth

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: chore/canonical-finance-source-of-truth
          fetch-depth: 0

      - name: Materialize audited repair bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .clara-repair-work
          mkdir -p .clara-repair-work
          unzip -q .clara-repair-bundle.zip -d .clara-repair-work
          python .clara-repair-work/clara-canonical-repair/apply_repair.py "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical wallet semantics
        run: node --test tests/canonical-financial-source-of-truth.test.mjs tests/wallet-money-semantics.test.mjs

      - name: Run full prebuild tests and production build
        run: npm run build

      - name: Validate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CLARA Principal Engineer"
          git config user.email "actions@users.noreply.github.com"
          git rm -- .clara-repair-bundle.zip .github/workflows/canonical-finance-repair.yml
          rm -rf .clara-repair-work
          git add -- \
            src/lib/clara-wallet-money-semantics.js \
            src/lib/clara-wallet-direct-finance-reply.js \
            src/lib/clara-buy-check-wallet-engine.js \
            src/lib/financeRepository.js \
            src/hooks/useFinancialData.js \
            src/hooks/useFinancialDataBase.js \
            src/lib/clara-dashboard-summary-ai-reader.js \
            src/lib/clara-dashboard-cards-ai-reader.js \
            src/components/financial-carousel/cards/wallet/ui/WalletListItem.jsx \
            src/components/fresh/main-dashboard/assistant/ClaraWalletOverlayV2.jsx \
            src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentBridge.jsx \
            src/lib/clara-local-brain.js \
            src/lib/clara-forecast-phase-one-snapshot.js \
            src/components/fresh/main-dashboard/assistant/useDashboardClaraAssistantContext.js \
            src/lib/clara-contextual-decision-engine.js \
            package.json \
            tests/canonical-financial-source-of-truth.test.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Canonicalize financial source of truth"
          git push origin HEAD:chore/canonical-finance-source-of-truth
