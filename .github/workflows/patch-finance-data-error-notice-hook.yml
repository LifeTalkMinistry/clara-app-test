name: Patch finance data error notice hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-finance-data-error-notice-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useFinanceDataErrorNotice into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useFinanceDataErrorNotice from "@/components/fresh/main-dashboard/finance-notices/useFinanceDataErrorNotice";\n'
          import_anchor = 'import FinanceInlineAlert from "@/components/fresh/main-dashboard/finance-notices/FinanceInlineAlert";\n'

          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Finance notice import anchor not found. Refusing to patch Dashboard.jsx.")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          block_start = '  useEffect(() => {\n    if (!financeDataError) return;\n\n    const message =\n'
          block_end = '  const dailyRemindersEnabled = notificationSettings?.dailyReminders !== false;\n'

          if block_start in text:
              start_index = text.index(block_start)
              end_index = text.index(block_end, start_index)
              old_block = text[start_index:end_index]
              required_tokens = [
                  'typeof financeDataError === "string"',
                  'financeDataError?.message',
                  'isProtectedFinanceRefreshWarning(message)',
                  'console.warn("Background finance refresh warning:", message);',
                  'setFinanceNotice({ message, type: "error" });',
                  '}, [financeDataError, hasVisibleFinanceData]);',
              ]
              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("Finance data error notice block does not match expected content. Refusing to patch Dashboard.jsx.")
              replacement = (
                  "  useFinanceDataErrorNotice({\n"
                  "    financeDataError,\n"
                  "    hasVisibleFinanceData,\n"
                  "    setFinanceNotice,\n"
                  "  });\n\n"
              )
              text = text[:start_index] + replacement + text[end_index:]
          elif 'useFinanceDataErrorNotice({' not in text:
              raise SystemExit("Finance data error notice block not found and hook is not wired. Refusing to patch Dashboard.jsx.")

          unused_import_line = '  isProtectedFinanceRefreshWarning,\n'
          if unused_import_line in text:
              text = text.replace(unused_import_line, '', 1)

          if 'useFinanceDataErrorNotice({' not in text:
              raise SystemExit("useFinanceDataErrorNotice was not wired. Refusing to continue.")
          if 'isProtectedFinanceRefreshWarning(message)' in text:
              raise SystemExit("Old protected finance warning check still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-finance-data-error-notice-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-finance-data-error-notice-hook.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Wire finance data error notice hook"
          git push
