name: Patch Dashboard theme hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard-theme-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardThemeClasses into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardThemeClasses from "@/components/fresh/main-dashboard/dashboard-theme/useDashboardThemeClasses";\n'
          import_anchor = '''import {
            readStoredDashboardTheme,
            persistDashboardTheme,
            readStoredSurvivalExpense,
            persistStoredSurvivalExpense,
          } from "@/components/fresh/main-dashboard/dashboard-theme/dashboardThemeRuntime";
          '''.replace("          ", "")

          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Import anchor not found. Refusing to patch Dashboard.jsx.")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          block_start = '  const dailyRemindersEnabled = notificationSettings?.dailyReminders !== false;\n'
          block_end = '  useEffect(() => {\n    const themeKey = normalizeString(\n'

          if block_start not in text or block_end not in text:
              raise SystemExit("Theme block anchors not found. Refusing to patch Dashboard.jsx.")

          start_index = text.index(block_start)
          end_index = text.index(block_end, start_index)
          old_block = text[start_index:end_index]

          if "useDashboardThemeClasses(selectedDashboardTheme)" not in old_block:
              required_tokens = [
                  "const themeIsLight = selectedDashboardTheme?.isLight === true;",
                  "const themeQuickActionPanelStyle = {",
                  "const themeQuickActionGlowStyle = {",
              ]
              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("Inline theme block does not match expected content. Refusing to patch Dashboard.jsx.")

              new_block = (
                  "  const dailyRemindersEnabled = notificationSettings?.dailyReminders !== false;\n"
                  "  const {\n"
                  "    themeIsLight,\n"
                  "    themePrimaryTextClass,\n"
                  "    themeSecondaryTextClass,\n"
                  "    themeMutedTextClass,\n"
                  "    themeSoftTextClass,\n"
                  "    themeGlassButtonClass,\n"
                  "    themeGlassIconButtonClass,\n"
                  "    themeQuickActionBaseClass,\n"
                  "    themeQuickActionIconShellClass,\n"
                  "    themeDividerClass,\n"
                  "    themeInactiveDotClass,\n"
                  "    themeQuickActionPanelStyle,\n"
                  "    themeQuickActionGlowStyle,\n"
                  "  } = useDashboardThemeClasses(selectedDashboardTheme);\n\n"
              )
              text = text[:start_index] + new_block + text[end_index:]

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-dashboard-theme-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-dashboard-theme-hook.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Wire dashboard theme classes hook"
          git push
