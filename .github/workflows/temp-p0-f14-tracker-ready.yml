name: TEMP P0-F14 Tracker Ready

on:
  push:
    branches:
      - fix/p0-f14-tracker-ready
    paths:
      - ".github/workflows/temp-p0-f14-tracker-ready.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-f14-tracker-ready

      - name: Mark verified P0-F14 ready
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/admin/AdminPhaseZeroTracker.jsx')
          source = path.read_text()
          old = '["P0-F14", "One universal free-core access authority", "blocked"]'
          new = '["P0-F14", "One universal free-core access authority", "ready"]'
          if old not in source:
              raise SystemExit('Expected P0-F14 blocked baseline was not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Remove temporary workflow from final branch diff
        run: rm .github/workflows/temp-p0-f14-tracker-ready.yml

      - name: Commit tracker status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/AdminPhaseZeroTracker.jsx .github/workflows/temp-p0-f14-tracker-ready.yml
          git commit -m "P0-F14: mark universal free-core authority ready"
          git push origin HEAD:fix/p0-f14-tracker-ready
