name: Patch dashboard hydrate from cache hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard-hydrate-from-cache-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardHydrateFromCache into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardHydrateFromCache from "@/components/fresh/main-dashboard/dashboard-cache/useDashboardHydrateFromCache";\n'
          import_anchor = 'import { createEmptyDashboardCache } from "@/components/fresh/main-dashboard/dashboard-cache/dashboardCacheFactory";\n'
          fallback_anchor = 'import useDashboardDataState from "@/components/fresh/main-dashboard/dashboard-state/useDashboardDataState";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Dashboard hydrate cache import anchor not found. Refusing to patch Dashboard.jsx.")

          replacement = (
              '  const hydrateFromCache = useDashboardHydrateFromCache({\n'
              '    financeDataLoading,\n'
              '    hasLoadedDashboardRef,\n'
              '    setTasks,\n'
              '    setSubmissions,\n'
              '    setProgramRecord,\n'
              '    setSurvivalExpense,\n'
              '    setWalletMoney,\n'
              '    setWallets,\n'
              '    setWalletTransactions,\n'
              '    setTransfers,\n'
              '    setBudgets,\n'
              '    setSavingsGoals,\n'
              '    setExpenses,\n'
              '    setPendingExpenses,\n'
              '    setOfflineReady,\n'
              '    setProfileData,\n'
              '    setLatestEnrollment,\n'
              '    setGuardChecked,\n'
              '    setNickname,\n'
              '    setReminderTime,\n'
              '    setFinancialGoal,\n'
              '    setLoading,\n'
              '  });\n\n'
          )

          if 'useDashboardHydrateFromCache({' not in text:
              pattern = re.compile(
                  r'  const hydrateFromCache = useCallback\(\(nextCache\) => \{\n'
                  r'    setTasks\(nextCache\.tasks\);\n'
                  r'    setSubmissions\(nextCache\.submissions\);\n'
                  r'    setProgramRecord\(nextCache\.programRecord\);\n'
                  r'    setSurvivalExpense\(nextCache\.survivalExpense\);\n'
                  r'    setWalletMoney\(nextCache\.walletMoney\);\n'
                  r'    setWallets\(nextCache\.wallets\);\n'
                  r'    setWalletTransactions\(nextCache\.walletTransactions\);\n'
                  r'    setTransfers\(nextCache\.transfers \|\| \[\]\);\n'
                  r'    setBudgets\(nextCache\.budgets\);\n'
                  r'    setSavingsGoals\(nextCache\.savingsGoals\);\n'
                  r'    setExpenses\(nextCache\.expenses\);\n'
                  r'    setPendingExpenses\(nextCache\.pendingExpenses \|\| \[\]\);\n'
                  r'    setOfflineReady\(Boolean\(nextCache\.offlineReady\)\);\n'
                  r'    setProfileData\(nextCache\.profileData\);\n'
                  r'    setLatestEnrollment\(nextCache\.latestEnrollment\);\n'
                  r'    setGuardChecked\(nextCache\.guardChecked\);\n'
                  r'    setNickname\(nextCache\.nickname\);\n'
                  r'    setReminderTime\(nextCache\.reminderTime\);\n'
                  r'    setFinancialGoal\(nextCache\.financialGoal\);\n'
                  r'    hasLoadedDashboardRef\.current = nextCache\.loaded;\n'
                  r'    setLoading\(!nextCache\.loaded && !hasDashboardFinanceContent\(nextCache\) && financeDataLoading\);\n'
                  r'  \}, \[financeDataLoading\]\);\n\n',
                  re.DOTALL,
              )

              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("hydrateFromCache callback block not found. Refusing to patch Dashboard.jsx.")

          if 'useDashboardHydrateFromCache({' not in text:
              raise SystemExit("useDashboardHydrateFromCache was not wired. Refusing to continue.")
          if 'const hydrateFromCache = useCallback((nextCache) => {' in text:
              raise SystemExit("Old hydrateFromCache callback still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-dashboard-hydrate-from-cache-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-dashboard-hydrate-from-cache-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire dashboard cache hydration hook"
          git push
