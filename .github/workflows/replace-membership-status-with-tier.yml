name: Replace membership status with tier badge

on:
  push:
    branches:
      - membership-tier-badge-details
    paths:
      - ".github/workflows/replace-membership-status-with-tier.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace status badge with tier badge
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx')
          source = path.read_text()

          old_status_label = '''  const membershipStatusLabel = membershipStatus === "loading"\n    ? "SYNCING"\n    : membershipStatus === "active"\n      ? "ACTIVE"\n      : membershipStatus === "pending"\n        ? "PENDING"\n        : ["inactive", "expired", "cancelled"].includes(membershipStatus)\n          ? "INACTIVE"\n          : "FREE";\n  const membershipStatusBadgeClass = membershipStatus === "active"\n    ? "border-[#b89934]/45 bg-[#ffd84a]/8 text-[#ffe681]"\n    : membershipStatus === "pending"\n      ? "border-[#b89934]/40 bg-[#ffd84a]/7 text-[#ffe681]"\n      : "border-[#315c8c]/45 bg-[#0a1a30] text-[#9fb9d8]";\n'''
          if old_status_label not in source:
              raise SystemExit('Expected membership status badge block not found')
          source = source.replace(old_status_label, '', 1)

          old_render = '''        <div className="mt-3 flex flex-wrap items-start justify-between gap-3"><div className="min-w-0"><h3 className="text-2xl font-black tracking-tight text-white">{membershipTierLabel}</h3><p className="mt-1 text-lg font-black text-[#ffe477]">{membershipPriceLabel}</p></div><span className={`shrink-0 rounded-full border px-3 py-1 text-[10px] font-black uppercase tracking-[0.12em] ${membershipStatusBadgeClass}`}>{membershipStatusLabel}</span></div>'''
          new_render = '''        <div className="mt-3 flex flex-wrap items-start justify-between gap-3"><div className="min-w-0"><h3 className="text-2xl font-black tracking-tight text-white">{membershipTierLabel}</h3><p className="mt-1 text-lg font-black text-[#ffe477]">{membershipPriceLabel}</p></div>{selectedMembershipTierKey ? <SupportTierBadge tier={selectedMembershipTierKey} compact tone="settings" /> : null}</div>'''
          if old_render not in source:
              raise SystemExit('Expected membership card status badge render not found')
          source = source.replace(old_render, new_render, 1)

          path.write_text(source)
          PY

      - name: Verify targeted behavior
        run: |
          set -euo pipefail
          FILE='src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx'
          grep -Fq 'SupportTierBadge tier={selectedMembershipTierKey} compact tone="settings"' "$FILE"
          ! grep -Fq 'membershipStatusLabel' "$FILE"
          ! grep -Fq 'membershipStatusBadgeClass' "$FILE"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npx vite build --base=./

      - name: Publish change
        run: |
          rm -f .github/workflows/replace-membership-status-with-tier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show membership tier badge in membership details"
          git push origin membership-tier-badge-details
