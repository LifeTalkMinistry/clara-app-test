name: Apply bottom-up budget redesign

on:
  push:
    branches:
      - fix/bottom-up-budget-flow

permissions:
  contents: write

concurrency:
  group: apply-bottom-up-budget-redesign
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/bottom-up-budget-flow
          fetch-depth: 0
          persist-credentials: true

      - name: Restore implementation payload
        shell: bash
        run: |
          cat .clara-budget-payload.0* | base64 --decode > /tmp/clara-bottom-up-budget.tar.gz
          tar -xzf /tmp/clara-bottom-up-budget.tar.gz -C .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run targeted budget tests
        run: node --test tests/clara-derived-budget.test.mjs

      - name: Run lint when available
        run: npm run lint --if-present

      - name: Build production app
        run: npm run build

      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .clara-budget-payload.0*
          rm -f .github/workflows/apply-bottom-up-budget-redesign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "Redesign budget setup as bottom-up derived flow"
          git push origin HEAD:fix/bottom-up-budget-flow
