name: Verify CLARA local-only settings fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply the surgical source patch
        run: python .github/scripts/apply-local-only-settings-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run targeted Settings and backup regression tests
        run: node --test tests/settings-local-only-regression.test.mjs

      - name: Run full test suite
        run: npm test

      - name: Run targeted lint
        run: npx eslint src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx src/lib/start-local-vault-identity.js src/App.jsx tests/settings-local-only-regression.test.mjs

      - name: Build application
        run: npm run build

      - name: Commit verified fix to source branch
        shell: bash
        run: |
          rm -f .github/scripts/apply-local-only-settings-fix.py
          rm -f .github/workflows/fix-clara-local-only-settings.yml
          rm -f .github/workflows/fix-clara-local-only-settings-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore local-only Settings backup access"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
