name: Internal provider removal runner

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  remove-provider:
    if: github.event.issue.title == '[CLARA_INTERNAL] remove legacy provider'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: remove-supabase-completely
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply source migration
        run: node .github/scripts/remove-supabase-completely.mjs

      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Prove zero legacy-provider references
        shell: bash
        run: |
          if grep -RniI --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist 'supabase' .; then
            echo 'Legacy provider references remain.'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-only -z | xargs -0 -r git add --
          git ls-files --others --exclude-standard -z | xargs -0 -r git add --
          git status --short
          git commit -m 'Remove Supabase completely from CLARA app'
          git push origin HEAD:remove-supabase-completely
