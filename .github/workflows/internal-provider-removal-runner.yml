name: Internal provider removal verifier

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  verify-provider-removal:
    if: github.event.issue.title == '[CLARA_INTERNAL] verify provider removal'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Mark verification started
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body 'verification-started'

      - name: Check out prepared verification branch
        uses: actions/checkout@v4
        with:
          ref: provider-removal-verify-main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Remove branch-only verifier
        run: rm -f .github/workflows/verify-provider-removal.yml

      - name: Prove zero legacy-provider references
        shell: bash
        run: |
          needle='supa''base'
          if grep -RniI --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "$needle" .; then
            echo 'Legacy provider references remain.'
            exit 1
          fi

      - name: Commit verified branch state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No verification changes to commit.'
          else
            git commit -m 'Finalize provider removal on latest main'
            git push origin HEAD:provider-removal-verify-main
          fi

      - name: Mark verification passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment 'verification-passed'
