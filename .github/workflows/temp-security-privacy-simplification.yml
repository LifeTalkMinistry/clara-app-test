name: Temporary Security Privacy Simplification

on:
  push:
    branches:
      - automation/security-privacy-simplification-20260609
    paths:
      - ".github/workflows/temp-security-privacy-simplification.yml"

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply surgical Settings patch
        run: node .github/scripts/extract-dashboard-settings-panel-safe.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: gemini-2.5-flash

      - name: Commit only the verified Settings source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Settings source change was produced."
            exit 1
          fi
          git commit -m "Simplify Security and Privacy settings page"
          git pull --rebase origin main
          git push origin HEAD:main
