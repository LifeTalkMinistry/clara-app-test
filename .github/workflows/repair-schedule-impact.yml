name: CLARA integrity verification runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply fixed Means baseline repair
        run: python3 scripts/fix_means_fixed_full_cycle_anchor_v6.py

      - name: Normalize current wallet semantics for repair script
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/lib/clara-wallet-money-semantics.js")
          text = path.read_text(encoding="utf-8")

          block = re.search(r'const OTHER_PROTECTED_KEYS = \[[\s\S]*?\n\];', text)
          if not block:
              raise SystemExit("OTHER_PROTECTED_KEYS block not found")
          protected_block = block.group(0)
          additions = [
              '  "reservedAmount",',
              '  "reserved_amount",',
              '  "protectedAmount",',
              '  "protected_amount",',
          ]
          for addition in additions:
              key = addition.strip().rstrip(',')
              if key not in protected_block:
                  protected_block = protected_block[:-3] + addition + "\n];"
          text = text[:block.start()] + protected_block + text[block.end():]

          if "function roundMoney(value)" not in text:
              marker = "\nfunction firstDefinedValue("
              idx = text.find(marker)
              if idx < 0:
                  raise SystemExit("firstDefinedValue marker not found")
              helper = '''\nfunction roundMoney(value) {\n  const amount = toMoney(value);\n  return Math.round((amount + Number.EPSILON) * 100) / 100;\n}\n'''
              text = text[:idx] + helper + text[idx:]

          path.write_text(text, encoding="utf-8")

      - name: Apply remaining full-suite repair
        run: python3 scripts/fix_remaining_full_suite_after_means_v1.py

      - name: Syntax checks
        run: |
          python3 -m py_compile scripts/fix_means_fixed_full_cycle_anchor_v6.py scripts/fix_remaining_full_suite_after_means_v1.py
          node --check src/runtime/installClaraOrbGreeting.js
          node --check src/lib/clara-means-cycle-baseline.js
          node --check src/lib/clara-buy-check-wallet-engine.js
          node --check src/lib/clara-buy-check-income-runway-engine.js
          node --check src/lib/clara-wallet-money-semantics.js

      - name: Focused financial regression tests
        run: |
          node --test tests/means-score-context-baseline-regression.test.mjs
          node --test tests/buy-check-context-facts.test.mjs
          node --test tests/wallet-money-semantics.test.mjs
          node --test tests/wallet-expanded-flow-regression.test.mjs

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Full application regression suite
        id: full_tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee financial-integrity-test.log

      - name: Upload application test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-integrity-test-log
          path: financial-integrity-test.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop if full suite failed
        if: steps.full_tests.outcome == 'failure'
        run: exit 1

      - name: Production build
        run: npm run build:web
        env:
          VITE_GEMINI_MODEL: gemini-3.6-flash
          VITE_CLARA_RUNTIME_MODE: local_only
          VITE_CLARA_AUTH_ENABLED: "false"
          VITE_CLARA_LOCAL_MODE_ENABLED: "true"

      - name: Commit verified repair to main
        run: |
          if git diff --quiet; then
            echo "Verified repair already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/runtime/installClaraOrbGreeting.js \
            src/lib/clara-means-cycle-baseline.js \
            src/lib/clara-buy-check-wallet-engine.js \
            src/lib/clara-buy-check-income-runway-engine.js \
            src/lib/clara-wallet-money-semantics.js \
            tests
          git commit -m "Restore financial integrity and regression contracts"
          git push origin HEAD:main
