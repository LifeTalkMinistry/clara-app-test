name: Validate adaptive PDF fit temporary

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/adaptive-fit.trigger"

permissions:
  contents: write

jobs:
  patch-build-and-clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply adaptive readable-fit calculation
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path("src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "const PDF_MAX_WIDTH = 1040;\n",
              "const PDF_MAX_WIDTH = 1040;\n"
              "const PDF_COMFORTABLE_FIT_HEIGHT_RATIO = 0.78;\n"
              "const PDF_NARROW_SCREEN_MAX_OVERSIZE = 1.06;\n"
              "const PDF_NARROW_SCREEN_BREAKPOINT = 640;\n",
              "fit constants",
          )

          replace_once(
              "  const [pdfRenderWidth, setPdfRenderWidth] = useState(0);\n",
              "  const [pdfRenderWidth, setPdfRenderWidth] = useState(0);\n"
              "  const [pdfPageAspectRatio, setPdfPageAspectRatio] = useState(0);\n",
              "aspect-ratio state",
          )

          reset_anchor = "    setPdfRenderWidth(0);\n"
          if "    setPdfPageAspectRatio(0);\n" not in text:
              reset_count = text.count(reset_anchor)
              if reset_count != 2:
                  raise RuntimeError(
                      f"render-width resets: expected two matches, found {reset_count}",
                  )
              text = text.replace(
                  reset_anchor,
                  reset_anchor + "    setPdfPageAspectRatio(0);\n",
              )

          replace_once(
              "      setIsPdfZoomed(false);\n      clearTapTracking();\n",
              "      setIsPdfZoomed(false);\n"
              "      setPdfPageAspectRatio(0);\n"
              "      clearTapTracking();\n",
              "PDF error reset",
          )

          replace_once(
              "  const retryPdf = useCallback(() => {\n    setIsPdfZoomed(false);\n",
              "  const retryPdf = useCallback(() => {\n"
              "    setIsPdfZoomed(false);\n"
              "    setPdfPageAspectRatio(0);\n",
              "Retry reset",
          )

          measure_pattern = re.compile(
              r"    const measureViewport = \(\) => \{\n.*?\n    \};\n\n"
              r"    const animationFrame = window\.requestAnimationFrame\(measureViewport\);",
              re.DOTALL,
          )
          measure_replacement = '''    const measureViewport = () => {
              const viewportRect = viewport.getBoundingClientRect();
              const scrollContainer = scrollContainerRef.current;
              const availableWidth = Math.floor(viewportRect.width);
              const availableHeight = Math.floor(
                scrollContainer?.getBoundingClientRect().height ?? window.innerHeight,
              );

              if (availableWidth <= 0 || availableHeight <= 0) {
                setPdfRenderWidth(0);
                return;
              }

              const isNarrowPortraitScreen =
                availableWidth < PDF_NARROW_SCREEN_BREAKPOINT &&
                availableHeight > availableWidth;
              const widthLimit =
                availableWidth *
                (isNarrowPortraitScreen ? PDF_NARROW_SCREEN_MAX_OVERSIZE : 1);
              const heightDrivenWidth =
                pdfPageAspectRatio > 0
                  ? availableHeight *
                    PDF_COMFORTABLE_FIT_HEIGHT_RATIO *
                    pdfPageAspectRatio
                  : availableWidth;
              const nextWidth = Math.round(
                Math.min(
                  Math.max(availableWidth, heightDrivenWidth),
                  widthLimit,
                  PDF_MAX_WIDTH,
                ),
              );

              setPdfRenderWidth((currentWidth) =>
                currentWidth === nextWidth ? currentWidth : nextWidth,
              );
            };

            const animationFrame = window.requestAnimationFrame(measureViewport);'''
          text, measure_count = measure_pattern.subn(measure_replacement, text, count=1)
          if measure_count != 1:
              raise RuntimeError(
                  f"viewport measurement: expected one match, found {measure_count}",
              )

          replace_once(
              "      resizeObserver = new window.ResizeObserver(measureViewport);\n"
              "      resizeObserver.observe(viewport);\n",
              "      resizeObserver = new window.ResizeObserver(measureViewport);\n"
              "      resizeObserver.observe(viewport);\n"
              "      if (scrollContainerRef.current) {\n"
              "        resizeObserver.observe(scrollContainerRef.current);\n"
              "      }\n",
              "ResizeObserver targets",
          )

          replace_once(
              "  }, [activePdfPath, hasPdf, isOpen, material?.id]);\n",
              "  }, [\n"
              "    activePdfPath,\n"
              "    hasPdf,\n"
              "    isOpen,\n"
              "    material?.id,\n"
              "    pdfPageAspectRatio,\n"
              "  ]);\n",
              "measurement dependencies",
          )

          replace_once(
              "  useEffect(() => {\n"
              "    if (!isOpen) return;\n"
              "    setIsReaderMenuOpen(false);\n"
              "    setIsPdfZoomed(false);\n",
              "  useEffect(() => {\n"
              "    if (!isOpen) return;\n"
              "    setIsReaderMenuOpen(false);\n"
              "    setIsPdfZoomed(false);\n"
              "    setPdfPageAspectRatio(0);\n",
              "page-change reset",
          )

          replace_once(
              "  const handlePdfPageRenderSuccess = useCallback(() => {\n"
              "    syncPdfScrollPosition(isPdfZoomed);\n"
              "  }, [isPdfZoomed, syncPdfScrollPosition]);\n\n",
              "  const handlePdfPageRenderSuccess = useCallback(() => {\n"
              "    syncPdfScrollPosition(isPdfZoomed);\n"
              "  }, [isPdfZoomed, syncPdfScrollPosition]);\n\n"
              "  const handlePdfPageLoadSuccess = useCallback((page) => {\n"
              "    const pageViewport = page?.getViewport?.({ scale: 1 });\n"
              "    const nextAspectRatio =\n"
              "      pageViewport?.width > 0 && pageViewport?.height > 0\n"
              "        ? pageViewport.width / pageViewport.height\n"
              "        : 0;\n\n"
              "    if (!Number.isFinite(nextAspectRatio) || nextAspectRatio <= 0) return;\n\n"
              "    setPdfPageAspectRatio((currentAspectRatio) =>\n"
              "      Math.abs(currentAspectRatio - nextAspectRatio) < 0.001\n"
              "        ? currentAspectRatio\n"
              "        : nextAspectRatio,\n"
              "    );\n"
              "  }, []);\n\n",
              "page aspect-ratio callback",
          )

          replace_once(
              '                : "overflow-x-hidden overflow-y-auto px-2 py-2 sm:px-3 sm:py-3"',
              '                : "overflow-x-hidden overflow-y-auto px-0 py-2 sm:px-2 sm:py-3"',
              "Fit Page padding",
          )

          replace_once(
              "                          renderAnnotationLayer={false}\n",
              "                          renderAnnotationLayer={false}\n"
              "                          onLoadSuccess={handlePdfPageLoadSuccess}\n",
              "Page load callback",
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build default target
        run: npm run build

      - name: Build web target
        run: npm run build:web

      - name: Commit validated reader-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/adaptive-fit.trigger
          git add src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx
          git commit -m "Improve adaptive PDF fit readability"
          git push origin ${{ github.event.pull_request.head.ref }}
