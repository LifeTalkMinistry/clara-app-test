name: One-shot Means fully covered zero

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy to GitHub Pages
    types:
      - completed

permissions:
  contents: write

jobs:
  patch-test-build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Fully Covered zero state
        run: python scripts/apply_means_fully_covered_zero.py

      - name: Syntax check changed sources
        run: |
          node --check src/lib/clara-means-cycle-baseline.js
          node --check src/lib/clara-buy-check-metric-impact.js
          node --check src/runtime/installClaraOrbGreeting.js

      - name: Run targeted Means regressions
        run: |
          node --test tests/means-score-context-baseline-regression.test.mjs
          node --test tests/buy-check-metric-impact.test.mjs

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Build application
        run: npm run build:web
        env:
          VITE_GEMINI_MODEL: gemini-3.6-flash
          VITE_CLARA_RUNTIME_MODE: local_only
          VITE_CLARA_AUTH_ENABLED: "false"
          VITE_CLARA_LOCAL_MODE_ENABLED: "true"

      - name: Commit verified Fully Covered state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/clara-means-cycle-baseline.js \
            src/lib/clara-buy-check-metric-impact.js \
            src/runtime/installClaraOrbGreeting.js \
            tests/means-score-context-baseline-regression.test.mjs \
            tests/buy-check-metric-impact.test.mjs
          git rm scripts/apply_means_fully_covered_zero.py .github/workflows/one-shot-means-fully-covered-zero.yml
          git commit -m "Show Fully Covered when remaining runway reaches zero"
          git push origin HEAD:main
