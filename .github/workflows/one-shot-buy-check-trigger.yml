name: Trigger Buy Check retraining

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-buy-check-trigger.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply committed Buy Check repair payload
        run: |
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          source = Path('.github/workflows/one-shot-buy-check-judgment-payment.yml').read_text()
          match = re.search(r"payload = '''([^']+)'''", source)
          if not match:
              raise SystemExit('Buy Check repair payload not found')
          Path('/tmp/retrain_buy_check.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python /tmp/retrain_buy_check.py

      - name: Align authority regression with payment-structure readiness
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/buy-check-gemini-authority.test.mjs')
          text = path.read_text()
          old = r'  assert.match(expert, /if \(!hasConfirmedClaraPurchasePrice\(source\)\) return null/);'
          new = r'  assert.match(expert, /if \(!hasConfirmedClaraPaymentStructure\(source\)\) return null/);'
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify targeted Buy Check intelligence
        run: |
          node --check src/lib/clara-buy-check-intelligence-router.js
          node --check src/lib/clara-buy-check-expert-ai.js
          node --check src/lib/clara-buy-check-metric-impact.js
          node --check src/components/fresh/main-dashboard/assistant/useClaraBuyCheckExpertFlow.js
          node --check src/components/fresh/main-dashboard/assistant/useClaraBuyCheckFlowV5.js
          node --test tests/buy-check-progressive-router.test.mjs tests/buy-check-gemini-authority.test.mjs tests/buy-check-metric-impact.test.mjs tests/gemini-request-lifecycle.test.mjs

      - name: Verify production build
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx vite build

      - name: Commit repair and remove one-shot workflows
        run: |
          rm -f .github/workflows/one-shot-buy-check-judgment-payment.yml .github/workflows/one-shot-buy-check-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/clara-buy-check-intelligence-router.js src/lib/clara-buy-check-expert-ai.js src/lib/clara-buy-check-metric-impact.js src/components/fresh/main-dashboard/assistant/useClaraBuyCheckExpertFlow.js src/components/fresh/main-dashboard/assistant/useClaraBuyCheckFlowV5.js tests/buy-check-progressive-router.test.mjs tests/buy-check-gemini-authority.test.mjs tests/buy-check-metric-impact.test.mjs .github/workflows
          git commit -m "Retrain Buy Check judgment and payment structure"
          git pull --rebase origin main
          git push origin HEAD:main
