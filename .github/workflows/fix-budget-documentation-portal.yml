name: Fix budget documentation viewport anchoring

on:
  push:
    paths:
      - '.github/workflows/fix-budget-documentation-portal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Portal budget documentation to the viewport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/financial-carousel/cards/budget/ui/BudgetCardContent.jsx')
          source = path.read_text()

          old_import = 'import { useState } from "react";\n'
          new_import = 'import { useState } from "react";\nimport { createPortal } from "react-dom";\n'
          if 'import { createPortal } from "react-dom";' not in source:
              if old_import not in source:
                  raise SystemExit('react import not found')
              source = source.replace(old_import, new_import, 1)

          start_marker = 'function BudgetDriftDetailsModal({' 
          end_marker = '\nexport default function BudgetCardContent(props) {'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('BudgetDriftDetailsModal block not found')

          block = source[start:end]

          old_return = '''  return (\n    <div className="fixed inset-0 z-[10000] flex items-start justify-center bg-black/64 px-4 pb-6 pt-[128px] backdrop-blur-md">'''
          new_return = '''  if (typeof document === "undefined") return null;\n\n  return createPortal(\n    <div className="fixed inset-0 z-[10000] flex items-start justify-center bg-black/64 px-4 pb-6 pt-[128px] backdrop-blur-md">'''
          if old_return not in block:
              raise SystemExit('modal return wrapper not found')
          block = block.replace(old_return, new_return, 1)

          old_tail = '''    </div>\n  );\n}'''
          new_tail = '''    </div>,\n    document.body\n  );\n}'''
          if not block.rstrip().endswith(old_tail):
              raise SystemExit('modal block tail not found')
          block = block.rstrip()[:-len(old_tail)] + new_tail + '\n'

          source = source[:start] + block + source[end:]
          path.write_text(source)

          test_path = Path('tests/budget-documentation-viewport-portal.test.mjs')
          test_path.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\n\nconst source = readFileSync(\n  new URL("../src/components/financial-carousel/cards/budget/ui/BudgetCardContent.jsx", import.meta.url),\n  "utf8",\n);\n\ntest("budget documentation is portaled to document.body and keeps its intended top offset", () => {\n  assert.match(source, /import \{ createPortal \} from "react-dom"/);\n  assert.match(source, /return createPortal\(/);\n  assert.match(source, /pt-\[128px\]/);\n  assert.match(source, /document\.body/);\n});\n''')

          workflow = Path('.github/workflows/fix-budget-documentation-portal.yml')
          workflow.unlink()
          PY

      - name: Run regression test
        run: node --test tests/budget-documentation-viewport-portal.test.mjs

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/financial-carousel/cards/budget/ui/BudgetCardContent.jsx tests/budget-documentation-viewport-portal.test.mjs .github/workflows/fix-budget-documentation-portal.yml
          git commit -m "Anchor budget documentation to viewport"
          git push
