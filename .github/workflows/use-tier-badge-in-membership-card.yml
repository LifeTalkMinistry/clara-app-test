name: Apply membership tier badge in Membership detail

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/use-tier-badge-in-membership-card.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Replace active status pill with canonical tier badge
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx')
          source = path.read_text()

          old_label = '''  const membershipStatusLabel = membershipStatus === "loading"
    ? "SYNCING"
    : membershipStatus === "active"
      ? "ACTIVE"
      : membershipStatus === "pending"
        ? "PENDING"
        : ["inactive", "expired", "cancelled"].includes(membershipStatus)
          ? "INACTIVE"
          : "FREE";
  const membershipStatusBadgeClass = membershipStatus === "active"
    ? "border-[#b89934]/45 bg-[#ffd84a]/8 text-[#ffe681]"
    : membershipStatus === "pending"
      ? "border-[#b89934]/40 bg-[#ffd84a]/7 text-[#ffe681]"
      : "border-[#315c8c]/45 bg-[#0a1a30] text-[#9fb9d8]";'''
          new_label = '''  const membershipStatusLabel = membershipStatus === "loading"
    ? "SYNCING"
    : membershipStatus === "pending"
      ? "PENDING"
      : ["inactive", "expired", "cancelled"].includes(membershipStatus)
        ? "INACTIVE"
        : "FREE";
  const membershipStatusBadgeClass = membershipStatus === "pending"
    ? "border-[#b89934]/40 bg-[#ffd84a]/7 text-[#ffe681]"
    : "border-[#315c8c]/45 bg-[#0a1a30] text-[#9fb9d8]";'''
          if old_label not in source:
              raise SystemExit('membership status label block not found')
          source = source.replace(old_label, new_label, 1)

          old_render = '''<span className={`shrink-0 rounded-full border px-3 py-1 text-[10px] font-black uppercase tracking-[0.12em] ${membershipStatusBadgeClass}`}>{membershipStatusLabel}</span>'''
          new_render = '''{membershipStatus === "active" && selectedMembershipTierKey ? <SupportTierBadge tier={selectedMembershipTierKey} compact tone="settings" /> : <span className={`shrink-0 rounded-full border px-3 py-1 text-[10px] font-black uppercase tracking-[0.12em] ${membershipStatusBadgeClass}`}>{membershipStatusLabel}</span>}'''
          if old_render not in source:
              raise SystemExit('membership status badge render not found')
          source = source.replace(old_render, new_render, 1)
          path.write_text(source)

          test_path = Path('tests/clara-free-support-system.test.mjs')
          test_source = test_path.read_text()
          anchor = '''  assert.match(settings, /badgeNode: activeSupporterTier \\?/);
  assert.match(settings, /<SupportTierBadge tier=\\{activeSupporterTier\\} compact \\/>/);'''
          replacement = '''  assert.match(settings, /badgeNode: activeSupporterTier \\?/);
  assert.match(settings, /<SupportTierBadge tier=\\{activeSupporterTier\\} compact tone="settings" \\/>/);
  assert.match(settings, /membershipStatus === "active" && selectedMembershipTierKey \\? <SupportTierBadge tier=\\{selectedMembershipTierKey\\} compact tone="settings" \\/>/);
  assert.doesNotMatch(settings, /\\? "ACTIVE"/);'''
          if anchor not in test_source:
              raise SystemExit('support identity test anchor not found')
          test_source = test_source.replace(anchor, replacement, 1)
          test_path.write_text(test_source)
          PY

      - name: Verify support identity regression
        run: |
          npm ci
          node --test tests/clara-free-support-system.test.mjs

      - name: Verify production bundle
        run: npx vite build --base=./

      - name: Commit app change and remove one-time workflow
        run: |
          rm -f .github/workflows/use-tier-badge-in-membership-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show membership tier badge instead of active status"
          git push origin main
