name: One-shot Buy Check score enforcement repair v3
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-buy-check-score-enforcement-v3.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch source
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Verify patch
        run: |
          grep -q 'const authoritativeMeans = buildCanonicalMeansContext' src/lib/clara-buy-check-expert-ai.js
          grep -q 'if (means)' src/lib/clara-buy-check-expert-ai.js
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/clara-buy-check-expert-ai.js
          git commit -m 'Enforce exact projected Means score in Buy Check'
          git push origin main
