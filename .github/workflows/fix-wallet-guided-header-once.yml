name: Fix Wallet Guided Header Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-wallet-guided-header-once.yml"

permissions:
  contents: write

jobs:
  fix-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Restore guided header and lower it below shared nav
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/fresh/main-dashboard/dashboard-primitives/GuidedWalletCreationModal.jsx';
          let text = fs.readFileSync(path, 'utf8');

          const oldRoot = 'className="fixed inset-x-0 bottom-0 top-[64px] z-[120] h-[calc(100dvh-64px)] w-full overflow-hidden bg-[linear-gradient(140deg,rgba(5,28,48,0.99),rgba(7,16,44,0.995)_48%,rgba(34,15,73,0.995))] text-white"';
          const newRoot = 'className="fixed inset-0 z-[120] h-[100dvh] w-full overflow-hidden bg-[linear-gradient(140deg,rgba(5,28,48,0.99),rgba(7,16,44,0.995)_48%,rgba(34,15,73,0.995))] text-white"';
          if (!text.includes(oldRoot) && !text.includes(newRoot)) throw new Error('Guided wallet root marker not found');
          text = text.replace(oldRoot, newRoot);

          const oldHeader = 'px-6 pb-4 pt-4 sm:pb-5 sm:pt-5';
          const newHeader = 'px-6 pb-4 pt-[calc(4.75rem+env(safe-area-inset-top))] sm:pb-5 sm:pt-[calc(4.75rem+env(safe-area-inset-top))]';
          if (!text.includes(oldHeader) && !text.includes(newHeader)) throw new Error('Guided wallet header padding marker not found');
          text = text.replace(oldHeader, newHeader);

          if (!text.includes('Step {stepIndex} of {totalSteps}')) throw new Error('Step progress indicator was removed');
          if (!text.includes('aria-label="Close wallet setup"')) throw new Error('Close button was removed');
          if (!text.includes('{title}</h3>')) throw new Error('Guided wallet title was removed');

          fs.writeFileSync(path, text);
          NODE

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-wallet-guided-header-once.yml
          git add src/components/fresh/main-dashboard/dashboard-primitives/GuidedWalletCreationModal.jsx
          git commit -m "Restore guided wallet header below top navigation"
          git pull --rebase origin main
          git push origin main
