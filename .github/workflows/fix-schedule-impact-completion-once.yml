name: Fix schedule impact completion once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardScheduleImpactPortalPanel.jsx')
          s = p.read_text()
          s = s.replace('function getOpeningMessage(form) {\n  return `Hi Max, so you want to ${getEventPhrase(form)}. Am I understanding that correctly?`;\n}', 'function getScheduleTitleForImpact(form) {\n  return cleanText(form?.title) || makeTitle(form?.note, form?.type) || "this schedule";\n}\n\nfunction getOpeningMessage(form) {\n  return `Hi Max, I’ll assess the money impact for this schedule: ${getScheduleTitleForImpact(form)}. Is that correct?`;\n}')
          s = s.replace('Great! I’ll treat this as your confirmed schedule. Before saving, let’s assess possible spending for it. Ready to start?', 'Great. Before saving, let’s estimate possible expenses one part at a time. Ready to start?')
          s = s.replace('  const rootRef = useRef(null);\n  const [session, setSession] = useState(null);', '  const rootRef = useRef(null);\n  const autoCloseTimerRef = useRef(null);\n  const [session, setSession] = useState(null);')
          s = s.replace('  useBodyScrollLock(Boolean(session));\n\n  const startImpactChat = async (form) => {', '  useBodyScrollLock(Boolean(session));\n\n  useEffect(() => () => {\n    if (autoCloseTimerRef.current && typeof window !== "undefined") window.clearTimeout(autoCloseTimerRef.current);\n  }, []);\n\n  const startImpactChat = async (form) => {')
          s = s.replace('  return { stage: "complete", total, expensePath: path, activeCategory: "", activeSubItem: "", message: buildSummaryMessage(total, path) };\n}', '  if (stage === "complete" && isAffirmative(reply) && total > 0) {\n    return { stage: "complete", total, expensePath: path, activeCategory: "", activeSubItem: "", message: `Wonderful, Max. Your schedule and estimated money impact of ${formatPeso(total)} have been saved successfully.` };\n  }\n\n  return { stage: "complete", total, expensePath: path, activeCategory: "", activeSubItem: "", message: buildSummaryMessage(total, path) };\n}')
          s = s.replace('  };\n\n  const sendReply = async (event) => {', '  };\n\n  const applyEstimateToSchedule = (amount) => {\n    const form = rootRef.current ? readForm(rootRef.current) : null;\n    if (form?.elements?.amountInput) updateControlledField(form.elements.amountInput, formatPeso(amount));\n  };\n\n  const closeImpactChat = () => {\n    if (autoCloseTimerRef.current && typeof window !== "undefined") {\n      window.clearTimeout(autoCloseTimerRef.current);\n      autoCloseTimerRef.current = null;\n    }\n    setSession(null);\n  };\n\n  const sendReply = async (event) => {', 1)
          s = s.replace('      const nextStage = finalPending.subItem ? (normalizedStage === "confirm_intent" || normalizedStage === "ask_permission" || normalizedStage === "clarify_intent" ? normalizedStage : "category_assessment") : "complete";\n\n      setSession((current) => ({', '      const nextStage = finalPending.subItem ? (normalizedStage === "confirm_intent" || normalizedStage === "ask_permission" || normalizedStage === "clarify_intent" ? normalizedStage : "category_assessment") : "complete";\n      const assistantText = cleanText(ai.assistant_message) || getLocalReplyForStage({ stage: currentStage, reply, total: session.total, expensePath: session.expensePath, activeCategory: session.activeCategory, activeSubItem: session.activeSubItem }).message;\n      const shouldAutoApplyEstimate = currentStage === "complete" && isAffirmative(reply) && applied.total > 0;\n\n      setSession((current) => ({')
          s = s.replace('        activeSubItem: applied.activeSubItem,\n        messages: [...optimisticMessages, { role: "assistant", text: cleanText(ai.assistant_message) || getLocalReplyForStage({ stage: currentStage, reply, total: session.total, expensePath: session.expensePath, activeCategory: session.activeCategory, activeSubItem: session.activeSubItem }).message }],', '        activeSubItem: applied.activeSubItem,\n        autoClosing: shouldAutoApplyEstimate,\n        messages: [...optimisticMessages, { role: "assistant", text: assistantText }],')
          s = s.replace('      }));\n    } catch (error) {', '      }));\n\n      if (shouldAutoApplyEstimate) {\n        applyEstimateToSchedule(applied.total);\n        if (autoCloseTimerRef.current && typeof window !== "undefined") window.clearTimeout(autoCloseTimerRef.current);\n        autoCloseTimerRef.current = window.setTimeout(() => {\n          setSession(null);\n          autoCloseTimerRef.current = null;\n        }, 1000);\n      }\n    } catch (error) {')
          s = s.replace('      const local = getLocalReplyForStage({ stage: currentStage, reply, total: session.total, expensePath: session.expensePath, activeCategory: session.activeCategory, activeSubItem: session.activeSubItem });\n      setSession((current) => ({ ...current, stage: local.stage, total: local.total, expensePath: local.expensePath, activeCategory: local.activeCategory, activeSubItem: local.activeSubItem, messages: [...optimisticMessages, { role: "assistant", text: local.message }] }));', '      const local = getLocalReplyForStage({ stage: currentStage, reply, total: session.total, expensePath: session.expensePath, activeCategory: session.activeCategory, activeSubItem: session.activeSubItem });\n      const shouldAutoApplyEstimate = currentStage === "complete" && isAffirmative(reply) && local.total > 0;\n      setSession((current) => ({ ...current, stage: local.stage, total: local.total, expensePath: local.expensePath, activeCategory: local.activeCategory, activeSubItem: local.activeSubItem, autoClosing: shouldAutoApplyEstimate, messages: [...optimisticMessages, { role: "assistant", text: local.message }] }));\n      if (shouldAutoApplyEstimate) {\n        applyEstimateToSchedule(local.total);\n        if (autoCloseTimerRef.current && typeof window !== "undefined") window.clearTimeout(autoCloseTimerRef.current);\n        autoCloseTimerRef.current = window.setTimeout(() => {\n          setSession(null);\n          autoCloseTimerRef.current = null;\n        }, 1000);\n      }')
          s = s.replace('  const useEstimate = (amount) => {\n    const root = rootRef.current;\n    const form = root ? readForm(root) : null;\n    if (form?.elements?.amountInput) updateControlledField(form.elements.amountInput, formatPeso(amount));\n    setSession(null);\n  };', '  const useEstimate = (amount) => {\n    applyEstimateToSchedule(amount);\n    closeImpactChat();\n  };')
          s = s.replace('{session.total > 0 ? <button type="button" onClick={() => onUseEstimate(session.total)}', '{!session.autoClosing && session.total > 0 ? <button type="button" onClick={() => onUseEstimate(session.total)}')
          s = s.replace('<form onSubmit={onSend} className="flex gap-2">', '{!session.autoClosing ? <form onSubmit={onSend} className="flex gap-2">')
          s = s.replace('            </form>\n          </footer>', '            </form> : null}\n          </footer>')
          s = s.replace('onClose={() => setSession(null)}', 'onClose={closeImpactChat}')
          p.write_text(s)

          q = Path('src/lib/ai-command/schedule-impact-service.js')
          t = q.read_text()
          t = t.replace('- After that, continue the existing category/sub-item assessment flow.\n', '- After that, continue the existing category/sub-item assessment flow.\n- When the user confirms the final estimate or saving, give a brief saved confirmation only. Do not tell the user to close the chat, and do not add manual closing instructions.\n')
          q.write_text(t)
          PY
      - name: Commit changes
        run: |
          rm -f .github/workflows/refine-schedule-impact-tone-once.yml .github/workflows/fix-schedule-impact-completion-once.yml .github/schedule-impact-completion-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Fix schedule impact completion auto close" && git push)
