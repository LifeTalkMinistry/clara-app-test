name: Verify budget cycle branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/budget-cycle-branch-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/reset-aware-budget-cycle
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply staged patches
        run: |
          node scripts/apply-budget-cycle-reset-fix.mjs
          node scripts/apply-budget-cycle-reset-actions.mjs
          node scripts/apply-budget-cycle-reset-consumers.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run budget cycle tests
        run: npm run test:budget-cycle

      - name: Build application
        run: npm run build

      - name: Commit verified branch
        run: |
          rm -f scripts/apply-budget-cycle-reset-fix.mjs
          rm -f scripts/apply-budget-cycle-reset-actions.mjs
          rm -f scripts/apply-budget-cycle-reset-consumers.mjs
          rm -f .github/workflows/apply-budget-cycle-reset-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make budget cycle reset authoritative"
          git push origin HEAD:fix/reset-aware-budget-cycle
