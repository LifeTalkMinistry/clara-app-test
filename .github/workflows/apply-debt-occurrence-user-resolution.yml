name: Apply debt occurrence user resolution patch

on:
  push:
    branches: [fix/debt-occurrence-user-resolution]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/debt-occurrence-user-resolution
          fetch-depth: 0

      - name: Patch canonical Means debt semantics
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected patch target not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/lib/clara-means-authority.js",
              '''      .map((dueDate) => {
                  const requirementKey = `debt:${id}:${dueDate}`;
                  const occurrencePaid = isDebtOccurrencePaid(record, dueDate, planned);
                  return {
                    id: requirementKey,
                    requirementKey,
                    debtId: id,
                    sourceId: id,
                    date: dueDate,
                    kind: "debt",
                    sourceType: "debt",
                    amount: planned,
                    actualPaid: occurrencePaid
                      ? planned
                      : cumulativeActualForOccurrence(record, dueDate),
                    waivedAmount: isDebtOccurrenceSkipped(record, dueDate) ? planned : 0,
                    fulfilledBeforeCycle: amountPaidBeforeCycle(record, dueDate, cycleStart),
                    source: "debt_obligation",
                  };
                });''',
              '''      .map((dueDate) => {
                  const requirementKey = `debt:${id}:${dueDate}`;
                  const actualPaid = cumulativeActualForOccurrence(record, dueDate);
                  const skipped = isDebtOccurrenceSkipped(record, dueDate);
                  const occurrencePaid = isDebtOccurrencePaid(record, dueDate, planned);
                  const resolvedUnpaidRemainder =
                    occurrencePaid && !skipped
                      ? Math.max(planned - actualPaid, 0)
                      : 0;
                  return {
                    id: requirementKey,
                    requirementKey,
                    debtId: id,
                    sourceId: id,
                    date: dueDate,
                    kind: "debt",
                    sourceType: "debt",
                    amount: planned,
                    actualPaid,
                    waivedAmount: skipped ? planned : resolvedUnpaidRemainder,
                    fulfilledBeforeCycle: amountPaidBeforeCycle(record, dueDate, cycleStart),
                    source: "debt_obligation",
                  };
                });'''
          )

          replace_once(
              "src/lib/clara-means-authority.js",
              '''    .reduce((sum, entry) => {
                const planned = nonNegative(entry?.amount);
                const actualPaid = nonNegative(entry?.actualPaid ?? entry?.actual_paid);
                return sum + Math.max(planned - actualPaid, 0);
              }, 0);''',
              '''    .reduce((sum, entry) => {
                const planned = nonNegative(entry?.amount);
                const actualPaid = nonNegative(entry?.actualPaid ?? entry?.actual_paid);
                const waivedAmount = nonNegative(entry?.waivedAmount ?? entry?.waived_amount);
                return sum + Math.max(planned - actualPaid - waivedAmount, 0);
              }, 0);'''
          )

          Path(".github/workflows/apply-debt-occurrence-user-resolution.yml").unlink()

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close resolved debt remainder in current cycle"
          git push origin HEAD:fix/debt-occurrence-user-resolution
