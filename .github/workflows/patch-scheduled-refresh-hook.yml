name: Patch scheduled refresh hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-scheduled-refresh-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardScheduledRefresh into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardScheduledRefresh from "@/components/fresh/main-dashboard/finance-notices/useDashboardScheduledRefresh";\n'
          import_anchor = 'import useDashboardFinanceRefreshEvents from "@/components/fresh/main-dashboard/finance-notices/useDashboardFinanceRefreshEvents";\n'
          fallback_anchor = 'import useDashboardOnlineStatusNotice from "@/components/fresh/main-dashboard/finance-notices/useDashboardOnlineStatusNotice";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Scheduled refresh import anchor not found. Refusing to patch Dashboard.jsx.")

          refresh_ref_line = '  const refreshTimeoutRef = useRef(null);\n'
          if refresh_ref_line in text:
              text = text.replace(refresh_ref_line, '', 1)

          if 'useDashboardScheduledRefresh({' not in text:
              replacement = (
                  '  const scheduleRefresh = useDashboardScheduledRefresh({\n'
                  '    loadDashboardData,\n'
                  '    refreshFinancialData,\n'
                  '  });\n\n'
              )

              pattern = re.compile(
                  r'  const scheduleRefresh = useCallback\(\(\) => \{\n'
                  r'    if \(refreshTimeoutRef\.current\) \{\n'
                  r'      clearTimeout\(refreshTimeoutRef\.current\);\n'
                  r'    \}\n\n'
                  r'    refreshTimeoutRef\.current = setTimeout\(\(\) => \{\n'
                  r'      refreshFinancialData\?\.\(\);\n'
                  r'      loadDashboardData\(\{ background: true \}\);\n'
                  r'    \}, 350\);\n'
                  r'  \}, \[loadDashboardData, refreshFinancialData\]\);\n\n'
                  r'  useEffect\(\(\) => \{\n'
                  r'    return \(\) => \{\n'
                  r'      if \(refreshTimeoutRef\.current\) \{\n'
                  r'        clearTimeout\(refreshTimeoutRef\.current\);\n'
                  r'      \}\n'
                  r'    \};\n'
                  r'  \}, \[\]\);\n\n',
                  re.DOTALL,
              )

              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("Scheduled refresh block not found. Refusing to patch Dashboard.jsx.")

          if 'useDashboardScheduledRefresh({' not in text:
              raise SystemExit("useDashboardScheduledRefresh was not wired. Refusing to continue.")
          if 'refreshTimeoutRef' in text:
              raise SystemExit("refreshTimeoutRef still exists after patch. Refusing to continue.")
          if 'const scheduleRefresh = useCallback(() => {' in text:
              raise SystemExit("Old scheduleRefresh callback still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-scheduled-refresh-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-scheduled-refresh-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire dashboard scheduled refresh hook"
          git push
