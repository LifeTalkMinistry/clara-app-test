name: Patch manual expense budget list items hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-manual-expense-budget-list-items-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardManualExpenseBudgetListItems into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardManualExpenseBudgetListItems from "@/components/fresh/main-dashboard/budget/useDashboardManualExpenseBudgetListItems";\n'
          import_anchor = 'import useDashboardBudgetFormProgress from "@/components/fresh/main-dashboard/budget/useDashboardBudgetFormProgress";\n'
          fallback_anchor = 'import useDashboardMonthlyBudgetPlan from "@/components/fresh/main-dashboard/budget/useDashboardMonthlyBudgetPlan";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Manual expense budget list items import anchor not found. Refusing to patch Dashboard.jsx.")

          def find_statement_end(source, start):
              paren = brace = bracket = 0
              in_single = in_double = in_template = False
              in_line_comment = in_block_comment = False
              escape = False
              i = start

              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ""

                  if in_line_comment:
                      if ch == "\n":
                          in_line_comment = False
                      i += 1
                      continue

                  if in_block_comment:
                      if ch == "*" and nxt == "/":
                          in_block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_single or in_double or in_template:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif in_single and ch == "'":
                          in_single = False
                      elif in_double and ch == '"':
                          in_double = False
                      elif in_template and ch == "`":
                          in_template = False
                      i += 1
                      continue

                  if ch == "/" and nxt == "/":
                      in_line_comment = True
                      i += 2
                      continue
                  if ch == "/" and nxt == "*":
                      in_block_comment = True
                      i += 2
                      continue
                  if ch == "'":
                      in_single = True
                      i += 1
                      continue
                  if ch == '"':
                      in_double = True
                      i += 1
                      continue
                  if ch == "`":
                      in_template = True
                      i += 1
                      continue

                  if ch == "(":
                      paren += 1
                  elif ch == ")":
                      paren -= 1
                  elif ch == "{":
                      brace += 1
                  elif ch == "}":
                      brace -= 1
                  elif ch == "[":
                      bracket += 1
                  elif ch == "]":
                      bracket -= 1
                  elif ch == ";" and paren == 0 and brace == 0 and bracket == 0:
                      return i + 1

                  i += 1

              return -1

          if 'useDashboardManualExpenseBudgetListItems({' not in text:
              start_token = '  const manualExpenseBudgetListItems = useMemo('
              start_index = text.find(start_token)
              if start_index == -1:
                  start_token = '  const manualExpenseBudgetListItems = useMemo(() => {'
                  start_index = text.find(start_token)

              if start_index == -1:
                  raise SystemExit("manualExpenseBudgetListItems useMemo start not found. Refusing to patch Dashboard.jsx.")

              end_index = find_statement_end(text, start_index)
              if end_index == -1:
                  raise SystemExit("manualExpenseBudgetListItems statement end not found. Refusing to patch Dashboard.jsx.")

              if text[end_index:end_index + 2] == "\n\n":
                  end_index += 2
              elif text[end_index:end_index + 1] == "\n":
                  end_index += 1

              old_block = text[start_index:end_index]
              required_tokens = [
                  'manualExpenseBudgetListItems',
                  'manualExpenseBudgetOptions',
                  '__unplanned__',
                  '__undocumented__',
                  'Unplanned Spending',
                  'Undocumented Spending',
              ]

              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("manualExpenseBudgetListItems block content mismatch. Refusing to patch Dashboard.jsx.")

              replacement = (
                  '  const manualExpenseBudgetListItems =\n'
                  '    useDashboardManualExpenseBudgetListItems({\n'
                  '      manualExpenseBudgetOptions,\n'
                  '      monthlyBudgetPlan,\n'
                  '      fmt,\n'
                  '    });\n\n'
              )

              text = text[:start_index] + replacement + text[end_index:]

          if 'useDashboardManualExpenseBudgetListItems({' not in text:
              raise SystemExit("useDashboardManualExpenseBudgetListItems was not wired. Refusing to continue.")
          if 'const manualExpenseBudgetListItems = useMemo(' in text:
              raise SystemExit("Old manualExpenseBudgetListItems useMemo still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-manual-expense-budget-list-items-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-manual-expense-budget-list-items-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire manual expense budget list items hook"
          git push
