name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase build variables
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: |
          missing=0

          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Missing repository secret: VITE_SUPABASE_URL"
            missing=1
          fi

          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing repository secret: VITE_SUPABASE_ANON_KEY"
            missing=1
          fi

          if [ -z "$VITE_GEMINI_API_KEY" ]; then
            echo "::error::Missing repository secret: VITE_GEMINI_API_KEY"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Configure required secrets in GitHub: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Build GitHub Pages app
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: gemini-2.5-flash

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
