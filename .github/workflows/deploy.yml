name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run regression tests
        id: regression_tests
        continue-on-error: true
        run: npm test

      - name: Report regression test warning
        if: steps.regression_tests.outcome == 'failure'
        run: echo "::warning::Regression tests failed. GitHub Pages deployment will continue so the live build does not remain stale."

      - name: Stamp web build
        run: |
          printf '{"commit":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > public/build-info.json

      - name: Build GitHub Pages app
        run: npm run build:web
        env:
          VITE_GEMINI_MODEL: gemini-3.6-flash
          VITE_CLARA_RUNTIME_MODE: local_only
          VITE_CLARA_AUTH_ENABLED: "false"
          VITE_CLARA_LOCAL_MODE_ENABLED: "true"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
