name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Means is source-controlled and regression-tested. Do not mutate its cycle anchor
      # during deploy; deploy-time v6/v7 patching previously rewrote the fixed 100.
      - name: Wire installed-PWA freshness runtime
        run: python3 scripts/install_clara_pwa_freshness.py

      - name: Apply remaining full-suite repair
        run: python3 scripts/fix_remaining_full_suite_after_means_v1.py

      - name: Preserve current Wallet regression owner
        run: git restore --source=HEAD -- tests/wallet-expanded-flow-regression.test.mjs

      - name: Preserve current Learning Hub regression owner
        run: git restore --source=HEAD -- tests/learning-hub-first-click.test.mjs

      - name: Apply one-shot debt commitments display repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          authority = Path('src/lib/clara-means-authority.js')
          source = authority.read_text(encoding='utf-8')

          anchor = '''export function buildMeansDebtOccurrences(records = [], cycleStart, cycleEnd) {
            return (Array.isArray(records) ? records : []).flatMap((record) => {
              const id = debtRecordId(record);
              const planned = nonNegative(getMonthlyDebtPayment(record));
              if (!id || !(planned > 0)) return [];
              return debtOccurrenceDates(record, cycleStart, cycleEnd)
                .filter((dueDate) => shouldIncludeDebtOccurrence(record, dueDate, cycleStart))
                .map((dueDate) => ({
                  id: `debt:${id}:${dueDate}`,
                  debtId: id,
                  date: dueDate,
                  kind: "debt",
                  amount: planned,
                  actualPaid: cumulativeActualForOccurrence(record, dueDate),
                  source: "debt_obligation",
                }));
            });
          }
          '''
          helper = anchor + '''
          export function calculateMeansOutstandingDebtCommitments(
            debtOccurrences = [],
            carriedObligations = 0
          ) {
            const occurrenceRemaining = (Array.isArray(debtOccurrences) ? debtOccurrences : [])
              .filter((entry) => entry?.kind === "debt")
              .reduce((sum, entry) => {
                const planned = nonNegative(entry?.amount);
                const actualPaid = nonNegative(entry?.actualPaid ?? entry?.actual_paid);
                return sum + Math.max(planned - actualPaid, 0);
              }, 0);
            return occurrenceRemaining + nonNegative(carriedObligations);
          }
          '''
          if 'export function calculateMeansOutstandingDebtCommitments' not in source:
              if anchor not in source:
                  raise SystemExit('Debt occurrence anchor not found')
              source = source.replace(anchor, helper, 1)

          old = '''  const debtUpcoming = futureContributions
            .filter((entry) => entry.kind === "debt")
            .reduce((sum, entry) => sum + nonNegative(entry.amount), 0);
          '''
          new = '''  const debtUpcoming = calculateMeansOutstandingDebtCommitments(
            debtOccurrences,
            baselineState.carriedObligations
          );
          '''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('Debt upcoming anchor not found')

          authority.write_text(source, encoding='utf-8')

          test = Path('tests/means-score-debt-commitments-display-regression.test.mjs')
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport fs from "node:fs";\nimport path from "node:path";\nimport vm from "node:vm";\nimport { fileURLToPath } from "node:url";\n\nconst __dirname = path.dirname(fileURLToPath(import.meta.url));\nconst authorityPath = path.join(__dirname, "../src/lib/clara-means-authority.js");\nconst source = fs.readFileSync(authorityPath, "utf8");\n\nfunction loadOutstandingDebtHelper() {\n  const start = source.indexOf("export function calculateMeansOutstandingDebtCommitments");\n  assert.notEqual(start, -1);\n  const end = source.indexOf("\\nfunction currentCycleFutureDebtActual", start);\n  assert.notEqual(end, -1);\n  const helperSource = source.slice(start, end).replace("export function", "function");\n  const context = { result: null };\n  vm.createContext(context);\n  vm.runInContext(`const nonNegative = (value) => { const parsed = Number(String(value ?? "").replace(/[^0-9.-]/g, "")); return Number.isFinite(parsed) ? Math.max(0, parsed) : 0; }; ${helperSource}; result = calculateMeansOutstandingDebtCommitments;`, context);\n  return context.result;\n}\n\ntest("ORB debt commitments include overdue/current-cycle unpaid remainder", () => {\n  const calculate = loadOutstandingDebtHelper();\n  assert.equal(calculate([\n    { kind: "debt", date: "2026-08-27", amount: 3000, actualPaid: 0 },\n    { kind: "debt", date: "2026-08-29", amount: 81, actualPaid: 30 },\n    { kind: "debt", date: "2026-09-05", amount: 500, actualPaid: 500 },\n    { kind: "money_schedule", date: "2026-09-01", amount: 9999, actualPaid: 0 },\n  ], 400), 3451);\n});\n\ntest("fully paid current-cycle debt leaves no remaining ORB debt commitment", () => {\n  const calculate = loadOutstandingDebtHelper();\n  assert.equal(calculate([{ kind: "debt", amount: 81, actualPaid: 81 }], 0), 0);\n});\n\ntest("snapshot no longer uses a future-only debt filter", () => {\n  assert.match(source, /const debtUpcoming = calculateMeansOutstandingDebtCommitments\\(\\s*debtOccurrences,\\s*baselineState\\.carriedObligations\\s*\\);/);\n  assert.doesNotMatch(source, /const debtUpcoming = futureContributions\\s*\\.filter\\(\\(entry\\) => entry\\.kind === "debt"\\)/);\n});\n''', encoding='utf-8')
          PY

      - name: Syntax checks
        run: |
          python3 -m py_compile \
            scripts/install_clara_pwa_freshness.py \
            scripts/fix_remaining_full_suite_after_means_v1.py
          node --check src/runtime/installClaraOrbGreeting.js
          node --check src/runtime/installClaraPwaFreshness.js
          node --check src/lib/clara-means-authority.js
          node --check src/lib/clara-means-cycle-baseline.js
          node --check src/lib/debtObligationStore.js
          node --check src/lib/clara-buy-check-wallet-engine.js
          node --check src/lib/clara-buy-check-income-runway-engine.js
          node --check src/lib/clara-wallet-money-semantics.js
          node --check public/clara-task-reminder-sw.js

      - name: Run focused financial regression tests
        run: |
          node --test tests/means-score-debt-commitments-display-regression.test.mjs
          node --test tests/means-score-context-baseline-regression.test.mjs
          node --test tests/means-score-final-acceptance-regression.test.mjs
          node --test tests/means-score-single-authority-regression.test.mjs
          node --test tests/buy-check-context-facts.test.mjs
          node --test tests/wallet-money-semantics.test.mjs
          node --test tests/wallet-expanded-flow-regression.test.mjs

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run full regression suite
        run: npm test

      - name: Commit and push verified repair
        run: |
          if git diff --quiet; then
            echo "Verified repair already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/runtime/installClaraOrbGreeting.js \
              src/runtime/installClaraPwaFreshness.js \
              src/lib/clara-means-authority.js \
              src/lib/debtObligationStore.js \
              src/lib/clara-buy-check-wallet-engine.js \
              src/lib/clara-buy-check-income-runway-engine.js \
              src/lib/clara-wallet-money-semantics.js \
              tests
            git commit -m "Show outstanding debt commitments in Means"
            git push origin HEAD:main
          fi

      - name: Stamp release freshness
        run: |
          BUILD_ID="$(git rev-parse HEAD)"
          BUILD_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys
          path = Path("public/clara-task-reminder-sw.js")
          source = path.read_text(encoding="utf-8")
          marker = "__CLARA_APP_BUILD__"
          if marker not in source:
              raise SystemExit("PWA build marker missing")
          path.write_text(source.replace(marker, sys.argv[1]), encoding="utf-8")
          PY
          printf '{"commit":"%s","builtAt":"%s"}\n' "$BUILD_ID" "$BUILD_AT" > public/build-info.json

      - name: Build GitHub Pages app
        run: npm run build:web
        env:
          VITE_GEMINI_MODEL: gemini-3.6-flash
          VITE_CLARA_RUNTIME_MODE: local_only
          VITE_CLARA_AUTH_ENABLED: "false"
          VITE_CLARA_LOCAL_MODE_ENABLED: "true"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
