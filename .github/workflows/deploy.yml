name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Means is source-controlled and regression-tested. Do not mutate its cycle anchor
      # during deploy; deploy-time v6/v7 patching previously rewrote the fixed 100.
      - name: Wire installed-PWA freshness runtime
        run: python3 scripts/install_clara_pwa_freshness.py

      - name: Apply remaining full-suite repair
        run: python3 scripts/fix_remaining_full_suite_after_means_v1.py

      - name: Preserve current Wallet regression owner
        run: git restore --source=HEAD -- tests/wallet-expanded-flow-regression.test.mjs

      - name: Preserve current Learning Hub regression owner
        run: git restore --source=HEAD -- tests/learning-hub-first-click.test.mjs

      - name: Syntax checks
        run: |
          python3 -m py_compile \
            scripts/install_clara_pwa_freshness.py \
            scripts/fix_remaining_full_suite_after_means_v1.py
          node --check src/runtime/installClaraOrbGreeting.js
          node --check src/runtime/installClaraPwaFreshness.js
          node --check src/lib/clara-means-cycle-baseline.js
          node --check src/lib/debtObligationStore.js
          node --check src/lib/clara-buy-check-wallet-engine.js
          node --check src/lib/clara-buy-check-income-runway-engine.js
          node --check src/lib/clara-wallet-money-semantics.js
          node --check public/clara-task-reminder-sw.js

      - name: Run focused financial regression tests
        run: |
          node --test tests/means-score-context-baseline-regression.test.mjs
          node --test tests/means-score-single-authority-regression.test.mjs
          node --test tests/buy-check-context-facts.test.mjs
          node --test tests/wallet-money-semantics.test.mjs
          node --test tests/wallet-expanded-flow-regression.test.mjs

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run full regression suite
        run: npm test

      - name: Commit and push verified repair
        run: |
          if git diff --quiet; then
            echo "Verified repair already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/runtime/installClaraOrbGreeting.js \
              src/runtime/installClaraPwaFreshness.js \
              src/lib/debtObligationStore.js \
              src/lib/clara-buy-check-wallet-engine.js \
              src/lib/clara-buy-check-income-runway-engine.js \
              src/lib/clara-wallet-money-semantics.js \
              tests
            git commit -m "Restore financial integrity and regression contracts"
            git push origin HEAD:main
          fi

      - name: Stamp release freshness
        run: |
          BUILD_ID="$(git rev-parse HEAD)"
          BUILD_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys
          path = Path("public/clara-task-reminder-sw.js")
          source = path.read_text(encoding="utf-8")
          marker = "__CLARA_APP_BUILD__"
          if marker not in source:
              raise SystemExit("PWA build marker missing")
          path.write_text(source.replace(marker, sys.argv[1]), encoding="utf-8")
          PY
          printf '{"commit":"%s","builtAt":"%s"}\n' "$BUILD_ID" "$BUILD_AT" > public/build-info.json

      - name: Build GitHub Pages app
        run: npm run build:web
        env:
          VITE_GEMINI_MODEL: gemini-3.6-flash
          VITE_CLARA_RUNTIME_MODE: local_only
          VITE_CLARA_AUTH_ENABLED: "false"
          VITE_CLARA_LOCAL_MODE_ENABLED: "true"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
