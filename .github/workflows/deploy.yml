name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase build variables
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: |
          missing=0
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Missing repository secret: VITE_SUPABASE_URL"
            missing=1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing repository secret: VITE_SUPABASE_ANON_KEY"
            missing=1
          fi
          if [ -z "$VITE_GEMINI_API_KEY" ]; then
            echo "::error::Missing repository secret: VITE_GEMINI_API_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Configure required secrets in GitHub: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Patch Ask CLARA env lookup for Vite
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/clara-gemini-client.js")
          source = path.read_text()
          source = source.replace(
          '''function getGeminiApiKey() {
  const env = import.meta?.env || {};
  return (
    env.VITE_GEMINI_API_KEY ||
    env.VITE_GOOGLE_GEMINI_API_KEY ||
    env.VITE_GOOGLE_AI_API_KEY ||
    env.VITE_GOOGLE_GENERATIVE_AI_API_KEY ||
    env.VITE_CLARA_GEMINI_API_KEY ||
    env.VITE_AI_API_KEY ||
    ""
  );
}

function getGeminiModel() {
  const env = import.meta?.env || {};
  return env.VITE_GEMINI_MODEL || env.VITE_CLARA_GEMINI_MODEL || DEFAULT_GEMINI_MODEL;
}''',
          '''function getGeminiApiKey() {
  return (
    import.meta.env.VITE_GEMINI_API_KEY ||
    import.meta.env.VITE_GOOGLE_GEMINI_API_KEY ||
    import.meta.env.VITE_GOOGLE_AI_API_KEY ||
    import.meta.env.VITE_GOOGLE_GENERATIVE_AI_API_KEY ||
    import.meta.env.VITE_CLARA_GEMINI_API_KEY ||
    import.meta.env.VITE_AI_API_KEY ||
    ""
  );
}

function getGeminiModel() {
  return import.meta.env.VITE_GEMINI_MODEL || import.meta.env.VITE_CLARA_GEMINI_MODEL || DEFAULT_GEMINI_MODEL;
}'''
          )
          path.write_text(source)
          PY

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Deploy dist to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
