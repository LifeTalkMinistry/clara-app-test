name: Settings regression verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/settings-regression-verify.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align current notification tools label
        run: sed -i 's/Advanced task reminder schedule/Advanced delivery \& task reminder tools/g' tests/settings-integrity-regression.test.mjs

      - name: Run Settings authority regression suite
        run: |
          node --test \
            tests/canonical-display-name-authority.test.mjs \
            tests/settings-local-only-regression.test.mjs \
            tests/settings-integrity-regression.test.mjs \
            tests/settings-top-spacing.test.mjs \
            tests/settings-visual-authority.test.mjs \
            tests/dashboard-top-nav-ownership.test.mjs

      - name: Commit verified alignment and remove verifier
        run: |
          git config user.name "CLARA Engineering"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/settings-regression-verify.yml
          git add tests/settings-integrity-regression.test.mjs
          git commit -m "Verify Settings visual authority regressions"
          git push origin HEAD:main
