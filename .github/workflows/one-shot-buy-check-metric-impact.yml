name: One-shot Buy Check metric impact repair

on:
  push:
    paths:
      - ".github/workflows/one-shot-buy-check-metric-impact.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply canonical metric-impact architecture
        shell: python
        run: |
          from pathlib import Path
          import re

          metric_path = Path('src/lib/clara-buy-check-metric-impact.js')
          metric_path.write_text(r'''import {
            getClaraMoneyScheduleStorageKey,
            readClaraMoneyRoutine,
          } from "./clara-money-schedule-repository.js";

          const STOP_WORDS = new Set([
            "a", "an", "and", "buy", "buying", "for", "get", "i", "item", "my", "of", "pay",
            "purchase", "spend", "the", "this", "to", "want", "with",
          ]);

          function clean(value = "") {
            return String(value ?? "").replace(/\s+/g, " ").trim();
          }

          function toNumber(value, fallback = 0) {
            const parsed = Number(String(value ?? "").replace(/[₱,\s]/g, ""));
            return Number.isFinite(parsed) ? parsed : fallback;
          }

          function localDateKey(value = new Date()) {
            const date = value instanceof Date ? value : new Date(value);
            if (Number.isNaN(date.getTime())) return "";
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
          }

          function addDays(date, amount) {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate() + amount);
          }

          function parseDateKey(value) {
            const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!match) return null;
            return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
          }

          function normalizeToken(token = "") {
            let value = String(token).toLowerCase().replace(/[^a-z0-9]/g, "");
            if (value.length > 4 && value.endsWith("ies")) value = `${value.slice(0, -3)}y`;
            else if (value.length > 4 && value.endsWith("s")) value = value.slice(0, -1);
            return value;
          }

          function words(value = "") {
            return clean(value)
              .toLowerCase()
              .split(/[^a-z0-9]+/)
              .map(normalizeToken)
              .filter((token) => token && token.length > 1 && !STOP_WORDS.has(token));
          }

          function normalizedPhrase(value = "") {
            return words(value).join(" ");
          }

          function matchScore(item = "", candidate = "") {
            const leftPhrase = normalizedPhrase(item);
            const rightPhrase = normalizedPhrase(candidate);
            if (!leftPhrase || !rightPhrase) return 0;
            if (leftPhrase === rightPhrase) return 1;
            if (leftPhrase.includes(rightPhrase) || rightPhrase.includes(leftPhrase)) return 0.94;

            const left = new Set(leftPhrase.split(" "));
            const right = new Set(rightPhrase.split(" "));
            const intersection = [...left].filter((token) => right.has(token)).length;
            if (!intersection) return 0;
            const overlap = intersection / Math.max(left.size, right.size);
            return overlap >= 0.75 ? 0.82 : overlap >= 0.5 && intersection >= 2 ? 0.74 : 0;
          }

          function ownerFromContext(context = {}) {
            return (
              context?.user ||
              context?.userId ||
              context?.user_id ||
              context?.profile?.id ||
              context?.profile?.email ||
              context?.localUserId ||
              context?.local_user_id ||
              "local-user"
            );
          }

          function routineCandidates({ item, assistantContext, snapshot }) {
            if (typeof window === "undefined") return [];
            let routine = assistantContext?.moneyRoutine || assistantContext?.moneyScheduleRoutine || null;
            if (!routine) {
              try {
                routine = readClaraMoneyRoutine(ownerFromContext(assistantContext));
              } catch {
                routine = null;
              }
            }
            if (!routine || routine.active === false || !Array.isArray(routine.days)) return [];

            const today = new Date();
            const horizon = parseDateKey(snapshot?.cycleEndDate || snapshot?.horizonDate) || addDays(today, 31);
            const candidates = [];
            for (let cursor = new Date(today.getFullYear(), today.getMonth(), today.getDate()); cursor < horizon; cursor = addDays(cursor, 1)) {
              const day = routine.days.find((entry) => Number(entry?.weekdayIndex ?? entry?.weekday_index) === cursor.getDay());
              if (!day || !Array.isArray(day.items)) continue;
              day.items.forEach((entry) => {
                const label = clean(entry?.label || entry?.title || entry?.name || entry?.category);
                const score = matchScore(item, label);
                const centavos = Number(entry?.amountCentavos ?? entry?.amount_centavos);
                const amount = Number.isFinite(centavos) ? Math.max(0, centavos) / 100 : Math.max(0, toNumber(entry?.amount));
                if (score < 0.72 || !(amount > 0)) return;
                candidates.push({
                  source: "money_schedule_routine",
                  label,
                  amount,
                  matchScore: score,
                  targetDate: localDateKey(cursor),
                  impactKey: clean(entry?.id) || `routine:${localDateKey(cursor)}:${normalizedPhrase(label)}`,
                  offsetUntil: snapshot?.cycleEndDate || snapshot?.horizonDate || localDateKey(horizon),
                });
              });
            }
            return candidates;
          }

          function scheduledEventCandidates({ item, assistantContext, snapshot }) {
            if (typeof window === "undefined" || !window.localStorage) return [];
            let events = [];
            const supplied =
              assistantContext?.scheduleEvents ||
              assistantContext?.moneyScheduleEvents ||
              assistantContext?.calendarEvents ||
              assistantContext?.schedule ||
              null;
            if (Array.isArray(supplied)) events = supplied;
            else {
              try {
                const key = getClaraMoneyScheduleStorageKey(ownerFromContext(assistantContext));
                const parsed = JSON.parse(window.localStorage.getItem(key) || "[]");
                events = Array.isArray(parsed) ? parsed : [];
              } catch {
                events = [];
              }
            }

            const today = localDateKey();
            const horizon = String(snapshot?.cycleEndDate || snapshot?.horizonDate || "9999-12-31").slice(0, 10);
            return events.flatMap((event) => {
              const date = String(event?.date || event?.start || "").slice(0, 10);
              const direction = clean(event?.direction || "out").toLowerCase();
              const amount = Math.max(0, toNumber(event?.amount ?? event?.cost));
              const label = clean(event?.title || event?.name || event?.note || event?.type);
              const score = matchScore(item, `${label} ${event?.note || ""}`);
              if (!date || date < today || date >= horizon || direction !== "out" || event?.affectsMoney === false) return [];
              if (!(amount > 0) || score < 0.72) return [];
              return [{
                source: "money_schedule_event",
                label,
                amount,
                matchScore: score,
                targetDate: date,
                impactKey: clean(event?.id) || `event:${date}:${normalizedPhrase(label)}`,
                offsetUntil: date,
              }];
            });
          }

          function choosePlannedCandidate(args = {}) {
            const supplied = Array.isArray(args.plannedCandidates) ? args.plannedCandidates : null;
            const candidates = supplied || [
              ...routineCandidates(args),
              ...scheduledEventCandidates(args),
            ];
            return candidates
              .filter((candidate) => Number(candidate?.amount) > 0)
              .sort((left, right) =>
                Number(right.matchScore || 0) - Number(left.matchScore || 0) ||
                String(left.targetDate || "").localeCompare(String(right.targetDate || ""))
              )[0] || null;
          }

          function statusForScore(score) {
            if (score >= 10000) return "Diamond";
            if (score >= 5000) return "Gold";
            if (score >= 2000) return "Silver";
            if (score >= 1000) return "Bronze";
            if (score >= 500) return "Vanguard";
            if (score >= 400) return "3 Cycles Ahead";
            if (score >= 300) return "2 Cycles Ahead";
            if (score >= 200) return "1 Cycle Ahead";
            if (score >= 101) return "Below Your Means";
            if (score === 100) return "Within Your Means";
            if (score >= 1) return "Above Your Means";
            return "In Deficit";
          }

          function simulateMeansPurchaseImpact({
            snapshot = {},
            purchasePrice = 0,
            alreadyAccountedAmount = 0,
            impactSource = "unplanned",
            impactLabel = "",
            impactKey = "",
            targetDate = null,
            offsetUntil = null,
          } = {}) {
            const price = Math.max(0, toNumber(purchasePrice));
            if (!(price > 0) || !snapshot || typeof snapshot !== "object") return null;

            const currentScore = Number(snapshot.score);
            const requiredRunway = Math.max(0, toNumber(snapshot.requiredRunway));
            const availableNow = Math.max(0, toNumber(snapshot.availableNow));
            const upcomingCommitments = Math.max(0, toNumber(snapshot.upcoming));
            const currentRoomUntilPayday = Number.isFinite(Number(snapshot.projectedRoom))
              ? Number(snapshot.projectedRoom)
              : availableNow - upcomingCommitments;
            const currentScoreRoom = Number.isFinite(Number(snapshot.scoreRoom))
              ? Number(snapshot.scoreRoom)
              : requiredRunway > 0 && Number.isFinite(currentScore)
                ? ((currentScore / 100) * requiredRunway) - requiredRunway
                : currentRoomUntilPayday;

            const accounted = Math.max(0, toNumber(alreadyAccountedAmount));
            const incrementalImpact = price - accounted;
            const projectedScoreRoom = currentScoreRoom - incrementalImpact;
            const projectedRoomAfterPurchase = currentRoomUntilPayday - incrementalImpact;
            const projectedScoreAfterPurchase = requiredRunway > 0
              ? Math.round(((requiredRunway + projectedScoreRoom) / requiredRunway) * 100)
              : Number.isFinite(currentScore)
                ? currentScore
                : availableNow > 0
                  ? 100
                  : 0;

            return {
              protectionLine: 100,
              purchasePrice: price,
              alreadyAccountedAmount: accounted,
              incrementalImpact,
              impactSource,
              impactLabel,
              impactKey,
              targetDate,
              offsetUntil,
              currentScore: Number.isFinite(currentScore) ? currentScore : null,
              projectedScoreAfterPurchase,
              scoreChange: Number.isFinite(currentScore) ? projectedScoreAfterPurchase - currentScore : null,
              currentStatus: Number.isFinite(currentScore) ? statusForScore(currentScore) : null,
              projectedStatus: statusForScore(projectedScoreAfterPurchase),
              requiredRunway,
              currentScoreRoom,
              projectedScoreRoom,
              currentRoomUntilPayday,
              projectedRoomAfterPurchase,
              roomChange: projectedRoomAfterPurchase - currentRoomUntilPayday,
              purchaseSimulationApplied: true,
              crossesProtectionLine:
                Number.isFinite(currentScore) && currentScore >= 100 && projectedScoreAfterPurchase < 100,
              cycleStartDate: snapshot.cycleStartDate || null,
              nextPayday: snapshot.cycleEndDate || snapshot.horizonDate || null,
              spendableMoney: availableNow,
              availableAfterPurchase: availableNow - price,
              upcomingCommitments,
              upcomingCommitmentsAfterPurchase: Math.max(0, upcomingCommitments - accounted),
              breakdown: {
                debtAndObligations: Math.max(0, toNumber(snapshot.debtUpcoming)),
                savingsGoals: Math.max(0, toNumber(snapshot.savingsGoalUpcoming)),
                moneySchedule: Math.max(0, toNumber(snapshot.moneyScheduleUpcoming)),
                otherScheduledEvents: Math.max(0, toNumber(snapshot.otherScheduledUpcoming)),
              },
              moneyLentUnavailable: Math.max(0, toNumber(snapshot.moneyLentUnavailable)),
              savingsProtected: Math.max(0, toNumber(snapshot.savingsProtected)),
              emergencyProtected: Math.max(0, toNumber(snapshot.emergencyProtected)),
              dataSource: "canonical-orb-means-snapshot",
            };
          }

          function buildClaraPurchaseMetricImpact({ purchasePrice = 0, item = "", assistantContext = {}, snapshot: suppliedSnapshot = null, plannedCandidates = null } = {}) {
            const snapshot = suppliedSnapshot || (typeof window !== "undefined" ? window.__claraCanonicalMeansSnapshot__ : null);
            if (!snapshot || typeof snapshot !== "object" || !Object.keys(snapshot).length) return null;
            const candidate = choosePlannedCandidate({ item, assistantContext, snapshot, plannedCandidates });
            return simulateMeansPurchaseImpact({
              snapshot,
              purchasePrice,
              alreadyAccountedAmount: candidate?.amount || 0,
              impactSource: candidate?.source || "unplanned",
              impactLabel: candidate?.label || "",
              impactKey: candidate?.impactKey || "",
              targetDate: candidate?.targetDate || null,
              offsetUntil: candidate?.offsetUntil || null,
            });
          }

          function peso(value = 0) {
            const amount = Math.abs(Number(value) || 0);
            return `₱${amount.toLocaleString("en-PH", { maximumFractionDigits: amount % 1 === 0 ? 0 : 2 })}`;
          }

          function signedPoints(value = 0) {
            const amount = Number(value) || 0;
            if (amount > 0) return `+${amount}`;
            if (amount < 0) return `−${Math.abs(amount)}`;
            return "0";
          }

          function formatClaraMetricImpactLine(impact = {}) {
            if (!impact?.purchaseSimulationApplied || impact?.projectedScoreAfterPurchase == null) return "";
            const before = Number.isFinite(Number(impact.currentScore)) ? Number(impact.currentScore) : null;
            const after = Number(impact.projectedScoreAfterPurchase);
            const movement = before === null
              ? `Means impact: ${after}`
              : `Means impact: ${before} → ${after} (${signedPoints(impact.scoreChange)}).`;
            const accounted = Math.max(0, Number(impact.alreadyAccountedAmount) || 0);
            const incremental = Number(impact.incrementalImpact) || 0;
            const sourceLabel = impact.impactSource === "money_schedule_routine" || impact.impactSource === "money_schedule_event"
              ? "Money Schedule"
              : "your plan";

            if (!(accounted > 0)) return `${movement} New pressure: ${peso(impact.purchasePrice)}.`;
            if (Math.abs(incremental) < 0.005) {
              return `${movement} ${peso(accounted)} is already accounted for in ${sourceLabel}.`;
            }
            if (incremental > 0) {
              return `${movement} ${peso(accounted)} is already accounted for; new pressure: ${peso(incremental)}.`;
            }
            return `${movement} You planned ${peso(accounted)}; this creates ${peso(Math.abs(incremental))} extra room.`;
          }

          export {
            buildClaraPurchaseMetricImpact,
            formatClaraMetricImpactLine,
            matchScore,
            simulateMeansPurchaseImpact,
          };
          ''')

          ai_path = Path('src/lib/clara-buy-check-expert-ai.js')
          ai = ai_path.read_text()
          import_anchor = 'import { buildClaraLifeContextStatement } from "./clara-life-context.js";\n'
          if 'clara-buy-check-metric-impact.js' not in ai:
            ai = ai.replace(import_anchor, import_anchor + 'import {\n  buildClaraPurchaseMetricImpact,\n  formatClaraMetricImpactLine,\n} from "./clara-buy-check-metric-impact.js";\n')

          ai = re.sub(
            r'function buildCanonicalMeansContext\(purchasePrice = 0\) \{.*?\n\}\n\nfunction buildConversationFinancialContext',
            '''function buildCanonicalMeansContext(purchasePrice = 0, assistantContext = {}, evidence = {}) {\n  return buildClaraPurchaseMetricImpact({\n    purchasePrice,\n    item: clean(evidence?.item || ""),\n    assistantContext,\n  });\n}\n\nfunction buildConversationFinancialContext''',
            ai,
            count=1,
            flags=re.S,
          )
          ai = ai.replace('const means = buildCanonicalMeansContext(price);', 'const means = buildCanonicalMeansContext(price, assistantContext, understood);')
          ai = ai.replace('const means = buildCanonicalMeansContext(current.price);', 'const means = buildCanonicalMeansContext(current.price, assistantContext, current);')
          ai = ai.replace('const authoritativeMeans = buildCanonicalMeansContext(mergedEvidence.price);', 'const authoritativeMeans = buildCanonicalMeansContext(mergedEvidence.price, assistantContext, mergedEvidence);')

          ai = ai.replace(
            '- When a purchase price is known, ALWAYS treat the projected Means values as the real-time what-if result of buying the item.\n',
            '- When a purchase price is known, ALWAYS treat the projected Means values as the real-time what-if result of buying the item.\n- The application computes the metric impact deterministically. means.purchasePrice is the proposed cost; means.alreadyAccountedAmount is money already represented in the current Means plan; means.incrementalImpact is the NEW financial pressure after removing that already-accounted amount.\n- If means.alreadyAccountedAmount is greater than zero, NEVER subtract the full purchase price again in your reasoning. Judge the decision from means.incrementalImpact.\n- A negative means.incrementalImpact means the user is spending less than CLARA had already accounted for and is creating additional room.\n'
          )
          ai = ai.replace(
            '- When a purchase price is known and means.projectedScoreAfterPurchase is available, ALWAYS state the exact projected Means Score in the visible reply.\n',
            '- The application prepends the exact deterministic Means impact line to the visible reply. Do not invent, recalculate, or contradict it. Focus your own sentence on the practical recommendation or tradeoff.\n'
          )
          ai = ai.replace(
            '- When a purchase price is known and means.projectedScoreAfterPurchase exists, the projected score/change is ALWAYS the primary visible financial point.\n- State the exact projected score every time. Prefer natural before → after wording, for example: "That would move you from 144 to 142, still comfortably above 100."\n- Never give only a qualitative statement like "you stay above 100" when the exact projected score is available.\n',
            '- The deterministic Means impact line is ALWAYS the primary visible financial point once a price is known.\n- Do not repeat the full metric line unless repetition is necessary for clarity; add the human recommendation after it.\n- Never contradict the before → after score, incremental pressure, or already-accounted amount supplied by the application.\n'
          )

          old_fallback = '''    return {\n      action: "ready",\n      reply: `₱${Number(current.price).toLocaleString()} would move your Means Score ${movement}, ${guidance}. Will you still buy it?`,\n      evidence: current,\n      readinessConfidence: 0.9,\n      source: "means-fallback",\n    };'''
          new_fallback = '''    const metricLine = formatClaraMetricImpactLine(means);\n    return {\n      action: "ready",\n      reply: `${metricLine} ${guidance}. Will you still buy it?`.trim(),\n      evidence: current,\n      readinessConfidence: 0.9,\n      source: "means-fallback",\n    };'''
          if old_fallback not in ai:
            raise SystemExit('fallback block not found')
          ai = ai.replace(old_fallback, new_fallback)

          old_enforcement = re.compile(r'''    // Enforce the exact projected Means score in application code\. Gemini may\n    // explain the result, but it cannot omit the authoritative simulation\.\n    const authoritativeMeans = buildCanonicalMeansContext\(mergedEvidence\.price, assistantContext, mergedEvidence\);\n    if \(\n      authoritativeMeans\?\.purchaseSimulationApplied &&\n      authoritativeMeans\.projectedScoreAfterPurchase !== null\n    \) \{.*?\n    \}\n''', re.S)
          replacement = '''    // The application, not Gemini, owns the financial math. Always put the\n    // canonical metric impact first so the user sees the exact consequence.\n    const authoritativeMeans = buildCanonicalMeansContext(mergedEvidence.price, assistantContext, mergedEvidence);\n    if (\n      authoritativeMeans?.purchaseSimulationApplied &&\n      authoritativeMeans.projectedScoreAfterPurchase !== null\n    ) {\n      const metricLine = formatClaraMetricImpactLine(authoritativeMeans);\n      if (metricLine && !reply.startsWith(metricLine)) {\n        reply = `${metricLine} ${reply}`.trim().slice(0, 720);\n      }\n    }\n'''
          ai, count = old_enforcement.subn(replacement, ai, count=1)
          if count != 1:
            raise SystemExit(f'enforcement block replacements: {count}')
          ai_path.write_text(ai)

          v5_path = Path('src/components/fresh/main-dashboard/assistant/useClaraBuyCheckFlowV5.js')
          v5 = v5_path.read_text()
          v5_import_anchor = 'import { saveAvoidedSpendingDecision } from "@/lib/clara-buy-check-impact-ledger";\n'
          if 'clara-buy-check-metric-impact' not in v5:
            v5 = v5.replace(v5_import_anchor, v5_import_anchor + 'import { buildClaraPurchaseMetricImpact } from "@/lib/clara-buy-check-metric-impact";\n')
          old_setup = '''    const selectedBudget = base.state?.budgetAssessment?.selectedBudget || null;\n    const conversationReason = clean(decision.explanation) || preparedReason(base.state);\n    const purchase = {\n      item: clean(base.state?.item),\n      price: amount,\n      reason: conversationReason,\n      planningStatus: base.state?.planningStatus || "unplanned",\n      category: normalizeExpenseCategory(`${base.state?.item || ""} ${conversationReason}`),\n      budgetId: selectedBudget?.id || "",\n      budgetName: selectedBudget?.title || "",\n    };'''
          new_setup = '''    const conversationReason = clean(decision.explanation) || preparedReason(base.state);\n    const metricImpact = buildClaraPurchaseMetricImpact({\n      purchasePrice: amount,\n      item: clean(base.state?.item),\n      assistantContext,\n    });\n    const plannedByMetric = Number(metricImpact?.alreadyAccountedAmount || 0) > 0;\n    const purchase = {\n      item: clean(base.state?.item),\n      price: amount,\n      reason: conversationReason,\n      planningStatus: plannedByMetric ? "planned" : "unplanned",\n      category: normalizeExpenseCategory(`${base.state?.item || ""} ${conversationReason}`),\n      budgetId: "",\n      budgetName: "",\n    };'''
          if old_setup not in v5:
            raise SystemExit('V5 setup block not found')
          v5 = v5.replace(old_setup, new_setup)
          payload_anchor = '''          source: "local",\n          syncStatus: "local_only",\n        }, {\n          budgetId: purchase.budgetId,\n          budgetRemaining: selectedBudget?.remaining,\n        });'''
          payload_replacement = '''          source: "local",\n          syncStatus: "local_only",\n          means_accounted_amount: Number(metricImpact?.alreadyAccountedAmount || 0),\n          means_incremental_impact: Number(metricImpact?.incrementalImpact ?? amount),\n          means_accounted_source: metricImpact?.impactSource || "unplanned",\n          means_accounted_key: metricImpact?.impactKey || null,\n          means_accounted_target_date: metricImpact?.targetDate || null,\n          means_accounted_until: metricImpact?.offsetUntil || null,\n          means_metric_score_before: metricImpact?.currentScore ?? null,\n          means_metric_score_after: metricImpact?.projectedScoreAfterPurchase ?? null,\n        }, {\n          budgetId: "",\n        });'''
          if payload_anchor not in v5:
            raise SystemExit('V5 payload anchor not found')
          v5 = v5.replace(payload_anchor, payload_replacement)
          result_old = '''            message: purchase.budgetName\n              ? `${purchase.item} was added to your transactions, linked to ${purchase.budgetName}, and deducted from ${wallet.name}.`\n              : `${purchase.item} was added to your transactions and deducted from ${wallet.name}. No budget was linked.`,'''
          result_new = '''            message: metricImpact?.projectedScoreAfterPurchase != null\n              ? `${purchase.item} was added to your transactions and deducted from ${wallet.name}. Means: ${metricImpact.currentScore} → ${metricImpact.projectedScoreAfterPurchase}.`\n              : `${purchase.item} was added to your transactions and deducted from ${wallet.name}.`,'''
          if result_old not in v5:
            raise SystemExit('V5 result message block not found')
          v5 = v5.replace(result_old, result_new)
          v5_path.write_text(v5)

          runtime_path = Path('src/runtime/installClaraOrbGreeting.js')
          runtime = runtime_path.read_text()
          helper_anchor = 'async function buildMeansSnapshot(profile = {}) {\n'
          helper = r'''function realizedBuyCheckMeansOffset(expenses = [], cycleStart = "", cycleEnd = "") {
            const today = localDateKey();
            return (Array.isArray(expenses) ? expenses : []).reduce((sum, expense) => {
              const date = localDateKey(getTransactionDate(expense));
              if (!date || date < cycleStart || date >= cycleEnd) return sum;
              const amount = Math.max(0, Number(expense?.means_accounted_amount || 0));
              const source = normalizeLower(expense?.means_accounted_source);
              if (!(amount > 0) || !source || source === "unplanned") return sum;

              // One-off scheduled events stop needing an offset after their planned
              // date leaves Upcoming. Weekly routine items remain represented as
              // Assumed spent, so their offset remains valid for the whole cycle.
              const offsetUntil = String(expense?.means_accounted_until || "").slice(0, 10);
              if (source === "money_schedule_event" && offsetUntil && today > offsetUntil) return sum;
              return sum + amount;
            }, 0);
          }

          '''
          if 'function realizedBuyCheckMeansOffset(' not in runtime:
            runtime = runtime.replace(helper_anchor, helper + helper_anchor)
          runtime = runtime.replace(
            '  const spent = payCycleSpent(expenses, cycleStartDate);\n',
            '  const spent = payCycleSpent(expenses, cycleStartDate);\n  const realizedPlannedBuyCheckOffset = realizedBuyCheckMeansOffset(expenses, cycleStartDate, cycleEndDate);\n'
          )
          runtime = runtime.replace(
            '  const scoreRoom = financialRunway - upcoming - plannedAssumedSinceLock;\n',
            '  const scoreRoom = financialRunway - upcoming - plannedAssumedSinceLock + realizedPlannedBuyCheckOffset;\n'
          )
          runtime = runtime.replace(
            '    plannedAssumedSinceLock,\n    moneyLentUnavailable,\n',
            '    plannedAssumedSinceLock,\n    realizedPlannedBuyCheckOffset,\n    moneyLentUnavailable,\n'
          )
          runtime_path.write_text(runtime)

          test_path = Path('tests/buy-check-metric-impact.test.mjs')
          test_path.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import {
            formatClaraMetricImpactLine,
            simulateMeansPurchaseImpact,
          } from "../src/lib/clara-buy-check-metric-impact.js";

          const snapshot = {
            score: 150,
            requiredRunway: 10000,
            scoreRoom: 5000,
            projectedRoom: 5000,
            availableNow: 9000,
            upcoming: 4000,
            cycleStartDate: "2026-08-25",
            cycleEndDate: "2026-09-10",
          };

          test("unplanned purchase uses the locked canonical required runway", () => {
            const impact = simulateMeansPurchaseImpact({ snapshot, purchasePrice: 1000 });
            assert.equal(impact.currentScore, 150);
            assert.equal(impact.projectedScoreAfterPurchase, 140);
            assert.equal(impact.scoreChange, -10);
            assert.equal(impact.incrementalImpact, 1000);
            assert.equal(impact.projectedRoomAfterPurchase, 4000);
          });

          test("fully accounted purchase is metric-neutral", () => {
            const impact = simulateMeansPurchaseImpact({
              snapshot,
              purchasePrice: 1000,
              alreadyAccountedAmount: 1000,
              impactSource: "money_schedule_routine",
