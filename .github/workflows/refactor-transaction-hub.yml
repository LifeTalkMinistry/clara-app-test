name: Finalize validated membership migration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refactor-transaction-hub.yml"

permissions:
  contents: write

jobs:
  finalize-membership:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply validated membership migration
        run: node scripts/apply-membership-migration.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: validation-placeholder
          VITE_GEMINI_API_KEY: validation-placeholder

      - name: Restore workflow and remove migration assets
        shell: bash
        run: |
          git show HEAD^:.github/workflows/refactor-transaction-hub.yml > .github/workflows/refactor-transaction-hub.yml
          rm -rf .github/membership-migration
          rm -f .github/workflows/validate-membership-migration.yml
          rm -f scripts/apply-membership-migration.mjs
          rm -rf scripts/templates

      - name: Commit final membership source
        shell: bash
        run: |
          git config user.name "CLARA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Retire legacy membership tiers"
          git push origin HEAD:main
