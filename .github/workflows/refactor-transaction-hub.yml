name: Apply Savings managed balance upgrade

# Triggered through a merged PR so GitHub Actions receives a trusted push event.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refactor-transaction-hub.yml"

permissions:
  contents: write

jobs:
  apply-savings-managed-balance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Savings feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/savings-goal-managed-balance
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract and run prepared upgrade
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/apply-savings-managed-balance.yml > /tmp/prepared.yml
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/prepared.yml').read_text()
          start = text.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          Path('/tmp/apply_savings_balance.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          python /tmp/apply_savings_balance.py

      - run: npm ci
      - run: node --test tests/savings-goal-managed-balance-regression.test.mjs
      - run: npm test -- --runInBand
      - run: npm run build

      - name: Commit verified Savings changes
        run: |
          rm -f .github/workflows/run-savings-managed-balance.yml
          rm -f .github/savings-goal-managed-balance-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: manage Savings Goal balances with explicit actions"
          git push origin HEAD:fix/savings-goal-managed-balance
