name: Refactor Transaction Hub

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refactor-transaction-hub.yml"
      - ".github/scripts/extract-transaction-hub-utils.mjs"
      - ".github/scripts/extract-transaction-hub-primitives.mjs"
      - "src/components/fresh/transaction-hub/logic/transactionHubUtils.js"
      - "src/components/fresh/transaction-hub/ui/TransactionHubPrimitives.jsx"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-transaction-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch TransactionHub.jsx
        run: node .github/scripts/extract-transaction-hub-primitives.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build

      - name: Commit Transaction Hub refactor
        run: |
          if git diff --quiet; then
            echo "No Transaction Hub primitive extraction changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/TransactionHub.jsx
          git commit -m "Extract Transaction Hub UI primitives"
          git push
