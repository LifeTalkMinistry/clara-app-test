name: Finalize Memory retirement on current main

on:
  push:
    branches:
      - eradicate-memory-system-current
    paths:
      - ".github/workflows/finalize-memory-retirement-current.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Capture current-main regression baseline
        run: |
          set +e
          npm test > /tmp/current-main-baseline.txt 2>&1
          set -e

      - name: Cherry-pick verified Memory retirement and resolve current Settings test
        run: |
          set -euo pipefail
          git fetch origin eradicate-memory-system
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git cherry-pick 05bbe85daf4d3c4225317a9aabb3754c6d08284b
          cherry_status=$?
          set -e

          if [ "$cherry_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "tests/settings-local-only-regression.test.mjs" ]; then
              echo "Unexpected Memory retirement conflicts:" >&2
              echo "$conflicts" >&2
              exit 1
            fi

            git checkout --ours tests/settings-local-only-regression.test.mjs
            python <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/settings-local-only-regression.test.mjs')
          source = path.read_text()
          source = source.replace(
              'const assistantMemorySource = readSource("src/clara-assistant-memory-tab.js");\n',
              '',
              1,
          )
          pattern = re.compile(
              r'test\("Settings directly owns detail history, logout, and Memory", \(\) => \{[\s\S]*?\n\}\);',
              re.MULTILINE,
          )
          match = pattern.search(source)
          if not match:
              raise SystemExit('Current-main Settings Memory ownership test was not found.')
          replacement = '''test("Settings owns detail history and logout without the retired Memory entry", () => {\n  assert.match(activeSettingsSource, /SETTINGS_DETAIL_HISTORY_KEY/);\n  assert.match(activeSettingsSource, /window\\.history\\.pushState/);\n  assert.match(activeSettingsSource, /window\\.addEventListener\\("popstate"/);\n  assert.match(activeSettingsSource, /signOutFromClaraBackend/);\n  assert.match(activeSettingsSource, /"Log out"/);\n  assert.doesNotMatch(activeSettingsSource, /title: "Memory"/);\n  assert.doesNotMatch(activeSettingsSource, /clara:open-assistant-memory-board/);\n  assert.doesNotMatch(activeSettingsSource, /MutationObserver/);\n});'''
          source = source[:match.start()] + replacement + source[match.end():]
          path.write_text(source)
          PY
            git add tests/settings-local-only-regression.test.mjs
            GIT_EDITOR=true git cherry-pick --continue
          fi

      - name: Verify no new regression failures versus current main
        run: |
          set +e
          npm test > /tmp/retired-memory-tests.txt 2>&1
          set -e
          cat /tmp/retired-memory-tests.txt
          python <<'PY'
          from pathlib import Path
          import re
          import sys

          baseline = Path('/tmp/current-main-baseline.txt').read_text()
          current = Path('/tmp/retired-memory-tests.txt').read_text()
          pattern = re.compile(r'^not ok \d+ - (.+)$', re.MULTILINE)
          baseline_failures = set(pattern.findall(baseline))
          current_failures = set(pattern.findall(current))
          new_failures = sorted(current_failures - baseline_failures)
          print(f'Current-main baseline failures: {len(baseline_failures)}')
          print(f'Retirement branch failures: {len(current_failures)}')
          if new_failures:
              print('New failures introduced by Memory retirement:')
              for failure in new_failures:
                  print(f' - {failure}')
              sys.exit(1)
          print('No new regression failures versus current main.')
          PY

      - name: Lint modified Buy Check contract
        run: npx eslint src/lib/clara-buy-check-context-contract.js

      - name: Build production bundle directly
        run: npx vite build --base=./

      - name: Audit Memory retirement and preserve current Settings transfer ownership
        run: |
          set -euo pipefail
          test ! -e src/clara-assistant-memory-tab.js
          test ! -e src/clara-memory-bridge.js
          test ! -e src/lib/memory-cabinets
          test ! -e src/lib/ai/clara-memory.js
          test ! -e tests/memory-review-premium-design.test.mjs

          grep -q 'DeviceTransferPanel' src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx
          grep -q 'Backup & Restore File' src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx

          if grep -R -n -E 'clara:open-assistant-memory-board|CLARA BEHAVIORAL INTELLIGENCE FRAMEWORK|__claraBehavioralMemoryTrainingInstalled|installScopedClaraMemoryStorage|clara-assistant-memory-tab|clara-onboarding-memory-review-bridge|clara-memory-cabinet-autosave|clara-conversation-memory-summarizer|clara-universal-memory-profile|clara-user-context-story|clara-behavioral-intelligence|@/lib/memory-cabinets|@/lib/ai/clara-memory' src index.html --exclude='installRetiredContextDataCleanup.js'; then
            echo 'Retired Memory implementation reference still exists.' >&2
            exit 1
          fi

          if grep -R -n -E 'memoryContext|profileMemoryNotes|previousConversationMemory|aiFinancialMemory' src --exclude='clara-life-context.js'; then
            echo 'Retired Memory context is still connected to active source.' >&2
            exit 1
          fi

      - name: Clean helper diagnostics and publish rebased retirement
        run: |
          rm -f memory-rebase-conflicts.txt memory-rebase-conflict-diff.txt
          rm -f .github/workflows/rebase-memory-retirement-current.yml
          rm -f .github/workflows/finalize-memory-retirement-current.yml
          git add -A
          git commit --amend --no-edit
          git push origin eradicate-memory-system-current
