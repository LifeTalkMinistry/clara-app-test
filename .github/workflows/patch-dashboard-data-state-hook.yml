name: Patch dashboard data state hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard-data-state-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardDataState into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardDataState from "@/components/fresh/main-dashboard/dashboard-state/useDashboardDataState";\n'
          import_anchor = 'import { createEmptyDashboardCache } from "@/components/fresh/main-dashboard/dashboard-cache/dashboardCacheFactory";\n'
          fallback_anchor = 'import useDashboardFinanceStateSync from "@/components/fresh/main-dashboard/finance-content/useDashboardFinanceStateSync";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Dashboard data state import anchor not found. Refusing to patch Dashboard.jsx.")

          hook_block = (
              '  const {\n'
              '    tasks,\n'
              '    setTasks,\n'
              '    submissions,\n'
              '    setSubmissions,\n'
              '    programRecord,\n'
              '    setProgramRecord,\n'
              '    survivalExpense,\n'
              '    setSurvivalExpense,\n'
              '    walletMoney,\n'
              '    setWalletMoney,\n'
              '    wallets,\n'
              '    setWallets,\n'
              '    walletTransactions,\n'
              '    setWalletTransactions,\n'
              '    transfers,\n'
              '    setTransfers,\n'
              '    budgets,\n'
              '    setBudgets,\n'
              '    savingsGoals,\n'
              '    setSavingsGoals,\n'
              '    emergencyFund,\n'
              '    setEmergencyFund,\n'
              '    expenses,\n'
              '    setExpenses,\n'
              '    pendingExpenses,\n'
              '    setPendingExpenses,\n'
              '    offlineReady,\n'
              '    setOfflineReady,\n'
              '    loading,\n'
              '    setLoading,\n'
              '    profileData,\n'
              '    setProfileData,\n'
              '    latestEnrollment,\n'
              '    setLatestEnrollment,\n'
              '    guardChecked,\n'
              '    setGuardChecked,\n'
              '  } = useDashboardDataState({\n'
              '    initialCache,\n'
              '    hasInitialFinanceCache,\n'
              '    financeDataLoading,\n'
              '  });\n\n'
          )

          if 'useDashboardDataState({' not in text:
              start_token = '  const [tasks, setTasks] = useState(initialCache.tasks);\n'
              start_index = text.find(start_token)
              if start_index == -1:
                  raise SystemExit("Dashboard data state block start not found. Refusing to patch Dashboard.jsx.")

              end_token = '  const {\n    showProgramStart,\n'
              end_index = text.find(end_token, start_index)
              if end_index == -1:
                  raise SystemExit("Dashboard data state block end not found. Refusing to patch Dashboard.jsx.")

              old_block = text[start_index:end_index]
              required_tokens = [
                  'const [tasks, setTasks] = useState(initialCache.tasks);',
                  'const [wallets, setWallets] = useState(Array.isArray(initialCache.wallets) ? initialCache.wallets : []);',
                  'const [walletTransactions, setWalletTransactions] = useState(Array.isArray(initialCache.walletTransactions) ? initialCache.walletTransactions : []);',
                  'const [transfers, setTransfers] = useState(Array.isArray(initialCache.transfers) ? initialCache.transfers : []);',
                  'const [budgets, setBudgets] = useState(Array.isArray(initialCache.budgets) ? initialCache.budgets : []);',
                  'const [savingsGoals, setSavingsGoals] = useState(Array.isArray(initialCache.savingsGoals) ? initialCache.savingsGoals : []);',
                  'const [emergencyFund, setEmergencyFund] = useState(initialCache.emergencyFund || null);',
                  'const [expenses, setExpenses] = useState(Array.isArray(initialCache.expenses) ? initialCache.expenses : []);',
                  'const [pendingExpenses, setPendingExpenses] = useState([]);',
                  'const [offlineReady, setOfflineReady] = useState(true);',
                  'const [profileData, setProfileData] = useState(initialCache.profileData);',
                  'const [latestEnrollment, setLatestEnrollment] = useState(',
                  'const [guardChecked, setGuardChecked] = useState(initialCache.guardChecked);',
              ]

              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("Dashboard data state block content mismatch. Refusing to patch Dashboard.jsx.")

              text = text[:start_index] + hook_block + text[end_index:]

          if 'useDashboardDataState({' not in text:
              raise SystemExit("useDashboardDataState was not wired. Refusing to continue.")

          old_state_signatures = [
              'const [tasks, setTasks] = useState(initialCache.tasks);',
              'const [submissions, setSubmissions] = useState(initialCache.submissions);',
              'const [programRecord, setProgramRecord] = useState(initialCache.programRecord);',
              'const [survivalExpense, setSurvivalExpense] = useState(initialCache.survivalExpense);',
              'const [walletMoney, setWalletMoney] = useState(initialCache.walletMoney);',
              'const [wallets, setWallets] = useState(Array.isArray(initialCache.wallets) ? initialCache.wallets : []);',
              'const [walletTransactions, setWalletTransactions] = useState(Array.isArray(initialCache.walletTransactions) ? initialCache.walletTransactions : []);',
              'const [transfers, setTransfers] = useState(Array.isArray(initialCache.transfers) ? initialCache.transfers : []);',
              'const [budgets, setBudgets] = useState(Array.isArray(initialCache.budgets) ? initialCache.budgets : []);',
              'const [savingsGoals, setSavingsGoals] = useState(Array.isArray(initialCache.savingsGoals) ? initialCache.savingsGoals : []);',
              'const [emergencyFund, setEmergencyFund] = useState(initialCache.emergencyFund || null);',
              'const [expenses, setExpenses] = useState(Array.isArray(initialCache.expenses) ? initialCache.expenses : []);',
              'const [pendingExpenses, setPendingExpenses] = useState([]);',
              'const [offlineReady, setOfflineReady] = useState(true);',
              'const [profileData, setProfileData] = useState(initialCache.profileData);',
              'const [guardChecked, setGuardChecked] = useState(initialCache.guardChecked);',
          ]

          for signature in old_state_signatures:
              if signature in text:
                  raise SystemExit(f"Old dashboard data state line still exists after patch: {signature}")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-dashboard-data-state-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-dashboard-data-state-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire dashboard data state hook"
          git push
