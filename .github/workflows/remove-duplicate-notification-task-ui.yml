name: Remove duplicate notification task UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-duplicate-notification-task-ui.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove nested task-reminder settings authority
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          panel_path = Path("src/components/notifications/NotificationSettingsPanel.jsx")
          panel = panel_path.read_text()

          panel = panel.replace(
              'import TaskReminderSettingsCard from "@/components/TaskReminderSettingsCard";\n',
              ''
          )
          panel = panel.replace(
              '"Your notification choice was saved, but task reminder delivery could not be updated."',
              '"Your notification choice was saved, but notification delivery could not be updated."'
          )
          panel = panel.replace(
              '"Your app preference was saved, but task reminder delivery could not be updated."',
              '"Your app preference was saved, but notification delivery could not be updated."'
          )

          panel, count = re.subn(
              r'\n  const saveTaskReminderSchedule = useCallback\(async \(\) => \{[\s\S]*?\n  \}, \[preferences, taskReminderSettings, updatePreference\]\);\n',
              '\n',
              panel,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Expected to remove one saveTaskReminderSchedule block, removed {count}")

          start_marker = '''      {notificationOwnerId ? (\n        <details className="group rounded-[26px] border border-[#1d4b7b]/45 bg-[#061225] p-3">'''
          end_marker = '''      ) : null}\n\n      {!embedded ? ('''
          start = panel.find(start_marker)
          end = panel.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit("Could not locate the existing advanced task-reminder UI block")

          replacement = '''      {notificationOwnerId ? (\n        <details className="group overflow-hidden rounded-[22px] border border-[#1d4b7b]/45 bg-[#061225]">\n          <summary className="flex cursor-pointer list-none items-center justify-between gap-3 px-4 py-4 text-sm font-bold text-white/75">\n            Delivery diagnostics\n            <ChevronDown className="h-4 w-4 transition group-open:rotate-180" />\n          </summary>\n          <div className="border-t border-[#1d4b7b]/45 px-4 pb-4 pt-3">\n            <p className="text-[11px] leading-5 text-white/40">\n              Technical delivery status only. Notification families above remain the single source of truth.\n            </p>\n\n            <div className="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-3">\n              <div className="rounded-2xl border border-[#1d4b7b]/45 bg-[#040d1c] px-3 py-3">\n                <p className="text-[9px] font-black uppercase tracking-[0.14em] text-white/30">\n                  Device support\n                </p>\n                <p className="mt-1 text-xs font-black text-white/75">\n                  {taskReminderSettings.pushSupported ? "Available" : "Unavailable"}\n                </p>\n              </div>\n              <div className="rounded-2xl border border-[#1d4b7b]/45 bg-[#040d1c] px-3 py-3">\n                <p className="text-[9px] font-black uppercase tracking-[0.14em] text-white/30">\n                  Permission\n                </p>\n                <p className="mt-1 text-xs font-black text-white/75">\n                  {taskReminderSettings.permissionState === "granted"\n                    ? "Granted"\n                    : taskReminderSettings.permissionState === "denied"\n                      ? "Blocked"\n                      : taskReminderSettings.permissionState === "unsupported"\n                        ? "Unavailable"\n                        : "Not granted"}\n                </p>\n              </div>\n              <div className="rounded-2xl border border-[#1d4b7b]/45 bg-[#040d1c] px-3 py-3">\n                <p className="text-[9px] font-black uppercase tracking-[0.14em] text-white/30">\n                  Phone delivery\n                </p>\n                <p className="mt-1 text-xs font-black text-white/75">\n                  {taskReminderSettings.pushConfigured ? "Ready" : "Not configured"}\n                </p>\n              </div>\n            </div>\n\n            <div className="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-2">\n              <button\n                type="button"\n                onClick={sendLocalDeviceTest}\n                disabled={localTestSending}\n                className="rounded-2xl border border-[#1d4b7b]/45 bg-[#07162b] px-4 py-3 text-xs font-black text-white/70 disabled:opacity-45"\n              >\n                {localTestSending ? "Sending local test..." : "Test local notification"}\n              </button>\n              <button\n                type="button"\n                onClick={sendRealPushTest}\n                disabled={realPushTestSending || !taskReminderSettings.pushConfigured}\n                className="rounded-2xl border border-[#4f96ff]/35 bg-[#0867ff] px-4 py-3 text-xs font-black text-white disabled:opacity-45"\n              >\n                {realPushTestSending ? "Sending push test..." : "Test phone push"}\n              </button>\n            </div>\n          </div>\n        </details>\n      ) : null}\n\n      {!embedded ? ('''

          panel = panel[:start] + replacement + panel[end + len(end_marker):]
          panel_path.write_text(panel)

          runtime_test_path = Path("tests/notification-runtime-contracts.test.mjs")
          runtime_test = runtime_test_path.read_text()
          guard = '''\n\ntest("notification Settings exposes one user-facing notification system", () => {\n  assert.match(notificationPanelSource, /Delivery diagnostics/);\n  assert.match(notificationPanelSource, /Technical delivery status only/);\n  assert.doesNotMatch(notificationPanelSource, /TaskReminderSettingsCard/);\n  assert.doesNotMatch(notificationPanelSource, /Advanced delivery & task reminder tools/);\n  assert.doesNotMatch(notificationPanelSource, /Save advanced task schedule/);\n});\n'''
          if 'notification Settings exposes one user-facing notification system' not in runtime_test:
              runtime_test += guard
          runtime_test_path.write_text(runtime_test)

          settings_test_path = Path("tests/settings-integrity-regression.test.mjs")
          settings_test = settings_test_path.read_text()
          settings_test = settings_test.replace(
              '  assert.match(notificationPanelSource, /Advanced task reminder schedule/);',
              '  assert.match(notificationPanelSource, /Delivery diagnostics/);\n  assert.doesNotMatch(notificationPanelSource, /TaskReminderSettingsCard/);'
          )
          settings_test = settings_test.replace(
              '  assert.match(notificationPanelSource, /Advanced delivery & task reminder tools/);',
              '  assert.match(notificationPanelSource, /Delivery diagnostics/);\n  assert.doesNotMatch(notificationPanelSource, /TaskReminderSettingsCard/);'
          )
          settings_test_path.write_text(settings_test)
          PY

      - name: Verify notification UI authority
        run: |
          node --test tests/notification-runtime-contracts.test.mjs
          node --test tests/settings-integrity-regression.test.mjs
          if grep -q 'TaskReminderSettingsCard' src/components/notifications/NotificationSettingsPanel.jsx; then
            echo "Nested TaskReminderSettingsCard is still present" >&2
            exit 1
          fi
          if grep -q 'Advanced delivery & task reminder tools' src/components/notifications/NotificationSettingsPanel.jsx; then
            echo "Old advanced task-reminder UI is still present" >&2
            exit 1
          fi

      - name: Commit repair and remove one-time verifier
        run: |
          git config user.name "CLARA Engineering"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/remove-duplicate-notification-task-ui.yml
          git add src/components/notifications/NotificationSettingsPanel.jsx tests/notification-runtime-contracts.test.mjs tests/settings-integrity-regression.test.mjs
          git commit -m "Remove duplicate task reminder UI from Notifications"
          git pull --rebase origin main
          git push origin HEAD:main
