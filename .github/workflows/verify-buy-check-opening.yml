name: Verify Buy Check Opening

on:
  push:
    branches:
      - fix/buy-check-opening-board

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify Buy Check copy in bundle
        shell: bash
        run: |
          grep -R -F "What do you want to buy?" dist/assets >/dev/null
          grep -R -F "Type the exact item for us to start." dist/assets >/dev/null
          grep -R -F "No judgment—just a clearer decision before your money leaves." dist/assets >/dev/null
          grep -R -F "Type the item you want to buy" dist/assets >/dev/null

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: buy-check-production-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
