name: Verify Add Income Header-Only Regression

on:
  push:
    branches:
      - main
    paths:
      - "src/components/fresh/main-dashboard/assistant/ClaraAddIncomeOverlayV2.jsx"
      - "src/components/fresh/main-dashboard/assistant/ClaraFinancialContextSetupCoordinator.jsx"
      - "src/lib/incomeHubRepository.js"
      - "src/runtime/installClaraPwaFreshness.js"
      - "public/clara-task-reminder-sw.js"
      - "vite.config.js"
      - "tests/clara-add-income-header-only-regression.mjs"
      - "tests/visual/clara-add-income-header-only-regression.html"
      - "tests/visual/clara-add-income-header-only-regression-harness.jsx"
      - ".github/workflows/verify-add-income-header-only.yml"
  pull_request:
    paths:
      - "src/components/fresh/main-dashboard/assistant/ClaraAddIncomeOverlayV2.jsx"
      - "src/components/fresh/main-dashboard/assistant/ClaraFinancialContextSetupCoordinator.jsx"
      - "src/lib/incomeHubRepository.js"
      - "src/runtime/installClaraPwaFreshness.js"
      - "public/clara-task-reminder-sw.js"
      - "vite.config.js"
      - "tests/clara-add-income-header-only-regression.mjs"
      - "tests/visual/clara-add-income-header-only-regression.html"
      - "tests/visual/clara-add-income-header-only-regression-harness.jsx"
      - ".github/workflows/verify-add-income-header-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_CLARA_RUNTIME_MODE: local_only
      VITE_CLARA_AUTH_ENABLED: "false"
      VITE_CLARA_LOCAL_MODE_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start real-component harness
        run: |
          npx vite --host 127.0.0.1 --port 4173 > /tmp/clara-add-income-vite.log 2>&1 &
          echo $! > /tmp/clara-add-income-vite.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/tests/visual/clara-add-income-header-only-regression.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clara-add-income-vite.log
          exit 1

      - name: Run Add Income browser regression
        env:
          CLARA_VISUAL_BASE_URL: http://127.0.0.1:4173
        run: node tests/clara-add-income-header-only-regression.mjs

      # Compile the same Vite path Vercel uses and provide the Vercel commit env
      # explicitly so release-freshness assets are tested as production artifacts.
      - name: Compile production Vite bundle
        env:
          VERCEL_GIT_COMMIT_SHA: pwa-regression-build-sha
        run: npx vite build --base=./

      - name: Verify stamped PWA production assets
        env:
          EXPECTED_CLARA_BUILD_ID: pwa-regression-build-sha
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const expected = process.env.EXPECTED_CLARA_BUILD_ID;
          const swPath = "dist/clara-task-reminder-sw.js";
          const infoPath = "dist/build-info.json";
          if (!fs.existsSync(swPath)) throw new Error("production service worker is missing");
          if (!fs.existsSync(infoPath)) throw new Error("production build-info.json is missing");
          const sw = fs.readFileSync(swPath, "utf8");
          if (sw.includes("__CLARA_APP_BUILD__")) {
            throw new Error("production service worker still contains unresolved build marker");
          }
          if (!sw.includes(expected)) {
            throw new Error("production service worker does not contain the expected build id");
          }
          if (!sw.includes('const CLARA_UNSTAMPED_BUILD_PREFIX = "__CLARA_";')) {
            throw new Error("production service worker lost unresolved-build safety guard");
          }
          const info = JSON.parse(fs.readFileSync(infoPath, "utf8"));
          if (info.commit !== expected) {
            throw new Error(`build-info commit mismatch: ${info.commit}`);
          }
          console.log(`Verified stamped PWA production assets for ${expected}.`);
          NODE
