name: Fix budget draft completion
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-budget-draft-completion.yml
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep incomplete budgets in setup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/MonthlyBudgetPlan.jsx')
          source = path.read_text()
          old = '  const showCurrentPlan = budgetOptions.length > 0 && !editingCategory;'
          new = '  const showCurrentPlan = Boolean(monthlyBudgetHeader) && budgetOptions.length > 0 && !editingCategory;'

          if old not in source:
              raise SystemExit('Expected budget manager condition was not found.')

          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-budget-draft-completion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Keep incomplete budget plans in guided setup" && git push)
