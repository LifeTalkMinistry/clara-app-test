name: Apply Emergency Allocation Delete Patch

on:
  push:
    branches:
      - fix/budget-reset-boundary

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Emergency Fund allocation delete fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/budget-reset-boundary
          fetch-depth: 0

      - name: Apply surgical code patch
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = Path(path).read_text()
              if old not in text:
                  raise SystemExit(f"Pattern not found in {path}:\n{old}")
              Path(path).write_text(text.replace(old, new, 1))

          # TransactionHub.jsx — import helper and route Emergency Fund Allocation before group routing.
          hub = Path('src/pages/TransactionHub.jsx')
          text = hub.read_text()
          if 'isEmergencyFundAllocation,' not in text:
              text = text.replace(
                  '  isDeletedRecord,\n  isJsonLike,',
                  '  isDeletedRecord,\n  isEmergencyFundAllocation,\n  isJsonLike,',
                  1,
              )
          text = text.replace(
              '''    const rawId = getEditableRawId(selectedTransaction);\n\n    if (!rawId) {\n      setEditError("This transaction is missing its original ID and cannot be deleted safely.");\n      return;\n    }\n\n    const confirmCopy =\n      selectedTransaction.group === "transfer"''',
              '''    const rawId = getEditableRawId(selectedTransaction);\n\n    if (!rawId) {\n      setEditError("This transaction is missing its original ID and cannot be deleted safely.");\n      return;\n    }\n\n    const isEmergencyAllocation = isEmergencyFundAllocation(selectedTransaction);\n\n    const confirmCopy =\n      isEmergencyAllocation\n        ? "Delete this Emergency Fund allocation? This will remove the transaction, return the amount to the source wallet, and reduce your Emergency Fund balance."\n        : selectedTransaction.group === "transfer"''',
              1,
          )
          text = text.replace(
              '''      if (selectedTransaction.group === "expense") {\n        if (typeof financial.deleteExpense !== "function") {''',
              '''      if (isEmergencyAllocation) {\n        if (typeof financial.deleteEmergencyFundAllocation !== "function") {\n          throw new Error("Emergency Fund allocation delete handler is not available.");\n        }\n\n        await financial.deleteEmergencyFundAllocation(selectedTransaction);\n        setNotice(\n          "Emergency Fund allocation deleted. Wallet and Emergency Fund balance were reversed."\n        );\n        setIsEditOpen(false);\n        setSelectedTransaction(null);\n        setEditForm(buildEditFormFromTransaction(null));\n        setEditError("");\n        return;\n      }\n\n      if (selectedTransaction.group === "expense") {\n        if (typeof financial.deleteExpense !== "function") {''',
              1,
          )
          hub.write_text(text)

          # useFinancialData.js — make the Emergency Fund reversal explicit and non-recursive.
          hook = Path('src/hooks/useFinancialData.js')
          text = hook.read_text()
          text = text.replace(
              '''      if (!removedFallback) {\n        const entryAmount = Math.abs(toNumber(item?.amount ?? item?.value ?? item?.total ?? 0));''',
              '''      if (!safeActivityId && !removedFallback) {\n        const entryAmount = Math.abs(toNumber(item?.amount ?? item?.value ?? item?.total ?? 0));''',
              1,
          )
          text = text.replace(
              '''        const repairedEmergencyFund = await repairDeletedEmergencyAllocationOrphans(\n          localUserId,\n          rawEmergencyFund,\n          rawExpenses\n        );\n        const nextCache = buildSafeCache({ rawExpenses, rawWallets, rawWalletTransactions, rawTransfers, rawBudgets, rawSavingsGoals, rawEmergencyFund: repairedEmergencyFund });''',
              '''        const nextCache = buildSafeCache({ rawExpenses, rawWallets, rawWalletTransactions, rawTransfers, rawBudgets, rawSavingsGoals, rawEmergencyFund: rawEmergencyFund || null });''',
              1,
          )
          text = text.replace(
              '''  const deleteEmergencyFundAllocation = useCallback(async (transaction) => {\n    const raw = transaction?.raw || transaction || {};\n    const amount = Math.abs(toNumber(raw.amount ?? transaction?.amount ?? transaction?.signedAmount ?? raw.signedAmount ?? 0));\n    const expenseId = readFirstText(raw, ["id", "expense_id", "expenseId", "local_id", "localId"]);\n    const activityId = readFirstText(\n      { ...(transaction || {}), ...(raw || {}) },\n      EMERGENCY_LINK_KEYS\n    );\n\n    if (!expenseId) throw new Error("Emergency Fund allocation is missing its linked expense id.");\n    if (!Number.isFinite(amount) || amount <= 0) throw new Error("Emergency Fund allocation amount is invalid.");\n\n    await deleteExpenseRecord(expenseId);\n\n    const now = new Date().toISOString();\n    const liveEmergencyFund = emergencyFund || {};''',
              '''  const deleteEmergencyFundAllocation = useCallback(async (transaction) => {\n    const raw = transaction?.raw || transaction || {};\n    const lookup = { ...(transaction || {}), ...(raw || {}) };\n    const amount = Math.abs(\n      toNumber(raw.amount ?? transaction?.amount ?? raw.signedAmount ?? transaction?.signedAmount ?? 0)\n    );\n    const expenseId = readFirstText(lookup, [\n      "id",\n      "rawId",\n      "expense_id",\n      "expenseId",\n      "local_id",\n      "localId",\n    ]);\n    const activityId = readFirstText(lookup, EMERGENCY_LINK_KEYS);\n\n    if (!expenseId) throw new Error("Emergency Fund allocation is missing its linked expense id.");\n    if (!Number.isFinite(amount) || amount <= 0) throw new Error("Emergency Fund allocation amount is invalid.");\n\n    await deleteExpenseRecord(expenseId);\n\n    const now = new Date().toISOString();\n    const liveEmergencyFund = (await getEmergencyFund(localUserId)) || emergencyFund || {};''',
              1,
          )
          text = text.replace(
              '''  const deleteExpense = useCallback(async (id) => {\n    if (!id) throw new Error("Expense id is required.");\n    const existing = await getLocalRecordById(EXPENSE_STORE, id, localUserId);\n\n    if (existing && isEmergencyFundAllocationRecord(existing)) {\n      return deleteEmergencyFundAllocation(existing);\n    }\n\n    return deleteExpenseRecord(id);\n  }, [deleteEmergencyFundAllocation, deleteExpenseRecord, localUserId]);''',
              '''  const deleteExpense = useCallback(async (id) => {\n    if (!id) throw new Error("Expense id is required.");\n    return deleteExpenseRecord(id);\n  }, [deleteExpenseRecord]);''',
              1,
          )
          marker = '''  const deleteExpense = useCallback(async (id) => {\n    if (!id) throw new Error("Expense id is required.");\n    return deleteExpenseRecord(id);\n  }, [deleteExpenseRecord]);\n\n'''
          repair_fn = '''  const repairEmergencyFundAllocationBalance = useCallback(async () => {\n    const [rawExpenses, liveEmergencyFund] = await Promise.all([\n      getExpenses(localUserId),\n      getEmergencyFund(localUserId),\n    ]);\n\n    if (!liveEmergencyFund) {\n      return { repaired: false, reason: "No Emergency Fund record found." };\n    }\n\n    const activeAllocations = removeDeletedRows(rawExpenses).filter(isEmergencyFundAllocationRecord);\n    const primaryActivity = getEmergencyActivitySource(liveEmergencyFund);\n    const allocationActivity = primaryActivity.filter(isEmergencyAllocationActivity);\n    const hasUnsafeHistory = primaryActivity.some((item) => !isEmergencyAllocationActivity(item));\n\n    if (activeAllocations.length > 0) {\n      return { repaired: false, reason: "Active Emergency Fund allocations still exist." };\n    }\n\n    if (!primaryActivity.length || !allocationActivity.length || hasUnsafeHistory) {\n      return { repaired: false, reason: "Emergency Fund history is not safe for automatic repair." };\n    }\n\n    const activeAllocationIds = buildActiveEmergencyAllocationIdSet(rawExpenses);\n    const orphanedAllocations = allocationActivity.filter((item) =>\n      isOrphanedEmergencyAllocationActivity(item, activeAllocationIds)\n    );\n\n    if (orphanedAllocations.length !== allocationActivity.length) {\n      return { repaired: false, reason: "Some allocation activity still matches active expenses." };\n    }\n\n    const now = new Date().toISOString();\n    const payload = {\n      ...liveEmergencyFund,\n      savedAmount: 0,\n      saved_amount: 0,\n      currentAmount: 0,\n      current_amount: 0,\n      amount: 0,\n      balance: 0,\n      moneyLeft: 0,\n      protectedBalance: 0,\n      protected_balance: 0,\n      reserveBalance: 0,\n      reserve_balance: 0,\n      emergencyActivityLog: [],\n      emergency_activity_log: [],\n      activityLog: [],\n      activity_log: [],\n      usageLog: [],\n      usage_log: [],\n      lastTopUpAmount: null,\n      last_top_up_amount: null,\n      updatedAt: now,\n      updated_at: now,\n      emergencyAllocationRepairAt: now,\n      emergency_allocation_repair_at: now,\n    };\n\n    await repoUpsertEmergencyFund(localUserId, payload);\n    await refreshData();\n    dispatchFinanceUpdateEvents();\n\n    return {\n      repaired: true,\n      nextEmergencySaved: 0,\n      removedActivityCount: orphanedAllocations.length,\n    };\n  }, [localUserId, refreshData]);\n\n'''
          if 'const repairEmergencyFundAllocationBalance = useCallback' not in text:
              text = text.replace(marker, marker + repair_fn, 1)
          text = text.replace(
              '''    updateEmergencyFund, deleteEmergencyFundAllocation,''',
              '''    updateEmergencyFund, deleteEmergencyFundAllocation, repairEmergencyFundAllocationBalance,''',
              1,
          )
          hook.write_text(text)

          # TransactionCard.jsx — enforce no group mutation workaround.
          card = Path('src/components/fresh/transaction-hub/ui/TransactionCard.jsx')
          text = card.read_text().replace(
              'onEdit?.(isEmergencyAllocation ? { ...item, group: "expense" } : item);',
              'onEdit?.(item);',
          )
          card.write_text(text)
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-emergency-allocation-delete-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/TransactionHub.jsx src/hooks/useFinancialData.js src/components/fresh/transaction-hub/ui/TransactionCard.jsx .github/workflows/apply-emergency-allocation-delete-patch.yml
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
          else
            git commit -m "Apply Emergency Fund allocation delete fix"
            git push origin HEAD:fix/budget-reset-boundary
          fi
