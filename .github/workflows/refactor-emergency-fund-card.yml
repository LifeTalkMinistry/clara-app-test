name: Refactor Emergency Fund card flow

on:
  push:
    branches:
      - fix/emergency-fund-card-flow
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/emergency-fund-card-flow
          fetch-depth: 0

      - name: Apply Emergency Fund card refactor
        run: python3 .github/scripts/refactor-emergency-fund-card.py

      - name: Install dependencies
        run: npm ci || npm ci

      - name: Run focused Emergency Fund regression
        run: node --test tests/emergency-fund-card-flow-regression.test.mjs

      - name: Run full regression and production build
        run: npm run build

      - name: Commit verified Emergency Fund refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Emergency Fund changes were produced."
            exit 0
          fi
          git commit -m "Refactor Emergency Fund card flow"
          git pull --rebase origin fix/emergency-fund-card-flow
          git push origin HEAD:fix/emergency-fund-card-flow
