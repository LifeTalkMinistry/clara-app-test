name: Apply CLARA PDF wrapper fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/clara-pdf-wrapper-fix.yml"

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply the one-line wrapper correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx")
          old = '                    <div className="w-max min-w-full">'
          new = '                    <div className={isPdfZoomed ? "w-max min-w-full" : "w-full"}>'
          text = path.read_text(encoding="utf-8")
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one target wrapper; found {count}.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git diff --check
          test "$(git diff --name-only)" = "src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build web app
        run: npm run build:web

      - name: Commit validated correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx
          git commit -m "Fix PDF fit-page wrapper centering"
          git push origin HEAD:main
