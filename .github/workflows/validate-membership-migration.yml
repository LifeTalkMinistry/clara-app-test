name: Validate membership migration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply migration
        run: node scripts/apply-membership-migration.mjs
      - name: Install dependencies
        run: npm ci
      - name: Package changed files
        shell: bash
        run: |
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > membership-files.txt
          test -s membership-files.txt
          zip -q membership-validated.zip -@ < membership-files.txt
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: membership-validated
          path: |
            membership-validated.zip
            membership-files.txt
          retention-days: 1
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: validation-placeholder
          VITE_GEMINI_API_KEY: validation-placeholder
