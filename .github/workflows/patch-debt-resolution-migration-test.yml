name: Patch debt resolution migration regression

on:
  push:
    branches: [fix/debt-occurrence-user-resolution]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/debt-occurrence-user-resolution
          fetch-depth: 0
      - name: Update migration expectation
        shell: python
        run: |
          from pathlib import Path
          p = Path("tests/device-transfer-financial-context-integration.test.mjs")
          text = p.read_text()
          marker = 'await t.test("Test G — Debt payment history, Wallet effect, and fulfillment survive without replay"'
          start = text.find(marker)
          if start < 0:
              raise SystemExit("Debt migration Test G marker not found")
          before = text[:start]
          section = text[start:]
          old_remaining = 'assert.equal(before.remainingPlannedSpending, 1800);'
          old_fulfilled = 'assert.equal(before.requirements[0].fulfilledAmount, 1200);'
          if old_remaining not in section or old_fulfilled not in section:
              raise SystemExit("Debt migration Test G assertions not found")
          section = section.replace(old_remaining, 'assert.equal(before.remainingPlannedSpending, 0);', 1)
          section = section.replace(
              old_fulfilled,
              old_fulfilled + '\n    assert.equal(before.requirements[0].waivedAmount, 1800);',
              1,
          )
          p.write_text(before + section)
          Path(".github/workflows/patch-debt-resolution-migration-test.yml").unlink()
      - name: Commit regression update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align debt migration regression with resolved occurrence semantics"
          git push origin HEAD:fix/debt-occurrence-user-resolution
