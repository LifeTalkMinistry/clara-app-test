name: Patch debt resolution migration regression

on:
  push:
    branches: [fix/debt-occurrence-user-resolution]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/debt-occurrence-user-resolution
          fetch-depth: 0
      - name: Update migration expectation
        shell: python
        run: |
          from pathlib import Path
          p = Path("tests/device-transfer-financial-context-integration.test.mjs")
          text = p.read_text()
          old = '    const { before, result } = await transferCurrentState();\n    assert.equal(before.remainingPlannedSpending, 1800);\n    assert.equal(before.requirements[0].fulfilledAmount, 1200);'
          new = '    const { before, result } = await transferCurrentState();\n    assert.equal(before.remainingPlannedSpending, 0);\n    assert.equal(before.requirements[0].fulfilledAmount, 1200);\n    assert.equal(before.requirements[0].waivedAmount, 1800);'
          if old not in text:
              raise SystemExit("Debt migration assertion target not found")
          p.write_text(text.replace(old, new, 1))
          Path(".github/workflows/patch-debt-resolution-migration-test.yml").unlink()
      - name: Commit regression update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align debt migration regression with resolved occurrence semantics"
          git push origin HEAD:fix/debt-occurrence-user-resolution
