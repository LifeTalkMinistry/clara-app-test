name: Patch dashboard finance overview state

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard-finance-overview-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardFinanceOverviewState into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardFinanceOverviewState from "@/components/fresh/main-dashboard/finance-content/useDashboardFinanceOverviewState";\n'
          import_anchor = 'import useDashboardFinanceStateSync from "@/components/fresh/main-dashboard/finance-content/useDashboardFinanceStateSync";\n'
          fallback_anchor = 'import useDashboardVisibleFinanceData from "@/components/fresh/main-dashboard/finance-content/useDashboardVisibleFinanceData";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Finance overview import anchor not found.")

          hook_block = (
              '  const {\n'
              '    topWallet,\n'
              '    walletPreviewTransactions,\n'
              '    activeBudget,\n'
              '    derivedActiveBudget,\n'
              '    totalSavingsTarget,\n'
              '    totalSavingsSaved,\n'
              '    primarySavingsGoal,\n'
              '  } = useDashboardFinanceOverviewState({\n'
              '    wallets,\n'
              '    walletTransactions,\n'
              '    budgets,\n'
              '    expenses,\n'
              '    savingsGoals,\n'
              '  });\n\n'
          )

          if 'useDashboardFinanceOverviewState({' not in text:
              start_token = '  const topWallet = useMemo(() => wallets[0] || null, [wallets]);\n'
              end_token = '  const claraAssistantContext = useMemo(() => {'
              start = text.find(start_token)
              end = text.find(end_token, start)

              if start == -1:
                  raise SystemExit("Finance overview block start not found.")
              if end == -1:
                  raise SystemExit("Finance overview block end not found.")

              old_block = text[start:end]
              required = [
                  'walletPreviewTransactions',
                  'activeBudget',
                  'derivedActiveBudget',
                  'totalSavingsTarget',
                  'totalSavingsSaved',
                  'primarySavingsGoal',
              ]

              if not all(token in old_block for token in required):
                  raise SystemExit("Finance overview block content mismatch.")

              text = text[:start] + hook_block + text[end:]

          if 'useDashboardFinanceOverviewState({' not in text:
              raise SystemExit("Finance overview hook was not wired.")
          if 'const topWallet = useMemo(() => wallets[0] || null, [wallets]);' in text:
              raise SystemExit("Old topWallet memo still exists.")
          if 'const derivedActiveBudget = useMemo(() => {' in text:
              raise SystemExit("Old derivedActiveBudget memo still exists.")
          if 'const totalSavingsTarget = useMemo(' in text:
              raise SystemExit("Old savings aggregate memo still exists.")

          Path('.github/workflows/patch-dashboard-finance-overview-state.yml').unlink(missing_ok=True)
          target.write_text(text)
          PY

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-dashboard-finance-overview-state.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Wire dashboard finance overview state hook"
          git push
