name: Settings visual authority cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/settings-visual-authority-cleanup.py"
      - ".github/workflows/settings-visual-authority-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cleanup
        run: python .github/scripts/settings-visual-authority-cleanup.py

      - name: Commit cleanup
        run: |
          git config user.name "CLARA Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete Settings visual authority cleanup"
          git push origin HEAD:main

      - name: Run Settings regressions
        run: |
          node --test \
            tests/canonical-display-name-authority.test.mjs \
            tests/settings-local-only-regression.test.mjs \
            tests/settings-integrity-regression.test.mjs \
            tests/settings-top-spacing.test.mjs \
            tests/settings-visual-authority.test.mjs \
            tests/dashboard-top-nav-ownership.test.mjs
