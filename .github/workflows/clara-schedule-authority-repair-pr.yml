name: CLARA Schedule Authority Repair PR Runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.head_ref == 'fix/calendar-financial-derived-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calendar-financial-derived-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Execute surgical repair script from bootstrap workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/clara-schedule-authority-repair.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'clara-schedule-authority-repair.py', 'exec'))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused Schedule regression suite
        run: >-
          node --test
          tests/financial-card-calendar-projection-regression.test.mjs
          tests/stable-income-calendar-year-projection.test.mjs
          tests/debt-obligation-integrity.test.mjs
          tests/savings-goal-card-flow-regression.test.mjs

      - name: Run full project tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Review diff scope
        run: |
          git status --short
          git diff --check
          git diff --stat

      - name: Commit verified repair
        shell: bash
        run: |
          rm -f .github/workflows/clara-schedule-authority-repair.yml
          rm -f .github/workflows/clara-schedule-authority-repair-pr.yml
          git config user.name "CLARA Principal Engineer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Repair Schedule financial projection authority"
          git push origin HEAD:fix/calendar-financial-derived-state
