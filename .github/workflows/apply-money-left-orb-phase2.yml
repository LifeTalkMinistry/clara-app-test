name: Apply Money Left Orb Guide Phase 2

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: money-left-orb-phase2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-build-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'money-left-orb-guide-phase2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Restore reviewed Phase 2 patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scripts
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/e80c184d352af75aaa25e97c74d705947edcf4c2 --jq .content \
            | tr -d '\n' \
            | base64 -d \
            > scripts/apply_money_left_orb_phase2.py

      - name: Normalize cancellation block for strict patching
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/components/fresh/main-dashboard/money-summary/DashboardMoneySummaryStable.jsx")
          text = path.read_text()
          old = (
              "  const handleOrbCancel = useCallback(\n"
              "    (event) => {\n"
              "      stopOrbEvent(event);\n\n"
              "      if (!isGuideMode) {"
          )
          new = (
              "  const handleOrbCancel = useCallback(\n"
              "    (event) => {\n"
              "      stopOrbEvent(event);\n"
              "      // Cancellation remains isolated from Guide Mode completion.\n\n"
              "      if (!isGuideMode) {"
          )
          if text.count(old) != 1:
              raise SystemExit(f"Expected one cancel block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply Phase 2
        run: python3 scripts/apply_money_left_orb_phase2.py

      - name: Check patch formatting
        run: git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Commit verified Phase 2
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm -f scripts/apply_money_left_orb_phase2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Money Left orb Guide Phase 2"
          git push origin HEAD:${HEAD_BRANCH}
