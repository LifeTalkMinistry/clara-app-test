name: CLARA remove book page transitions validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - docs/clara-remove-book-transitions.txt
      - .github/workflows/clara-remove-book-transitions-once.yml

permissions:
  contents: write

jobs:
  simplify-validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch quietly
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone --quiet --depth 1 --branch "$HEAD_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo

      - name: Extract and run the surgical cleanup
        working-directory: repo
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/clara-remove-book-transitions-once.yml").read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          final_cleanup = r'''
          source = re.sub(
              r'className=\{`w-full transition-\[opacity,transform\][\s\S]*?`\}',
              'className="book-page w-full opacity-100 transform-none animate-none transition-none"',
              source,
              count=1,
          )
          source = source.replace("pdfPageTurnLockRef.current", "false")
          source = re.sub(r'\s*\|\|\s*false', '', source)
          source = re.sub(r'false\s*\|\|\s*', '', source)
          source = re.sub(
              r'\n\s*if \(false\) \{\n(?:\s+.*\n){1,5}\s*\}',
              '',
              source,
          )
          source = re.sub(r'\n\s*if \(false\) return;', '', source)
          '''
          script = "import re\n" + script
          script = script.replace("forbidden = [", final_cleanup + "\nforbidden = [", 1)
          Path("/tmp/remove-book-transitions.py").write_text(script + "\n")
          PY
          python /tmp/remove-book-transitions.py

      - name: Install dependencies
        working-directory: repo
        run: npm ci

      - name: Lint shared reader
        working-directory: repo
        run: npx eslint src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx

      - name: Build application
        working-directory: repo
        run: npm run build

      - name: Verify focused diff
        working-directory: repo
        shell: bash
        run: |
          git diff --check
          test -z "$(git diff --name-only -- package.json package-lock.json)"
          test "$(grep -c '<Page' src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx)" = "1"
          ! grep -E 'carousel|boundarySnapshot|pendingGlobalPageIndex|transitionLockRef|pdfPageTurnLockRef|onTransitionEnd|translate3d|isVisible|transition-\[opacity,transform\]' src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx

      - name: Commit validated reader correction
        working-directory: repo
        shell: bash
        run: |
          rm -f docs/clara-remove-book-transitions.txt
          rm -f docs/reader-check-revision.txt
          rm -f .github/workflows/clara-remove-book-transitions-once.yml
          rm -f .github/workflows/clara-two-layer-pdf-transition.yml
          git config user.name "CLARA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx .github/workflows/clara-two-layer-pdf-transition.yml .github/workflows/clara-remove-book-transitions-once.yml docs/clara-remove-book-transitions.txt docs/reader-check-revision.txt
          git commit -m "fix(learning-hub): remove book page transitions [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
