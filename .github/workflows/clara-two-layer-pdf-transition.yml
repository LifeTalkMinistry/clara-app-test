name: Validate CLARA PDF white flash fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - docs/clara-pdf-final-validation.txt

permissions:
  contents: write

jobs:
  build-validate-and-commit:
    if: github.event.pull_request.head.ref == 'clara-pdf-geometry-stability'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
          persist-credentials: true

      - name: Apply stable per-document PDF geometry
        shell: bash
        run: |
          test -f docs/clara-pdf-final-validation.txt
          python <<'PY'
          from pathlib import Path

          path = Path('src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx')
          text = path.read_text(encoding='utf-8')

          old_effect = '''  useEffect(() => {
    if (!isOpen) return;
    setIsReaderMenuOpen(false);
    resetPdfToFit({ announce: false });
    setPdfPageAspectRatio(0);
    scrollToTop();
  }, [
    activePdfPath,
    isOpen,
    material?.id,
    pdfReloadKey,
    resetPdfToFit,
    safePageIndex,
    scrollToTop,
  ]);'''

          new_effect = '''  useEffect(() => {
    if (!isOpen) return;
    setIsReaderMenuOpen(false);
    resetPdfToFit({ announce: false });
    setPdfPageAspectRatio(0);
    scrollToTop();
  }, [
    activePdfPath,
    isOpen,
    material?.id,
    pdfReloadKey,
    resetPdfToFit,
    scrollToTop,
  ]);'''

          old_aspect = '''    setPdfPageAspectRatio((currentAspectRatio) =>
      Math.abs(currentAspectRatio - nextAspectRatio) < 0.001
        ? currentAspectRatio
        : nextAspectRatio,
    );'''

          new_aspect = '''    setPdfPageAspectRatio((currentAspectRatio) =>
      currentAspectRatio > 0 ? currentAspectRatio : nextAspectRatio,
    );'''

          if text.count(old_effect) != 1:
              raise RuntimeError('Expected exactly one page-reset effect')
          if text.count(old_aspect) != 1:
              raise RuntimeError('Expected exactly one aspect-ratio updater')

          text = text.replace(old_effect, new_effect, 1)
          text = text.replace(old_aspect, new_aspect, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build web application
        run: npm run build:web

      - name: Commit validated implementation
        shell: bash
        run: |
          git diff --check
          rm -f docs/clara-pdf-final-validation.txt
          git config user.name "CLARA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx docs/clara-pdf-final-validation.txt
          git commit -m "fix: prevent white PDF canvas flash after page changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
