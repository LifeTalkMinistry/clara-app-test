name: CLARA two-layer PDF transition final validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .clara-pr-final-trigger

permissions:
  contents: write

jobs:
  build-validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Restore surgical component
        shell: bash
        run: |
          test -f .clara-pr-final-trigger
          git fetch origin automation/clara-two-layer-pdf-transition --quiet
          git show origin/automation/clara-two-layer-pdf-transition:.clara-two-layer-payload.gz.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/LearningMaterialModal.jsx
          test -s /tmp/LearningMaterialModal.jsx
          mv /tmp/LearningMaterialModal.jsx src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build validation 1
        run: npm run build

      - name: Build validation 2
        run: npm run build

      - name: Confirm final one-file diff
        shell: bash
        run: |
          rm -f .clara-pr-final-trigger
          git diff --check
          test -z "$(git diff --name-only -- package.json package-lock.json)"
          git fetch origin main --quiet
          changed="$(git diff --name-only origin/main)"
          test "$changed" = "src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx"
          unexpected="$(git status --short | sed 's/^...//' | grep -Ev '^(src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx|.clara-pr-final-trigger)$' || true)"
          test -z "$unexpected"

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "CLARA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx .clara-pr-final-trigger
          git commit -m "Fix PDF transition with two rendered layers [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
