name: CLARA two-layer PDF transition finalizer

on:
  push:
    branches:
      - main
    paths:
      - .clara-direct-two-layer-trigger

permissions:
  contents: write

jobs:
  build-validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Restore surgical component
        shell: bash
        run: |
          test -f .clara-direct-two-layer-trigger
          git fetch origin automation/clara-two-layer-pdf-transition --quiet
          git show origin/automation/clara-two-layer-pdf-transition:.clara-two-layer-payload.gz.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/LearningMaterialModal.jsx
          test -s /tmp/LearningMaterialModal.jsx
          mv /tmp/LearningMaterialModal.jsx src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build validation 1
        run: npm run build

      - name: Build validation 2
        run: npm run build

      - name: Confirm final one-file tree
        shell: bash
        run: |
          rm -f .clara-direct-two-layer-trigger .github/workflows/clara-two-layer-pdf-transition.yml
          git diff --check
          test -z "$(git diff --name-only -- package.json package-lock.json)"
          changed="$(git diff --name-only 65e3aa7688fac80eb8976c599d7b4b13ebad53b5)"
          test "$changed" = "src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx"

      - name: Commit final implementation
        shell: bash
        run: |
          git config user.name "CLARA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx .clara-direct-two-layer-trigger .github/workflows/clara-two-layer-pdf-transition.yml
          git commit -m "Fix PDF transition with two rendered layers"
          git push origin HEAD:main
