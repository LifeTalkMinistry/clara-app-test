name: CLARA remove book page transitions validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - docs/clara-remove-book-transitions.txt
      - .github/workflows/clara-remove-book-transitions-once.yml

permissions:
  contents: write

jobs:
  simplify-validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Extract and run the surgical cleanup
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/clara-remove-book-transitions-once.yml").read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          Path("/tmp/remove-book-transitions.py").write_text(script + "\n")
          PY
          python /tmp/remove-book-transitions.py

      - name: Install dependencies
        run: npm ci

      - name: Lint shared reader
        run: npx eslint src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx

      - name: Build application
        run: npm run build

      - name: Verify focused diff
        shell: bash
        run: |
          git diff --check
          test -z "$(git diff --name-only -- package.json package-lock.json)"
          test "$(grep -c '<Page' src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx)" = "1"
          ! grep -E 'carousel|boundarySnapshot|pendingGlobalPageIndex|transitionLockRef|pdfPageTurnLockRef|onTransitionEnd|translate3d' src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx

      - name: Commit validated reader correction
        shell: bash
        run: |
          rm -f docs/clara-remove-book-transitions.txt
          rm -f .github/workflows/clara-remove-book-transitions-once.yml
          rm -f .github/workflows/clara-two-layer-pdf-transition.yml
          git config user.name "CLARA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx .github/workflows/clara-two-layer-pdf-transition.yml .github/workflows/clara-remove-book-transitions-once.yml docs/clara-remove-book-transitions.txt
          git commit -m "fix(learning-hub): remove book page transitions [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
