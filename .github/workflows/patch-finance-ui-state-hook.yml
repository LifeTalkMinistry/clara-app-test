name: Patch finance UI state hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-finance-ui-state-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardFinanceUiState into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardFinanceUiState from "@/components/fresh/main-dashboard/finance-form/useDashboardFinanceUiState";\n'
          import_anchor = 'import createInitialFinanceForm from "@/components/fresh/main-dashboard/finance-form/financeFormInitialState";\n'
          fallback_anchor = 'import useBudgetListDropdownDismiss from "@/components/fresh/main-dashboard/finance-form/useBudgetListDropdownDismiss";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Finance UI state import anchor not found. Refusing to patch Dashboard.jsx.")

          finance_ui_block = (
              '  const {\n'
              '    financeActionLoading,\n'
              '    setFinanceActionLoading,\n'
              '    financeNotice,\n'
              '    setFinanceNotice,\n'
              '    financeModal,\n'
              '    setFinanceModal,\n'
              '    budgetExitConfirm,\n'
              '    setBudgetExitConfirm,\n'
              '    budgetListOpen,\n'
              '    setBudgetListOpen,\n'
              '  } = useDashboardFinanceUiState();\n'
          )

          state_lines = [
              '  const [financeActionLoading, setFinanceActionLoading] = useState(false);\n',
              '  const [financeNotice, setFinanceNotice] = useState(null);\n',
              '  const [financeModal, setFinanceModal] = useState({ type: null, payload: null });\n',
              '  const [budgetExitConfirm, setBudgetExitConfirm] = useState(false);\n',
              '  const [budgetListOpen, setBudgetListOpen] = useState(false);\n',
          ]

          if finance_ui_block not in text:
              insert_line = state_lines[0]
              if insert_line not in text:
                  raise SystemExit("Finance UI state insertion point not found. Refusing to patch Dashboard.jsx.")
              text = text.replace(insert_line, finance_ui_block, 1)

          for old_line in state_lines[1:]:
              if old_line in text:
                  text = text.replace(old_line, '', 1)

          if 'useDashboardFinanceUiState();' not in text:
              raise SystemExit("useDashboardFinanceUiState was not wired. Refusing to continue.")

          for old_line in state_lines:
              if old_line in text:
                  raise SystemExit(f"Old finance UI state line still exists after patch: {old_line.strip()}")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-finance-ui-state-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-finance-ui-state-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire dashboard finance UI state hook"
          git push
