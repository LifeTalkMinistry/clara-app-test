name: P0-F14 Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/free-core-access-authority.test.mjs"
      - "package.json"
      - ".github/workflows/coaching-scheduling-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run P0-F14 regression suite
        run: node --test tests/free-core-access-authority.test.mjs

      - name: Run Buy Check lint suite
        run: npm run lint:buy-check

      - name: Build production app
        id: production_build
        continue-on-error: true
        run: npm run build > p0-f14-build.log 2>&1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-f14-build-log
          path: p0-f14-build.log
          retention-days: 1

      - name: Fail when production build fails
        if: steps.production_build.outcome == 'failure'
        run: |
          cat p0-f14-build.log
          exit 1
