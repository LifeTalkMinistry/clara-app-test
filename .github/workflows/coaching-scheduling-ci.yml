name: Apply Add Income Lifecycle Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/coaching-scheduling-ci.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/add-income-header-only-20260903

      - name: Patch first invalid Add Income transition
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/components/fresh/main-dashboard/assistant/ClaraAddIncomeOverlayV2.jsx")
          text = path.read_text()

          old_show = '''    const show = () => {
      if (token !== sequenceTokenRef.current) return;
      setTypedText("");
      setPendingMessage(chatMessage("assistant", nextText));
    };'''
          new_show = '''    const show = () => {
      if (token !== sequenceTokenRef.current) return;
      setTypedText("");
      setPendingMessage(chatMessage("assistant", nextText));
      setPhase("responding");
    };'''
          if old_show in text:
              text = text.replace(old_show, new_show, 1)
          elif new_show not in text:
              raise SystemExit("queueNextAssistantMessage show() target not found")

          old_sequence = '''    sequenceRef.current = replies;
    sequencePhaseRef.current = nextPhase;
    setPhase("responding");
    setInteractionReady(false);'''
          new_sequence = '''    sequenceRef.current = replies;
    sequencePhaseRef.current = nextPhase;
    setInteractionReady(false);'''
          if old_sequence in text:
              text = text.replace(old_sequence, new_sequence, 1)
          elif new_sequence not in text:
              raise SystemExit("runAssistantSequence target not found")

          constant = 'const EMPTY_RESPONDING_RECOVERY_MS = 1000;\n'
          anchor = 'const INCOME_OPEN_TIMEOUT_MS = 5000;\n'
          if constant not in text:
              if anchor not in text:
                  raise SystemExit("opening timeout anchor not found")
              text = text.replace(anchor, anchor + constant, 1)

          guard = '''  useEffect(() => {
    if (
      !isActive ||
      phase !== "responding" ||
      messages.length !== 0 ||
      pendingMessage ||
      busy
    ) {
      return undefined;
    }

    // Secondary invariant guard only: normal sequencing enters responding only
    // when a pending assistant turn is already renderable.
    const recoveryTimer = window.setTimeout(() => {
      void loadSourcesAndStart();
    }, EMPTY_RESPONDING_RECOVERY_MS);

    return () => window.clearTimeout(recoveryTimer);
  }, [isActive, phase, messages.length, pendingMessage, busy]);

'''
          cleanup_anchor = '''  useEffect(
    () => () => {
      openingAttemptRef.current += 1;
      sequenceTokenRef.current += 1;
      clearPacingTimers();
    },
    []
  );'''
          if guard not in text:
              if cleanup_anchor not in text:
                  raise SystemExit("cleanup effect anchor not found")
              text = text.replace(cleanup_anchor, guard + cleanup_anchor, 1)

          path.write_text(text)
          PY

      - name: Verify focused diff
        run: |
          git diff --check
          git diff -- src/components/fresh/main-dashboard/assistant/ClaraAddIncomeOverlayV2.jsx

      - name: Commit repair if needed
        run: |
          if git diff --quiet; then
            echo "Repair already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/assistant/ClaraAddIncomeOverlayV2.jsx
          git commit -m "fix: make Add Income reply transition render-safe"
          git push origin HEAD:fix/add-income-header-only-20260903
