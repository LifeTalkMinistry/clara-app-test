name: P0-F14 Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/free-core-access-authority.test.mjs"
      - "package.json"
      - ".github/workflows/coaching-scheduling-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run P0-F14 regression suite
        run: node --test tests/free-core-access-authority.test.mjs

      - name: Run Buy Check lint suite
        run: npm run lint:buy-check

      - name: Build production app
        run: npm run build
