name: Remove duplicate guided budget summary
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-guided-budget-summary.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate summary container
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/monthly-budget-plan/MonthlyBudgetPlanGuided.jsx')
          source = path.read_text()
          source = source.replace('  Sparkles,\n', '', 1)
          source = source.replace('  const showPlanSoFar = declared > 0;\n', '', 1)
          start = source.find('        {showPlanSoFar && step !== 5 ? (')
          end = source.find('        {isActiveBudget && step === 5 ? (', start)
          if start < 0 or end < 0:
              raise SystemExit('Duplicate summary block not found')
          path.write_text(source[:start] + source[end:])
          PY
      - name: Commit summary removal
        run: |
          rm -f .github/workflows/remove-guided-budget-summary.yml
          rm -f .github/workflows/surgical-guided-budget-layout.yml
          rm -f .github/workflows/apply-guided-budget-unified-workspace.yml
          rm -rf .github/budget-patch
          rm -rf src/pages/monthly-budget-plan/guided
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Remove duplicate guided budget summary" && git push origin main)
