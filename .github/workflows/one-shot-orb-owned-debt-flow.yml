name: One-shot Orb-owned debt flow
on:
  push:
    paths:
      - 'scripts/orb_owned_debt_flow.py'
      - '.github/workflows/one-shot-orb-owned-debt-flow.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/orb_owned_debt_flow.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/community/ClaraOrbPage.jsx src/runtime/installClaraOrbCommandChatRouting.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Keep Debt Obligations inside CLARA Orb'
          git push origin main
