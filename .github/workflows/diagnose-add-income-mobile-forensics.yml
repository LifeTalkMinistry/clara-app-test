name: Diagnose Add Income Mobile Forensics

on:
  push:
    branches:
      - diagnostic/add-income-mobile-forensics-2960528
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    env:
      VITE_CLARA_RUNTIME_MODE: local_only
      VITE_CLARA_AUTH_ENABLED: "false"
      VITE_CLARA_LOCAL_MODE_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start production-shell forensic harness
        run: |
          npx vite --host 127.0.0.1 --port 4173 > /tmp/clara-forensic-vite.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/tests/visual/clara-add-income-header-only-regression.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clara-forensic-vite.log
          exit 1
      - name: Emit first-divergence geometry trace
        env:
          CLARA_VISUAL_BASE_URL: http://127.0.0.1:4173
        run: node tests/clara-add-income-mobile-first-divergence.mjs
      - name: Run synchronized desktop/mobile Add Income regression
        continue-on-error: true
        env:
          CLARA_VISUAL_BASE_URL: http://127.0.0.1:4173
        run: node tests/clara-add-income-header-only-regression.mjs
