name: Deploy Buy Check Test to GitHub Pages

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Buy Check test branch
        uses: actions/checkout@v4
        with:
          ref: fix/buy-check-expanding-composer-v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Stamp web build
        run: |
          printf '{"commit":"%s","builtAt":"%s"}\n' \
            "$(git rev-parse HEAD)" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > public/build-info.json

      - name: Build GitHub Pages app
        run: npm run build:web
        env:
          VITE_GEMINI_MODEL: gemini-3.6-flash
          VITE_CLARA_RUNTIME_MODE: local_only
          VITE_CLARA_AUTH_ENABLED: "false"
          VITE_CLARA_LOCAL_MODE_ENABLED: "true"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
