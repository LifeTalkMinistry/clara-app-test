name: Verify Budget card truth

on:
  push:
    branches:
      - fix/budget-card-truth
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/budget-card-truth
          fetch-depth: 0

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci attempt ${attempt} failed; retrying..."
            sleep 10
          done
          exit 1

      - name: Run focused Budget regression
        run: node --test tests/budget-card-truth-regression.test.mjs

      - name: Run full regression and production build
        run: npm run build
