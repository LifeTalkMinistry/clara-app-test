name: Patch onboarding page lock hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-onboarding-page-lock-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useOnboardingPageLock into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useOnboardingPageLock from "@/components/fresh/main-dashboard/onboarding/useOnboardingPageLock";\n'
          import_anchor = 'import OnboardingActionBar from "@/components/fresh/main-dashboard/onboarding/OnboardingActionBar";\n'

          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Onboarding import anchor not found. Refusing to patch Dashboard.jsx.")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          block_start = '  useEffect(() => {\n    if (!showOnboarding) {\n      document.body.classList.remove("clara-onboarding-open");\n'
          block_end = '  const fmt = useCallback((n) => {\n'

          if block_start in text:
              start_index = text.index(block_start)
              end_index = text.index(block_end, start_index)
              old_block = text[start_index:end_index]
              required_tokens = [
                  'document.body.classList.add("clara-onboarding-open");',
                  'document.documentElement.classList.add("clara-onboarding-open");',
                  'const styleId = "clara-onboarding-global-hide-style";',
                  'body.clara-onboarding-open [data-bottom-nav]',
                  'html.clara-onboarding-open',
              ]
              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("Onboarding page lock block does not match expected content. Refusing to patch Dashboard.jsx.")
              text = text[:start_index] + '  useOnboardingPageLock(showOnboarding);\n\n' + text[end_index:]
          elif 'useOnboardingPageLock(showOnboarding);' not in text:
              raise SystemExit("Onboarding lock block not found and hook is not wired. Refusing to patch Dashboard.jsx.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-onboarding-page-lock-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-onboarding-page-lock-hook.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Wire onboarding page lock hook"
          git push
