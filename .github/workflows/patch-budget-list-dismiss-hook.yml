name: Patch budget list dismiss hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-budget-list-dismiss-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useBudgetListDropdownDismiss into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useBudgetListDropdownDismiss from "@/components/fresh/main-dashboard/finance-form/useBudgetListDropdownDismiss";\n'
          import_anchor = '''import {
            financeInputClassName,
            UNDOCUMENTED_SPENDING_REASONS,
          } from "@/components/fresh/main-dashboard/finance-form/financeFormConstants";
          '''.replace("          ", "")

          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Finance form import anchor not found. Refusing to patch Dashboard.jsx.")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          block_start = '  useEffect(() => {\n    if (!budgetListOpen) return;\n\n    const handlePointerDown = (event) => {\n'
          block_end = '  useEffect(() => {\n    const safeWallets = Array.isArray(financeWallets) ? financeWallets : [];\n'

          if block_start in text:
              start_index = text.index(block_start)
              end_index = text.index(block_end, start_index)
              old_block = text[start_index:end_index]
              required_tokens = [
                  'budgetListDropdownRef.current.contains(event.target)',
                  'if (event.key === "Escape") setBudgetListOpen(false);',
                  'document.addEventListener("mousedown", handlePointerDown);',
                  'document.addEventListener("touchstart", handlePointerDown, { passive: true });',
                  'document.addEventListener("keydown", handleKeyDown);',
              ]
              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("Budget list dismiss block does not match expected content. Refusing to patch Dashboard.jsx.")
              replacement = '''  useBudgetListDropdownDismiss({
    budgetListOpen,
    budgetListDropdownRef,
    setBudgetListOpen,
  });

'''
              text = text[:start_index] + replacement + text[end_index:]
          elif 'useBudgetListDropdownDismiss({' not in text:
              raise SystemExit("Budget list dismiss block not found and hook is not wired. Refusing to patch Dashboard.jsx.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-budget-list-dismiss-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-budget-list-dismiss-hook.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Wire budget list dropdown dismiss hook"
          git push
