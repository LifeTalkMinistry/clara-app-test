name: CLARA financial integrity PR verifier

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/financial-integrity-repair.trigger"

permissions:
  contents: write

jobs:
  verify-repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply fixed Means baseline repair
        run: python3 scripts/fix_means_fixed_full_cycle_anchor_v6.py

      - name: Normalize wallet semantics for current source shape
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/lib/clara-wallet-money-semantics.js")
          text = path.read_text(encoding="utf-8")
          block = re.search(r'const OTHER_PROTECTED_KEYS = \[[\s\S]*?\n\];', text)
          if not block:
              raise SystemExit("OTHER_PROTECTED_KEYS block not found")
          protected_block = block.group(0)
          for key in ["reservedAmount", "reserved_amount", "protectedAmount", "protected_amount"]:
              quoted = f'"{key}"'
              if quoted not in protected_block:
                  protected_block = protected_block[:-3] + f'  {quoted},\n];'
          text = text[:block.start()] + protected_block + text[block.end():]

          if "function roundMoney(value)" not in text:
              marker = "\nfunction firstDefinedValue("
              idx = text.find(marker)
              if idx < 0:
                  raise SystemExit("firstDefinedValue marker not found")
              helper = '''\nfunction roundMoney(value) {\n  const amount = toMoney(value);\n  return Math.round(amount * 100) / 100;\n}\n'''
              text = text[:idx] + helper + text[idx:]

          text = text.replace(
              '  const currentBalance = Math.max(getWalletCurrentBalance(wallet), 0);',
              '  const currentBalance = roundMoney(Math.max(getWalletCurrentBalance(wallet), 0));'
          )
          text = text.replace(
              '  const totalProtectedAmount =\n    emergencyProtectedAmount + savingsProtectedAmount + otherProtectedAmount;',
              '  const totalProtectedAmount = roundMoney(\n    emergencyProtectedAmount + savingsProtectedAmount + otherProtectedAmount\n  );'
          )
          text = text.replace(
              '''    spendableBalance: protectedAmounts.isMoneyLent\n      ? 0\n      : Math.max(\n          protectedAmounts.currentBalance - protectedAmounts.totalProtectedAmount,\n          0\n        ),''',
              '''    spendableBalance: protectedAmounts.isMoneyLent\n      ? 0\n      : roundMoney(\n          Math.max(\n            protectedAmounts.currentBalance - protectedAmounts.totalProtectedAmount,\n            0\n          )\n        ),'''
          )
          text = text.replace(
              '  if (explicitSpendable !== null) return Math.max(toMoney(explicitSpendable), 0);',
              '  if (explicitSpendable !== null) return roundMoney(Math.max(toMoney(explicitSpendable), 0));'
          )
          text = text.replace(
              '  return Math.max(getWalletCurrentBalance(wallet) - protectedAmount, 0);',
              '  return roundMoney(Math.max(getWalletCurrentBalance(wallet) - protectedAmount, 0));'
          )
          for field in [
              "currentBalance", "availableBalance", "unavailableAmount",
              "moneyLentUnavailableAmount", "emergencyProtectedAmount",
              "savingsProtectedAmount", "otherProtectedAmount",
              "totalProtectedAmount", "spendableBalance"
          ]:
              text = re.sub(
                  rf'{field}: totals\.{field} \+ ([A-Za-z]+),',
                  rf'{field}: roundMoney(totals.{field} + \1),',
                  text,
              )
          path.write_text(text, encoding="utf-8")

      - name: Apply remaining full-suite repair
        run: python3 scripts/fix_remaining_full_suite_after_means_v1.py

      - name: Syntax checks
        run: |
          python3 -m py_compile scripts/fix_means_fixed_full_cycle_anchor_v6.py scripts/fix_remaining_full_suite_after_means_v1.py
          node --check src/runtime/installClaraOrbGreeting.js
          node --check src/lib/clara-means-cycle-baseline.js
          node --check src/lib/clara-buy-check-wallet-engine.js
          node --check src/lib/clara-buy-check-income-runway-engine.js
          node --check src/lib/clara-wallet-money-semantics.js

      - name: Focused financial regression tests
        run: |
          node --test tests/means-score-context-baseline-regression.test.mjs
          node --test tests/buy-check-context-facts.test.mjs
          node --test tests/wallet-money-semantics.test.mjs
          node --test tests/wallet-expanded-flow-regression.test.mjs

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Full application regression suite
        id: full_tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee financial-integrity-test.log

      - name: Upload application test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-integrity-test-log
          path: financial-integrity-test.log
          if-no-files-found: warn
          retention-days: 1

      - name: Gate on full-suite result
        if: steps.full_tests.outcome == 'failure'
        run: exit 1

      - name: Production build
        run: npm run build:web
        env:
          VITE_GEMINI_MODEL: gemini-3.6-flash
          VITE_CLARA_RUNTIME_MODE: local_only
          VITE_CLARA_AUTH_ENABLED: "false"
          VITE_CLARA_LOCAL_MODE_ENABLED: "true"

      - name: Commit verified repair to branch
        run: |
          rm -f .github/financial-integrity-repair.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verified repair changes to commit."
            exit 0
          fi
          git commit -m "Restore financial integrity and regression contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
