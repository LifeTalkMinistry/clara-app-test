name: Fix CLARA PDF white page flash

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/clara-pdf-white-flash-fix.yml

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply surgical white-flash fix
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx')
          text = path.read_text(encoding='utf-8')

          old_effect = '''  useEffect(() => {
    if (!isOpen) return;
    setIsReaderMenuOpen(false);
    resetPdfToFit({ announce: false });
    setPdfPageAspectRatio(0);
    scrollToTop();
  }, [
    activePdfPath,
    isOpen,
    material?.id,
    pdfReloadKey,
    resetPdfToFit,
    safePageIndex,
    scrollToTop,
  ]);'''

          new_effect = '''  useEffect(() => {
    if (!isOpen) return;
    setIsReaderMenuOpen(false);
    resetPdfToFit({ announce: false });
    setPdfPageAspectRatio(0);
    scrollToTop();
  }, [
    activePdfPath,
    isOpen,
    material?.id,
    pdfReloadKey,
    resetPdfToFit,
    scrollToTop,
  ]);'''

          old_aspect = '''    setPdfPageAspectRatio((currentAspectRatio) =>
      Math.abs(currentAspectRatio - nextAspectRatio) < 0.001
        ? currentAspectRatio
        : nextAspectRatio,
    );'''

          new_aspect = '''    setPdfPageAspectRatio((currentAspectRatio) =>
      currentAspectRatio > 0 ? currentAspectRatio : nextAspectRatio,
    );'''

          if text.count(old_effect) != 1:
              raise RuntimeError('Expected exactly one page-reset effect')
          if text.count(old_aspect) != 1:
              raise RuntimeError('Expected exactly one page aspect-ratio updater')

          text = text.replace(old_effect, new_effect, 1)
          text = text.replace(old_aspect, new_aspect, 1)

          if 'currentAspectRatio > 0 ? currentAspectRatio : nextAspectRatio' not in text:
              raise RuntimeError('Stable per-document aspect ratio guard is missing')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build web app
        run: npm run build:web

      - name: Commit validated fix and remove temporary workflow
        if: success()
        shell: bash
        run: |
          git diff --check
          rm -f .github/workflows/clara-pdf-white-flash-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx .github/workflows/clara-pdf-white-flash-fix.yml
          git commit -m "fix: prevent white PDF canvas flash after page changes"
          git push origin HEAD:main

      - name: Remove temporary workflow after failure
        if: failure()
        shell: bash
        run: |
          git restore src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx || true
          rm -f .github/workflows/clara-pdf-white-flash-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove failed PDF white flash validator"
            git push origin HEAD:main
          fi
