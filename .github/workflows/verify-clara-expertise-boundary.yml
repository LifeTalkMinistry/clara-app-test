name: Verify CLARA Expertise Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/clara-expertise-boundary.js'
      - 'src/lib/ai-command/ai-engine.js'
      - 'tests/clara-expertise-boundary.test.mjs'
      - '.github/workflows/verify-clara-expertise-boundary.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/clara-expertise-boundary.test.mjs
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npm run build

# Synchronize PR after workflow registration.
