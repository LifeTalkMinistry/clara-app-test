name: Patch Schedule AgendaCard Label

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-schedule-selected-date-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Remove AgendaCard label only
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardSchedulePanel.jsx")
          text = path.read_text(encoding="utf-8")

          old_line = '            <p className="text-[10px] font-black uppercase tracking-[.22em] text-cyan-100/55">{agenda.label}</p>'
          new_line = '            <span aria-hidden="true" />'

          if old_line not in text:
              raise SystemExit("Expected AgendaCard label line was not found.")

          text = text.replace(old_line, new_line, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit AgendaCard UI update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardSchedulePanel.jsx
          git rm .github/workflows/patch-schedule-selected-date-ui.yml
          if git diff --cached --quiet; then
            echo "No AgendaCard UI changes to commit."
          else
            git commit -m "Remove schedule agenda card label"
            git push
          fi
