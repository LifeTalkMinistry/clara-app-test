name: Verify CLARA Pause Hold Fix

on:
  pull_request:
    types: [opened]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-build-and-commit:
    if: github.head_ref == 'codex/fix-clara-pause-hold'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch the live Money Left orb
        run: node .github/scripts/fix-clara-pause-hold.mjs

      - name: Verify the live event path
        shell: bash
        run: |
          git diff --check
          grep -q 'CLARA_PAUSE_OPEN_REQUEST_EVENT' src/components/fresh/main-dashboard/money-summary/DashboardMoneySummaryStable.jsx
          grep -q 'window.dispatchEvent' src/components/fresh/main-dashboard/money-summary/DashboardMoneySummaryStable.jsx
          grep -q 'source: "money-left-orb-stable"' src/components/fresh/main-dashboard/money-summary/DashboardMoneySummaryStable.jsx
          ! grep -q 'startMoneyLeftOrbLongPress?.(event);' src/components/fresh/main-dashboard/money-summary/DashboardMoneySummaryStable.jsx
          ! grep -q 'moveMoneyLeftOrbLongPress(event);' src/components/fresh/main-dashboard/money-summary/DashboardMoneySummaryStable.jsx
          grep -q 'CLARA_PAUSE_OPEN_REQUEST_EVENT' src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentBridge.jsx
          ! grep -q 'const LONG_PRESS_DELAY = 520' src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentBridge.jsx

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: gemini-2.5-flash

      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/scripts/fix-clara-pause-hold.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix CLARA Pause long press"
          git push origin HEAD:${{ github.head_ref }}
