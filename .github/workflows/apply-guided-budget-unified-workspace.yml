name: Apply guided budget unified workspace
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-guided-budget-unified-workspace.yml
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct guided budget setup
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64
          import zlib

          payload = ""
          guided = zlib.decompress(base64.b64decode(payload)).decode("utf-8")
          guided_path = Path("src/pages/monthly-budget-plan/MonthlyBudgetPlanGuided.jsx")
          guided_path.write_text(guided, encoding="utf-8")

          wrapper_path = Path("src/pages/MonthlyBudgetPlan.jsx")
          wrapper = wrapper_path.read_text(encoding="utf-8")
          old_labels = 'const STEP_LABELS = ["Amount", "Cycle", "Protection", "Categories", "Review"];'
          new_labels = 'const STEP_LABELS = ["Basics", "Protection", "Categories", "Review"];'
          if old_labels not in wrapper:
              raise SystemExit("Expected five-step label declaration was not found.")
          wrapper = wrapper.replace(old_labels, new_labels, 1)

          old_progress = '''      const progressSection = Array.from(root.querySelectorAll("section")).find((section) =>
        /step\s*\d+\s*of\s*5/i.test(section.textContent || ""),
      );
      const stepMatch = progressSection?.textContent?.match(/step\s*(\d+)\s*of\s*5/i);
      const currentStep = Math.min(5, Math.max(1, Number(stepMatch?.[1]) || 1));'''
          new_progress = '''      const guidedScreen = root.querySelector("[data-budget-guided-step]");
      const currentStep = Math.min(
        4,
        Math.max(1, Number(guidedScreen?.getAttribute("data-budget-guided-step")) || 1),
      );
      const progressSection = null;'''
          if old_progress not in wrapper:
              raise SystemExit("Expected five-step progress resolver was not found.")
          wrapper = wrapper.replace(old_progress, new_progress, 1)
          old_progress_text = 'const nextProgressText = `Step ${currentStep} of 5 · ${currentLabel}`;'
          new_progress_text = 'const nextProgressText = `Step ${currentStep} of 4 · ${currentLabel}`;'
          if old_progress_text not in wrapper:
              raise SystemExit("Expected five-step progress text was not found.")
          wrapper = wrapper.replace(old_progress_text, new_progress_text, 1)
          wrapper_path.write_text(wrapper, encoding="utf-8")
          PYCODE
      - name: Commit guided budget reconstruction
        run: |
          rm -f .github/workflows/apply-guided-budget-unified-workspace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Unify guided budget setup workspace" && git push origin main)
