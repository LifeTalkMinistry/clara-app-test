name: Patch enrollment redirect hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-enrollment-redirect-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardEnrollmentRedirect into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardEnrollmentRedirect from "@/components/fresh/main-dashboard/program-access/useDashboardEnrollmentRedirect";\n'
          import_anchor = 'import useLatestValueRef from "@/components/fresh/main-dashboard/hooks/useLatestValueRef";\n'
          fallback_anchor = 'import useDashboardScheduledRefresh from "@/components/fresh/main-dashboard/finance-notices/useDashboardScheduledRefresh";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Enrollment redirect import anchor not found. Refusing to patch Dashboard.jsx.")

          if 'useDashboardEnrollmentRedirect({' not in text:
              replacement = (
                  '  useDashboardEnrollmentRedirect({\n'
                  '    guardChecked,\n'
                  '    profileData,\n'
                  '    latestEnrollment,\n'
                  '    isPaid,\n'
                  '    navigate,\n'
                  '  });\n\n'
              )

              pattern = re.compile(
                  r'  useEffect\(\(\) => \{\n'
                  r'    if \(!guardChecked \|\| !profileData\) return;\n\n'
                  r'    const shouldRedirect = shouldForceToEnroll\(profileData, latestEnrollment, isPaid\);\n\n'
                  r'    if \(shouldRedirect\) \{\n'
                  r'      navigate\("/enroll", \{ replace: true \}\);\n'
                  r'    \}\n'
                  r'  \}, \[guardChecked, profileData, latestEnrollment, isPaid, navigate\]\);\n\n',
                  re.DOTALL,
              )

              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("Enrollment redirect effect block not found. Refusing to patch Dashboard.jsx.")

          if 'useDashboardEnrollmentRedirect({' not in text:
              raise SystemExit("useDashboardEnrollmentRedirect was not wired. Refusing to continue.")

          if 'shouldForceToEnroll(profileData, latestEnrollment, isPaid);' in text:
              raise SystemExit("Old enrollment redirect logic still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-enrollment-redirect-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-enrollment-redirect-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire dashboard enrollment redirect hook"
          git push
