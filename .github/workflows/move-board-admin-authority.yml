name: Move CLARA Board admin authority

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/move-board-admin-authority.yml"
      - ".github/scripts/move-board-admin-authority.mjs"
      - "tests/official-admin-authority.test.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-admin-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Remove legacy Settings and Board admin ownership
        run: node .github/scripts/move-board-admin-authority.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify official admin authority boundary
        run: node --test tests/official-admin-authority.test.mjs

      - name: Build check
        run: npm run build

      - name: Commit verified authority migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx src/pages/AdminPanel.jsx tests/official-admin-authority.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No admin authority changes were produced."
            exit 0
          fi
          git commit -m "Move CLARA Board control to official admin"
          git pull --rebase origin main
          git push origin main

# This workflow is intentionally narrow: it only migrates the legacy in-app admin authority.
