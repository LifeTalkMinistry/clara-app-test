name: Verify CLARA Orb Guide Refactor

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: clara-orb-guide-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-build-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'clara-orb-guide-verified-20260619'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Restore reviewed refactor script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scripts
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/dcea3fbea584fe315bb38aa0e0c628b2211f8c9f --jq .content \
            | tr -d '\n' \
            | base64 -d \
            > scripts/apply_clara_orb_guide_refactor.py

      - name: Apply strict refactor
        run: python3 scripts/apply_clara_orb_guide_refactor.py

      - name: Check patch formatting
        run: git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: |
          set -o pipefail
          npm run build 2>&1 | tee CLARA_ORB_BUILD_ERROR.log

      - name: Publish build failure details
        if: failure()
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm -f scripts/apply_clara_orb_guide_refactor.py
          git restore . ':!.github/workflows/apply-clara-orb-guide-verified.yml' || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLARA_ORB_BUILD_ERROR.log
          git commit -m "chore: capture CLARA orb guide build error" || true
          git push origin HEAD:${HEAD_BRANCH}

      - name: Commit verified implementation
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm -f scripts/apply_clara_orb_guide_refactor.py
          rm -f .github/workflows/apply-clara-orb-guide-verified.yml
          rm -f CLARA_ORB_BUILD_ERROR.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use production UI in CLARA orb guide"
          git push origin HEAD:${HEAD_BRANCH}
