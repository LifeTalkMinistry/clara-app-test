name: Run guided category refinement
on:
  push:
    branches: [main]
    paths:
      - scripts/refine_guided_category_screen.py
      - .github/workflows/run-guided-category-refinement.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/refine_guided_category_screen.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Refine guided budget category screen
          file_pattern: src/pages/monthly-budget-plan/MonthlyBudgetPlanGuided.jsx
