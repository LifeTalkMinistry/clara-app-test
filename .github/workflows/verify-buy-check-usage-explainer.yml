name: Verify Buy Check Usage Explainer

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/fresh/main-dashboard/assistant/ClaraBuyCheckUsagePortal.jsx"
      - ".github/workflows/verify-buy-check-usage-explainer.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo '## Production build failure'
              echo '```text'
              tail -n 160 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
