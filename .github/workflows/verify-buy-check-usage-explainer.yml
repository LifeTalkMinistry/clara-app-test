name: Verify Buy Check Usage Explainer

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/fresh/main-dashboard/assistant/ClaraBuyCheckUsagePortal.jsx"
      - ".github/workflows/verify-buy-check-usage-explainer.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        id: production-build
        continue-on-error: true
        shell: bash
        run: npm run build > build.log 2>&1

      - name: Upload build diagnostics
        if: steps.production-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: buy-check-usage-explainer-build-log
          path: build.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail if production build failed
        if: steps.production-build.outcome == 'failure'
        run: exit 1
