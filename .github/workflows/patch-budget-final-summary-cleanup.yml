name: Patch budget final summary cleanup

on:
  push:
    paths:
      - '.github/workflows/patch-budget-final-summary-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Consolidate final summary explanations
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/monthly-budget-plan/MonthlyBudgetPlanGuided.jsx')
          text = path.read_text(encoding='utf-8')

          old_header = '''            <div className="border-b border-white/8 bg-gradient-to-br from-cyan-400/[0.09] via-transparent to-violet-400/[0.08] p-4">
              <QuestionHeader
                icon={CheckCircle2}
                eyebrow="Step 5"
                title={`You created a ${fmt(calculatedTotal)} ${cycle.label.toLowerCase()} budget`}
                body={`This budget is intended to cover ${cycle.start} to ${cycle.end}.`}
              />
            </div>'''

          new_header = '''            <div className="border-b border-white/8 bg-gradient-to-br from-cyan-400/[0.09] via-transparent to-violet-400/[0.08] p-4">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0 flex-1">
                  <QuestionHeader
                    icon={CheckCircle2}
                    eyebrow="Step 5"
                    title={`You created a ${fmt(calculatedTotal)} ${cycle.label.toLowerCase()} budget`}
                  />
                </div>
                <InfoHint label="budget summary">
                  <div className="space-y-2">
                    <p>
                      Covers {cycle.start} to {cycle.end}.
                    </p>
                    <p>
                      {fmt(regularTotal)} regular items · {fmt(protectedTotal)} protected money · {fmt(debtTotal)} debt or obligations.
                    </p>
                  </div>
                </InfoHint>
              </div>
            </div>'''

          old_explainer = '''              <div className="mt-4 rounded-2xl border border-white/8 bg-black/12 p-4 text-sm font-semibold leading-6 text-white/58">
                It includes {fmt(regularTotal)} in regular budget items, {fmt(protectedTotal)} in protected money, and {fmt(debtTotal)} in debt or obligation payments.
              </div>

'''

          changed = False

          if old_header in text:
              text = text.replace(old_header, new_header, 1)
              changed = True
          elif 'body={`This budget is intended to cover ${cycle.start} to ${cycle.end}.`}' in text:
              raise SystemExit('Step 5 header changed shape; refusing partial patch.')
          else:
              print('Final summary header already cleaned or source changed.')

          if old_explainer in text:
              text = text.replace(old_explainer, '', 1)
              changed = True
          elif 'It includes {fmt(regularTotal)} in regular budget items' in text:
              raise SystemExit('Final summary explainer changed shape; refusing partial patch.')
          else:
              print('Final summary explainer already removed or source changed.')

          if changed:
              path.write_text(text, encoding='utf-8')
              print('Final budget summary now uses one optional info explanation and no duplicate explainer card.')

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "CLARA UI Patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/monthly-budget-plan/MonthlyBudgetPlanGuided.jsx
          git commit -m "Clean final budget summary explanation"
          git push origin main
