name: One-shot Means unpaid debt carryover

on:
  push:
    paths:
      - ".github/workflows/one-shot-means-unpaid-debt-carryover.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Keep overdue unpaid debt inside Means
        run: python scripts/fix_means_unpaid_debt_carryover.py

      - name: Verify canonical unpaid debt carryover
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/runtime/installClaraOrbGreeting.js").read_text()
          for check in [
            'function overdueUnpaidDebtAmount',
            'if (lastPaid && lastPaid >= event.date) return;',
            'futureDebtObligationAmount(debtObligations, cycleEndDate) +',
            'overdueUnpaidDebtAmount(debtObligations, cycleEndDate)',
          ]:
            assert check in text, check

      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/installClaraOrbGreeting.js
          git commit -m "Keep overdue unpaid debt in Means score"
          git push origin HEAD:main
