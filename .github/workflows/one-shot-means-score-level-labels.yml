name: One-shot Means Score level labels

on:
  push:
    paths:
      - ".github/workflows/one-shot-means-score-level-labels.yml"
      - "scripts/means_score_level_labels.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Means Score level labels
        run: python scripts/means_score_level_labels.py
      - name: Verify hierarchy
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/runtime/installClaraOrbGreeting.js").read_text()
          assert 'if (score >= 400) return "Level IV";' in text
          assert 'if (score >= 300) return "Level III";' in text
          assert 'if (score >= 200) return "Level II";' in text
          assert 'Cycles Ahead' not in text
          assert 'if (score >= 500) return "Vanguard";' in text
          assert 'if (score >= 1000) return "Bronze";' in text
          assert 'if (score >= 2000) return "Silver";' in text
          assert 'if (score >= 5000) return "Gold";' in text
          assert 'if (score >= 10000) return "Diamond";' in text
      - name: Commit hierarchy update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/installClaraOrbGreeting.js
          git rm scripts/means_score_level_labels.py .github/workflows/one-shot-means-score-level-labels.yml
          git commit -m "Rename Means Score cycle tiers to levels"
          git push origin HEAD:main
