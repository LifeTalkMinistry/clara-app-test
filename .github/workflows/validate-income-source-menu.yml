name: Validate Income Source Action Menu

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/components/financial-carousel/cards/investment/ui/InvestmentCardView.jsx"
      - ".github/workflows/validate-income-source-menu.yml"

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint InvestmentCardView
        run: npx eslint src/components/financial-carousel/cards/investment/ui/InvestmentCardView.jsx

      - name: Build production app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: gemini-2.5-flash
