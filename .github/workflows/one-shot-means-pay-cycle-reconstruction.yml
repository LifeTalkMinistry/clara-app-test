name: One-shot Means pay-cycle reconstruction

on:
  push:
    paths:
      - ".github/workflows/one-shot-means-pay-cycle-reconstruction.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct Means Score around one pay cycle
        run: python scripts/means_pay_cycle_reconstruct.py
      - name: Verify reconstruction
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/runtime/installClaraOrbGreeting.js").read_text()
          for check in [
            'function resolveMeansPayCycle',
            'Income this pay cycle',
            '↳ Money Schedule',
            '↳ Other scheduled events',
            'moneyScheduleUpcoming',
            'otherScheduledUpcoming',
            'cycleStartDate',
            'cycleEndDate',
          ]:
            assert check in text, check
      - name: Commit reconstruction to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/installClaraOrbGreeting.js
          git commit -m "Reconstruct Means Score around pay cycle"
          git push origin HEAD:main
