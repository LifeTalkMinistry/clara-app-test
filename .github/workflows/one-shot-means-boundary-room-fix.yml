name: One-shot Means boundary and room fix

on:
  push:
    paths:
      - ".github/workflows/one-shot-means-boundary-room-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix Means payday boundary and room
        run: python scripts/means_boundary_room_fix.py
      - name: Verify fix
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/runtime/installClaraOrbGreeting.js").read_text()
          for check in [
            'while (cursor < end)',
            'date >= horizonEnd',
            'const projectedRoom = availableNow - upcoming;',
            '${signedMoney(snapshot.projectedRoom)}',
            'upcomingBreakdownTotal',
          ]:
            assert check in text, check
      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/installClaraOrbGreeting.js
          git commit -m "Fix Means payday boundary and room integrity"
          git push origin HEAD:main
