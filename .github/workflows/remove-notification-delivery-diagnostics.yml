name: Remove Notification Delivery Diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-notification-delivery-diagnostics.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove extra notification diagnostics UI and dead code
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/notifications/NotificationSettingsPanel.jsx';
          let source = fs.readFileSync(path, 'utf8');

          const deviceTestImport = `import {
            sendRealPushTestNotification,
            showTestDeviceNotification,
          } from "@/lib/notifications/deviceNotifications";\n`;
          if (!source.includes(deviceTestImport)) {
            throw new Error('Expected device diagnostics import block was not found.');
          }
          source = source.replace(deviceTestImport, '');

          const stateBlock = `  const [localTestSending, setLocalTestSending] = useState(false);\n  const [realPushTestSending, setRealPushTestSending] = useState(false);\n`;
          if (!source.includes(stateBlock)) {
            throw new Error('Expected diagnostics-only state block was not found.');
          }
          source = source.replace(stateBlock, '');

          const callbackStart = '  const sendLocalDeviceTest = useCallback(async () => {';
          const callbackEnd = '  const coachingScheduleEnabled =';
          const callbackStartIndex = source.indexOf(callbackStart);
          const callbackEndIndex = source.indexOf(callbackEnd, callbackStartIndex);
          if (callbackStartIndex < 0 || callbackEndIndex < 0) {
            throw new Error('Expected diagnostics callback block was not found.');
          }
          source = source.slice(0, callbackStartIndex) + source.slice(callbackEndIndex);

          const diagnosticsStart = '      {notificationOwnerId ? (\n        <details className="group overflow-hidden rounded-[22px] border border-[#1d4b7b]/45 bg-[#061225]">';
          const diagnosticsEnd = '      {!embedded ? (';
          const diagnosticsStartIndex = source.indexOf(diagnosticsStart);
          const diagnosticsEndIndex = source.indexOf(diagnosticsEnd, diagnosticsStartIndex);
          if (diagnosticsStartIndex < 0 || diagnosticsEndIndex < 0) {
            throw new Error('Expected Delivery diagnostics JSX block was not found.');
          }
          source = source.slice(0, diagnosticsStartIndex) + source.slice(diagnosticsEndIndex);

          const forbidden = [
            'Delivery diagnostics',
            'Technical delivery status only',
            'Test local notification',
            'Test phone push',
            'sendLocalDeviceTest',
            'sendRealPushTest',
            'localTestSending',
            'realPushTestSending',
            'showTestDeviceNotification',
            'sendRealPushTestNotification',
          ];
          for (const token of forbidden) {
            if (source.includes(token)) {
              throw new Error(`Diagnostics cleanup incomplete; still found: ${token}`);
            }
          }
          if (!source.includes('Notification delivery')) {
            throw new Error('Top Notification delivery card was removed unexpectedly.');
          }
          if (!source.includes('Enable phone notifications')) {
            throw new Error('Normal phone notification control was removed unexpectedly.');
          }

          fs.writeFileSync(path, source, 'utf8');
          console.log('Notification diagnostics UI and diagnostics-only code removed successfully.');
          NODE

      - name: Verify surgical diff
        shell: bash
        run: |
          git diff --check
          git diff -- src/components/notifications/NotificationSettingsPanel.jsx
          if grep -q "Delivery diagnostics\|Test local notification\|Test phone push\|sendLocalDeviceTest\|sendRealPushTestNotification" src/components/notifications/NotificationSettingsPanel.jsx; then
            echo "Diagnostics residue remains" >&2
            exit 1
          fi
          grep -q "Notification delivery" src/components/notifications/NotificationSettingsPanel.jsx
          grep -q "Enable phone notifications" src/components/notifications/NotificationSettingsPanel.jsx

      - name: Commit repair and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-notification-delivery-diagnostics.yml
          git add src/components/notifications/NotificationSettingsPanel.jsx
          git commit -m "Remove extra notification delivery diagnostics UI"
          git push origin HEAD:main
