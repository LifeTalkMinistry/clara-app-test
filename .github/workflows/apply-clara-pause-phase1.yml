name: Apply CLARA Pause Phase 1

on:
  push:
    branches:
      - codex/clara-pause-phase-1

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.head_commit.message == 'Stage CLARA Pause Phase 1 automation'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: codex/clara-pause-phase-1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply exact-source Phase 1 patch
        run: node .github/scripts/apply-clara-pause-phase1.mjs

      - name: Verify intended source shape
        shell: bash
        run: |
          git diff --check
          test -f src/lib/clara-pause-events.js
          grep -q 'clara:pause-open-request' src/lib/clara-pause-events.js
          grep -q 'clara:open-buy-check' src/lib/clara-pause-events.js
          grep -q 'data-clara-pause-entry-board="true"' src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlay.jsx
          grep -q 'data-clara-pause-overlay="true"' src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlay.jsx
          ! grep -q 'Choose Buy Check, Forecast, or Analytic' src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlay.jsx
          ! grep -q 'Use the buttons above first' src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlay.jsx
          ! grep -q 'const LONG_PRESS_DELAY = 520' src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentBridge.jsx
          grep -q 'import "../clara-assistant-forecast-tab";' src/runtime/installClaraRuntimePatches.js
          grep -q 'import "../clara-assistant-analytic-tab";' src/runtime/installClaraRuntimePatches.js
          grep -q 'import "../clara-schedule-notification-runtime-bridge";' src/runtime/installClaraRuntimePatches.js

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: gemini-2.5-flash

      - name: Commit verified Phase 1 implementation
        shell: bash
        run: |
          rm -f .github/scripts/apply-clara-pause-phase1.mjs
          rm -f .github/workflows/apply-clara-pause-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement CLARA Pause Phase 1"
          git push origin HEAD:codex/clara-pause-phase-1
