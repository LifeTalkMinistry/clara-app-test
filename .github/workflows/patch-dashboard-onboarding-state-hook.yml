name: Patch dashboard onboarding state hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard-onboarding-state-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardOnboardingState into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardOnboardingState from "@/components/fresh/main-dashboard/onboarding/useDashboardOnboardingState";\n'
          import_anchor = 'import useOnboardingPageLock from "@/components/fresh/main-dashboard/onboarding/useOnboardingPageLock";\n'
          fallback_anchor = 'import OnboardingActionBar from "@/components/fresh/main-dashboard/onboarding/OnboardingActionBar";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Dashboard onboarding state import anchor not found. Refusing to patch Dashboard.jsx.")

          onboarding_block = (
              '  const {\n'
              '    showProgramStart,\n'
              '    setShowProgramStart,\n'
              '    programPromptSeenThisSession,\n'
              '    setProgramPromptSeenThisSession,\n'
              '    showOnboarding,\n'
              '    setShowOnboarding,\n'
              '    onboardingStep,\n'
              '    setOnboardingStep,\n'
              '    savingOnboarding,\n'
              '    setSavingOnboarding,\n'
              '    commitmentChecked,\n'
              '    setCommitmentChecked,\n'
              '    nickname,\n'
              '    setNickname,\n'
              '    reminderTime,\n'
              '    setReminderTime,\n'
              '    financialGoal,\n'
              '    setFinancialGoal,\n'
              '  } = useDashboardOnboardingState(initialCache);\n'
          )

          first_state_line = '  const [showProgramStart, setShowProgramStart] = useState(false);\n'
          state_lines = [
              first_state_line,
              '  const [programPromptSeenThisSession, setProgramPromptSeenThisSession] =\n    useState(false);\n',
              '  const [showOnboarding, setShowOnboarding] = useState(false);\n',
              '  const [onboardingStep, setOnboardingStep] = useState(0);\n',
              '  const [savingOnboarding, setSavingOnboarding] = useState(false);\n',
              '  const [commitmentChecked, setCommitmentChecked] = useState(false);\n',
              '  const [nickname, setNickname] = useState(initialCache.nickname);\n',
              '  const [reminderTime, setReminderTime] = useState(initialCache.reminderTime);\n',
              '  const [financialGoal, setFinancialGoal] = useState(initialCache.financialGoal);\n',
          ]

          if onboarding_block not in text:
              if first_state_line not in text:
                  raise SystemExit("showProgramStart state line not found. Refusing to patch Dashboard.jsx.")
              text = text.replace(first_state_line, onboarding_block, 1)

          for old_line in state_lines[1:]:
              if old_line in text:
                  text = text.replace(old_line, '', 1)

          if 'useDashboardOnboardingState(initialCache);' not in text:
              raise SystemExit("useDashboardOnboardingState was not wired. Refusing to continue.")

          for old_line in state_lines:
              if old_line in text:
                  raise SystemExit(f"Old onboarding state line still exists after patch: {old_line.strip()}")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-dashboard-onboarding-state-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-dashboard-onboarding-state-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire dashboard onboarding state hook"
          git push
