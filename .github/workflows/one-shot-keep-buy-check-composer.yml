name: One-shot keep Buy Check composer visible

on:
  push:
    paths:
      - '.github/workflows/one-shot-keep-buy-check-composer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep composer mounted while CLARA replies
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx')
          text = path.read_text()
          old = '  const showComposer = baseShowComposer && !pacingLocked && (visibleMessages.length > 0 || openingReady);'
          new = '  const showComposer = baseShowComposer && (visibleMessages.length > 0 || openingReady);'
          if old not in text:
              raise SystemExit('Expected composer visibility line not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-keep-buy-check-composer.yml
      - name: Commit fix
        run: |
          git config user.name 'LifeTalk Ministry'
          git config user.email '96472293+LifeTalkMinistry@users.noreply.github.com'
          git add src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx .github/workflows/one-shot-keep-buy-check-composer.yml
          git commit -m 'Keep Buy Check composer visible during CLARA replies'
          git push origin main
