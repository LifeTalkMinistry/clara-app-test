name: Fix debt paid-period live indicator

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-debt-paid-period-live-indicator.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply live paid-period refresh repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('src/components/financial-carousel/cards/debt/ui/DebtObligationItem.jsx')
          source = component.read_text()

          def replace_once(old, new, label):
              global source
              if old not in source:
                  raise SystemExit(f'Missing expected source block: {label}')
              source = source.replace(old, new, 1)

          replace_once(
              'import { useState } from "react";',
              'import { useEffect, useState } from "react";',
              'React hooks import',
          )

          replace_once(
              '''export default function DebtObligationItem({ record, totalPositiveDebt, onEdit }) {\n  const [paymentOpen, setPaymentOpen] = useState(false);''',
              '''export default function DebtObligationItem({ record, totalPositiveDebt, onEdit }) {\n  const [localRecord, setLocalRecord] = useState(null);\n  const recordVersion = String(record?.updatedAt || record?.updated_at || "");\n\n  useEffect(() => {\n    setLocalRecord(null);\n  }, [record?.id, recordVersion]);\n\n  const effectiveRecord =\n    localRecord && String(localRecord?.id || "") === String(record?.id || "")\n      ? localRecord\n      : record;\n\n  const [paymentOpen, setPaymentOpen] = useState(false);''',
              'local debt snapshot',
          )

          replacements = [
              ('const balance = getObligationBalance(record);', 'const balance = getObligationBalance(effectiveRecord);', 'balance source'),
              ('const monthly = getObligationMonthly(record);', 'const monthly = getObligationMonthly(effectiveRecord);', 'monthly source'),
              ('const interest = getObligationInterest(record);', 'const interest = getObligationInterest(effectiveRecord);', 'interest source'),
              ('const mode = getDebtObligationMode(record);', 'const mode = getDebtObligationMode(effectiveRecord);', 'mode source'),
              ('const status = getDebtStatus(record);', 'const status = getDebtStatus(effectiveRecord);', 'status source'),
              ('const dueMeta = getSafeDueMeta(record);', 'const dueMeta = getSafeDueMeta(effectiveRecord);', 'due source'),
              ('const latestPaidOccurrence = getLatestPaidOccurrenceMeta(record);', 'const latestPaidOccurrence = getLatestPaidOccurrenceMeta(effectiveRecord);', 'paid indicator source'),
              ('const currentOccurrencePaidAmount = getOccurrencePaidAmount(record, dueMeta.dueDate);', 'const currentOccurrencePaidAmount = getOccurrencePaidAmount(effectiveRecord, dueMeta.dueDate);', 'partial payment source'),
              ('const localUserId = String(record?.localUserId || record?.local_user_id || "").trim();', 'const localUserId = String(effectiveRecord?.localUserId || effectiveRecord?.local_user_id || "").trim();', 'owner source'),
              ('setPaymentAmount(String(getSuggestedPaymentAmount(record, dueMeta.dueDate) || ""));', 'setPaymentAmount(String(getSuggestedPaymentAmount(effectiveRecord, dueMeta.dueDate) || ""));', 'suggested payment source'),
              ('{getDebtTitle(record)}', '{getDebtTitle(effectiveRecord)}', 'card title'),
              ('onClick={() => onEdit(record)}', 'onClick={() => onEdit(effectiveRecord)}', 'edit source'),
              ('aria-label={`Edit ${getDebtTitle(record)}`}', 'aria-label={`Edit ${getDebtTitle(effectiveRecord)}`}', 'edit label'),
              ('value={getDebtTypeLabel(record.debtType || record.type)}', 'value={getDebtTypeLabel(effectiveRecord.debtType || effectiveRecord.type)}', 'debt type source'),
              ('<p className="text-xs font-black text-white/90">Pay {getDebtTitle(record)}</p>', '<p className="text-xs font-black text-white/90">Pay {getDebtTitle(effectiveRecord)}</p>', 'payment title'),
          ]
          for old, new, label in replacements:
              replace_once(old, new, label)

          replace_once(
              '''      await payDebtObligationFromWallet(localUserId, record.id, {\n        walletId: paymentWalletId,''',
              '''      const paymentResult = await payDebtObligationFromWallet(localUserId, effectiveRecord.id, {\n        walletId: paymentWalletId,''',
              'payment result capture',
          )

          replace_once(
              '''        deductWallet: requiresWalletDeduction,\n      });\n      const walletLabel = getWalletName(selectedWallet) || "wallet";''',
              '''        deductWallet: requiresWalletDeduction,\n      });\n      if (paymentResult?.debt) {\n        setLocalRecord(paymentResult.debt);\n      }\n      const walletLabel = getWalletName(selectedWallet) || "wallet";''',
              'apply updated debt snapshot',
          )

          component.write_text(source)

          test_file = Path('tests/debt-paid-period-indicator-regression.test.mjs')
          test_source = test_file.read_text()
          anchor = '''  assert.match(source, /This period/);\n});'''
          replacement = '''  assert.match(source, /This period/);\n  assert.match(source, /const effectiveRecord =/);\n  assert.match(source, /setLocalRecord\\(paymentResult\\.debt\\)/);\n});'''
          if anchor not in test_source:
              raise SystemExit('Missing debt paid-period indicator test anchor')
          test_file.write_text(test_source.replace(anchor, replacement, 1))
          PY

      - name: Verify focused debt regressions
        run: node --test tests/debt-paid-period-indicator-regression.test.mjs tests/debt-payment-historical-log-regression.test.mjs

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/financial-carousel/cards/debt/ui/DebtObligationItem.jsx tests/debt-paid-period-indicator-regression.test.mjs
          git rm .github/workflows/fix-debt-paid-period-live-indicator.yml
          git commit -m "Refresh paid debt period immediately"
          git pull --rebase origin main
          git push origin HEAD:main
