name: Patch monthly budget header hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-monthly-budget-header-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardMonthlyBudgetHeader into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardMonthlyBudgetHeader from "@/components/fresh/main-dashboard/budget/useDashboardMonthlyBudgetHeader";\n'
          import_anchor = 'import useDashboardBudgetSummaries from "@/components/fresh/main-dashboard/budget/useDashboardBudgetSummaries";\n'
          fallback_anchor = 'import useDashboardMoneyLeftMetrics from "@/components/fresh/main-dashboard/money-summary/useDashboardMoneyLeftMetrics";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Monthly budget header import anchor not found. Refusing to patch Dashboard.jsx.")

          if 'useDashboardMonthlyBudgetHeader({' not in text:
              block_start = '  const monthlyBudgetHeader = useMemo(() => {\n    const currentMonthKey = getPHMonthKey();\n'
              if block_start not in text:
                  raise SystemExit("monthlyBudgetHeader useMemo start not found. Refusing to patch Dashboard.jsx.")

              start_index = text.index(block_start)

              block_end = '  }, [monthlyBudgetHeader]);\n\n'
              end_index = text.find(block_end, start_index)
              if end_index == -1:
                  raise SystemExit("declaredMonthlyBudgetAmount useMemo end not found. Refusing to patch Dashboard.jsx.")
              end_index += len(block_end)

              old_block = text[start_index:end_index]
              required_tokens = [
                  'const isCurrentMonth = !month || month === currentMonthKey;',
                  'normalizeLower(budget?.category) === "__monthly_budget__"',
                  'normalizeLower(budget?.type) === "monthly_budget";',
                  'const declaredMonthlyBudgetAmount = useMemo(() => {',
                  'monthlyBudgetHeader?.declared_amount,',
                  'monthlyBudgetHeader?.monthly_budget_amount,',
                  'monthlyBudgetHeader?.budget_amount,',
                  'monthlyBudgetHeader?.amount',
              ]

              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("Monthly budget header block content mismatch. Refusing to patch Dashboard.jsx.")

              replacement = (
                  '  const {\n'
                  '    monthlyBudgetHeader,\n'
                  '    declaredMonthlyBudgetAmount,\n'
                  '  } = useDashboardMonthlyBudgetHeader({\n'
                  '    budgets,\n'
                  '  });\n\n'
              )

              text = text[:start_index] + replacement + text[end_index:]

          if 'useDashboardMonthlyBudgetHeader({' not in text:
              raise SystemExit("useDashboardMonthlyBudgetHeader was not wired. Refusing to continue.")
          if 'const monthlyBudgetHeader = useMemo(() => {' in text:
              raise SystemExit("Old monthlyBudgetHeader useMemo still exists after patch. Refusing to continue.")
          if 'const declaredMonthlyBudgetAmount = useMemo(() => {' in text:
              raise SystemExit("Old declaredMonthlyBudgetAmount useMemo still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-monthly-budget-header-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-monthly-budget-header-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire dashboard monthly budget header hook"
          git push
