name: One-shot Vercel production redeploy

on:
  push:
    paths:
      - '.github/workflows/one-shot-vercel-redeploy.yml'

permissions:
  contents: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push clean redeploy commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-vercel-redeploy.yml
          git commit -m "Trigger Vercel production redeploy"
          git push origin HEAD:main
