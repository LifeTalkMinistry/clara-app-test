name: Patch finance state sync hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-finance-state-sync-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardFinanceStateSync into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardFinanceStateSync from "@/components/fresh/main-dashboard/finance-content/useDashboardFinanceStateSync";\n'
          import_anchor = 'import useDashboardVisibleFinanceData from "@/components/fresh/main-dashboard/finance-content/useDashboardVisibleFinanceData";\n'
          fallback_anchor = 'import { hasDashboardFinanceContent } from "@/components/fresh/main-dashboard/finance-content/dashboardFinanceContent";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Finance state sync import anchor not found. Refusing to patch Dashboard.jsx.")

          block_start = '  useEffect(() => {\n    const safeWallets = Array.isArray(financeWallets) ? financeWallets : [];\n'

          if 'useDashboardFinanceStateSync({' not in text:
              if block_start not in text:
                  raise SystemExit("Finance state sync useEffect start not found. Refusing to patch Dashboard.jsx.")

              start_index = text.index(block_start)
              end_candidates = [
                  '  const hasVisibleFinanceData = useDashboardVisibleFinanceData({\n',
                  '  const hasVisibleFinanceData = useMemo(\n',
                  '  useFinanceDataErrorNotice({\n',
              ]

              end_index = -1
              for candidate in end_candidates:
                  candidate_index = text.find(candidate, start_index + len(block_start))
                  if candidate_index != -1:
                      if end_index == -1 or candidate_index < end_index:
                          end_index = candidate_index

              if end_index == -1:
                  raise SystemExit("Finance state sync useEffect end not found. Refusing to patch Dashboard.jsx.")

              old_block = text[start_index:end_index]
              required_tokens = [
                  'const safeWalletTransactions = Array.isArray(financeWalletTransactions)',
                  'const safePendingExpenses = safeExpenses.filter(',
                  'const nextWalletMoney = safeWallets.reduce(',
                  'setWallets(safeWallets);',
                  'setWalletTransactions(safeWalletTransactions);',
                  'setEmergencyFund(financeEmergencyFund || null);',
                  'setWalletMoney(nextWalletMoney);',
                  'dashboardPageCache = {',
                  'walletTransactions: safeWalletTransactions,',
                  'pendingExpenses: safePendingExpenses,',
              ]

              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("Finance state sync block content mismatch. Refusing to patch Dashboard.jsx.")

              replacement = (
                  '  const updateDashboardFinanceCache = useCallback((nextFinanceCache) => {\n'
                  '    dashboardPageCache = {\n'
                  '      ...dashboardPageCache,\n'
                  '      ...nextFinanceCache,\n'
                  '    };\n'
                  '  }, []);\n\n'
                  '  useDashboardFinanceStateSync({\n'
                  '    cacheKey,\n'
                  '    financeWallets,\n'
                  '    financeWalletTransactions,\n'
                  '    financeTransfers,\n'
                  '    financeBudgets,\n'
                  '    financeSavingsGoals,\n'
                  '    financeExpenses,\n'
                  '    financeEmergencyFund,\n'
                  '    setWallets,\n'
                  '    setWalletTransactions,\n'
                  '    setTransfers,\n'
                  '    setBudgets,\n'
                  '    setSavingsGoals,\n'
                  '    setEmergencyFund,\n'
                  '    setExpenses,\n'
                  '    setPendingExpenses,\n'
                  '    setOfflineReady,\n'
                  '    setWalletMoney,\n'
                  '    setLoading,\n'
                  '    onCacheUpdate: updateDashboardFinanceCache,\n'
                  '  });\n\n'
              )

              text = text[:start_index] + replacement + text[end_index:]

          if 'useDashboardFinanceStateSync({' not in text:
              raise SystemExit("useDashboardFinanceStateSync was not wired. Refusing to continue.")
          if 'const updateDashboardFinanceCache = useCallback' not in text:
              raise SystemExit("updateDashboardFinanceCache was not added. Refusing to continue.")
          if block_start in text:
              raise SystemExit("Old finance state sync effect start still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-finance-state-sync-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-finance-state-sync-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire dashboard finance state sync hook"
          git push
