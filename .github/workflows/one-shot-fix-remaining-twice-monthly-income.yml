name: One-shot fix remaining twice-monthly income

on:
  push:
    paths:
      - ".github/workflows/one-shot-fix-remaining-twice-monthly-income.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch remaining expected twice-monthly income
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/runtime/installClaraOrbGreeting.js")
          text = path.read_text()

          old = '''  } else if (type === "twice_monthly") {
    const days = Array.isArray(recurrence?.days) ? recurrence.days : [];
    paydays = [...new Set(days.map(Number))].filter(
      (day) => Number.isInteger(day) && day >= 1 && day <= daysInMonth
    ).length;
  } else if (type === "monthly") {'''

          new = '''  } else if (type === "twice_monthly") {
    const days = Array.isArray(recurrence?.days) ? recurrence.days : [];
    const todayDay =
      currentMonthKey === getPHMonthKey()
        ? Number(
            new Intl.DateTimeFormat("en-PH", {
              timeZone: "Asia/Manila",
              day: "numeric",
            }).format(new Date())
          )
        : 1;
    paydays = [...new Set(days.map(Number))].filter(
      (day) =>
        Number.isInteger(day) &&
        day >= 1 &&
        day <= daysInMonth &&
        day >= todayDay
    ).length;
  } else if (type === "monthly") {'''

          if old not in text:
              raise SystemExit("Expected twice_monthly projection block was not found; refusing to patch blindly.")

          updated = text.replace(old, new, 1)
          if updated == text:
              raise SystemExit("Patch made no change.")

          path.write_text(updated)

      - name: Verify surgical rule
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/runtime/installClaraOrbGreeting.js").read_text()
          assert 'timeZone: "Asia/Manila"' in text
          assert 'day >= todayDay' in text
          assert 'currentMonthKey === getPHMonthKey()' in text

      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/installClaraOrbGreeting.js
          git commit -m "Fix remaining twice-monthly income projection"
          git push origin HEAD:main
