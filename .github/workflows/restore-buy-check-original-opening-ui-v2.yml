name: Restore original Buy Check opening UI v2

on:
  push:
    paths:
      - '.github/workflows/restore-buy-check-original-opening-ui-v2.yml'

permissions:
  contents: write

jobs:
  restore-original-opening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original opening
        run: python .github/scripts/restore_buy_check_original_opening.py
      - name: Verify Buy Check
        run: |
          grep -q 'const BUY_CHECK_ACKNOWLEDGMENTS = \[' src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx
          grep -q 'function selectAcknowledgment' src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx
          grep -q 'min-h-\[92px\]' src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx
          grep -q 'data-clara-buy-check-active-question="true"' src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx
          grep -q 'acknowledgmentMessage={acknowledgmentSessionRef.current.message' src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx
          node --check src/lib/clara-buy-check-intelligence-router.js
          node --check src/lib/clara-buy-check-expert-ai.js
          node --test tests/buy-check-progressive-router.test.mjs tests/buy-check-metric-impact.test.mjs tests/buy-check-gemini-authority.test.mjs
      - name: Compile app
        run: |
          npm install --no-audit --no-fund
          npx vite build
      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/restore-buy-check-original-opening-ui.yml .github/workflows/restore-buy-check-original-opening-ui-v2.yml .github/scripts/restore_buy_check_original_opening.py
          git add src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx
          git commit -m "Restore original Buy Check rotating acknowledgment UI"
          git pull --rebase origin main
          git push origin HEAD:main
