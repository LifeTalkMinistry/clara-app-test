name: One-shot fix Means paid-debt baseline v5

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_means_paid_debt_baseline_v5.py'
      - '.github/workflows/one-shot-fix-means-paid-debt-baseline-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Means debt lifecycle
        run: python3 scripts/fix_means_paid_debt_baseline_v5.py

      - name: Syntax check repaired sources
        run: |
          node --check src/runtime/installClaraOrbGreeting.js
          node --check src/lib/debtOccurrenceState.js

      - name: Commit verified repair
        run: |
          if git diff --quiet; then
            echo "Runtime already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/installClaraOrbGreeting.js src/lib/debtOccurrenceState.js
          git commit -m "Exclude early-paid debt occurrences from Means"
          git push
