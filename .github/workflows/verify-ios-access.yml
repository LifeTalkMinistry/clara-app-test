name: Verify iOS Access Admin

on:
  pull_request:
    paths:
      - "src/App.jsx"
      - "src/components/BudgetCard.jsx"
      - "src/components/access/**"
      - "src/lib/ios-access-client.js"
      - "src/pages/admin/IosUserAccess.jsx"
      - "supabase/clara_ios_access_codes.sql"
      - "supabase/functions/clara-ios-access/**"
      - ".github/workflows/verify-ios-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production web build
        run: npm run build:web
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: gemini-2.5-flash
          VITE_CLARA_RUNTIME_MODE: local_only
          VITE_CLARA_AUTH_ENABLED: "false"
          VITE_CLARA_LOCAL_MODE_ENABLED: "true"
