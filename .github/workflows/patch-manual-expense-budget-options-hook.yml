name: Patch manual expense budget options hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-manual-expense-budget-options-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardManualExpenseBudgetOptions into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardManualExpenseBudgetOptions from "@/components/fresh/main-dashboard/budget/useDashboardManualExpenseBudgetOptions";\n'
          import_anchor = 'import useDashboardMonthlyBudgetHeader from "@/components/fresh/main-dashboard/budget/useDashboardMonthlyBudgetHeader";\n'
          fallback_anchor = 'import useDashboardBudgetSummaries from "@/components/fresh/main-dashboard/budget/useDashboardBudgetSummaries";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Manual expense budget options import anchor not found. Refusing to patch Dashboard.jsx.")

          if 'useDashboardManualExpenseBudgetOptions({' not in text:
              block_start = '  const manualExpenseBudgetOptions = useMemo(() => {\n    const currentMonthKey = getPHMonthKey();\n'
              if block_start not in text:
                  raise SystemExit("manualExpenseBudgetOptions useMemo start not found. Refusing to patch Dashboard.jsx.")

              start_index = text.index(block_start)
              block_end = '  }, [budgets]);\n\n'
              end_index = text.find(block_end, start_index)
              if end_index == -1:
                  raise SystemExit("manualExpenseBudgetOptions useMemo end not found. Refusing to patch Dashboard.jsx.")
              end_index += len(block_end)

              old_block = text[start_index:end_index]
              required_tokens = [
                  'const seen = new Set();',
                  'return budgets',
                  'const isHeader =',
                  'normalizeLower(budget?.category) === "__monthly_budget__"',
                  'getBudgetListTitle(budget)',
                  'getBudgetNeedType(budget)',
                  'allocated: firstValidNumber(',
                  'const signature = normalizeLower(item.title);',
                  'seen.add(signature);',
                  '.sort((a, b) => a.sortOrder - b.sortOrder || a.title.localeCompare(b.title));',
              ]

              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("manualExpenseBudgetOptions block content mismatch. Refusing to patch Dashboard.jsx.")

              replacement = (
                  '  const manualExpenseBudgetOptions =\n'
                  '    useDashboardManualExpenseBudgetOptions({\n'
                  '      budgets,\n'
                  '    });\n\n'
              )

              text = text[:start_index] + replacement + text[end_index:]

          if 'useDashboardManualExpenseBudgetOptions({' not in text:
              raise SystemExit("useDashboardManualExpenseBudgetOptions was not wired. Refusing to continue.")
          if 'const manualExpenseBudgetOptions = useMemo(() => {' in text:
              raise SystemExit("Old manualExpenseBudgetOptions useMemo still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-manual-expense-budget-options-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-manual-expense-budget-options-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire manual expense budget options hook"
          git push
