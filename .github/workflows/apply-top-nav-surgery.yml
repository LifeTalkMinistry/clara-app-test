name: Verify top nav ownership surgery

on:
  push:
    branches:
      - fix-top-nav-ownership
    paths:
      - ".github/workflows/apply-top-nav-surgery.yml"
      - "package.json"
      - "src/**"
      - "tests/dashboard-top-nav-ownership.test.mjs"
      - "tests/settings-local-only-regression.test.mjs"
      - "tests/settings-integrity-regression.test.mjs"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix-top-nav-ownership

      - name: Install dependencies
        run: npm ci

      - name: Run full regression suite
        run: npm test

      - name: Build production app
        run: npm run build
