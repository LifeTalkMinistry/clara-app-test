name: Apply top nav ownership surgery

on:
  push:
    branches:
      - fix-top-nav-ownership
    paths:
      - ".github/workflows/apply-top-nav-surgery.yml"
      - ".github/scripts/apply-dashboard-top-nav-surgery.mjs"
      - ".github/scripts/apply-settings-react-ownership.mjs"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix-top-nav-ownership
          fetch-depth: 0

      - name: Apply top nav surgery
        run: |
          set +e
          mkdir -p .github/diagnostics
          {
            echo "=== Dashboard and top nav surgery ==="
            node .github/scripts/apply-dashboard-top-nav-surgery.mjs
            first_status=$?
            echo "dashboard_script_status=$first_status"
            if [ "$first_status" -ne 0 ]; then
              exit "$first_status"
            fi
            echo "=== Settings React ownership ==="
            node .github/scripts/apply-settings-react-ownership.mjs
            second_status=$?
            echo "settings_script_status=$second_status"
            exit "$second_status"
          } > .github/diagnostics/top-nav-surgery.log 2>&1
          status=$?
          cat .github/diagnostics/top-nav-surgery.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/diagnostics/top-nav-surgery.log
            git commit -m "Capture top nav surgery failure" || true
            git push origin HEAD:fix-top-nav-ownership || true
            exit "$status"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No top nav ownership changes were produced."
            exit 0
          fi
          git commit -m "Refactor dashboard top nav ownership"
          git push origin HEAD:fix-top-nav-ownership
