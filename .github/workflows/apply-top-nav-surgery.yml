name: Apply top nav ownership surgery

on:
  push:
    branches:
      - fix-top-nav-ownership
    paths:
      - ".github/workflows/apply-top-nav-surgery.yml"
      - ".github/scripts/apply-dashboard-top-nav-surgery.mjs"
      - ".github/scripts/apply-settings-react-ownership.mjs"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix-top-nav-ownership
          fetch-depth: 0

      - name: Normalize Settings surgery anchors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-settings-react-ownership.mjs')
          source = path.read_text()
          label = '"Plan to support navigation"'
          label_index = source.index(label)
          block_start = source.rfind('\nreplaceOnce(', 0, label_index)
          block_end = source.index('\n);', label_index) + len('\n);')
          if block_start < 0:
              raise RuntimeError('Plan support replacement block was not found')
          path.write_text(source[:block_start] + source[block_end:])
          PY

      - name: Apply top nav surgery
        id: apply-surgery
        run: |
          set +e
          mkdir -p .github/diagnostics
          {
            echo "=== Dashboard and top nav surgery ==="
            node .github/scripts/apply-dashboard-top-nav-surgery.mjs
            first_status=$?
            echo "dashboard_script_status=$first_status"
            if [ "$first_status" -ne 0 ]; then
              exit "$first_status"
            fi
            echo "=== Settings React ownership ==="
            node .github/scripts/apply-settings-react-ownership.mjs
            second_status=$?
            echo "settings_script_status=$second_status"
            if [ "$second_status" -ne 0 ]; then
              exit "$second_status"
            fi
            echo "=== Plan support navigation ==="
            python - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx')
          source = path.read_text()
          source, count = re.subn(
              r'onClick=\{\(\) => \{\s*setSettingsNotice\(null\);\s*setActiveSetting\("support"\);\s*\}\}',
              'onClick={() => openSetting("support")}',
              source,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f'Expected one Plan support navigation block, found {count}')
          path.write_text(source)
          PY
            third_status=$?
            echo "plan_support_status=$third_status"
            exit "$third_status"
          } > .github/diagnostics/top-nav-surgery.log 2>&1
          status=$?
          cat .github/diagnostics/top-nav-surgery.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload surgery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-nav-surgery-diagnostics
          path: .github/diagnostics/top-nav-surgery.log
          if-no-files-found: warn

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No top nav ownership changes were produced."
            exit 0
          fi
          git commit -m "Refactor dashboard top nav ownership"
          git push origin HEAD:fix-top-nav-ownership
