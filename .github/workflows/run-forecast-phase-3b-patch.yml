name: Run Means migration baseline repair

on:
  push:
    paths:
      - ".github/forecast-phase-3b-trigger.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Means migration repair
        run: python scripts/fix_means_score_transfer_baseline.py

      - name: Run focused regression tests
        run: node --test tests/means-score-transfer-baseline-regression.test.mjs tests/means-score-context-baseline-regression.test.mjs

      - name: Restore runner and remove temporary script
        run: |
          git checkout HEAD^ -- .github/workflows/run-forecast-phase-3b-patch.yml
          rm -f scripts/fix_means_score_transfer_baseline.py

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source change needed."
            exit 0
          fi
          git commit -m "Fix migrated Means Score baseline authority"
          git push origin HEAD:main
