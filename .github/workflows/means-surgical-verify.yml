name: Means surgical verification

on:
  push:
    branches:
      - codex/means-score-final-surgical

permissions:
  contents: write

jobs:
  verify-and-apply-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: codex/means-score-final-surgical
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply deterministic ORB runtime surgery
        run: python scripts/apply_final_means_runtime.py

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit verified runtime surgery
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated runtime changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/installClaraOrbGreeting.js
          git commit -m "Wire ORB to final Means Score authority"
          git push origin HEAD:codex/means-score-final-surgical
