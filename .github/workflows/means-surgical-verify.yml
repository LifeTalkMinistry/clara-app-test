name: Means surgical verification

on:
  push:
    branches:
      - codex/means-score-final-surgical

permissions:
  contents: write

jobs:
  verify-and-apply-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: codex/means-score-final-surgical
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic ORB runtime surgery
        run: python3 scripts/apply_final_means_runtime.py

      - name: Syntax checks
        run: |
          python3 -m py_compile scripts/apply_final_means_runtime.py
          node --check src/runtime/installClaraOrbGreeting.js
          node --check src/lib/clara-financial-day.js
          node --check src/lib/clara-means-cycle-baseline.js
          node --check src/lib/clara-means-authority.js
          node --check src/lib/debtOccurrenceState.js
          node --check src/lib/weeklyMoneyCheckReconciliationRepository.js

      - name: Run focused Means regressions
        run: |
          node --test tests/means-score-context-baseline-regression.test.mjs
          node --test tests/means-score-single-authority-regression.test.mjs

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run full regression suite
        run: npm test

      - name: Build web production bundle
        run: npm run build:web

      - name: Build Android production bundle
        run: npm run build:android

      - name: Commit verified runtime surgery
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated runtime changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/installClaraOrbGreeting.js
          git commit -m "Wire ORB to final Means Score authority"
          git push origin HEAD:codex/means-score-final-surgical
