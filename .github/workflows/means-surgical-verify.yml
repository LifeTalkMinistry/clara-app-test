name: Means surgical verification

on:
  push:
    branches:
      - codex/means-score-final-surgical

permissions:
  contents: read

jobs:
  verify-final-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: codex/means-score-final-surgical
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax checks
        run: |
          node --check src/runtime/installClaraOrbGreeting.js
          node --check src/lib/clara-financial-day.js
          node --check src/lib/clara-means-cycle-baseline.js
          node --check src/lib/clara-means-authority.js
          node --check src/lib/debtOccurrenceState.js
          node --check src/lib/debtObligationStore.js
          node --check src/lib/debtPaymentRepository.js
          node --check src/lib/weeklyMoneyCheckReconciliationRepository.js

      - name: Run focused Means regressions
        run: |
          node --test tests/means-score-context-baseline-regression.test.mjs
          node --test tests/means-score-single-authority-regression.test.mjs
          node --test tests/means-score-final-acceptance-regression.test.mjs

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run full regression suite
        run: npm test

      - name: Build web production bundle
        run: npm run build:web

      - name: Build Android production bundle
        run: npm run build:android
