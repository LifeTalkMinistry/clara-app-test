name: Verify Tutorial Real ORB

on:
  pull_request:
    paths:
      - "src/components/community/ClaraOrbPage.jsx"
      - "src/pages/onboarding/ClaraTutorialOrbIntro.jsx"
      - "src/pages/onboarding/ClaraTutorialOrbDemo.jsx"
      - "src/pages/onboarding/ClaraCoreTutorial.jsx"
      - "src/runtime/installClaraOrbGreeting.js"
      - "src/runtime/installClaraOrbIdleLife.js"
      - "tests/clara-tutorial-orb-real-surface.test.mjs"
      - "tests/clara-tutorial-orb-visual.mjs"
      - "tests/visual/clara-tutorial-orb.html"
      - "tests/visual/clara-tutorial-orb-harness.jsx"
      - "tests/clara-financial-context-income-visual.mjs"
      - "tests/visual/clara-financial-context-income.html"
      - "tests/visual/clara-financial-context-income-harness.jsx"
      - ".github/workflows/verify-tutorial-real-orb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_CLARA_RUNTIME_MODE: local_only
      VITE_CLARA_AUTH_ENABLED: "false"
      VITE_CLARA_LOCAL_MODE_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify tutorial ORB ownership and isolation
        run: node --test tests/clara-tutorial-orb-real-surface.test.mjs

      - name: Install visual browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start visual harness
        run: |
          npx vite --host 127.0.0.1 --port 4173 > /tmp/clara-tutorial-vite.log 2>&1 &
          echo $! > /tmp/clara-tutorial-vite.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/tests/visual/clara-tutorial-orb.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clara-tutorial-vite.log
          exit 1

      - name: Verify Juan greeting, live ORB blink, six viewports, and tutorial interaction
        env:
          CLARA_VISUAL_BASE_URL: http://127.0.0.1:4173
        run: node tests/clara-tutorial-orb-visual.mjs

      - name: Diagnose Financial Context Add Income resume lifecycle
        env:
          CLARA_VISUAL_BASE_URL: http://127.0.0.1:4173
        run: node tests/clara-financial-context-income-visual.mjs

      - name: Run repository production build gate
        run: npm run build

      - name: Upload ORB visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clara-tutorial-orb-visuals
          path: artifacts/tutorial-orb
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Add Income diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clara-add-income-resume-diagnostic
          path: artifacts/add-income-diagnostic
          if-no-files-found: warn
          retention-days: 7
