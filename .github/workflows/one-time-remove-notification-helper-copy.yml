name: One-time Notifications helper copy cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-remove-notification-helper-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove only redundant Notifications helper copy
        shell: python
        run: |
          from pathlib import Path

          dashboard_path = Path("src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx")
          dashboard = dashboard_path.read_text(encoding="utf-8")
          old_header = '<DetailHeader title="Notifications" subtitle="Control how and when CLARA gets your attention." />'
          new_header = '<DetailHeader title="Notifications" />'
          assert dashboard.count(old_header) == 1, "Notifications subtitle authority changed; refusing broad edit"
          dashboard = dashboard.replace(old_header, new_header, 1)
          dashboard_path.write_text(dashboard, encoding="utf-8")

          panel_path = Path("src/components/notifications/NotificationSettingsPanel.jsx")
          panel = panel_path.read_text(encoding="utf-8")
          old_family_copy = '''          <p className="mt-1 text-xs leading-5 text-white/40">
            CLARA only notifies you about meaningful actions—not simply because you have not opened the app.
          </p>
          '''
          assert panel.count(old_family_copy) == 1, "Notification Families helper authority changed; refusing broad edit"
          panel = panel.replace(old_family_copy, "", 1)
          panel_path.write_text(panel, encoding="utf-8")

          assert "Control how and when CLARA gets your attention." not in dashboard
          assert "CLARA only notifies you about meaningful actions" not in panel
          assert "Notification families" in panel
          assert "Remind me when today’s CLARA check-in is still incomplete." in panel

      - name: Commit surgical copy cleanup
        run: |
          git config user.name "LifeTalk Ministry"
          git config user.email "96472293+LifeTalkMinistry@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx src/components/notifications/NotificationSettingsPanel.jsx
          git commit -m "Remove redundant Notifications helper copy"
          git pull --rebase origin main
          git push origin HEAD:main
