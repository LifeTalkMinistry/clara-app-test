name: Fix finance actions hook wire

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Dashboard.jsx safely
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/Dashboard.jsx')
          s = p.read_text()

          imp = 'import useDashboardFinanceActions from "@/components/fresh/main-dashboard/finance-form/useDashboardFinanceActions";\n'
          anchor = 'import useManualExpenseBudgetListKey from "@/components/fresh/main-dashboard/finance-form/useManualExpenseBudgetListKey";\n'
          if imp not in s:
              if anchor not in s:
                  raise SystemExit('finance actions import anchor not found')
              s = s.replace(anchor, anchor + imp, 1)

          def end_stmt(src, start):
              paren = brace = bracket = 0
              quote = None
              esc = False
              line = block = False
              i = start
              while i < len(src):
                  c = src[i]
                  n = src[i+1] if i + 1 < len(src) else ''
                  if line:
                      line = c != '\n'
                      i += 1
                      continue
                  if block:
                      if c == '*' and n == '/':
                          block = False
                          i += 2
                      else:
                          i += 1
                      continue
                  if quote:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue
                  if c == '/' and n == '/':
                      line = True
                      i += 2
                      continue
                  if c == '/' and n == '*':
                      block = True
                      i += 2
                      continue
                  if c in ('"', "'", '`'):
                      quote = c
                  elif c == '(':
                      paren += 1
                  elif c == ')':
                      paren -= 1
                  elif c == '{':
                      brace += 1
                  elif c == '}':
                      brace -= 1
                  elif c == '[':
                      bracket += 1
                  elif c == ']':
                      bracket -= 1
                  elif c == ';' and paren == 0 and brace == 0 and bracket == 0:
                      return i + 1
                  i += 1
              return -1

          names = [
              'saveManualExpenseInline','addMoneyInline','transferMoneyInline','saveWalletInline',
              'deleteWalletInline','saveBudgetInline','deleteBudgetCategoryInline','resetBudgetInline',
              'saveSavingsGoalInline','deleteSavingsGoalInline','addSavingsInline','deleteExpenseInline'
          ]

          hook = '''  const {
    saveManualExpenseInline,
    addMoneyInline,
    transferMoneyInline,
    saveWalletInline,
    deleteWalletInline,
    saveBudgetInline,
    deleteBudgetCategoryInline,
    resetBudgetInline,
    saveSavingsGoalInline,
    deleteSavingsGoalInline,
    addSavingsInline,
    deleteExpenseInline,
  } = useDashboardFinanceActions({
    financeForm,
    financeModal,
    selectedManualExpenseBudget,
    manualExpenseIsUnplanned,
    manualExpenseIsUndocumented,
    manualExpenseReason,
    manualExpenseUndocumentedReason,
    monthlyBudgetPlan,
    addExpenseData,
    updateExpenseData,
    deleteExpenseData,
    addWalletData,
    updateWalletData,
    deleteWalletData,
    addIncomeData,
    transferBetweenWalletsData,
    addBudgetData,
    updateBudgetData,
    deleteBudgetData,
    addSavingsGoalData,
    updateSavingsGoalData,
    deleteSavingsGoalData,
    refreshFinancialData,
    scheduleRefresh,
    closeFinanceModal,
    showFinanceNotice,
    setFinanceActionLoading,
    setFinanceForm,
    setBudgetExitConfirm,
  });

'''

          if 'useDashboardFinanceActions({' not in s:
              ranges = []
              for name in names:
                  marker = f'  const {name} = '
                  start = s.find(marker)
                  if start == -1:
                      continue
                  end = end_stmt(s, start)
                  if end == -1:
                      raise SystemExit(f'{name} end not found')
                  block = s[start:end]
                  if 'useCallback' not in block:
                      continue
                  if s[end:end+2] == '\n\n':
                      end += 2
                  elif s[end:end+1] == '\n':
                      end += 1
                  ranges.append((start, end))

              if ranges:
                  ranges.sort()
                  insert = ranges[0][0]
                  out = []
                  cursor = 0
                  added = False
                  for start, end in ranges:
                      out.append(s[cursor:start])
                      if not added:
                          out.append(hook)
                          added = True
                      cursor = end
                  out.append(s[cursor:])
                  s = ''.join(out)
              else:
                  marker = '  const manualExpenseBudgetListItems ='
                  start = s.find(marker)
                  if start == -1:
                      raise SystemExit('manualExpenseBudgetListItems not found')
                  end = end_stmt(s, start)
                  if end == -1:
                      raise SystemExit('manualExpenseBudgetListItems end not found')
                  if s[end:end+2] == '\n\n':
                      end += 2
                  elif s[end:end+1] == '\n':
                      end += 1
                  s = s[:end] + hook + s[end:]

          if 'useDashboardFinanceActions({' not in s:
              raise SystemExit('finance actions hook not wired')
          if 'const saveWalletInline = useCallback' in s:
              raise SystemExit('old saveWalletInline still exists')

          p.write_text(s)
          Path('.github/workflows/patch-dashboard-finance-actions-hook.yml').unlink(missing_ok=True)
          Path('.github/workflows/fix-finance-actions-wire.yml').unlink(missing_ok=True)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-dashboard-finance-actions-hook.yml .github/workflows/fix-finance-actions-wire.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix finance actions hook wiring"
          git push
