name: Validate CLARA PDF paper swipe transition

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    if: github.event.pull_request.head.ref == 'clara-paper-swipe-implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply surgical page-turn patch
        run: python .clara-paper-swipe-trigger.py

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build web app
        run: npm run build:web

      - name: Verify and commit validated implementation
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/clara-paper-swipe-surgical.yml
          git rm .clara-paper-swipe-trigger.py

          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            ".clara-paper-swipe-trigger.py"
            ".github/workflows/clara-paper-swipe-surgical.yml"
            "src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx"
          )

          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[@]}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx
          git commit -m "feat: add premium PDF paper swipe transition"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
