      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build web app
        run: npm run build:web

      - name: Verify surgical diff
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/clara-paper-swipe-surgical.yml
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            ".github/workflows/clara-paper-swipe-surgical.yml"
            "src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx"
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[@]}"
            exit 1
          fi

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx
          git commit -m "feat: add premium PDF paper swipe transition"
          git push origin HEAD:main
