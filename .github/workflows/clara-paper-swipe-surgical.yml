name: Apply CLARA PDF paper swipe transition

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/clara-paper-swipe-surgical.yml

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply surgical page-turn patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx")
          content = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global content
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              content = content.replace(old, new, 1)

