name: Run final budget review refinement
on:
  push:
    branches: [main]
    paths:
      - scripts/refine_final_budget_review.py
      - .github/workflows/run-final-budget-review-refinement.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/refine_final_budget_review.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Show exact budget items in final review
          file_pattern: src/pages/monthly-budget-plan/MonthlyBudgetPlanGuided.jsx
