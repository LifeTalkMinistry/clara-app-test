# One-time cleanup: remove the two highlighted Budget Items explanations.
name: Remove budget setup copy

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: remove-budget-setup-copy
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove highlighted explanations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/monthly-budget-plan/MonthlyBudgetPlanGuided.jsx')
          text = path.read_text(encoding='utf-8')

          body_line = '              body="Add each expense or responsibility one at a time. CLARA will calculate your real budget total as you go."\n'
          if body_line not in text:
              raise SystemExit('Top Budget Items explanation was not found.')
          text = text.replace(body_line, '', 1)

          empty_state = '''            ) : (
              <div className="mt-5 rounded-2xl border border-white/8 bg-black/12 p-4 text-sm font-semibold leading-6 text-white/45">
                You can continue without a regular item if this budget will contain only protected money or a confirmed obligation.
              </div>
            )}'''
          if empty_state not in text:
              raise SystemExit('Empty-state explanation was not found.')
          text = text.replace(empty_state, '            ) : null}', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit and clean up workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-budget-setup-copy.yml
          git add src/pages/monthly-budget-plan/MonthlyBudgetPlanGuided.jsx
          git commit -m "Remove redundant budget setup explanations"
          git push origin HEAD:main
