name: CLARA Schedule Authority Repair

on:
  push:
    branches:
      - fix/calendar-financial-derived-state

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.event.head_commit.message == 'Bootstrap CLARA Schedule authority repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply surgical Schedule authority repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)

          def replace_once(path, old, new, label):
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              write(path, source.replace(old, new, 1))

          write("src/lib/financialCardScheduleProjection.js", r'''import {
            getDebtBalance,
            getDebtDueDay,
            getDebtTitleValue,
            getMonthlyDebtPayment,
            isActiveDebtObligation,
          } from "./debtObligationMath.js";
          import {
            getRecurrenceOccurrences,
            toLocalDateKey,
          } from "./recurringCashFlowRepository.js";

          export const SAVINGS_GOAL_SCHEDULE_SOURCE = "savings_goal_card_projection";
          export const DEBT_OBLIGATION_SCHEDULE_SOURCE = "debt_obligation_card_projection";

          const SAVINGS_GOAL_ID_PREFIX = "savings-goal-schedule-";
          const DEBT_OBLIGATION_ID_PREFIX = "debt-obligation-schedule-";

          function cleanText(value) {
            return String(value ?? "").replace(/\s+/g, " ").trim();
          }

          function cleanMoney(value) {
            const amount = Number(String(value ?? "").replace(/[₱,\s]/g, ""));
            return Number.isFinite(amount) ? Math.max(0, amount) : 0;
          }

          function formatMoney(value) {
            return cleanMoney(value).toLocaleString("en-PH", {
              maximumFractionDigits: 2,
            });
          }

          function getSavingsGoalDate(goal = {}) {
            return toLocalDateKey(
              goal.planned_use_date ||
                goal.plannedUseDate ||
                goal.due_date ||
                goal.dueDate ||
                goal.target_date ||
                goal.targetDate ||
                ""
            );
          }

          function getSavingsGoalTitle(goal = {}) {
            return (
              cleanText(goal.title || goal.name || goal.goal_name || goal.goalName) ||
              "Savings Goal"
            );
          }

          function getSavingsGoalTarget(goal = {}) {
            return cleanMoney(
              goal.target_amount ??
                goal.targetAmount ??
                goal.goal_amount ??
                goal.goalAmount ??
                goal.target ??
                goal.amount
            );
          }

          function getSavingsGoalSaved(goal = {}) {
            return cleanMoney(
              goal.saved_amount ??
                goal.savedAmount ??
                goal.current_amount ??
                goal.currentAmount ??
                goal.saved ??
                goal.progress_amount ??
                goal.progressAmount ??
                goal.amount_saved
            );
          }

          function isSavingsGoalActive(goal = {}) {
            const status = cleanText(goal.status).toLowerCase();
            return !(
              goal.deletedAt ||
              goal.deleted_at ||
              goal.is_archived === true ||
              goal.isArchived === true ||
              ["deleted", "archived", "cancelled", "canceled"].includes(status)
            );
          }

          export function buildSavingsGoalScheduleProjection(goals = []) {
            return (Array.isArray(goals) ? goals : [])
              .filter(isSavingsGoalActive)
              .map((goal) => {
                const id = cleanText(goal.id || goal.goal_id || goal.goalId);
                const date = getSavingsGoalDate(goal);
                if (!id || !date) return null;

                const title = getSavingsGoalTitle(goal);
                const target = getSavingsGoalTarget(goal);
                const saved = getSavingsGoalSaved(goal);
                const remaining = Math.max(target - saved, 0);
                const note =
                  target > 0
                    ? remaining > 0
                      ? `${title} is planned for ${date}. ₱${formatMoney(saved)} is already saved and ₱${formatMoney(remaining)} remains before the ₱${formatMoney(target)} target.`
                      : `${title} is planned for ${date}. The ₱${formatMoney(target)} target is already funded, so protect that money until the planned use date.`
                    : `${title} is planned for ${date}. Keep this future use visible before optional spending.`;

                return {
                  id: `${SAVINGS_GOAL_ID_PREFIX}${id}-${date}`,
                  title,
                  date,
                  time: "",
                  type: "Money",
                  amount: target > 0 ? target : "",
                  direction: "out",
                  note,
                  impactBreakdown: [
                    {
                      direction: "out",
                      amount: target,
                      savedAmount: saved,
                      remainingAmount: remaining,
                      source: "savings_goal",
                    },
                  ],
                  source: SAVINGS_GOAL_SCHEDULE_SOURCE,
                  savingsGoalId: id,
                  savings_goal_id: id,
                  derived: true,
                  editable: false,
                };
              })
              .filter(Boolean);
          }

          function getDebtProjectionRange(referenceDate = new Date()) {
            const now = new Date(referenceDate);
            const safeNow = Number.isNaN(now.getTime()) ? new Date() : now;
            return {
              start: toLocalDateKey(new Date(safeNow.getFullYear(), 0, 1)),
              end: toLocalDateKey(new Date(safeNow.getFullYear() + 1, 11, 31)),
            };
          }

          function getDebtOccurrenceDates(record = {}, referenceDate = new Date()) {
            const dueDay = getDebtDueDay(record);
            const range = getDebtProjectionRange(referenceDate);

            if (dueDay) {
              return getRecurrenceOccurrences(
                {
                  type: "monthly",
                  startDate: range.start,
                  dayOfMonth: dueDay,
                },
                range.start,
                range.end,
                { kind: "bill" }
              );
            }

            const oneTimeDate = toLocalDateKey(record.dueDate || record.due_date || "");
            return oneTimeDate ? [oneTimeDate] : [];
          }

          export function buildDebtObligationScheduleProjection(
            records = [],
            { referenceDate = new Date() } = {}
          ) {
            return (Array.isArray(records) ? records : [])
              .filter(isActiveDebtObligation)
              .flatMap((record) => {
                const id = cleanText(record.id || record.debt_id || record.debtId);
                if (!id) return [];

                const title = getDebtTitleValue(record);
                const monthlyPayment = getMonthlyDebtPayment(record);
                const balance = getDebtBalance(record);
                if (monthlyPayment <= 0) return [];

                return getDebtOccurrenceDates(record, referenceDate).map((date) => ({
                  id: `${DEBT_OBLIGATION_ID_PREFIX}${id}-${date}`,
                  title: `${title} payment`,
                  date,
                  time: "",
                  type: "Bill",
                  amount: monthlyPayment,
                  direction: "out",
                  note:
                    balance > 0
                      ? `${title} requires ₱${formatMoney(monthlyPayment)} on ${date}. Remaining documented balance: ₱${formatMoney(balance)}.`
                      : `${title} requires ₱${formatMoney(monthlyPayment)} on ${date}. This is an ongoing monthly obligation.`,
                  impactBreakdown: [
                    {
                      direction: "out",
                      amount: monthlyPayment,
                      remainingBalance: balance,
                      source: "debt_obligation",
                    },
                  ],
                  source: DEBT_OBLIGATION_SCHEDULE_SOURCE,
                  debtObligationId: id,
                  debt_obligation_id: id,
                  derived: true,
                  editable: false,
                }));
              });
          }

          export function isFinancialCardScheduleProjection(event = {}) {
            const id = cleanText(event.id);
            const source = cleanText(event.source).toLowerCase();
            return (
              id.startsWith(SAVINGS_GOAL_ID_PREFIX) ||
              id.startsWith(DEBT_OBLIGATION_ID_PREFIX) ||
              source === SAVINGS_GOAL_SCHEDULE_SOURCE ||
              source === DEBT_OBLIGATION_SCHEDULE_SOURCE
            );
          }
          ''')

          write("src/lib/scheduleEventOwnership.js", r'''import { isFinancialCardScheduleProjection } from "./financialCardScheduleProjection.js";
          import { isStableIncomeScheduleProjection } from "./stableIncomeScheduleProjection.js";

          const cleanText = (value) => String(value ?? "").trim();

          export function isDerivedScheduleProjection(event = {}) {
            return (
              isStableIncomeScheduleProjection(event) ||
              isFinancialCardScheduleProjection(event)
            );
          }

          export function isScheduleOwnedEvent(event = {}) {
            return Boolean(
              cleanText(event?.id) &&
                cleanText(event?.title) &&
                cleanText(event?.date) &&
                !isDerivedScheduleProjection(event)
            );
          }

          export function filterScheduleOwnedEvents(events = []) {
            return (Array.isArray(events) ? events : []).filter(isScheduleOwnedEvent);
          }

          export function mergeScheduleEventCollections(...collections) {
            const merged = collections.flatMap((collection) =>
              Array.isArray(collection) ? collection.filter(Boolean) : []
            );
            const seenIds = new Set();

            return merged.filter((event) => {
              const id = cleanText(event?.id);
              if (!id || seenIds.has(id)) return false;
              seenIds.add(id);
              return true;
            });
          }
          ''')

          write("src/components/fresh/main-dashboard/dashboard-panels/schedule/financialCardScheduleIntegration.js", r'''import { getSavingsGoals } from "@/lib/financeRepository";
          import { getDebtObligations } from "@/lib/debtObligationStore";
          import { getEffectiveDemoFinanceLocalUserId } from "@/lib/demo/activeDemoProfile";
          import {
            buildDebtObligationScheduleProjection,
            buildSavingsGoalScheduleProjection,
          } from "@/lib/financialCardScheduleProjection";

          export {
            DEBT_OBLIGATION_SCHEDULE_SOURCE,
            SAVINGS_GOAL_SCHEDULE_SOURCE,
            buildDebtObligationScheduleProjection,
            buildSavingsGoalScheduleProjection,
            isFinancialCardScheduleProjection,
          } from "@/lib/financialCardScheduleProjection";

          export async function loadFinancialCardScheduleProjections({
            referenceDate = new Date(),
          } = {}) {
            const financeLocalUserId = getEffectiveDemoFinanceLocalUserId();
            const [savingsGoals, debtObligations] = await Promise.all([
              getSavingsGoals(financeLocalUserId),
              getDebtObligations(financeLocalUserId),
            ]);

            return {
              savingsGoalEvents: buildSavingsGoalScheduleProjection(savingsGoals),
              debtEvents: buildDebtObligationScheduleProjection(debtObligations, {
                referenceDate,
              }),
              financeLocalUserId,
            };
          }
          ''')

          dashboard = "src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardSchedulePanel.jsx"

          replace_once(
              dashboard,
              '''import {\n  buildStableIncomeScheduleProjection,\n  isStableIncomeScheduleProjection,\n  mergeScheduleEventsForRender,\n} from "@/lib/stableIncomeScheduleProjection";\n''',
              '''import {\n  buildStableIncomeScheduleProjection,\n  isStableIncomeScheduleProjection,\n  mergeScheduleEventsForRender,\n} from "@/lib/stableIncomeScheduleProjection";\nimport { isFinancialCardScheduleProjection } from "@/lib/financialCardScheduleProjection";\nimport {\n  filterScheduleOwnedEvents,\n  isDerivedScheduleProjection,\n  mergeScheduleEventCollections,\n} from "@/lib/scheduleEventOwnership";\nimport { loadFinancialCardScheduleProjections } from "./financialCardScheduleIntegration";\n''',
              "Dashboard imports",
          )

          replace_once(
              dashboard,
              '''const INCOME_HUB_UPDATED_EVENT = "clara-income-hub-updated";\n''',
              '''const INCOME_HUB_UPDATED_EVENT = "clara-income-hub-updated";\nconst FINANCIAL_CARD_SCHEDULE_UPDATE_EVENTS = [\n  "clara-finance-updated",\n  "clara:finance-data-updated",\n  "clara-local-finance-updated",\n  "clara:debt-obligations-updated",\n  "clara:demo-data-loaded",\n];\n''',
              "Dashboard finance event constants",
          )

          replace_once(
              dashboard,
              '''    return parsed.filter((event) => {\n      const title = String(event?.title || "").toLowerCase();\n      const isOldSampleCheckin =\n        event?.id === "sample-reset" ||\n        event?.id === "sample-checkin" ||\n        title.includes("lifeos check-in");\n\n      return (\n        event?.id &&\n        event?.title &&\n        event?.date &&\n        !isOldSampleCheckin &&\n        !isStableIncomeScheduleProjection(event)\n      );\n    });\n''',
              '''    return filterScheduleOwnedEvents(parsed).filter((event) => {\n      const title = String(event?.title || "").toLowerCase();\n      const isOldSampleCheckin =\n        event?.id === "sample-reset" ||\n        event?.id === "sample-checkin" ||\n        title.includes("lifeos check-in");\n\n      return !isOldSampleCheckin;\n    });\n''',
              "Dashboard persisted-event read filter",
          )

          replace_once(
              dashboard,
              '''    const persistedEvents = (Array.isArray(events) ? events : []).filter(\n      (event) => !isStableIncomeScheduleProjection(event)\n    );\n''',
              '''    const persistedEvents = filterScheduleOwnedEvents(events);\n''',
              "Dashboard persisted-event save filter",
          )

          replace_once(
              dashboard,
              '''  const managedStableIncomeEvent =\n    !adding && isStableIncomeScheduleProjection(event);\n''',
              '''  const managedStableIncomeEvent =\n    !adding && isStableIncomeScheduleProjection(event);\n  const managedFinancialCardEvent =\n    !adding && isFinancialCardScheduleProjection(event);\n''',
              "Dashboard managed derived event flags",
          )

          replace_once(
              dashboard,
              '''            {managedStableIncomeEvent ? (\n              <div className="rounded-2xl border border-cyan-300/12 bg-cyan-300/[.035] px-4 py-3 text-center text-xs font-bold leading-5 text-cyan-50/62">\n                Payday timing is managed in Income Hub.\n              </div>\n            ) : (\n              <button\n                type="button"\n                onClick={() => onRemove(event.id)}\n                className="flex w-full items-center justify-center gap-2 rounded-2xl border border-white/10 bg-white/[.035] px-4 py-3 text-sm font-black text-white/58"\n              >\n                <Trash2 className="h-4 w-4" /> Remove schedule\n              </button>\n            )}\n''',
              '''            {managedStableIncomeEvent ? (\n              <div className="rounded-2xl border border-cyan-300/12 bg-cyan-300/[.035] px-4 py-3 text-center text-xs font-bold leading-5 text-cyan-50/62">\n                Payday timing is managed in Income Hub.\n              </div>\n            ) : managedFinancialCardEvent ? (\n              <div className="rounded-2xl border border-cyan-300/12 bg-cyan-300/[.035] px-4 py-3 text-center text-xs font-bold leading-5 text-cyan-50/62">\n                This date is managed from its Savings Goal or Debt / Obligation.\n              </div>\n            ) : (\n              <button\n                type="button"\n                onClick={() => onRemove(event.id)}\n                className="flex w-full items-center justify-center gap-2 rounded-2xl border border-white/10 bg-white/[.035] px-4 py-3 text-sm font-black text-white/58"\n              >\n                <Trash2 className="h-4 w-4" /> Remove schedule\n              </button>\n            )}\n''',
              "Dashboard read-only financial projection UI",
          )

          replace_once(
              dashboard,
              '''  const [events, setEvents] = useState(() => readEvents(user));\n  const [incomeProjectedEvents, setIncomeProjectedEvents] = useState([]);\n''',
              '''  const [events, setEvents] = useState(() => readEvents(user));\n  const [incomeProjectedEvents, setIncomeProjectedEvents] = useState([]);\n  const [financialProjectedEvents, setFinancialProjectedEvents] = useState([]);\n''',
              "Dashboard financial projection state",
          )

          income_effect_tail = '''  }, [ownerId]);\n\n  const renderEvents = useMemo(\n    () => mergeScheduleEventsForRender(events, incomeProjectedEvents),\n    [events, incomeProjectedEvents]\n  );\n'''
          financial_effect = '''  }, [ownerId]);\n\n  useEffect(() => {\n    if (typeof window === "undefined") return undefined;\n\n    let cancelled = false;\n    let requestRevision = 0;\n\n    const refreshFinancialProjection = async () => {\n      const revision = ++requestRevision;\n\n      try {\n        const { savingsGoalEvents, debtEvents } =\n          await loadFinancialCardScheduleProjections();\n        if (cancelled || revision !== requestRevision) return;\n        setFinancialProjectedEvents(\n          mergeScheduleEventCollections(savingsGoalEvents, debtEvents)\n        );\n      } catch (error) {\n        if (cancelled || revision !== requestRevision) return;\n        console.warn(\n          "CLARA Savings Goal / Debt Calendar projection could not be refreshed:",\n          error\n        );\n        setFinancialProjectedEvents([]);\n      }\n    };\n\n    setFinancialProjectedEvents([]);\n    refreshFinancialProjection();\n    FINANCIAL_CARD_SCHEDULE_UPDATE_EVENTS.forEach((eventName) => {\n      window.addEventListener(eventName, refreshFinancialProjection);\n    });\n\n    return () => {\n      cancelled = true;\n      FINANCIAL_CARD_SCHEDULE_UPDATE_EVENTS.forEach((eventName) => {\n        window.removeEventListener(eventName, refreshFinancialProjection);\n      });\n    };\n  }, [ownerId]);\n\n  const renderEvents = useMemo(\n    () =>\n      mergeScheduleEventCollections(\n        mergeScheduleEventsForRender(events, incomeProjectedEvents),\n        financialProjectedEvents\n      ),\n    [events, incomeProjectedEvents, financialProjectedEvents]\n  );\n'''
          replace_once(dashboard, income_effect_tail, financial_effect, "Dashboard derived financial effect and render merge")

          replace_once(
              dashboard,
              '''      if (!title || isStableIncomeScheduleProjection(detail)) return;\n''',
              '''      if (!title || isDerivedScheduleProjection(detail)) return;\n''',
              "Dashboard create-event derived guard",
          )

          replace_once(
              dashboard,
              '''    if (isStableIncomeScheduleProjection(target)) {\n      close();\n      return;\n    }\n''',
              '''    if (isDerivedScheduleProjection(target)) {\n      close();\n      return;\n    }\n''',
              "Dashboard remove derived guard",
          )

          wrapper_js = "src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardScheduleImpactPortalPanel.js"
          replace_once(
              wrapper_js,
              '''import React, { useEffect, useMemo, useRef, useState } from "react";\n''',
              '''import React, { useEffect, useMemo, useRef } from "react";\n''',
              "JS wrapper React imports",
          )
          replace_once(
              wrapper_js,
              '''import { syncFinancialCardSchedulesIntoCalendar } from "./financialCardScheduleIntegration";\n''',
              '''''',
              "JS wrapper financial sync import",
          )
          replace_once(
              wrapper_js,
              '''const FINANCIAL_CARD_SCHEDULE_UPDATE_EVENTS = [\n  "clara-finance-updated",\n  "clara:finance-data-updated",\n  "clara-local-finance-updated",\n  "clara:debt-obligations-updated",\n];\n\n''',
              '''''',
              "JS wrapper finance event constants",
          )
          replace_once(
              wrapper_js,
              '''  const pendingBillRef = useRef(null);\n  const [financialProjectionEpoch, setFinancialProjectionEpoch] = useState(0);\n''',
              '''  const pendingBillRef = useRef(null);\n''',
              "JS wrapper projection epoch",
          )
          replace_once(
              wrapper_js,
              '''\n  useEffect(() => {\n    if (typeof window === "undefined") return undefined;\n\n    let cancelled = false;\n    let requestRevision = 0;\n\n    const refreshFinancialCardDates = async () => {\n      const revision = ++requestRevision;\n\n      try {\n        await syncFinancialCardSchedulesIntoCalendar(user);\n        if (cancelled || revision !== requestRevision) return;\n\n        // The Schedule panel owns an in-memory event snapshot. Always remount it\n        // after a successful Savings Goal / Debt sync so it rereads the canonical\n        // schedule storage even when that storage already contained the projection.\n        setFinancialProjectionEpoch((current) => current + 1);\n      } catch (error) {\n        if (cancelled || revision !== requestRevision) return;\n        console.warn(\n          "CLARA Savings Goal / Debt calendar projection could not be refreshed:",\n          error\n        );\n      }\n    };\n\n    const queueRefresh = () => {\n      window.setTimeout(refreshFinancialCardDates, 0);\n    };\n\n    refreshFinancialCardDates();\n    FINANCIAL_CARD_SCHEDULE_UPDATE_EVENTS.forEach((eventName) => {\n      window.addEventListener(eventName, queueRefresh);\n    });\n\n    return () => {\n      cancelled = true;\n      FINANCIAL_CARD_SCHEDULE_UPDATE_EVENTS.forEach((eventName) => {\n        window.removeEventListener(eventName, queueRefresh);\n      });\n    };\n  }, [ownerId, user?.id, user?.email]);\n\n  return React.createElement(OriginalScheduleImpactPortalPanel, {\n    ...props,\n    key: `financial-card-schedule-${ownerId}-${financialProjectionEpoch}`,\n  });\n''',
              '''\n  return React.createElement(OriginalScheduleImpactPortalPanel, props);\n''',
              "JS wrapper financial remount effect",
          )

          write("src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardScheduleImpactPortalPanel.jsx", r'''import React from "react";
          import DashboardScheduleManualPanel from "./DashboardScheduleManualPanel.jsx";
          import "./DashboardSchedulePremium.css";
          import "./DashboardScheduleVisibilityFix.css";

          export default function DashboardScheduleImpactPortalPanel(props) {
            return <DashboardScheduleManualPanel {...props} />;
          }
          ''')

          finance_repo = "src/lib/financeRepository.js"
          replace_once(
              finance_repo,
              '''export * from "./financeRepositoryCore.js";\n\n''',
              '''export * from "./financeRepositoryCore.js";\n\nexport const FINANCE_DATA_UPDATED_EVENT = "clara:finance-data-updated";\n\nfunction emitFinanceDataUpdated(localUserId, source) {\n  if (typeof window === "undefined") return;\n  window.dispatchEvent(\n    new CustomEvent(FINANCE_DATA_UPDATED_EVENT, {\n      detail: { localUserId, source },\n    })\n  );\n}\n\n''',
              "Finance repository mutation event helper",
          )
          replace_once(
              finance_repo,
              '''    async deleteExpense(localUserId, expenseId, ...args) {\n      const before = await findExpenseById(repository, localUserId, expenseId);\n      const result = await repository.deleteExpense(localUserId, expenseId, ...args);\n\n      if (before) {\n        await syncManualExpenseLinkedTargetChange({\n          localUserId,\n          before,\n          after: null,\n          repository,\n        });\n      }\n\n      return result;\n    },\n''',
              '''    async deleteExpense(localUserId, expenseId, ...args) {\n      const before = await findExpenseById(repository, localUserId, expenseId);\n      const result = await repository.deleteExpense(localUserId, expenseId, ...args);\n\n      if (before) {\n        await syncManualExpenseLinkedTargetChange({\n          localUserId,\n          before,\n          after: null,\n          repository,\n        });\n      }\n\n      return result;\n    },\n\n    async upsertSavingsGoal(localUserId, goal, ...args) {\n      const result = await repository.upsertSavingsGoal(localUserId, goal, ...args);\n      emitFinanceDataUpdated(localUserId, "savings_goal");\n      return result;\n    },\n''',
              "Finance repository Savings Goal event decorator",
          )
          source = read(finance_repo)
          append_marker = '''export async function getSavingsGoals(localUserId, options) {\n  const [goals, expenses] = await Promise.all([\n    financeRepository.getSavingsGoals(localUserId, options),\n    financeRepository.getExpenses(localUserId),\n  ]);\n\n  return reconcileSavingsGoalsWithLinkedExpenses(goals, expenses);\n}\n'''
          replacement = append_marker + '''\nexport async function upsertSavingsGoal(localUserId, goal, options) {\n  return financeRepository.upsertSavingsGoal(localUserId, goal, options);\n}\n'''
          if source.count(append_marker) != 1:
              raise SystemExit("Finance repository explicit upsertSavingsGoal export: marker mismatch")
          write(finance_repo, source.replace(append_marker, replacement, 1))

          debt_store = "src/lib/debtObligationStore.js"
          replace_once(
              debt_store,
              '''export const DEFAULT_DEBT_OBLIGATION_ID = "debt_obligation_primary";\n\n''',
              '''export const DEFAULT_DEBT_OBLIGATION_ID = "debt_obligation_primary";\nexport const DEBT_OBLIGATIONS_UPDATED_EVENT = "clara:debt-obligations-updated";\n\nfunction emitDebtObligationsUpdated(localUserId, reason) {\n  if (typeof window === "undefined") return;\n  window.dispatchEvent(\n    new CustomEvent(DEBT_OBLIGATIONS_UPDATED_EVENT, {\n      detail: { localUserId, reason },\n    })\n  );\n}\n\n''',
              "Debt update event helper",
          )
          replace_once(
              debt_store,
              '''  return upsertLocalRecord(DEBT_OBLIGATION_STORE, record, safeLocalUserId);\n}\n\nexport async function deleteDebtObligation(localUserId, id) {\n''',
              '''  const result = await upsertLocalRecord(\n    DEBT_OBLIGATION_STORE,\n    record,\n    safeLocalUserId\n  );\n  emitDebtObligationsUpdated(safeLocalUserId, "upsert");\n  return result;\n}\n\nexport async function deleteDebtObligation(localUserId, id) {\n''',
              "Debt upsert mutation signal",
          )
          replace_once(
              debt_store,
              '''  if (!safeId) throw new Error("Debt obligation id is required.");\n  return softDeleteLocalRecord(DEBT_OBLIGATION_STORE, safeId, safeLocalUserId);\n}\n''',
              '''  if (!safeId) throw new Error("Debt obligation id is required.");\n  const result = await softDeleteLocalRecord(\n    DEBT_OBLIGATION_STORE,\n    safeId,\n    safeLocalUserId\n  );\n  if (result) emitDebtObligationsUpdated(safeLocalUserId, "delete");\n  return result;\n}\n''',
              "Debt delete mutation signal",
          )

          write("tests/financial-card-calendar-projection-regression.test.mjs", r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          import {
            DEBT_OBLIGATION_SCHEDULE_SOURCE,
            SAVINGS_GOAL_SCHEDULE_SOURCE,
            buildDebtObligationScheduleProjection,
            buildSavingsGoalScheduleProjection,
            isFinancialCardScheduleProjection,
          } from "../src/lib/financialCardScheduleProjection.js";
          import {
            filterScheduleOwnedEvents,
            isDerivedScheduleProjection,
            mergeScheduleEventCollections,
          } from "../src/lib/scheduleEventOwnership.js";
          import {
            buildStableIncomeScheduleProjection,
            isStableIncomeScheduleProjection,
          } from "../src/lib/stableIncomeScheduleProjection.js";
          import { DEBT_OBLIGATION_RECORD_KIND } from "../src/lib/debtObligationMath.js";

          const sampleGoal = (date = "2026-08-30", overrides = {}) => ({
            id: "sample-goal",
            title: "Sample",
            target_amount: 5000,
            saved_amount: 0,
            planned_use_date: date,
            deletedAt: null,
            deleted_at: null,
            ...overrides,
          });

          const sampleDebt = (overrides = {}) => ({
            id: "sample-debt",
            recordKind: DEBT_OBLIGATION_RECORD_KIND,
            title: "Home Credit",
            obligationMode: "balance",
            balance: 12000,
            monthlyPayment: 1500,
            dueDay: 20,
            status: "active",
            deletedAt: null,
            ...overrides,
          });

          const stableIncome = () => ({
            id: "salary-source",
            name: "Salary",
            stability: "Stable",
            minimumStableIncome: 20000,
            usualIncomeDateEnabled: true,
            useForBudgetTiming: true,
            incomeRecurrence: {
              type: "monthly",
              startDate: "2026-01-15",
              dayOfMonth: 15,
            },
          });

          const manualEvent = () => ({
            id: "manual-event",
            title: "Dentist",
            date: "2026-08-22",
            type: "Health",
          });

          const recurringBill = () => ({
            id: "recurring-schedule-electric-2026-08-28",
            title: "Electric bill",
            date: "2026-08-28",
            type: "Bill",
            amount: 2500,
            source: "recurring_schedule_bill",
          });

          const sortEvents = (events) =>
            [...events].sort((a, b) =>
              `${a.date} ${a.time || "99:99"}`.localeCompare(
                `${b.date} ${b.time || "99:99"}`
              )
            );

          const groupByDate = (events) =>
            sortEvents(events).reduce((acc, event) => {
              acc[event.date] = [...(acc[event.date] || []), event];
              return acc;
            }, {});

          const isMoneyEvent = (event) => {
            const type = String(event?.type || "").toLowerCase();
            return (
              Boolean(event?.amount) ||
              type === "bill" ||
              type === "payday" ||
              type === "money"
            );
          };

          test("A — Savings Goal planned_use_date projects the exact canonical date", () => {
            const [projection] = buildSavingsGoalScheduleProjection([sampleGoal()]);
            assert.equal(projection.date, "2026-08-30");
            assert.equal(projection.source, SAVINGS_GOAL_SCHEDULE_SOURCE);
            assert.equal(projection.type, "Money");
            assert.equal(projection.derived, true);
            assert.equal(projection.editable, false);
            assert.equal(
              projection.id,
              "savings-goal-schedule-sample-goal-2026-08-30"
            );
          });

          test("B — render merge contains manual, Savings, Debt, and Stable Income without duplicate ids", () => {
            const savings = buildSavingsGoalScheduleProjection([sampleGoal()]);
            const debt = buildDebtObligationScheduleProjection([sampleDebt()], {
              referenceDate: new Date("2026-08-19T00:00:00"),
            });
            const income = buildStableIncomeScheduleProjection([stableIncome()], {
              year: 2026,
            });
            const merged = mergeScheduleEventCollections(
              [manualEvent()],
              income,
              savings,
              debt,
              [savings[0]]
            );

            assert.equal(merged.some((event) => event.id === "manual-event"), true);
            assert.equal(
              merged.some((event) => event.source === SAVINGS_GOAL_SCHEDULE_SOURCE),
              true
            );
            assert.equal(
              merged.some((event) => event.source === DEBT_OBLIGATION_SCHEDULE_SOURCE),
              true
            );
            assert.equal(merged.some(isStableIncomeScheduleProjection), true);
            assert.equal(new Set(merged.map((event) => event.id)).size, merged.length);
          });

          test("C — derived finance and income projections are never Schedule-persisted", () => {
            const savings = buildSavingsGoalScheduleProjection([sampleGoal()])[0];
            const debt = buildDebtObligationScheduleProjection([sampleDebt()], {
              referenceDate: new Date("2026-08-19T00:00:00"),
            })[0];
            const income = buildStableIncomeScheduleProjection([stableIncome()], {
              year: 2026,
            })[0];
            const persisted = filterScheduleOwnedEvents([
              manualEvent(),
              income,
              savings,
              debt,
              recurringBill(),
            ]);

            assert.deepEqual(
              persisted.map((event) => event.id),
              ["manual-event", "recurring-schedule-electric-2026-08-28"]
            );
          });

          test("D — legacy persisted Savings/Debt projections are ignored without deleting Schedule-owned records", () => {
            const legacySavings = {
              id: "legacy-savings",
              title: "Old savings",
              date: "2026-08-30",
              source: SAVINGS_GOAL_SCHEDULE_SOURCE,
            };
            const legacyDebt = {
              id: "legacy-debt",
              title: "Old debt",
              date: "2026-08-20",
              source: DEBT_OBLIGATION_SCHEDULE_SOURCE,
            };
            const persisted = filterScheduleOwnedEvents([
              manualEvent(),
              recurringBill(),
              legacySavings,
              legacyDebt,
            ]);

            assert.deepEqual(
              persisted.map((event) => event.id),
              ["manual-event", "recurring-schedule-electric-2026-08-28"]
            );
          });

          test("E — Savings date edit replaces the old derived date with exactly one current projection", () => {
            const before = buildSavingsGoalScheduleProjection([sampleGoal("2026-08-30")]);
            const after = buildSavingsGoalScheduleProjection([sampleGoal("2026-09-10")]);
            const renderAfter = mergeScheduleEventCollections([manualEvent()], after);

            assert.equal(before[0].date, "2026-08-30");
            assert.equal(renderAfter.some((event) => event.date === "2026-08-30" && isFinancialCardScheduleProjection(event)), false);
            assert.equal(renderAfter.some((event) => event.date === "2026-09-10" && event.title === "Sample"), true);
            assert.equal(renderAfter.filter((event) => event.title === "Sample").length, 1);
            assert.equal(filterScheduleOwnedEvents(renderAfter).some((event) => event.title === "Sample"), false);
          });

          test("F — deleting the canonical Savings Goal removes only its projection", () => {
            const deleted = buildSavingsGoalScheduleProjection([
              sampleGoal("2026-08-30", {
                deletedAt: "2026-08-19T03:00:00.000Z",
              }),
            ]);
            const income = buildStableIncomeScheduleProjection([stableIncome()], {
              year: 2026,
            });
            const debt = buildDebtObligationScheduleProjection([sampleDebt()], {
              referenceDate: new Date("2026-08-19T00:00:00"),
            });
            const merged = mergeScheduleEventCollections(
              [manualEvent(), recurringBill()],
              income,
              deleted,
              debt
            );

            assert.equal(deleted.length, 0);
            assert.equal(merged.some((event) => event.id === "manual-event"), true);
            assert.equal(merged.some((event) => event.id === recurringBill().id), true);
            assert.equal(merged.some(isStableIncomeScheduleProjection), true);
            assert.equal(merged.some((event) => event.source === DEBT_OBLIGATION_SCHEDULE_SOURCE), true);
          });

          test("G — active Debt due dates remain derived and non-persisted", () => {
            const debtEvents = buildDebtObligationScheduleProjection([sampleDebt()], {
              referenceDate: new Date("2026-08-19T00:00:00"),
            });
            const aug20 = debtEvents.find((event) => event.date === "2026-08-20");

            assert.ok(aug20);
            assert.equal(aug20.source, DEBT_OBLIGATION_SCHEDULE_SOURCE);
            assert.equal(aug20.derived, true);
            assert.equal(aug20.editable, false);
            assert.equal(filterScheduleOwnedEvents([aug20]).length, 0);
          });

          test("H — Stable Income remains derived and excluded from Schedule persistence", () => {
            const income = buildStableIncomeScheduleProjection([stableIncome()], {
              year: 2026,
            });
            const aug15 = income.find((event) => event.date === "2026-08-15");

            assert.ok(aug15);
            assert.equal(isStableIncomeScheduleProjection(aug15), true);
            assert.equal(isDerivedScheduleProjection(aug15), true);
            assert.equal(filterScheduleOwnedEvents([aug15]).length, 0);
          });

          test("I — recurring bills remain legitimate Schedule-owned records", () => {
            const bill = recurringBill();
            assert.deepEqual(filterScheduleOwnedEvents([bill]), [bill]);
            const merged = mergeScheduleEventCollections([manualEvent(), bill]);
            assert.equal(merged.some((event) => event.id === bill.id), true);
          });

          test("J — manual Schedule persistence survives serialization and removal", () => {
            const manual = manualEvent();
            const persisted = filterScheduleOwnedEvents([manual]);
            const reloaded = JSON.parse(JSON.stringify(persisted));

            assert.equal(reloaded.length, 1);
            assert.equal(reloaded[0].id, manual.id);
            const removed = reloaded.filter((event) => event.id !== manual.id);
            assert.equal(removed.length, 0);
          });

          test("K — real Sample case reaches byDate/agenda money state without Schedule-storage feedback", () => {
            const integrationSource = readFileSync(
              new URL(
                "../src/components/fresh/main-dashboard/dashboard-panels/schedule/financialCardScheduleIntegration.js",
                import.meta.url
              ),
              "utf8"
            );
            const wrapperJs = readFileSync(
              new URL(
                "../src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardScheduleImpactPortalPanel.js",
                import.meta.url
              ),
              "utf8"
            );
            const wrapperJsx = readFileSync(
              new URL(
                "../src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardScheduleImpactPortalPanel.jsx",
                import.meta.url
              ),
              "utf8"
            );
            const dashboardSource = readFileSync(
              new URL(
                "../src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardSchedulePanel.jsx",
                import.meta.url
              ),
              "utf8"
            );

            const [projection] = buildSavingsGoalScheduleProjection([sampleGoal()]);
            const renderEvents = mergeScheduleEventCollections([manualEvent()], [projection]);
            const sorted = sortEvents(renderEvents);
            const byDate = groupByDate(sorted);
            const selectedEvents = byDate["2026-08-30"] || [];
            const selectedMoneyEvent = selectedEvents.find(isMoneyEvent);

            assert.equal(projection.title, "Sample");
            assert.equal(projection.amount, 5000);
            assert.equal(projection.date, "2026-08-30");
            assert.equal(selectedEvents.includes(projection), true);
            assert.equal(Boolean(selectedMoneyEvent), true);
            assert.equal(selectedMoneyEvent.title, "Sample");
            assert.equal(isMoneyEvent(projection), true);

            assert.equal(integrationSource.includes("localStorage"), false);
            assert.equal(integrationSource.includes("syncFinancialCardSchedulesIntoCalendar"), false);
            assert.equal(wrapperJs.includes("syncFinancialCardSchedulesIntoCalendar"), false);
            assert.equal(wrapperJs.includes("financialProjectionEpoch"), false);
            assert.equal(wrapperJsx.includes("syncFinancialCardSchedulesIntoCalendar"), false);
            assert.equal(wrapperJsx.includes("financialProjectionEpoch"), false);
            assert.equal(dashboardSource.includes("financialProjectedEvents"), true);
            assert.equal(dashboardSource.includes("loadFinancialCardScheduleProjections"), true);
            assert.equal(dashboardSource.includes("filterScheduleOwnedEvents(events)"), true);
            assert.equal(dashboardSource.includes("mergeScheduleEventsForRender"), true);
          });

          test("runtime import resolution keeps one Calendar financial projection owner", () => {
            const renderer = readFileSync(
              new URL(
                "../src/components/fresh/main-dashboard/shell/DashboardPanelRenderer.jsx",
                import.meta.url
              ),
              "utf8"
            );
            const wrapperJs = readFileSync(
              new URL(
                "../src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardScheduleImpactPortalPanel.js",
                import.meta.url
              ),
              "utf8"
            );
            const wrapperJsx = readFileSync(
              new URL(
                "../src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardScheduleImpactPortalPanel.jsx",
                import.meta.url
              ),
              "utf8"
            );
            const manual = readFileSync(
              new URL(
                "../src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardScheduleManualPanel.jsx",
                import.meta.url
              ),
              "utf8"
            );

            assert.match(renderer, /schedule\/DashboardScheduleImpactPortalPanel"/);
            assert.match(wrapperJs, /DashboardScheduleImpactPortalPanel\.jsx/);
            assert.match(wrapperJsx, /DashboardScheduleManualPanel\.jsx/);
            assert.match(manual, /DashboardSchedulePanel\.jsx/);
            assert.equal(wrapperJs.includes("financialCardScheduleIntegration"), false);
            assert.equal(wrapperJsx.includes("financialCardScheduleIntegration"), false);
          });
          ''')

          package_path = "package.json"
          package_source = read(package_path)
          needle = "tests/stable-income-calendar-year-projection.test.mjs"
          if package_source.count(needle) != 1:
              raise SystemExit("package.json financial projection test insertion marker mismatch")
          package_source = package_source.replace(
              needle,
              "tests/financial-card-calendar-projection-regression.test.mjs " + needle,
              1,
          )
          write(package_path, package_source)

          # Normalize only the files authored wholesale above; transformed project files keep original formatting.
          for file_path in [
              "src/lib/financialCardScheduleProjection.js",
              "src/lib/scheduleEventOwnership.js",
              "src/components/fresh/main-dashboard/dashboard-panels/schedule/financialCardScheduleIntegration.js",
              "src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardScheduleImpactPortalPanel.jsx",
              "tests/financial-card-calendar-projection-regression.test.mjs",
          ]:
              text = read(file_path)
              lines = text.splitlines()
              non_empty = [line for line in lines if line.strip()]
              if non_empty:
                  common = min(len(line) - len(line.lstrip()) for line in non_empty)
                  if common:
                      text = "\n".join(line[common:] if line.strip() else "" for line in lines) + "\n"
                      write(file_path, text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused Schedule regression suite
        run: >-
          node --test
          tests/financial-card-calendar-projection-regression.test.mjs
          tests/stable-income-calendar-year-projection.test.mjs
          tests/debt-obligation-integrity.test.mjs
          tests/savings-goal-card-flow-regression.test.mjs

      - name: Run full project tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Review diff scope
        run: |
          git status --short
          git diff --check
          git diff --stat

      - name: Commit verified repair and remove bootstrap workflow
        shell: bash
        run: |
          rm -f .github/workflows/clara-schedule-authority-repair.yml
          git config user.name "CLARA Principal Engineer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Repair Schedule financial projection authority"
          git push origin HEAD:fix/calendar-financial-derived-state
