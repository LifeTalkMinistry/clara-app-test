              '    event.stopPropagation();\n'
              '    clearGestureTracking();\n',
              '  const openReaderMenu = (event) => {\n'
              '    event.preventDefault();\n'
              '    event.stopPropagation();\n\n'
              '    if (pdfPageTurnLockRef.current) return;\n\n'
              '    clearGestureTracking();\n',
              'reader menu lock',
