          old_page = '''                          <Page
                            pageNumber={localPdfPageNumber}
                            inputRef={pdfContentRef}
                            width={activePdfRenderWidth}
                            renderTextLayer={true}
                            renderAnnotationLayer={false}
                            onLoadSuccess={handlePdfPageLoadSuccess}
                            onLoadError={() =>
                              handlePdfLoadError(activeDocumentKey)
