name: CLARA surgical PDF page turn

on:
  push:
    paths:
      - .github/workflows/clara-page-turn-surgical.yml

permissions:
  contents: write

jobs:
  patch-build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply surgical page-turn patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              'const PDF_MAX_RENDER_WIDTH = 3200;\n',
              'const PDF_MAX_RENDER_WIDTH = 3200;\n'
              'const PDF_PAGE_TURN_OUT_DURATION = 140;\n'
              'const PDF_PAGE_TURN_IN_DURATION = 180;\n',
              'page-turn constants',
          )

          replace_once(
              '  const [announcedZoomPercentage, setAnnouncedZoomPercentage] = useState(100);\n'
              '  const touchStartRef = useRef({ x: null, y: null });\n',
              '  const [announcedZoomPercentage, setAnnouncedZoomPercentage] = useState(100);\n'
              '  const [pdfPageTurnDirection, setPdfPageTurnDirection] = useState(null);\n'
              '  const [pdfPageTurnPhase, setPdfPageTurnPhase] = useState("idle");\n'
              '  const touchStartRef = useRef({ x: null, y: null });\n',
              'page-turn state',
          )

          replace_once(
              '  const activeLoadTokenRef = useRef("");\n'
              '  const isOpenRef = useRef(isOpen);\n'
              '  const transitionLockRef = useRef(false);\n'
              '  const pdfZoomScaleRef = useRef(PDF_MIN_ZOOM_SCALE);\n',
              '  const activeLoadTokenRef = useRef("");\n'
              '  const isOpenRef = useRef(isOpen);\n'
              '  const isMountedRef = useRef(true);\n'
              '  const transitionLockRef = useRef(false);\n'
              '  const pdfPageTurnLockRef = useRef(false);\n'
              '  const pdfPageTurnPhaseRef = useRef("idle");\n'
              '  const pdfPageTurnTimerRef = useRef(null);\n'
              '  const pdfPageTurnFrameRef = useRef(null);\n'
              '  const pdfPageTurnSettleFrameRef = useRef(null);\n'
              '  const pdfZoomScaleRef = useRef(PDF_MIN_ZOOM_SCALE);\n',
              'page-turn refs',
          )

          replace_once(
              '  isOpenRef.current = isOpen;\n'
              '  pdfZoomScaleRef.current = pdfZoomScale;\n',
              '  isOpenRef.current = isOpen;\n'
              '  pdfZoomScaleRef.current = pdfZoomScale;\n\n'
              '  useEffect(() => {\n'
              '    pdfPageTurnPhaseRef.current = pdfPageTurnPhase;\n'
              '  }, [pdfPageTurnPhase]);\n',
              'phase ref synchronization',
          )

          replace_once(
              '  activeLoadTokenRef.current = activeDocumentKey;\n\n'
              '  const getEffectiveScaleForRequestedScale = useCallback(\n',
              '  activeLoadTokenRef.current = activeDocumentKey;\n\n'
              '  const pdfPaperStyle = useMemo(() => {\n'
              '    const restingTransform =\n'
              '      "translate3d(0, 0, 0) rotateY(0deg) scale(1)";\n'
              '    const sharedStyle = {\n'
              '      transformStyle: "preserve-3d",\n'
              '      backfaceVisibility: "hidden",\n'
              '      willChange: pdfPageTurnDirection ? "transform, opacity" : "auto",\n'
              '    };\n\n'
              '    if (!pdfPageTurnDirection) {\n'
              '      return {\n'
              '        ...sharedStyle,\n'
              '        transform: restingTransform,\n'
              '        opacity: 1,\n'
              '        transition: "none",\n'
              '        transformOrigin: "center center",\n'
              '      };\n'
              '    }\n\n'
              '    if (pdfPageTurnPhase === "leaving") {\n'
              '      const isNext = pdfPageTurnDirection === "next";\n'
              '      return {\n'
              '        ...sharedStyle,\n'
              '        transform: isNext\n'
              '          ? "translate3d(-6%, 0, 0) rotateY(-4deg) scale(0.985)"\n'
              '          : "translate3d(6%, 0, 0) rotateY(4deg) scale(0.985)",\n'
              '        opacity: 0.74,\n'
              '        transition: `transform ${PDF_PAGE_TURN_OUT_DURATION}ms cubic-bezier(0.22, 1, 0.36, 1), opacity ${PDF_PAGE_TURN_OUT_DURATION}ms ease-out`,\n'
              '        transformOrigin: isNext ? "left center" : "right center",\n'
              '      };\n'
              '    }\n\n'
              '    if (pdfPageTurnPhase === "entering") {\n'
              '      const isNext = pdfPageTurnDirection === "next";\n'
              '      return {\n'
              '        ...sharedStyle,\n'
              '        transform: isNext\n'
              '          ? "translate3d(6%, 0, 0) rotateY(3deg) scale(0.985)"\n'
              '          : "translate3d(-6%, 0, 0) rotateY(-3deg) scale(0.985)",\n'
              '        opacity: 0.78,\n'
              '        transition: "none",\n'
              '        transformOrigin: isNext ? "right center" : "left center",\n'
              '      };\n'
              '    }\n\n'
              '    return {\n'
              '      ...sharedStyle,\n'
              '      transform: restingTransform,\n'
              '      opacity: 1,\n'
              '      transition: `transform ${PDF_PAGE_TURN_IN_DURATION}ms cubic-bezier(0.22, 1, 0.36, 1), opacity ${PDF_PAGE_TURN_IN_DURATION}ms ease-out`,\n'
              '      transformOrigin:\n'
              '        pdfPageTurnDirection === "next" ? "right center" : "left center",\n'
              '    };\n'
              '  }, [pdfPageTurnDirection, pdfPageTurnPhase]);\n\n'
              '  const pdfPaperEdgeStyle = useMemo(() => {\n'
              '    const isNext = pdfPageTurnDirection === "next";\n'
              '    const isActivePhase =\n'
              '      pdfPageTurnPhase === "leaving" || pdfPageTurnPhase === "entering";\n'
              '    const opacity =\n'
              '      pdfPageTurnPhase === "leaving"\n'
              '        ? 1\n'
              '        : pdfPageTurnPhase === "entering"\n'
              '          ? 0.58\n'
              '          : 0;\n\n'
              '    return {\n'
              '      width: "44px",\n'
              '      left: pdfPageTurnDirection && !isNext ? 0 : "auto",\n'
              '      right: pdfPageTurnDirection && isNext ? 0 : "auto",\n'
              '      opacity: isActivePhase ? opacity : 0,\n'
              '      background: isNext\n'
              '        ? "linear-gradient(to right, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.16) 76%, rgba(0, 0, 0, 0.12) 96%, rgba(255, 255, 255, 0.1) 100%)"\n'
              '        : "linear-gradient(to left, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.16) 76%, rgba(0, 0, 0, 0.12) 96%, rgba(255, 255, 255, 0.1) 100%)",\n'
              '      transition:\n'
              '        pdfPageTurnPhase === "idle"\n'
              '          ? `opacity ${PDF_PAGE_TURN_IN_DURATION}ms ease-out`\n'
              '          : `opacity ${PDF_PAGE_TURN_OUT_DURATION}ms ease-out`,\n'
              '    };\n'
              '  }, [pdfPageTurnDirection, pdfPageTurnPhase]);\n\n'
              '  const getEffectiveScaleForRequestedScale = useCallback(\n',
              'paper styles',
          )

          replace_once(
              '  const clearTapTracking = useCallback(() => {\n'
              '    lastPdfTapTimeRef.current = 0;\n'
              '    ignoreDoubleClickUntilRef.current = 0;\n'
              '  }, []);\n\n'
              '  const clearGestureTracking = useCallback(() => {\n',
              '  const clearTapTracking = useCallback(() => {\n'
              '    lastPdfTapTimeRef.current = 0;\n'
              '    ignoreDoubleClickUntilRef.current = 0;\n'
              '  }, []);\n\n'
              '  const clearPdfPageTurnTimer = useCallback(() => {\n'
              '    if (pdfPageTurnTimerRef.current !== null) {\n'
              '      if (typeof window !== "undefined") {\n'
              '        window.clearTimeout(pdfPageTurnTimerRef.current);\n'
              '      }\n'
              '      pdfPageTurnTimerRef.current = null;\n'
              '    }\n'
              '  }, []);\n\n'
              '  const clearPdfPageTurnFrames = useCallback(() => {\n'
