              '      pdfPageTurnFrameRef.current = null;\n'
              '    }\n\n'
              '    if (pdfPageTurnSettleFrameRef.current !== null) {\n'
              '      window.cancelAnimationFrame(pdfPageTurnSettleFrameRef.current);\n'
              '      pdfPageTurnSettleFrameRef.current = null;\n'
              '    }\n'
              '  }, []);\n\n'
              '  const resetPdfPageTurnState = useCallback(() => {\n'
              '    clearPdfPageTurnTimer();\n'
              '    clearPdfPageTurnFrames();\n'
              '    pdfPageTurnLockRef.current = false;\n'
              '    pdfPageTurnPhaseRef.current = "idle";\n\n'
              '    if (isMountedRef.current) {\n'
              '      setPdfPageTurnPhase("idle");\n'
              '      setPdfPageTurnDirection(null);\n'
              '    }\n'
              '  }, [clearPdfPageTurnFrames, clearPdfPageTurnTimer]);\n\n'
              '  const clearGestureTracking = useCallback(() => {\n',
              'page-turn cleanup helpers',
          )

          replace_once(
              '  const setReadingZoom = useCallback(() => {\n'
              '    if (!canTogglePdfZoom) return;\n',
              '  const setReadingZoom = useCallback(() => {\n'
              '    if (!canTogglePdfZoom || pdfPageTurnLockRef.current) return;\n',
              'reading zoom lock',
          )

          replace_once(
              '  const resetReaderState = useCallback(() => {\n'
              '    setPageIndex(0);\n',
              '  const resetReaderState = useCallback(() => {\n'
              '    resetPdfPageTurnState();\n'
              '    setPageIndex(0);\n',
              'reader reset page-turn cleanup',
          )
          replace_once(
              '  }, [clearGestureTracking, clearTapTracking]);\n\n'
              '  const togglePdfZoom = useCallback(() => {\n',
              '  }, [clearGestureTracking, clearTapTracking, resetPdfPageTurnState]);\n\n'
              '  const togglePdfZoom = useCallback(() => {\n',
              'reader reset dependencies',
          )

          replace_once(
              '  const togglePdfZoom = useCallback(() => {\n'
              '    if (!canTogglePdfZoom || isReaderMenuOpen) return;\n',
              '  const togglePdfZoom = useCallback(() => {\n'
              '    if (\n'
              '      !canTogglePdfZoom ||\n'
              '      isReaderMenuOpen ||\n'
              '      pdfPageTurnLockRef.current\n'
              '    ) {\n'
              '      return;\n'
              '    }\n',
              'toggle zoom lock',
          )

          replace_once(
              '      if (targetPartIndex < 0) {\n'
              '        resetPdfToFit({ announce: false });\n',
              '      if (targetPartIndex < 0) {\n'
              '        resetPdfPageTurnState();\n'
              '        resetPdfToFit({ announce: false });\n',
              'multipart destination cleanup',
          )
          replace_once(
              '      resetPdfToFit,\n'
              '      safePageIndex,\n'
              '      scrollToTop,\n'
              '    ],\n'
              '  );\n\n'
              '  const goNext = useCallback(() => {\n'
              '    navigateToGlobalPage(Math.min(safePageIndex + 1, pageCount - 1));\n'
              '  }, [navigateToGlobalPage, pageCount, safePageIndex]);\n\n'
              '  const goPrevious = useCallback(() => {\n'
              '    navigateToGlobalPage(Math.max(safePageIndex - 1, 0));\n'
              '  }, [navigateToGlobalPage, safePageIndex]);\n',
              '      resetPdfPageTurnState,\n'
              '      resetPdfToFit,\n'
              '      safePageIndex,\n'
              '      scrollToTop,\n'
              '    ],\n'
              '  );\n\n'
              '  const requestPdfPageTurn = useCallback(\n'
              '    (targetGlobalPageIndex) => {\n'
              '      if (\n'
              '        !canNavigate ||\n'
              '        transitionLockRef.current ||\n'
              '        pdfPageTurnLockRef.current ||\n'
              '        targetGlobalPageIndex < 0 ||\n'
              '        targetGlobalPageIndex >= pageCount ||\n'
              '        targetGlobalPageIndex === safePageIndex ||\n'
              '        isReaderMenuOpen\n'
              '      ) {\n'
              '        return;\n'
              '      }\n\n'
              '      if (!hasPdf) {\n'
              '        navigateToGlobalPage(targetGlobalPageIndex);\n'
              '        return;\n'
              '      }\n\n'
              '      if (\n'
              '        pdfStatus !== "ready" ||\n'
              '        isBoundaryTransition ||\n'
              '        isPdfZoomed ||\n'
              '        Math.abs(effectivePdfZoomScale - PDF_MIN_ZOOM_SCALE) >\n'
              '          PDF_ZOOM_EPSILON\n'
              '      ) {\n'
              '        return;\n'
              '      }\n\n'
              '      const prefersReducedMotion =\n'
              '        typeof window !== "undefined" &&\n'
              '        typeof window.matchMedia === "function" &&\n'
              '        window.matchMedia("(prefers-reduced-motion: reduce)").matches;\n\n'
              '      if (prefersReducedMotion) {\n'
              '        navigateToGlobalPage(targetGlobalPageIndex);\n'
              '        return;\n'
              '      }\n\n'
              '      const direction =\n'
              '        targetGlobalPageIndex > safePageIndex ? "next" : "previous";\n\n'
              '      clearPdfPageTurnTimer();\n'
              '      pdfPageTurnLockRef.current = true;\n'
              '      setPdfPageTurnDirection(direction);\n'
              '      pdfPageTurnPhaseRef.current = "leaving";\n'
              '      setPdfPageTurnPhase("leaving");\n\n'
              '      pdfPageTurnTimerRef.current = window.setTimeout(() => {\n'
              '        pdfPageTurnTimerRef.current = null;\n\n'
              '        if (!isMountedRef.current || !isOpenRef.current) {\n'
              '          resetPdfPageTurnState();\n'
              '          return;\n'
              '        }\n\n'
              '        pdfPageTurnPhaseRef.current = "entering";\n'
              '        setPdfPageTurnPhase("entering");\n'
              '        navigateToGlobalPage(targetGlobalPageIndex);\n'
              '      }, PDF_PAGE_TURN_OUT_DURATION);\n'
              '    },\n'
              '    [\n'
              '      canNavigate,\n'
              '      clearPdfPageTurnTimer,\n'
              '      effectivePdfZoomScale,\n'
              '      hasPdf,\n'
              '      isBoundaryTransition,\n'
              '      isPdfZoomed,\n'
              '      isReaderMenuOpen,\n'
              '      navigateToGlobalPage,\n'
              '      pageCount,\n'
              '      pdfStatus,\n'
              '      resetPdfPageTurnState,\n'
              '      safePageIndex,\n'
              '    ],\n'
              '  );\n\n'
              '  const goNext = useCallback(() => {\n'
              '    requestPdfPageTurn(Math.min(safePageIndex + 1, pageCount - 1));\n'
              '  }, [pageCount, requestPdfPageTurn, safePageIndex]);\n\n'
              '  const goPrevious = useCallback(() => {\n'
              '    requestPdfPageTurn(Math.max(safePageIndex - 1, 0));\n'
              '  }, [requestPdfPageTurn, safePageIndex]);\n',
              'page-turn navigation wrapper',
          )

          replace_once(
              '      if (nextPageCount === 0) {\n'
              '        setPdfPageCount(0);\n',
              '      if (nextPageCount === 0) {\n'
              '        resetPdfPageTurnState();\n'
              '        setPdfPageCount(0);\n',
              'empty PDF cleanup',
          )
          replace_once(
              '        if (!activePart || nextPageCount !== activePart.expectedPageCount) {\n'
              '          setPdfPageCount(0);\n',
              '        if (!activePart || nextPageCount !== activePart.expectedPageCount) {\n'
              '          resetPdfPageTurnState();\n'
              '          setPdfPageCount(0);\n',
              'part count cleanup',
          )
          replace_once(
              '          if (pendingPartIndex !== activePartIndex) {\n'
              '            setPdfStatus("error");\n',
              '          if (pendingPartIndex !== activePartIndex) {\n'
              '            resetPdfPageTurnState();\n'
              '            setPdfStatus("error");\n',
              'pending part cleanup',
          )
          replace_once(
              '      pendingGlobalPageIndex,\n'
              '      resetPdfToFit,\n'
              '      scrollToTop,\n',
              '      pendingGlobalPageIndex,\n'
              '      resetPdfPageTurnState,\n'
              '      resetPdfToFit,\n'
              '      scrollToTop,\n',
              'load success dependencies',
          )

          replace_once(
              '      resetPdfToFit({ announce: false });\n'
              '      setPdfPageAspectRatio(0);\n'
              '      setPdfPageCount(0);\n\n'
              '      if (!hasMultiPartPdf) {\n',
              '      resetPdfPageTurnState();\n'
              '      resetPdfToFit({ announce: false });\n'
              '      setPdfPageAspectRatio(0);\n'
              '      setPdfPageCount(0);\n\n'
              '      if (!hasMultiPartPdf) {\n',
