          replace_once(
              '    [hasMultiPartPdf, resetPdfToFit, scrollToTop],\n'
              '  );\n\n'
              '  const retryPdf = useCallback(() => {\n'
              '    resetPdfToFit({ announce: false });\n',
              '    [\n'
              '      hasMultiPartPdf,\n'
              '      resetPdfPageTurnState,\n'
              '      resetPdfToFit,\n'
              '      scrollToTop,\n'
              '    ],\n'
              '  );\n\n'
              '  const retryPdf = useCallback(() => {\n'
              '    resetPdfPageTurnState();\n'
              '    resetPdfToFit({ announce: false });\n',
              'load error dependencies and retry cleanup',
          )
          replace_once(
              '  }, [hasMultiPartPdf, resetPdfToFit, scrollToTop]);\n\n'
              '  useEffect(() => {\n'
              '    if (!isOpen) {\n',
              '  }, [\n'
              '    hasMultiPartPdf,\n'
              '    resetPdfPageTurnState,\n'
              '    resetPdfToFit,\n'
              '    scrollToTop,\n'
              '  ]);\n\n'
              '  useEffect(() => {\n'
              '    resetPdfPageTurnState();\n\n'
              '    if (!isOpen) {\n',
              'retry dependencies and material cleanup',
          )
          replace_once(
              '    pdfSourceSignature,\n'
              '    resetReaderState,\n'
              '    scrollToTop,\n',
              '    pdfSourceSignature,\n'
              '    resetPdfPageTurnState,\n'
              '    resetReaderState,\n'
              '    scrollToTop,\n',
              'material effect dependencies',
          )

          replace_once(
              '  const processPdfTap = useCallback(() => {\n'
              '    if (!canTogglePdfZoom || isReaderMenuOpen) return false;\n',
              '  const processPdfTap = useCallback(() => {\n'
              '    if (\n'
