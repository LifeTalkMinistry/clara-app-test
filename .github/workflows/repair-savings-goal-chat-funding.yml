name: Repair Savings Goal Chat Funding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Savings Goal chat
        run: python scripts/patch-savings-goal-chat-funding.py
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/assistant/ClaraSavingsGoalOverlay.jsx
          git commit -m "Add Savings Goal chat fund movement"
          git push origin HEAD:main
