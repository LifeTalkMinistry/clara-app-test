name: Fix debt effective-record scope

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-debt-paid-period-effective-record.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct effective-record scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/financial-carousel/cards/debt/ui/DebtObligationItem.jsx')
          s = p.read_text()

          old_helper = '''function getSuggestedPaymentAmount(record, dueDate) {\n  const mode = getDebtObligationMode(effectiveRecord);'''
          new_helper = '''function getSuggestedPaymentAmount(record, dueDate) {\n  const mode = getDebtObligationMode(record);'''
          if old_helper not in s:
              raise SystemExit('Expected helper scope block not found')
          s = s.replace(old_helper, new_helper, 1)

          old_component = '''  const interest = getObligationInterest(effectiveRecord);\n  const mode = getDebtObligationMode(record);\n  const status = getDebtStatus(effectiveRecord);'''
          new_component = '''  const interest = getObligationInterest(effectiveRecord);\n  const mode = getDebtObligationMode(effectiveRecord);\n  const status = getDebtStatus(effectiveRecord);'''
          if old_component not in s:
              raise SystemExit('Expected component mode block not found')
          s = s.replace(old_component, new_component, 1)
          p.write_text(s)

          test = Path('tests/debt-paid-period-indicator-regression.test.mjs')
          t = test.read_text()
          anchor = '  assert.match(source, /setLocalRecord\\(paymentResult\\.debt\\)/);\n'
          addition = '  assert.match(source, /const mode = getDebtObligationMode\\(effectiveRecord\\)/);\n'
          if addition not in t:
              if anchor not in t:
                  raise SystemExit('Expected test anchor not found')
              t = t.replace(anchor, anchor + addition, 1)
              test.write_text(t)
          PY

      - name: Verify focused regressions
        run: node --test tests/debt-paid-period-indicator-regression.test.mjs tests/debt-payment-historical-log-regression.test.mjs

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/financial-carousel/cards/debt/ui/DebtObligationItem.jsx tests/debt-paid-period-indicator-regression.test.mjs
          git rm .github/workflows/fix-debt-paid-period-effective-record.yml
          git commit -m "Correct debt paid-period refresh scope"
          git pull --rebase origin main
          git push origin HEAD:main
