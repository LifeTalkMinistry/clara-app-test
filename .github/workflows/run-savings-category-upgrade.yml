name: Run savings category upgrade

on:
  push:
    branches:
      - feature/savings-goal-category-options

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/savings-goal-category-options
          fetch-depth: 0

      - name: Apply embedded upgrade script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-savings-goal-category-options.yml')
          raw = workflow.read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY"
          if start not in raw:
              raise RuntimeError('Embedded upgrade script was not found.')
          block = raw.split(start, 1)[1].split(end, 1)[0]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines())
          exec(compile(script, str(workflow), 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit feature branch
        run: |
          rm -f .github/workflows/apply-savings-goal-category-options.yml .category-upgrade-trigger noop noop2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expand savings goal categories with custom options"
          git push origin HEAD:feature/savings-goal-category-options
