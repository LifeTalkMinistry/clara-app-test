name: Refactor dashboard inline helpers

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refactor-dashboard-inline-helpers.yml"
      - ".github/scripts/extract-dashboard-settings-panel-safe.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-profile-helper-text:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Remove Profile information helper text
        run: node .github/scripts/extract-dashboard-settings-panel-safe.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: gemini-2.5-flash

      - name: Commit verified Settings cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Settings source changes were produced."
            exit 1
          fi
          git commit -m "Remove Profile information helper text"
          git pull --rebase origin main
          git push origin main
