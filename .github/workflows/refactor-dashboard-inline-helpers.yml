name: Refactor dashboard inline helpers

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refactor-dashboard-inline-helpers.yml"
      - ".github/scripts/refactor-dashboard-inline-helpers.mjs"
      - ".github/scripts/extract-dashboard-cache-factory.mjs"
      - ".github/scripts/extract-dashboard-panel-constants.mjs"
      - ".github/scripts/extract-dashboard-panel-shell.mjs"
      - ".github/scripts/extract-finance-inline-alert.mjs"
      - ".github/scripts/extract-onboarding-action-bar.mjs"
      - ".github/scripts/cleanup-dashboard-stale-alert-imports.mjs"
      - ".github/scripts/extract-dashboard-messages-panel.mjs"
      - ".github/scripts/cleanup-unused-dashboard-dispatch-event.mjs"
      - ".github/scripts/wire-dashboard-shell-atoms.mjs"
      - ".github/scripts/extract-dashboard-finance-modal-renderer.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire Dashboard shell atoms
        run: node .github/scripts/wire-dashboard-shell-atoms.mjs

      - name: Extract Dashboard finance modal renderer
        run: node .github/scripts/extract-dashboard-finance-modal-renderer.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build

      - name: Commit dashboard refactor
        run: |
          if git diff --quiet; then
            echo "No dashboard refactor changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx src/components/fresh/main-dashboard/shell/DashboardFinanceModalRenderer.jsx
          git commit -m "Extract dashboard finance modal renderer"
          git push
