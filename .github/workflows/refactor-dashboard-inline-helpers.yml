name: Refactor dashboard inline helpers

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refactor-dashboard-inline-helpers.yml"
      - ".github/scripts/restore-dashboard-stable-shell.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Restore stable shell-wired Dashboard
        run: node .github/scripts/restore-dashboard-stable-shell.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build

      - name: Commit stable dashboard recovery
        run: |
          if git diff --quiet; then
            echo "No dashboard recovery changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/refactor-dashboard-inline-helpers.yml .github/scripts/restore-dashboard-stable-shell.mjs
          git commit -m "Restore stable shell-wired dashboard"
          git push
