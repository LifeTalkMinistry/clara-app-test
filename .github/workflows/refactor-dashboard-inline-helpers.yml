name: Refactor dashboard inline helpers

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refactor-dashboard-inline-helpers.yml"
      - ".github/scripts/extract-dashboard-messages-panel-safe.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-messages-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Dashboard messages panel
        run: node .github/scripts/extract-dashboard-messages-panel-safe.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build

      - name: Commit Dashboard messages panel extraction
        run: |
          if git diff --quiet; then
            echo "No Dashboard messages panel extraction changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx src/components/fresh/main-dashboard/dashboard-panels/messages/DashboardMessagesPanel.jsx
          git commit -m "Extract dashboard messages panel"
          git push
