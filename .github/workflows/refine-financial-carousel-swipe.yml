name: Refine financial carousel swipe

on:
  push:
    branches:
      - fix/financial-carousel-swipe
    paths:
      - ".github/scripts/refine-financial-carousel-swipe.mjs"
      - ".github/workflows/refine-financial-carousel-swipe.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/refine-financial-carousel-swipe.mjs"
      - ".github/workflows/refine-financial-carousel-swipe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/financial-carousel-swipe
          fetch-depth: 0

      - name: Apply carousel swipe refinement
        run: node .github/scripts/refine-financial-carousel-swipe.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run focused carousel regression
        run: node --test tests/financial-carousel-swipe-regression.test.mjs

      - name: Run full regression and production build
        run: npm run build

      - name: Commit verified carousel refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No carousel changes were produced."
            exit 0
          fi
          git commit -m "Refine financial carousel swipe behavior"
          git pull --rebase origin fix/financial-carousel-swipe
          git push origin HEAD:fix/financial-carousel-swipe
