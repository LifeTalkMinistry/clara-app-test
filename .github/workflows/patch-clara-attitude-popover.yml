name: Patch CLARA attitude selector into composer control

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-clara-attitude-popover.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Buy Check attitude UI patch
        run: python scripts/patch_clara_attitude_popover.py

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify build and capture exact error
        shell: bash
        run: |
          set +e
          npm run build > /tmp/clara-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -250 /tmp/clara-build.log > CLARA_PATCH_BUILD_ERROR.txt
            git restore src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CLARA_PATCH_BUILD_ERROR.txt
            git commit -m "Capture CLARA popover build error"
            git push origin main
            exit "$status"
          fi

      - name: Commit Buy Check UI patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx
          git commit -m "Move CLARA attitude selector into composer control"
          git push origin main
