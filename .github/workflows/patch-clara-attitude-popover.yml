name: Patch CLARA attitude selector into composer control

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-clara-attitude-popover.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Buy Check attitude UI patch
        run: python scripts/patch_clara_attitude_popover.py

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify changed Buy Check component
        run: npx eslint src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx

      - name: Verify Vite production compile
        run: npx vite build --base=./

      - name: Commit Buy Check UI patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/assistant/ClaraAiEnvironmentOverlayV2.jsx
          git commit -m "Move CLARA attitude selector into composer control"
          git push origin main
