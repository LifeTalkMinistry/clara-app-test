name: One-shot fix Orb past schedule startup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_orb_past_schedule_startup.py'
      - '.github/workflows/one-shot-fix-orb-past-schedule-startup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply surgical repair
        run: python scripts/fix_orb_past_schedule_startup.py
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/community/ClaraOrbPage.jsx
          git commit -m 'Fix CLARA Orb startup after past schedule banner'
          git push origin main
