name: Integrate validated CLARA buffered PDF carousel

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  integrate-build-and-cleanup:
    if: github.event.pull_request.head.ref == 'clara-pdf-buffered-carousel-final'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out clean integration branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Copy validated reader implementation
        run: git checkout cedb8f375af277d087def425eef7c64ffc938b5f -- src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build web app
        run: npm run build:web

      - name: Verify and commit clean implementation
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/clara-pdf-carousel-patch.yml
          git rm .github/workflows/clara-pdf-carousel-pr.yml
          git rm .clara-pdf-buffered-carousel-final-trigger

          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            ".clara-pdf-buffered-carousel-final-trigger"
            ".github/workflows/clara-pdf-carousel-patch.yml"
            ".github/workflows/clara-pdf-carousel-pr.yml"
            "src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx"
          )

          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[@]}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx
          git commit -m "fix: buffer PDF page switching carousel"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
