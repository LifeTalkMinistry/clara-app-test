name: Validate CLARA buffered PDF carousel

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    if: github.event.pull_request.head.ref == 'clara-pdf-buffered-carousel'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract reviewed patch script
        shell: bash
        run: |
          set -o pipefail
          python <<'PY_EXTRACT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/clara-pdf-carousel-patch.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/apply-clara-pdf-carousel.py').write_text(script, encoding='utf-8')
          PY_EXTRACT
          python /tmp/apply-clara-pdf-carousel.py 2>&1 | tee /tmp/clara-pdf-carousel-patch.log

      - name: Upload patch failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clara-pdf-carousel-patch-log
          path: /tmp/clara-pdf-carousel-patch.log
          if-no-files-found: warn
          retention-days: 1

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build web app
        run: npm run build:web

      - name: Verify and commit validated implementation
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/clara-pdf-carousel-patch.yml
          git rm .github/workflows/clara-pdf-carousel-pr.yml
          git rm .clara-pdf-buffered-carousel-trigger

          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            ".clara-pdf-buffered-carousel-trigger"
            ".github/workflows/clara-pdf-carousel-patch.yml"
            ".github/workflows/clara-pdf-carousel-pr.yml"
            "src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx"
          )

          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[@]}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/learning-hub/modal/LearningMaterialModal.jsx
          git commit -m "fix: buffer PDF page switching carousel"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
