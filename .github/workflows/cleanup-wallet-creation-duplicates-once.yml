name: Cleanup Wallet Creation Duplicates Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-wallet-creation-duplicates-once.yml"

permissions:
  contents: write

jobs:
  cleanup-wallet-creation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Remove disconnected wallet creation code
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const removeFile = (path) => {
            if (fs.existsSync(path)) {
              fs.unlinkSync(path);
              console.log(`removed ${path}`);
            }
          };

          const replaceRequired = (path, from, to) => {
            let text = fs.readFileSync(path, 'utf8');
            if (!text.includes(from)) throw new Error(`Missing marker in ${path}: ${from}`);
            text = text.replace(from, to);
            fs.writeFileSync(path, text);
          };

          [
            'src/components/FinanceActionModalPremium.jsx',
            'src/components/WalletCardEditable.jsx',
            'src/components/fresh/main-dashboard/finance-form/useDashboardFinanceActions.js',
            'src/components/fresh/main-dashboard/finance-actions/useDashboardFinanceModalHandlers.js',
            'src/components/fresh/main-dashboard/shell/useDashboardRenderProps.js',
            '.github/scripts/wire-dashboard-finance-modal-handlers.mjs',
            '.github/scripts/lazy-load-dashboard-modal-stack.mjs',
          ].forEach(removeFile);

          {
            const path = 'src/components/fresh/main-dashboard/finance-actions/useDashboardFinanceActionHandlersCore.js';
            let text = fs.readFileSync(path, 'utf8');

            const providerImport = `import {\n  buildWalletProviderPayload,\n  getWalletProvider,\n} from "@/components/financial-carousel/cards/wallet/logic/walletProviderRegistry";\n`;
            if (!text.includes(providerImport)) throw new Error('Wallet provider import marker not found in core handler');
            text = text.replace(providerImport, '');

            if (!text.includes('  addWalletData,\n')) throw new Error('addWalletData parameter marker not found');
            text = text.replace('  addWalletData,\n', '');

            const start = text.indexOf('  const createWalletInline = useCallback(async () => {');
            const endMarker = '\n\n  const deleteWalletInline = useCallback(async () => {';
            const end = text.indexOf(endMarker, start);
            if (start === -1 || end === -1) throw new Error('Retired createWalletInline block not found');
            text = text.slice(0, start) + text.slice(end + 2);

            if (!text.includes('    createWalletInline,\n')) throw new Error('createWalletInline return marker not found');
            text = text.replace('    createWalletInline,\n', '');

            fs.writeFileSync(path, text);
          }

          {
            const path = 'src/pages/Dashboard.jsx';
            let text = fs.readFileSync(path, 'utf8');
            const replacements = [
              ['    addWallet: addWalletData,\n', ''],
              ['    createWalletInline,\n', ''],
              ['    addWalletData,\n', ''],
              ['          financeModal, closeFinanceModal, createWalletInline, financeActionLoading,\n', '          financeModal, closeFinanceModal, financeActionLoading,\n'],
            ];
            for (const [from, to] of replacements) {
              if (!text.includes(from)) throw new Error(`Dashboard marker missing: ${from}`);
              text = text.replace(from, to);
            }
            fs.writeFileSync(path, text);
          }

          replaceRequired(
            'src/components/fresh/main-dashboard/guide/ClaraGuideManualExpensePreview.jsx',
            '        createWalletInline={noop}\n',
            ''
          );

          replaceRequired(
            'tests/money-left-architecture.test.mjs',
            '    read("../src/components/fresh/main-dashboard/finance-actions/useDashboardFinanceModalHandlers.js"),',
            '    read("../src/components/fresh/main-dashboard/finance-actions/useDashboardFinanceActionHandlers.js"),'
          );
          NODE

      - name: Verify one wallet creation system remains
        shell: bash
        run: |
          set -euo pipefail

          for retired in \
            FinanceActionModalPremium \
            WalletCardEditable \
            useDashboardFinanceActions \
            useDashboardFinanceModalHandlers \
            useDashboardRenderProps \
            createWalletInline; do
            if git grep -n "$retired" -- src tests; then
              echo "Retired wallet creation reference still exists: $retired"
              exit 1
            fi
          done

          if git grep -n 'Set up a money container for balance, spending, and transfers' -- src; then
            echo "Retired premium wallet modal copy still exists"
            exit 1
          fi

          active_save_count=$(git grep -n 'financial.addWallet' -- src | wc -l | tr -d ' ')
          if [ "$active_save_count" -ne 1 ]; then
            echo "Expected exactly one live UI wallet save implementation, found $active_save_count"
            git grep -n 'financial.addWallet' -- src || true
            exit 1
          fi

          git grep -n 'GuidedWalletCreationModal' -- src/components/fresh/main-dashboard/shell/DashboardFinanceModalRendererWithIncomeFunding.jsx >/dev/null
          git grep -n 'type: "create_wallet"' -- src/pages/Dashboard.jsx src/components/community/CommunityHomeFinancialCarousel.jsx src/components/fresh/main-dashboard/finance-actions/useDashboardFinanceActionHandlersCore.js >/dev/null

          echo "Verified: all live create-wallet entry points route to GuidedWalletCreationModal, with one save implementation."

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-wallet-creation-duplicates-once.yml
          git add -A
          git commit -m "Eradicate disconnected wallet creation paths"
          git pull --rebase origin main
          git push origin main
