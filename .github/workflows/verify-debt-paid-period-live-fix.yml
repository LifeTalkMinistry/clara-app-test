name: Verify debt paid-period live fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-debt-paid-period-live-fix.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify paid-period regressions
        run: node --test tests/debt-paid-period-indicator-regression.test.mjs tests/debt-payment-historical-log-regression.test.mjs

      - name: Remove temporary verifier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-debt-paid-period-live-fix.yml
          git commit -m "Remove debt paid-period live verifier"
          git pull --rebase origin main
          git push origin HEAD:main
