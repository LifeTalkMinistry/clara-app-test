name: Replace Legacy Create Wallet Flow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/find-and-patch-live-create-wallet.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-create-wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Replace legacy Create Wallet surfaces with guided flow
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function ensureImport(text, anchor, importLine) {
            if (text.includes(importLine)) return text;
            if (!text.includes(anchor)) throw new Error(`Import anchor not found: ${anchor}`);
            return text.replace(anchor, `${anchor}\n${importLine}`);
          }

          function replaceBlock(text, startMarker, endMarker, replacement, label) {
            const start = text.indexOf(startMarker);
            if (start < 0) {
              if (text.includes(replacement.trim())) return text;
              throw new Error(`Start marker not found for ${label}`);
            }
            const endStart = text.indexOf(endMarker, start);
            if (endStart < 0) throw new Error(`End marker not found for ${label}`);
            const end = endStart + endMarker.length;
            return `${text.slice(0, start)}${replacement}${text.slice(end)}`;
          }

          const communityPath = 'src/components/community/CommunityHomeFinancialCarousel.jsx';
          let community = fs.readFileSync(communityPath, 'utf8');
          community = ensureImport(
            community,
            'import FinanceActionModal from "@/components/fresh/main-dashboard/dashboard-primitives/FinanceActionModal";',
            'import GuidedWalletCreationModal from "@/components/fresh/main-dashboard/dashboard-primitives/GuidedWalletCreationModal";'
          );

          const communityStart = '      <FinanceActionModal\n        open={walletModal.type === "create_wallet"}';
          const communityEnd = '      </FinanceActionModal>';
          const communityReplacement = `      <GuidedWalletCreationModal
        open={walletModal.type === "create_wallet"}
        onClose={closeWalletModal}
        onSave={createWalletInline}
        loading={walletActionLoading}
        financeForm={walletForm}
        setFinanceForm={setWalletForm}
        incomeSources={[]}
        incomeSourcesLoading={false}
        formatMoney={formatPhpCurrency}
      />`;
          community = replaceBlock(
            community,
            communityStart,
            communityEnd,
            communityReplacement,
            'Community Home create wallet'
          );
          fs.writeFileSync(communityPath, community);

          const rendererPath = 'src/components/fresh/main-dashboard/shell/DashboardFinanceModalRenderer.jsx';
          let renderer = fs.readFileSync(rendererPath, 'utf8');
          renderer = ensureImport(
            renderer,
            'import FinanceActionModal from "@/components/fresh/main-dashboard/dashboard-primitives/FinanceActionModal";',
            'import GuidedWalletCreationModal from "@/components/fresh/main-dashboard/dashboard-primitives/GuidedWalletCreationModal";'
          );

          const rendererStart = '      <FinanceActionModal\n        open={financeModal.type === "create_wallet"}';
          const rendererEnd = '      </FinanceActionModal>';
          const rendererReplacement = `      <GuidedWalletCreationModal
        open={financeModal.type === "create_wallet"}
        onClose={closeFinanceModal}
        onSave={createWalletInline}
        loading={financeActionLoading}
        financeForm={financeForm}
        setFinanceForm={setFinanceForm}
        incomeSources={[]}
        incomeSourcesLoading={false}
        formatMoney={fmt}
      />`;
          renderer = replaceBlock(
            renderer,
            rendererStart,
            rendererEnd,
            rendererReplacement,
            'Dashboard fallback create wallet'
          );
          fs.writeFileSync(rendererPath, renderer);

          const legacyChecks = [
            [communityPath, 'open={walletModal.type === "create_wallet"}', '<FinanceActionModal'],
            [rendererPath, 'open={financeModal.type === "create_wallet"}', '<FinanceActionModal'],
          ];

          for (const [file, openMarker, legacyComponent] of legacyChecks) {
            const text = fs.readFileSync(file, 'utf8');
            const markerIndex = text.indexOf(openMarker);
            if (markerIndex < 0) throw new Error(`Create wallet marker missing after patch: ${file}`);
            const before = text.slice(Math.max(0, markerIndex - 80), markerIndex);
            if (before.includes(legacyComponent)) {
              throw new Error(`Legacy FinanceActionModal create-wallet surface still active: ${file}`);
            }
            if (!before.includes('<GuidedWalletCreationModal')) {
              throw new Error(`Guided wallet creation not wired at live marker: ${file}`);
            }
          }

          console.log('Legacy Create Wallet surfaces replaced with GuidedWalletCreationModal.');
          NODE

      - name: Commit guided wallet routing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/community/CommunityHomeFinancialCarousel.jsx \
                  src/components/fresh/main-dashboard/shell/DashboardFinanceModalRenderer.jsx
          if git diff --cached --quiet; then
            echo "Create Wallet already uses the guided flow."
          else
            git commit -m "Use guided wallet creation everywhere"
            git pull --rebase origin main
            git push origin main
          fi
