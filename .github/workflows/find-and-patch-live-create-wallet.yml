name: One Time Wallet Creation Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/find-and-patch-live-create-wallet.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-wallet-creation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Remove legacy wallet creation surfaces and fix guided modal header
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function requireReplace(text, search, replacement, label) {
            if (!text.includes(search)) {
              if (text.includes(replacement)) return text;
              throw new Error(`Missing marker: ${label}`);
            }
            return text.replace(search, replacement);
          }

          function removeBetween(text, startMarker, endMarker, label) {
            const start = text.indexOf(startMarker);
            if (start < 0) return text;
            const endStart = text.indexOf(endMarker, start);
            if (endStart < 0) throw new Error(`Missing end marker: ${label}`);
            return text.slice(0, start) + text.slice(endStart);
          }

          // 1) Community Home: delete its duplicate Create Wallet form and hand
          // creation to the same latest income-aware controller used by Dashboard.
          const communityPath = 'src/components/community/CommunityHomeFinancialCarousel.jsx';
          let community = fs.readFileSync(communityPath, 'utf8');

          const controllerImport = 'import DashboardFinanceModalRendererWithIncomeFunding from "@/components/fresh/main-dashboard/shell/DashboardFinanceModalRendererWithIncomeFunding";';
          if (!community.includes(controllerImport)) {
            const anchor = 'import FinanceActionModal from "@/components/fresh/main-dashboard/dashboard-primitives/FinanceActionModal";';
            if (!community.includes(anchor)) throw new Error('Community import anchor missing');
            community = community.replace(anchor, `${anchor}\n${controllerImport}`);
          }

          community = community.replace('    addWallet: addWalletData,\n', '');

          community = removeBetween(
            community,
            '  const createWalletInline = useCallback(async () => {',
            '  const editWalletInline = useCallback',
            'Community duplicate createWalletInline'
          );

          const communityLegacyPattern = /      <FinanceActionModal\n        open=\{walletModal\.type === "create_wallet"\}[\s\S]*?      <\/FinanceActionModal>\n/;
          if (communityLegacyPattern.test(community)) {
            community = community.replace(
              communityLegacyPattern,
              `      {walletModal.type === "create_wallet" ? (\n        <DashboardFinanceModalRendererWithIncomeFunding\n          financeModal={walletModal}\n          closeFinanceModal={closeWalletModal}\n          financeActionLoading={walletActionLoading || loading || refreshing}\n          financeForm={walletForm}\n          setFinanceForm={setWalletForm}\n          fmt={formatPhpCurrency}\n          showFinanceNotice={(message, tone) => {\n            if (!message) return;\n            if (tone === "success") toast.success(message);\n            else toast.error(message);\n          }}\n          user={user}\n          wallets={wallets}\n        />\n      ) : null}\n`
            );
          }

          if (/open=\{walletModal\.type === "create_wallet"\}[\s\S]{0,120}<FinanceActionModal/.test(community)) {
            throw new Error('Community legacy create-wallet modal still present');
          }
          if (!community.includes('<DashboardFinanceModalRendererWithIncomeFunding')) {
            throw new Error('Community latest guided controller was not wired');
          }
          fs.writeFileSync(communityPath, community);

          // 2) Base Dashboard renderer: remove its retired fallback create-wallet form.
          // DashboardFinanceModalRendererWithIncomeFunding is the sole owner now.
          const rendererPath = 'src/components/fresh/main-dashboard/shell/DashboardFinanceModalRenderer.jsx';
          let renderer = fs.readFileSync(rendererPath, 'utf8');
          renderer = renderer.replace('  createWalletInline,\n', '');

          const rendererLegacyPattern = /      <FinanceActionModal\n        open=\{financeModal\.type === "create_wallet"\}[\s\S]*?      <\/FinanceActionModal>\n/;
          renderer = renderer.replace(rendererLegacyPattern, '');

          if (renderer.includes('open={financeModal.type === "create_wallet"}')) {
            throw new Error('Dashboard fallback create-wallet modal still present');
          }
          fs.writeFileSync(rendererPath, renderer);

          // 3) Guided flow: keep it below the shared top navigation so the title,
          // progress indicator, and close button can never sit underneath the nav.
          const guidedPath = 'src/components/fresh/main-dashboard/dashboard-primitives/GuidedWalletCreationModal.jsx';
          let guided = fs.readFileSync(guidedPath, 'utf8');
          guided = requireReplace(
            guided,
            'className="fixed inset-0 z-[120] h-[100dvh] w-full overflow-hidden bg-[linear-gradient(140deg,rgba(5,28,48,0.99),rgba(7,16,44,0.995)_48%,rgba(34,15,73,0.995))] text-white"',
            'className="fixed inset-x-0 bottom-0 top-[64px] z-[120] h-[calc(100dvh-64px)] w-full overflow-hidden bg-[linear-gradient(140deg,rgba(5,28,48,0.99),rgba(7,16,44,0.995)_48%,rgba(34,15,73,0.995))] text-white"',
            'Guided wallet root viewport offset'
          );
          guided = requireReplace(
            guided,
            'px-6 pb-5 pt-[calc(1.25rem+env(safe-area-inset-top))]',
            'px-6 pb-4 pt-4 sm:pb-5 sm:pt-5',
            'Guided wallet header padding'
          );
          guided = requireReplace(
            guided,
            'className="max-w-[340px] text-[34px] font-black leading-[0.98] tracking-[-0.055em]"',
            'className="max-w-[340px] text-[clamp(28px,8vw,34px)] font-black leading-[0.98] tracking-[-0.055em]"',
            'Guided wallet responsive title'
          );
          fs.writeFileSync(guidedPath, guided);

          console.log('Legacy wallet creation removed. Guided flow is the only Create Wallet UI.');
          NODE

      - name: Commit cleanup and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/find-and-patch-live-create-wallet.yml
          git add src/components/community/CommunityHomeFinancialCarousel.jsx \
                  src/components/fresh/main-dashboard/shell/DashboardFinanceModalRenderer.jsx \
                  src/components/fresh/main-dashboard/dashboard-primitives/GuidedWalletCreationModal.jsx
          git commit -m "Eradicate legacy wallet creation and fix guided header"
          git pull --rebase origin main
          git push origin main
