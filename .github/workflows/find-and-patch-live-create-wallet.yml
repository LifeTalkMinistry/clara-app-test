name: Find And Patch Live Create Wallet

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/find-and-patch-live-create-wallet.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Locate and patch live Create Wallet modal
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const roots = ['src'];
          const files = [];
          const walk = (dir) => {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(jsx|tsx|js|ts)$/.test(entry.name)) files.push(full);
            }
          };
          roots.forEach(walk);

          const markers = [
            'Add a new wallet without leaving the finance carousel.',
            'Wallet name',
            'Wallet type',
            'Starting balance',
          ];

          const targets = files.filter((file) => {
            const s = fs.readFileSync(file, 'utf8');
            return markers.every((m) => s.includes(m));
          });

          if (!targets.length) {
            throw new Error('No live Create Wallet modal source found.');
          }

          console.log('Live Create Wallet modal candidates:', targets.join(', '));

          for (const file of targets) {
            let text = fs.readFileSync(file, 'utf8');
            const original = text;

            text = text.replaceAll('title="Create wallet"', 'title="Where will your money live?"');
            text = text.replaceAll('title={"Create wallet"}', 'title={"Where will your money live?"}');
            text = text.replaceAll('Create wallet', 'Create wallet →');
            text = text.replaceAll('Create wallet → →', 'Create wallet →');
            text = text.replaceAll(
              'Add a new wallet without leaving the finance carousel.',
              'Create a new money container inside your CLARA system.'
            );

            text = text.replaceAll('bg-white/[0.04]', 'bg-white/[0.075]');
            text = text.replaceAll('bg-white/5', 'bg-white/[0.075]');
            text = text.replaceAll('border-white/10', 'border-white/15');
            text = text.replaceAll('rounded-xl', 'rounded-2xl');

            text = text.replaceAll(
              'placeholder="e.g. GCash, Cash, Payroll"',
              'placeholder="e.g. GCash, Cash, Payroll"'
            );

            text = text.replaceAll(
              'Choose a default type or create your own custom wallet type.',
              'Choose the closest type so CLARA can organize your money clearly.'
            );

            text = text.replaceAll(
              'className="w-full bg-emerald-500 font-semibold text-black hover:bg-emerald-400"',
              'className="min-h-[54px] w-full rounded-2xl bg-gradient-to-r from-emerald-400 via-emerald-500 to-green-600 text-sm font-bold text-white shadow-[0_14px_34px_rgba(16,185,129,0.32)] transition hover:scale-[1.01] hover:from-emerald-300 hover:to-green-500 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-60"'
            );

            text = text.replaceAll(
              'className="w-full rounded-2xl bg-gradient-to-r from-emerald-400 via-emerald-500 to-green-600 py-3 text-sm font-semibold text-white shadow-lg shadow-emerald-500/20 transition active:scale-[0.98]"',
              'className="min-h-[54px] w-full rounded-2xl bg-gradient-to-r from-emerald-400 via-emerald-500 to-green-600 text-sm font-bold text-white shadow-[0_14px_34px_rgba(16,185,129,0.32)] transition hover:scale-[1.01] hover:from-emerald-300 hover:to-green-500 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-60"'
            );

            if (text !== original) {
              fs.writeFileSync(file, text);
              console.log('Patched:', file);
            }
          }
          NODE

      - name: Commit live Create Wallet patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source changes produced."
          else
            git commit -m "Patch live create wallet modal premium styling"
            git pull --rebase origin main
            git push origin main
          fi
