name: Validate Money Left Orb Guide Final

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'validate-money-left-orb-guide-final'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Validate state machine and approved copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          home = Path('src/components/fresh/main-dashboard/shell/DashboardHomePanel.jsx').read_text()
          required = [
              'AMOUNTS RESTORED', 'MEET THE CLARA ORB', '1 TAP — LOG EXPENSE',
              '2 TAPS — TRANSACTION HUB', 'HOLD — CHAT WITH CLARA', 'ORB READY',
              'setMoneyLeftOrbPhase("intro")', 'setMoneyLeftOrbPhase("await-single")',
              'setMoneyLeftOrbPhase("single-preview")', 'setMoneyLeftOrbPhase("double-preview")',
              'setMoneyLeftOrbPhase("hold-preview")', '"await-double"', '"await-hold"',
              '"complete"', 'detail: { feature: GUIDE_FEATURE_MONEY_LEFT_ORB }',
              'guideOrbCompletionDispatchRef.current',
          ]
          missing = [token for token in required if token not in home]
          if missing:
              raise SystemExit(f'Missing state/copy requirements: {missing}')
          print('State machine and approved copy passed.')
          PY

      - name: Validate orb scroll safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          home = Path('src/components/fresh/main-dashboard/shell/DashboardHomePanel.jsx').read_text()
          preview = Path('src/components/fresh/main-dashboard/guide/ClaraGuideOrbPreview.jsx').read_text()
          start = home.index('const handleGuideNextToMoneyLeftOrb')
          end = home.index('const handleFinanceCarouselIndexChange')
          orb_flow = home[start:end]
          found = [token for token in ('scrollIntoView', 'window.scrollTo', 'dashboardScroller.scrollTo', '.scrollTo(') if token in orb_flow]
          if found:
              raise SystemExit(f'Forbidden orb-flow scrolling: {found}')
          count = orb_flow.count('preserveDashboardScrollPosition')
          print(f'preserveDashboardScrollPosition count: {count}')
          if count < 4:
              raise SystemExit(f'Expected at least 4 scroll-protected transitions, found {count}')
          if 'preventScroll: true' not in orb_flow or 'preventScroll: true' not in preview:
              raise SystemExit('Focus restoration is not scroll-safe')
          print('Orb scroll safety passed.')
          PY

      - name: Validate live-handler isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          home = Path('src/components/fresh/main-dashboard/shell/DashboardHomePanel.jsx').read_text()
          isolation = [
              'moneyLeftSummaryHandlers={isGuideMode ? undefined : moneyLeftSummaryHandlers}',
              'handleMoneyLeftOrbClick={isGuideMode ? undefined : handleMoneyLeftOrbClick}',
              'startMoneyLeftOrbLongPress={isGuideMode ? undefined : startMoneyLeftOrbLongPress}',
              'moveMoneyLeftOrbLongPress={isGuideMode ? undefined : moveMoneyLeftOrbLongPress}',
              'endMoneyLeftOrbLongPress={isGuideMode ? undefined : endMoneyLeftOrbLongPress}',
          ]
          missing = [token for token in isolation if token not in home]
          if missing:
              raise SystemExit(f'Missing live-handler isolation: {missing}')
          print('Live-handler isolation passed.')
          PY

      - name: Validate preview and data isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          home = Path('src/components/fresh/main-dashboard/shell/DashboardHomePanel.jsx').read_text()
          preview = Path('src/components/fresh/main-dashboard/guide/ClaraGuideOrbPreview.jsx').read_text()
          start = home.index('const handleGuideNextToMoneyLeftOrb')
          end = home.index('const handleFinanceCarouselIndexChange')
          simulation = home[start:end] + '\n' + preview
          forbidden = (
              'addExpense', 'saveManualExpenseInline', 'setFinanceForm', 'navigate(',
              'setShowAiAssistant', 'clara:open-assistant', 'localStorage.setItem',
              'openTransactionHubFromMoneyLeft', 'openManualExpenseFromMoneyLeft',
              'TransactionHub', 'useFinancialData', 'ClaraAssistantPanel', 'type="submit"',
          )
          found = [token for token in forbidden if token in simulation]
          if found:
              raise SystemExit(f'Simulation contains forbidden live/data dependency: {found}')
          if 'disabled' not in preview or 'SIMULATION ONLY' not in preview:
              raise SystemExit('Static preview safety markers are missing')
          print('Preview and data isolation passed.')
          PY

      - name: Validate gesture, pointer, focus, and cleanup rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          summary = Path('src/components/fresh/main-dashboard/money-summary/DashboardMoneySummaryStable.jsx').read_text()
          preview = Path('src/components/fresh/main-dashboard/guide/ClaraGuideOrbPreview.jsx').read_text()
          css = Path('src/guide-mode-money-left-orb.css').read_text()
          top_nav = Path('src/components/fresh/main-dashboard/top-nav/DashboardTopNav.jsx').read_text()
          installer = Path('src/runtime/installClaraGuideCarouselStep.js').read_text()
          main = Path('src/main.jsx').read_text()
          gesture = [
              'SINGLE_TAP_DELAY = 240', 'DOUBLE_TAP_WINDOW = 280',
              'GUIDE_LONG_PRESS_DELAY = 520', 'MOVE_CANCEL_DISTANCE = 12',
              'gestureEpochRef', 'isGestureCallbackCurrent', 'event?.repeat',
              'event?.preventDefault?.()',
          ]
          missing = [token for token in gesture if token not in summary]
          if missing:
              raise SystemExit(f'Missing gesture/timer rules: {missing}')
          selectors = [
              "data-clara-guide-orb-phase='await-single'",
              "data-clara-guide-orb-phase='await-double'",
              "data-clara-guide-orb-phase='await-hold'",
              "[data-clara-summary-privacy-toggle='true']",
              "[data-clara-summary-card='money-left']",
              "[data-clara-summary-card='total-expense']",
              "[data-clara-guide-action='next']",
              "[data-clara-guide-orb-preview-next='true']",
              "[data-clara-guide-exit='true']",
          ]
          missing = [token for token in selectors if token not in css]
          if missing:
              raise SystemExit(f'Missing pointer rules: {missing}')
          if 'content: none !important' not in css or 'box-shadow: none !important' not in css:
              raise SystemExit('Full-card spotlight suppression is missing')
          if 'right: 42px !important' not in css:
              raise SystemExit('Bubble arrow target rule is missing')
          if '@media (prefers-reduced-motion: reduce)' not in css:
              raise SystemExit('Reduced-motion rule is missing')
          if 'data-clara-guide-orb-preview="true"' not in preview or 'tabIndex={-1}' not in preview:
              raise SystemExit('Preview focus target is missing')
          if 'data-clara-guide-exit={isGuideExitSlot ? "true" : undefined}' not in top_nav:
              raise SystemExit('Exit pointer exemption is missing')
          if 'clearClaraGuideFeatureClasses' not in installer or 'clearClaraGuideFeatureClasses();' not in main:
              raise SystemExit('Root-class cleanup is not wired')
          print('Gesture, pointer, focus, and cleanup rules passed.')
          PY

      - name: Verify legacy live-preview controller is not mounted
        run: |
          matches=$(grep -R --line-number --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            'ClaraGuideMoneyLeftOrbController' src | grep -v 'src/runtime/ClaraGuideMoneyLeftOrbController.jsx' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi
          echo 'Legacy controller is not imported or mounted.'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full lint
        run: npm run lint

      - name: Run configured tests when present
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            npm test -- --run
          else
            echo 'No test script is configured; skipping automated tests.'
          fi

      - name: Run production build
        run: npm run build
