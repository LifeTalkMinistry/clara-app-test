name: Patch systemic cross-device sync coverage v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-systemic-sync-coverage-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch persistence boundary
        shell: bash
        run: |
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/lib/localFinanceStore.js")
          text = path.read_text(encoding="utf-8")

          helper = '''export const CLARA_LOCAL_FINANCE_UPDATED_EVENT = "clara-local-finance-updated";
          const MUTATION_PREFLIGHT_HOOK = "__claraPrepareServerFinanceMutation";

          async function prepareServerFinanceMutation(localUserId, context = {}) {
            const hook = globalThis?.[MUTATION_PREFLIGHT_HOOK];
            if (typeof hook !== "function") return null;
            try {
              return await hook({ localUserId, ...context });
            } catch {
              return null;
            }
          }

          function dispatchLocalFinanceUpdated(detail = {}) {
            if (typeof window === "undefined") return;
            window.dispatchEvent(
              new CustomEvent(CLARA_LOCAL_FINANCE_UPDATED_EVENT, {
                detail: { source: "local_finance_store", ...detail },
              })
            );
          }

          '''
          helper = "\n".join(line[10:] if line.startswith("          ") else line for line in helper.splitlines()) + "\n"

          if "CLARA_LOCAL_FINANCE_UPDATED_EVENT" not in text:
            marker = "let dbPromise = null;\n\n"
            if marker not in text:
              raise SystemExit("dbPromise marker missing")
            text = text.replace(marker, marker + helper, 1)

          callback_marker = '''  if (typeof callback !== "function") {
            throw new Error("A local finance transaction callback is required.");
          }

          const db = await openLocalFinanceDb();'''
          callback_marker = "\n".join(line[10:] if line.startswith("          ") else line for line in callback_marker.splitlines())
          callback_patch = '''  if (typeof callback !== "function") {
            throw new Error("A local finance transaction callback is required.");
          }

          if (mode === "readwrite" && options.skipServerPreflight !== true) {
            await prepareServerFinanceMutation(safeLocalUserId, {
              operation: "transaction",
              storeNames: safeStoreNames,
            });
          }

          const db = await openLocalFinanceDb();'''
          callback_patch = "\n".join(line[10:] if line.startswith("          ") else line for line in callback_patch.splitlines())
          if "options.skipServerPreflight" not in text:
            if callback_marker not in text:
              raise SystemExit("transaction callback marker missing")
            text = text.replace(callback_marker, callback_patch, 1)

          result_marker = '''    const result = await callback(helpers);
            await transactionDone;
            return result;'''
          result_marker = "\n".join(line[10:] if line.startswith("          ") else line for line in result_marker.splitlines())
          result_patch = '''    const result = await callback(helpers);
            await transactionDone;
            if (mode === "readwrite" && options.suppressMutationEvent !== true) {
              dispatchLocalFinanceUpdated({
                operation: "transaction",
                storeNames: safeStoreNames,
                localUserId: safeLocalUserId,
              });
            }
            return result;'''
          result_patch = "\n".join(line[10:] if line.startswith("          ") else line for line in result_patch.splitlines())
          if "options.suppressMutationEvent" not in text:
            if result_marker not in text:
              raise SystemExit("transaction result marker missing")
            text = text.replace(result_marker, result_patch, 1)

          def function_block(source, name, next_name):
            start = source.index(f"export async function {name}")
            end = source.index(f"export async function {next_name}", start)
            return start, end, source[start:end]

          def replace_function(source, name, next_name, operation, return_expr, result_name):
            start, end, block = function_block(source, name, next_name)
            if "prepareServerFinanceMutation" not in block:
              marker = "  const db = await openLocalFinanceDb();"
              preflight = f'''  await prepareServerFinanceMutation(safeLocalUserId, {{
            operation: "{operation}",
            storeNames: [storeName],
            recordId: {"record?.id || null" if name == "upsertLocalRecord" else "id"},
          }});
          const db = await openLocalFinanceDb();'''
              preflight = "\n".join(line[10:] if line.startswith("          ") else line for line in preflight.splitlines())
              if marker not in block:
                raise SystemExit(f"{name} db marker missing")
              block = block.replace(marker, preflight, 1)
            if f'operation: "{operation}"' not in block.split("await transactionToPromise(transaction);", 1)[-1]:
              marker = f"  await transactionToPromise(transaction);\n\n  return {return_expr};"
              event = f'''  await transactionToPromise(transaction);
          dispatchLocalFinanceUpdated({{
            operation: "{operation}",
            storeNames: [storeName],
            recordId: {result_name},
            localUserId: safeLocalUserId,
          }});

          return {return_expr};'''
              event = "\n".join(line[10:] if line.startswith("          ") else line for line in event.splitlines())
              if marker not in block:
                raise SystemExit(f"{name} return marker missing")
              block = block.replace(marker, event, 1)
            return source[:start] + block + source[end:]

          text = replace_function(
            text,
            "upsertLocalRecord",
            "softDeleteLocalRecord",
            "upsert",
            "normalizedRecord",
            "normalizedRecord.id",
          )
          text = replace_function(
            text,
            "softDeleteLocalRecord",
            "hardDeleteLocalRecord",
            "soft_delete",
            "deletedRecord",
            "id",
          )
          text = replace_function(
            text,
            "hardDeleteLocalRecord",
            "clearLocalUserPrivateData",
            "hard_delete",
            "true",
            "id",
          )

          def patch_clear(source, name, next_name, operation):
            start, end, block = function_block(source, name, next_name)
            if "prepareServerFinanceMutation" not in block:
              marker = "  const db = await openLocalFinanceDb();"
              preflight = f'''  await prepareServerFinanceMutation(safeLocalUserId, {{
            operation: "{operation}",
            storeNames: LOCAL_FINANCE_PRIVATE_STORES,
          }});
          const db = await openLocalFinanceDb();'''
              preflight = "\n".join(line[10:] if line.startswith("          ") else line for line in preflight.splitlines())
              if marker not in block:
                raise SystemExit(f"{name} db marker missing")
              block = block.replace(marker, preflight, 1)
            tail = block.split("await transactionToPromise(transaction);", 1)[-1]
            if f'operation: "{operation}"' not in tail:
              marker = "  await transactionToPromise(transaction);\n"
              event = f'''  await transactionToPromise(transaction);
          dispatchLocalFinanceUpdated({{
            operation: "{operation}",
            storeNames: LOCAL_FINANCE_PRIVATE_STORES,
            localUserId: safeLocalUserId,
          }});
          '''
              event = "\n".join(line[10:] if line.startswith("          ") else line for line in event.splitlines())
              if marker not in block:
                raise SystemExit(f"{name} completion marker missing")
              block = block.replace(marker, event, 1)
            return source[:start] + block + source[end:]

          text = patch_clear(text, "clearLocalUserPrivateData", "clearLocalUserVault", "clear_private_data")
          text = patch_clear(text, "clearLocalUserVault", "getLocalMetadata", "clear_vault")

          path.write_text(text, encoding="utf-8")
          PY

          cat > tests/systemic-sync-coverage.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs/promises";

          const localStoreSource = await fs.readFile(new URL("../src/lib/localFinanceStore.js", import.meta.url), "utf8");
          const bridgeSource = await fs.readFile(new URL("../src/components/CloudVaultSyncBridge.jsx", import.meta.url), "utf8");
          const snapshotSource = await fs.readFile(new URL("../src/lib/cloud-vault-snapshot.js", import.meta.url), "utf8");

          test("all private IndexedDB mutations notify and preflight account sync", () => {
            assert.match(localStoreSource, /CLARA_LOCAL_FINANCE_UPDATED_EVENT/);
            assert.match(localStoreSource, /__claraPrepareServerFinanceMutation/);
            for (const operation of ["transaction", "upsert", "soft_delete", "hard_delete", "clear_private_data", "clear_vault"]) {
              assert.match(localStoreSource, new RegExp(`operation: ["']${operation}["']`));
            }
          });

          test("localStorage features and foreground devices trigger synchronization", () => {
            assert.match(bridgeSource, /prototype\.setItem = patchedSetItem/);
            assert.match(bridgeSource, /prototype\.removeItem = patchedRemoveItem/);
            assert.match(bridgeSource, /clara:syncable-local-storage-changed/);
            assert.match(bridgeSource, /window\.addEventListener\("focus"/);
            assert.match(bridgeSource, /visibilitychange/);
            assert.match(bridgeSource, /FOREGROUND_SYNC_INTERVAL_MS/);
          });

          test("daily check-in remains intentionally device-only", () => {
            assert.match(bridgeSource, /\^clara_daily_check_in_/);
            assert.match(snapshotSource, /DEVICE_ONLY_STORAGE_KEY_PATTERN\s*=\s*\/\^clara_daily_check_in_\/i/);
          });
          EOF

          rm -f .github/workflows/patch-systemic-sync-coverage.yml
          rm -f .github/workflows/patch-systemic-sync-coverage-v2.yml

      - name: Verify targeted sync contracts
        run: |
          node --test tests/systemic-sync-coverage.test.mjs tests/budget-reset-cross-device-sync.test.mjs tests/cloud-vault-sync.test.mjs

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Cover all local feature writes in account sync"
          git push origin HEAD:main
