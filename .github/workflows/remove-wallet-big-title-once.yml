name: Remove Wallet Big Title Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-wallet-big-title-once.yml"

permissions:
  contents: write

jobs:
  remove-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Remove oversized first-step wallet title
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/fresh/main-dashboard/dashboard-primitives/GuidedWalletCreationModal.jsx';
          let text = fs.readFileSync(path, 'utf8');

          const oldTitle = '<h3 className="max-w-[340px] text-[clamp(28px,8vw,34px)] font-black leading-[0.98] tracking-[-0.055em]">{title}</h3>';
          const newTitle = '{step !== "choose_wallet" ? <h3 className="max-w-[340px] text-[clamp(28px,8vw,34px)] font-black leading-[0.98] tracking-[-0.055em]">{title}</h3> : null}';
          if (!text.includes(oldTitle) && !text.includes(newTitle)) throw new Error('Wallet title marker not found');
          text = text.replace(oldTitle, newTitle);

          const oldSubtitle = '<p className="mt-3 max-w-[340px] text-[13px] font-semibold leading-5 text-cyan-50/64">{subtitle}</p>';
          const newSubtitle = '<p className={`${step === "choose_wallet" ? "mt-2" : "mt-3"} max-w-[340px] text-[13px] font-semibold leading-5 text-cyan-50/64`}>{subtitle}</p>';
          if (!text.includes(oldSubtitle) && !text.includes(newSubtitle)) throw new Error('Wallet subtitle marker not found');
          text = text.replace(oldSubtitle, newSubtitle);

          fs.writeFileSync(path, text);
          NODE

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-wallet-big-title-once.yml
          git add src/components/fresh/main-dashboard/dashboard-primitives/GuidedWalletCreationModal.jsx
          git commit -m "Remove oversized wallet selection title"
          git pull --rebase origin main
          git push origin main
