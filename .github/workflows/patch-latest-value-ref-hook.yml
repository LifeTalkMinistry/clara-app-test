name: Patch latest value ref hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-latest-value-ref-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useLatestValueRef into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useLatestValueRef from "@/components/fresh/main-dashboard/hooks/useLatestValueRef";\n'
          import_anchor = 'import useDashboardScheduledRefresh from "@/components/fresh/main-dashboard/finance-notices/useDashboardScheduledRefresh";\n'
          fallback_anchor = 'import useDashboardProfileUpdateListener from "@/components/fresh/main-dashboard/profile/useDashboardProfileUpdateListener";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Latest value ref import anchor not found. Refusing to patch Dashboard.jsx.")

          replacements = {
              '  const latestEnrollmentRef = useRef(null);\n': '  const latestEnrollmentRef = useLatestValueRef(latestEnrollment);\n',
              '  const isPaidRef = useRef(isPaid);\n': '  const isPaidRef = useLatestValueRef(isPaid);\n',
          }

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"Expected ref line not found: {old.strip()}")

          old_latest_effect = (
              '  useEffect(() => {\n'
              '    latestEnrollmentRef.current = latestEnrollment;\n'
              '  }, [latestEnrollment]);\n\n'
          )
          old_paid_effect = (
              '  useEffect(() => {\n'
              '    isPaidRef.current = isPaid;\n'
              '  }, [isPaid]);\n\n'
          )

          for old_effect in [old_latest_effect, old_paid_effect]:
              if old_effect in text:
                  text = text.replace(old_effect, '', 1)
              else:
                  if old_effect.strip().split('\n')[1].strip() in text:
                      raise SystemExit("Latest ref sync effect still exists but exact block was not found. Refusing to patch Dashboard.jsx.")

          if 'useLatestValueRef(latestEnrollment)' not in text:
              raise SystemExit("latestEnrollmentRef was not wired to useLatestValueRef. Refusing to continue.")
          if 'useLatestValueRef(isPaid)' not in text:
              raise SystemExit("isPaidRef was not wired to useLatestValueRef. Refusing to continue.")
          if 'latestEnrollmentRef.current = latestEnrollment;' in text:
              raise SystemExit("Old latestEnrollmentRef sync effect still exists after patch. Refusing to continue.")
          if 'isPaidRef.current = isPaid;' in text:
              raise SystemExit("Old isPaidRef sync effect still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-latest-value-ref-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-latest-value-ref-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire latest value refs hook"
          git push
