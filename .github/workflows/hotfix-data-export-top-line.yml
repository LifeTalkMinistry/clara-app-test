name: Hotfix data export top line

on:
  push:
    branches:
      - fix/remove-data-export-top-line

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-data-export-top-line
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove the data export top accent leak
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          layout_path = Path("src/components/Layout.jsx")
          layout = layout_path.read_text()

          dashboard_marker = '  const isDashboard = location.pathname === "/dashboard";\n'
          data_export_line = '  const isDataExportPage = location.pathname === "/data-export";\n'
          if data_export_line not in layout:
              if dashboard_marker not in layout:
                  raise SystemExit("Could not find dashboard route marker in Layout.jsx")
              layout = layout.replace(dashboard_marker, dashboard_marker + data_export_line, 1)

          old_root = '    <div className="theme-page-shell flex h-screen overflow-hidden text-white">'
          new_root = '    <div className={`theme-page-shell flex h-screen overflow-hidden text-white${isDataExportPage ? " clara-data-export-layout" : ""}`}>'
          if new_root not in layout:
              if old_root not in layout:
                  raise SystemExit("Could not find Layout root className")
              layout = layout.replace(old_root, new_root, 1)

          style_marker = '      <style>{`\n'
          style_rule = '        .clara-data-export-layout main { padding-top: 0 !important; }\n'
          if style_rule not in layout:
              if style_marker not in layout:
                  raise SystemExit("Could not find Layout embedded style block")
              layout = layout.replace(style_marker, style_marker + style_rule, 1)

          layout_path.write_text(layout)

          test_path = Path("tests/settings-local-only-regression.test.mjs")
          test_source = test_path.read_text()
          app_marker = 'const appSource = readSource("src/App.jsx");\n'
          layout_const = 'const layoutSource = readSource("src/components/Layout.jsx");\n'
          if layout_const not in test_source:
              if app_marker not in test_source:
                  raise SystemExit("Could not find test source insertion marker")
              test_source = test_source.replace(app_marker, app_marker + layout_const, 1)

          test_block = '''\ntest("data export page does not expose the global top padding accent", () => {\n  assert.match(layoutSource, /isDataExportPage = location\\.pathname === "\\/data-export"/);\n  assert.match(layoutSource, /clara-data-export-layout/);\n  assert.match(\n    layoutSource,\n    /\\.clara-data-export-layout main \\{ padding-top: 0 !important; \\}/\n  );\n});\n'''
          if 'data export page does not expose the global top padding accent' not in test_source:
              test_source = test_source.rstrip() + test_block + '\n'

          test_path.write_text(test_source)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression test
        run: node --test tests/settings-local-only-regression.test.mjs

      - name: Run full test suite
        run: npm test

      - name: Lint changed source and test files
        run: npx eslint src/components/Layout.jsx tests/settings-local-only-regression.test.mjs

      - name: Build application
        run: npm run build

      - name: Commit verified hotfix
        shell: bash
        run: |
          rm -f .github/workflows/hotfix-data-export-top-line.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Layout.jsx tests/settings-local-only-regression.test.mjs .github/workflows/hotfix-data-export-top-line.yml
          git commit -m "Remove data export top accent line"
          git push origin HEAD:fix/remove-data-export-top-line
