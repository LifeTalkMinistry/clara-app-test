name: Remove redundant budget step progress

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove redundant step progress card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/monthly-budget-plan/MonthlyBudgetPlanGuided.jsx')
          text = path.read_text(encoding='utf-8')

          text, count_component = re.subn(
              r'\nfunction StepProgress\(\{ step \}\) \{.*?\n\}\n\nfunction QuestionHeader',
              '\nfunction QuestionHeader',
              text,
              count=1,
              flags=re.S,
          )
          if count_component != 1:
              raise SystemExit('StepProgress component was not found exactly once.')

          call = '        <StepProgress step={step} />\n\n'
          if call not in text:
              raise SystemExit('StepProgress render call was not found.')
          text = text.replace(call, '', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit focused change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-budget-step-progress.yml
          git add src/pages/monthly-budget-plan/MonthlyBudgetPlanGuided.jsx
          git commit -m "Remove redundant budget setup progress card"
          git push origin HEAD:main
