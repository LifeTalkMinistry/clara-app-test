name: Enable budget draft resume
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-budget-draft-resume.yml
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make guided setup draft-aware
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/monthly-budget-plan/MonthlyBudgetPlanGuided.jsx')
          source = path.read_text()
          old = '  const { monthlyBudgetHeader, declaredMonthlyBudgetAmount } = useDashboardMonthlyBudgetHeader({\n    budgets,\n  });'
          new = '  const { monthlyBudgetHeader, declaredMonthlyBudgetAmount } = useDashboardMonthlyBudgetHeader({\n    budgets,\n    includeDraft: true,\n  });'

          if old not in source:
              raise SystemExit('Expected guided budget header hook call was not found.')

          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          rm -f .github/workflows/enable-budget-draft-resume.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Resume incomplete budget drafts correctly" && git push)
