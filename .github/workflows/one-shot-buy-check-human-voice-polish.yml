name: One-shot Buy Check human voice polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-buy-check-human-voice-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Polish Buy Check human voice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/clara-buy-check-expert-ai.js')
          text = path.read_text()

          old = '- Also use means.currentRoomUntilPayday → means.projectedRoomAfterPurchase when that makes the consequence clearer.'
          new = '- Use means.currentRoomUntilPayday and means.projectedRoomAfterPurchase only when the breathing-room consequence materially helps, and phrase it naturally without arrows or report notation.'
          text = text.replace(old, new, 1)

          old = '- When means.purchaseSimulationApplied is true and means.projectedScoreAfterPurchase is available, the visible response MUST include that exact projected score.\n- Never say a purchase "keeps" the current score unless means.currentScore and means.projectedScoreAfterPurchase are actually equal.\n- Never ignore a non-zero means.scoreChange or means.roomChange. Describe the before → after score movement accurately whenever both scores are available.'
          new = '- When means.purchaseSimulationApplied is true and means.projectedScoreAfterPurchase is available, the FINAL ASSEMBLED response will include that exact projected score through the application-owned natural consequence sentence. Do not repeat it in your own reply.\n- Never say a purchase "keeps" the current score unless means.currentScore and means.projectedScoreAfterPurchase are actually equal.\n- Never ignore a non-zero means.scoreChange or means.roomChange in your reasoning. The application-owned sentence will state the exact movement; your own reply should interpret what it means for the user.'
          text = text.replace(old, new, 1)

          start_marker = '    const before = Number.isFinite(Number(means.currentScore)) ? Number(means.currentScore) : null;'
          end_marker = '      reply: `${metricLine} ${guidance}. Will you still buy it?`.trim(),'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('fallback block markers not found')
          end += len(end_marker)
          replacement = '    const after = Number(means.projectedScoreAfterPurchase);\n    const guidance = after >= 100\n      ? "You\\\'d still be above your 100 protection line."\n      : "That would put you below your 100 protection line, so I\\\'d wait or reduce the amount.";\n\n    const metricLine = formatClaraMetricImpactLine(means);\n    return {\n      action: "ready",\n      reply: `${metricLine} ${guidance} Will you still buy it?`.trim(),'
          text = text[:start] + replacement + text[end:]

          malformed = '  return {\n  means: null,\n  purchaseAlreadyUnderstood: {\n    item: purchase.item,\n    price,\n    suggestedTransactionReason: purchase.reason,\n  },\n};'
          clean = '  return {\n    means: null,\n    purchaseAlreadyUnderstood: {\n      item: purchase.item,\n      price,\n      suggestedTransactionReason: purchase.reason,\n    },\n  };'
          text = text.replace(malformed, clean, 1)
          path.write_text(text)
          PY

      - name: Verify polish
        shell: bash
        run: |
          node --check src/lib/clara-buy-check-expert-ai.js
          node --test tests/buy-check-metric-impact.test.mjs
          grep -q 'FINAL ASSEMBLED response will include' src/lib/clara-buy-check-expert-ai.js
          grep -q 'above your 100 protection line' src/lib/clara-buy-check-expert-ai.js
          ! grep -q 'guidance}. Will you still buy it' src/lib/clara-buy-check-expert-ai.js

      - name: Commit and push polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-buy-check-human-voice-polish.yml
          git add src/lib/clara-buy-check-expert-ai.js
          git commit -m "Polish Buy Check conversational fallback"
          git push origin HEAD:main
