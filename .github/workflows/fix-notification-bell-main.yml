name: Fix Notification Bell Runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-notification-bell-main.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore Bell import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/notifications/NotificationSettingsPanel.jsx')
          text = path.read_text()
          if 'icon={Bell}' not in text:
              raise SystemExit('Expected Budget & Money Alerts Bell usage is missing; aborting surgical hotfix.')
          import_block = 'import {\n'
          if '  Bell,\n' not in text.split('} from "lucide-react";', 1)[0]:
              text = text.replace(import_block, import_block + '  Bell,\n', 1)
          path.write_text(text)
          PY

      - name: Verify runtime symbol contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/components/notifications/NotificationSettingsPanel.jsx').read_text()
          imports = text.split('} from "lucide-react";', 1)[0]
          assert '  Bell,\n' in imports, 'Bell is still not imported from lucide-react'
          assert 'icon={Bell}' in text, 'Bell usage unexpectedly disappeared'
          print('Bell import/use contract verified.')
          PY
          git diff --check

      - name: Install locked dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit hotfix and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-notification-bell-main.yml
          git add src/components/notifications/NotificationSettingsPanel.jsx
          git commit -m "Fix Notifications Bell runtime crash"

          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo "Could not fast-forward main after repeated retries." >&2
          exit 1
