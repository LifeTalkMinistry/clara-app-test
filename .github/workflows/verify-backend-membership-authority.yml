name: Verify Backend Membership Authority

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete test suite
        run: npm test > membership-tests.log 2>&1

      - name: Run complete lint suite
        run: npm run lint > membership-lint.log 2>&1

      - name: Build production bundle
        run: npx vite build --base=./ > membership-build.log 2>&1

      - name: Scan production bundle for forbidden authorities
        run: |
          set -o pipefail
          if grep -R -n -E 'verifyHiddenAdminPassword|grantDeveloperCommittedAccess|readDeveloperMembershipPreview|OPEN_COMMITTED_ACCESS_CODE_EVENT|CommittedAccessCodeModal|IosPwaAccessGate|HiddenAdminRoute|AdminRescueButton|CoachingAdminPage|clara-ios-access' dist > membership-bundle-scan.log 2>&1; then
            echo 'Forbidden executable membership or admin authority found in production bundle.' >> membership-bundle-scan.log
            exit 1
          fi
          echo 'No forbidden executable membership or admin authority found in production bundle.' > membership-bundle-scan.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-membership-authority-validation
          path: |
            membership-tests.log
            membership-lint.log
            membership-build.log
            membership-bundle-scan.log
          if-no-files-found: warn
          retention-days: 3

  materialize_budget_premium:
    if: github.head_ref == 'fix/budget-premium-visual-system'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Budget redesign branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Materialize premium Budget source
        run: python .github/scripts/materialize_budget_premium.py

      - name: Install dependencies
        run: npm ci

      - name: Run complete test suite against generated source
        run: npm test

      - name: Run complete lint suite against generated source
        run: npm run lint

      - name: Build generated production bundle
        run: npm run build

      - name: Remove one-time migration helpers
        run: rm .github/scripts/materialize_budget_premium.py .github/workflows/materialize-budget-premium.yml

      - name: Commit validated Budget source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MonthlyBudgetPlan.jsx tests/monthly-budget-premium-design.test.mjs package.json .github/scripts/materialize_budget_premium.py .github/workflows/materialize-budget-premium.yml
          git commit -m "Apply premium Savings-style design to active Budget plan"
          git push origin HEAD:${{ github.head_ref }}
