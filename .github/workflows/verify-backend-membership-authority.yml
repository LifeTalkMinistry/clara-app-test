name: Verify Backend Membership Authority

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-facebook-access-support:
    if: ${{ github.head_ref == 'feature/facebook-access-support' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Facebook support branch
        uses: actions/checkout@v4
        with:
          ref: feature/facebook-access-support
          fetch-depth: 0

      - name: Apply Facebook access support
        run: node scripts/apply-facebook-access-support.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete test suite
        run: npm test

      - name: Run complete lint suite
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Commit validated Facebook support
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/shell/DashboardPanelRenderer.jsx tests/committed-facebook-support.test.mjs
          if git diff --cached --quiet; then
            echo "Facebook access support is already committed."
          else
            git commit -m "Route access concerns to CLARA Facebook support"
            git push origin HEAD:feature/facebook-access-support
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete test suite
        run: npm test > membership-tests.log 2>&1

      - name: Run complete lint suite
        run: npm run lint > membership-lint.log 2>&1

      - name: Build production bundle
        run: npx vite build --base=./ > membership-build.log 2>&1

      - name: Scan production bundle for forbidden authorities
        run: |
          set -o pipefail
          if grep -R -n -E 'verifyHiddenAdminPassword|grantDeveloperCommittedAccess|readDeveloperMembershipPreview|OPEN_COMMITTED_ACCESS_CODE_EVENT|CommittedAccessCodeModal|IosPwaAccessGate|HiddenAdminRoute|AdminRescueButton|CoachingAdminPage|clara-ios-access' dist > membership-bundle-scan.log 2>&1; then
            echo 'Forbidden executable membership or admin authority found in production bundle.' >> membership-bundle-scan.log
            exit 1
          fi
          echo 'No forbidden executable membership or admin authority found in production bundle.' > membership-bundle-scan.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-membership-authority-validation
          path: |
            membership-tests.log
            membership-lint.log
            membership-build.log
            membership-bundle-scan.log
          if-no-files-found: warn
          retention-days: 3
