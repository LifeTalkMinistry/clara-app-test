name: Verify Backend Membership Authority

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-committed-session-scheduler:
    if: ${{ github.head_ref == 'feature/committed-session-scheduler' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out scheduler branch
        uses: actions/checkout@v4
        with:
          ref: feature/committed-session-scheduler
          fetch-depth: 1
          show-progress: false

      - name: Apply one-time scheduler patch
        shell: bash
        run: |
          if [ ! -f .github/workflows/apply-committed-session-scheduler.yml ]; then
            echo "Scheduler patch is already applied."
            echo 0 > scheduler-patch-status.txt
            exit 0
          fi
          awk '
            /python <<'\''PY'\''/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-committed-session-scheduler.yml > /tmp/apply-scheduler.py
          set +e
          python /tmp/apply-scheduler.py > scheduler-patch.log 2>&1
          patch_status=$?
          set -e
          cat scheduler-patch.log
          echo "$patch_status" > scheduler-patch-status.txt

      - name: Upload scheduler patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: committed-session-scheduler-patch-diagnostics
          path: |
            scheduler-patch.log
            scheduler-patch-status.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Stop when scheduler patch failed
        shell: bash
        run: |
          if [ "$(cat scheduler-patch-status.txt 2>/dev/null || echo 1)" != "0" ]; then
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ hashFiles('.github/workflows/apply-committed-session-scheduler.yml') != '' }}
        run: npm ci

      - name: Run tests
        if: ${{ hashFiles('.github/workflows/apply-committed-session-scheduler.yml') != '' }}
        run: npm test

      - name: Run lint
        if: ${{ hashFiles('.github/workflows/apply-committed-session-scheduler.yml') != '' }}
        run: npm run lint

      - name: Build production app
        if: ${{ hashFiles('.github/workflows/apply-committed-session-scheduler.yml') != '' }}
        run: npm run build

      - name: Commit validated scheduler patch
        shell: bash
        run: |
          if [ ! -f .github/workflows/apply-committed-session-scheduler.yml ]; then
            echo "No patch files remain to commit."
            exit 0
          fi
          rm .github/workflows/apply-committed-session-scheduler.yml
          rm -f .github/workflows/trigger-committed-session-scheduler.yml
          rm -f scheduler-patch.log scheduler-patch-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/shell/DashboardPanelRenderer.jsx src/pages/WelcomeSession.jsx tests/committed-session-routing.test.mjs .github/workflows/apply-committed-session-scheduler.yml .github/workflows/trigger-committed-session-scheduler.yml
          git commit -m "[scheduler-patch-applied] Route Free users to one-on-one scheduling"
          git push origin HEAD:feature/committed-session-scheduler

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete test suite
        run: npm test > membership-tests.log 2>&1

      - name: Run complete lint suite
        run: npm run lint > membership-lint.log 2>&1

      - name: Build production bundle
        run: npx vite build --base=./ > membership-build.log 2>&1

      - name: Scan production bundle for forbidden authorities
        run: |
          set -o pipefail
          if grep -R -n -E 'verifyHiddenAdminPassword|grantDeveloperCommittedAccess|readDeveloperMembershipPreview|OPEN_COMMITTED_ACCESS_CODE_EVENT|CommittedAccessCodeModal|IosPwaAccessGate|HiddenAdminRoute|AdminRescueButton|CoachingAdminPage|clara-ios-access' dist > membership-bundle-scan.log 2>&1; then
            echo 'Forbidden executable membership or admin authority found in production bundle.' >> membership-bundle-scan.log
            exit 1
          fi
          echo 'No forbidden executable membership or admin authority found in production bundle.' > membership-bundle-scan.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-membership-authority-validation
          path: |
            membership-tests.log
            membership-lint.log
            membership-build.log
            membership-bundle-scan.log
          if-no-files-found: warn
          retention-days: 3
