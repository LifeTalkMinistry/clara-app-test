name: Verify Backend Membership Authority

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete test suite
        run: npm test > membership-tests.log 2>&1

      - name: Run complete lint suite
        run: npm run lint > membership-lint.log 2>&1

      - name: Build production bundle
        run: npx vite build --base=./ > membership-build.log 2>&1

      - name: Scan production bundle for forbidden authorities
        run: |
          set -o pipefail
          if grep -R -n -E 'verifyHiddenAdminPassword|grantDeveloperCommittedAccess|readDeveloperMembershipPreview|OPEN_COMMITTED_ACCESS_CODE_EVENT|CommittedAccessCodeModal|IosPwaAccessGate|HiddenAdminRoute|AdminRescueButton|CoachingAdminPage|clara-ios-access' dist > membership-bundle-scan.log 2>&1; then
            echo 'Forbidden executable membership or admin authority found in production bundle.' >> membership-bundle-scan.log
            exit 1
          fi
          echo 'No forbidden executable membership or admin authority found in production bundle.' > membership-bundle-scan.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-membership-authority-validation
          path: |
            membership-tests.log
            membership-lint.log
            membership-build.log
            membership-bundle-scan.log
          if-no-files-found: warn
          retention-days: 3

  materialize_savings_wallet_reconciliation:
    if: github.head_ref == 'feat/savings-wallet-reconciliation-source' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: feat/savings-wallet-reconciliation-source
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize Savings and wallet reconciliation
        run: |
          git fetch origin feat/savings-wallet-reconciliation
          git show origin/feat/savings-wallet-reconciliation:src/build/savingsGoalWalletReconciliationTransform.js > /tmp/savingsGoalWalletReconciliationTransform.mjs
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, unlinkSync, writeFileSync } from 'node:fs';
          import { transformSavingsGoalWalletReconciliation } from 'file:///tmp/savingsGoalWalletReconciliationTransform.mjs';

          const pagePath = 'src/pages/SavingsGoalsIntegrated.jsx';
          const packagePath = 'package.json';
          const testPath = 'tests/savings-goal-wallet-reconciliation-source.test.mjs';
          const triggerPath = '.savings-wallet-reconciliation-request';

          const source = readFileSync(pagePath, 'utf8');
          const materialized = transformSavingsGoalWalletReconciliation(source);
          if (materialized === source) throw new Error('Savings wallet reconciliation made no source changes.');
          writeFileSync(pagePath, materialized);

          const pkg = JSON.parse(readFileSync(packagePath, 'utf8'));
          const parts = String(pkg.scripts.test || '').split(/\s+/).filter(Boolean);
          if (!parts.includes(testPath)) parts.push(testPath);
          pkg.scripts.test = parts.join(' ');
          writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');

          writeFileSync(testPath, `import test from "node:test";
          import assert from "node:assert/strict";
          import { existsSync, readFileSync } from "node:fs";

          const page = readFileSync(new URL("../src/pages/SavingsGoalsIntegrated.jsx", import.meta.url), "utf8");
          const vite = readFileSync(new URL("../vite.config.js", import.meta.url), "utf8");

          test("Savings Goals reconcile protected money with the assigned wallet", () => {
            assert.match(page, /Reconcile Savings & Wallet/);
            assert.match(page, /The wallet balance is correct/);
            assert.match(page, /The savings amount is correct/);
            assert.match(page, /Both records need correction/);
            assert.match(page, /source_type: "savings_wallet_reconciliation"/);
            assert.match(page, /tag: "historical_wallet_correction"/);
            assert.match(page, /deleteWalletTransaction\(walletCorrectionTransactionId\)/);
            assert.match(page, /wallet_sync_prompt_decision: "reconciled"/);
            assert.match(page, /It will not transfer money out of the old wallet/);
          });

          test("Savings wallet reconciliation is direct source, not a Vite rewrite", () => {
            assert.doesNotMatch(vite, /savingsGoalWalletReconciliationPlugin|savingsGoalWalletReconciliationTransform/);
            assert.equal(existsSync(new URL("../src/build/savingsGoalWalletReconciliationTransform.js", import.meta.url)), false);
          });
          `);

          if (existsSync(triggerPath)) unlinkSync(triggerPath);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run complete test suite
        run: npm test

      - name: Run complete lint suite
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Commit validated reconciliation source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/pages/SavingsGoalsIntegrated.jsx tests .savings-wallet-reconciliation-request .github
          git commit -m "Materialize Savings wallet reconciliation"
          git push origin HEAD:feat/savings-wallet-reconciliation-source
