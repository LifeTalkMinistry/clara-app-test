name: Verify Backend Membership Authority

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-polished-committed-modal:
    if: ${{ github.head_ref == 'feature/polish-committed-modal-actions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out modal branch
        uses: actions/checkout@v4
        with:
          ref: feature/polish-committed-modal-actions
          fetch-depth: 0

      - name: Apply modal polish
        run: python .github/scripts/apply-polished-committed-modal.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete test suite
        run: npm test

      - name: Run complete lint suite
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Commit validated modal polish
        shell: bash
        run: |
          rm -f .github/workflows/apply-polished-committed-modal.yml
          rm -f .github/committed-modal-polish-trigger
          rm -f .github/scripts/apply-polished-committed-modal.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/shell/DashboardPanelRenderer.jsx .github/workflows/apply-polished-committed-modal.yml .github/committed-modal-polish-trigger .github/scripts/apply-polished-committed-modal.py
          git commit -m "Polish Committed modal actions and close controls"
          git push origin HEAD:feature/polish-committed-modal-actions

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete test suite
        run: npm test > membership-tests.log 2>&1

      - name: Run complete lint suite
        run: npm run lint > membership-lint.log 2>&1

      - name: Build production bundle
        run: npx vite build --base=./ > membership-build.log 2>&1

      - name: Scan production bundle for forbidden authorities
        run: |
          set -o pipefail
          if grep -R -n -E 'verifyHiddenAdminPassword|grantDeveloperCommittedAccess|readDeveloperMembershipPreview|OPEN_COMMITTED_ACCESS_CODE_EVENT|CommittedAccessCodeModal|IosPwaAccessGate|HiddenAdminRoute|AdminRescueButton|CoachingAdminPage|clara-ios-access' dist > membership-bundle-scan.log 2>&1; then
            echo 'Forbidden executable membership or admin authority found in production bundle.' >> membership-bundle-scan.log
            exit 1
          fi
          echo 'No forbidden executable membership or admin authority found in production bundle.' > membership-bundle-scan.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-membership-authority-validation
          path: |
            membership-tests.log
            membership-lint.log
            membership-build.log
            membership-bundle-scan.log
          if-no-files-found: warn
          retention-days: 3
