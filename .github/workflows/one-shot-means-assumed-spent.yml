name: One-shot Means assumed-spent upgrade

on:
  push:
    paths:
      - ".github/workflows/one-shot-means-assumed-spent.yml"
      - "scripts/add_means_assumed_spent.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add assumed-spent Means breakdown
        run: python scripts/add_means_assumed_spent.py
      - name: Verify assumed-spent invariants
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/runtime/installClaraOrbGreeting.js").read_text()
          assert 'function assumedRoutineSpent(user, cycleStart = localDateKey())' in text
          assert 'while (cursor <= today)' in text
          assert 'const assumedSpent = assumedRoutineSpent(owner, cycleStartDate);' in text
          assert '<span>Actual spent</span>' in text
          assert '<span>Assumed spent</span>' in text
      - name: Commit upgrade to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/installClaraOrbGreeting.js
          git commit -m "Show actual and assumed Means spending"
          git push origin HEAD:main
