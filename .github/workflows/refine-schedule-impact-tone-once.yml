name: Refine schedule impact tone once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-tone:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch local schedule impact tone
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardScheduleImpactPortalPanel.jsx';
          let text = fs.readFileSync(path, 'utf8');

          const oldOpening = `function getOpeningMessage(form) {
  return \`Hi Max, so you want to \${getEventPhrase(form)}. Am I understanding that correctly?\`;
}`;
          const newOpening = `function getScheduleTitleForImpact(form) {
  return cleanText(form?.title) || makeTitle(form?.note, form?.type) || "this schedule";
}

function getOpeningMessage(form) {
  return \`Hi Max, I’ll assess the money impact for this schedule: \${getScheduleTitleForImpact(form)}. Is that correct?\`;
}`;
          if (text.includes(oldOpening)) text = text.replace(oldOpening, newOpening);

          text = text.replace(
            'Great! I’ll treat this as your confirmed schedule. Before saving, let’s assess possible spending for it. Ready to start?',
            'Great. Before saving, let’s estimate possible expenses one part at a time. Ready to start?'
          );

          fs.writeFileSync(path, text);
          NODE
      - name: Remove one-time workflow
        run: rm .github/workflows/refine-schedule-impact-tone-once.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add src/components/fresh/main-dashboard/dashboard-panels/schedule/DashboardScheduleImpactPortalPanel.jsx .github/workflows/refine-schedule-impact-tone-once.yml
            git commit -m "Refine schedule impact local tone"
            git push
          fi
