name: Trigger committed session scheduler patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ github.head_ref == 'feature/committed-session-scheduler' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/committed-session-scheduler
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and run the one-time patch
        shell: bash
        run: |
          awk '
            /python <<'\''PY'\''/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-committed-session-scheduler.yml > /tmp/apply-scheduler.py
          python /tmp/apply-scheduler.py

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Commit validated patch
        shell: bash
        run: |
          rm .github/workflows/apply-committed-session-scheduler.yml
          rm .github/workflows/trigger-committed-session-scheduler.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/fresh/main-dashboard/shell/DashboardPanelRenderer.jsx src/pages/WelcomeSession.jsx tests/committed-session-routing.test.mjs .github/workflows/apply-committed-session-scheduler.yml .github/workflows/trigger-committed-session-scheduler.yml
          git commit -m "[scheduler-patch-applied] Route Free users to one-on-one scheduling"
          git push origin HEAD:feature/committed-session-scheduler
