name: CLARA Extract Dashboard Primitives

on:
  push:
    paths:
      - ".github/workflows/clara-inspect-messages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove extracted dashboard primitive blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/Dashboard.jsx')
          src = path.read_text()
          marker = 'import DashboardMoneySummary from "@/components/fresh/main-dashboard/money-summary/DashboardMoneySummary";'
          primitive_import_lines = [
              'import FinanceActionModal from "@/components/fresh/main-dashboard/dashboard-primitives/FinanceActionModal";',
              'import ManualExpenseFullScreenSheet from "@/components/fresh/main-dashboard/dashboard-primitives/ManualExpenseFullScreenSheet";',
              'import QuickActionDropdown from "@/components/fresh/main-dashboard/dashboard-primitives/QuickActionDropdown";',
              'import FinanceField from "@/components/fresh/main-dashboard/dashboard-primitives/FinanceField";',
          ]
          if 'dashboard-primitives/FinanceActionModal' not in src:
              src = src.replace(marker, marker + '\n' + '\n'.join(primitive_import_lines), 1)
          else:
              anchor = 'import QuickActionDropdown from "@/components/fresh/main-dashboard/dashboard-primitives/QuickActionDropdown";'
              if 'dashboard-primitives/QuickActionDropdown' not in src:
                  src = src.replace('import ManualExpenseFullScreenSheet from "@/components/fresh/main-dashboard/dashboard-primitives/ManualExpenseFullScreenSheet";', 'import ManualExpenseFullScreenSheet from "@/components/fresh/main-dashboard/dashboard-primitives/ManualExpenseFullScreenSheet";\n' + anchor, 1)
              if 'dashboard-primitives/FinanceField' not in src:
                  src = src.replace(anchor, anchor + '\nimport FinanceField from "@/components/fresh/main-dashboard/dashboard-primitives/FinanceField";', 1)

          start = src.find('const FinanceActionModal = ({')
          end = src.find('const QuickActionDropdown = ({', start)
          if start != -1 and end != -1:
              src = src[:start] + src[end:]

          start = src.find('const QuickActionDropdown = ({')
          end = src.find('const FinanceField = ({', start)
          if start != -1 and end != -1:
              src = src[:start] + src[end:]

          start = src.find('const FinanceField = ({')
          end = src.find('const financeInputClassName =', start)
          if start != -1 and end != -1:
              src = src[:start] + src[end:]

          path.write_text(src)
          PY
      - name: Build check
        run: |
          npm ci
          npm run build
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Extract dashboard finance field primitive from Dashboard
          file_pattern: src/pages/Dashboard.jsx
