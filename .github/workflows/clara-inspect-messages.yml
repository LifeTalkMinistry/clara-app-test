name: CLARA Extract Dashboard Primitives

on:
  push:
    paths:
      - ".github/workflows/clara-inspect-messages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove extracted dashboard primitive blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/Dashboard.jsx')
          src = path.read_text()
          marker = 'import DashboardMoneySummary from "@/components/fresh/main-dashboard/money-summary/DashboardMoneySummary";'
          if 'dashboard-primitives/FinanceActionModal' not in src:
              src = src.replace(marker, marker + '\nimport FinanceActionModal from "@/components/fresh/main-dashboard/dashboard-primitives/FinanceActionModal";\nimport ManualExpenseFullScreenSheet from "@/components/fresh/main-dashboard/dashboard-primitives/ManualExpenseFullScreenSheet";', 1)
          start = src.find('const FinanceActionModal = ({')
          end = src.find('const QuickActionDropdown = ({', start)
          if start != -1 and end != -1:
              src = src[:start] + src[end:]
          path.write_text(src)
          PY
      - name: Build check
        run: |
          npm ci
          npm run build
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Extract dashboard primitive usage from Dashboard
          file_pattern: src/pages/Dashboard.jsx
