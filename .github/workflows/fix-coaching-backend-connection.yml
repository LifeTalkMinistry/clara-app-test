name: Fix coaching backend connection

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-coaching-backend-connection.yml"

permissions:
  contents: write

jobs:
  fix-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the Vercel proxy and bypass ngrok warning responses
        shell: python
        run: |
          from pathlib import Path

          client_path = Path("src/lib/clara-backend-client.js")
          client = client_path.read_text(encoding="utf-8")

          old_resolver = '''function resolveApiUrl() {
            const configuredUrl = String(getBuildEnvironment().VITE_CLARA_API_URL || "").trim();
            if (configuredUrl) return configuredUrl;
            return isVercelWebRuntime() ? VERCEL_API_PROXY_PATH : DEFAULT_API_URL;
          }'''
          new_resolver = '''function resolveApiUrl() {
            // Web production must stay same-origin. A stale Vercel environment variable
            // must never bypass the working /clara-api rewrite and trigger browser CORS.
            if (isVercelWebRuntime()) return VERCEL_API_PROXY_PATH;

            const configuredUrl = String(getBuildEnvironment().VITE_CLARA_API_URL || "").trim();
            if (configuredUrl) return configuredUrl;
            return DEFAULT_API_URL;
          }'''
          if old_resolver not in client:
            raise SystemExit("Expected API resolver was not found")
          client = client.replace(old_resolver, new_resolver, 1)

          old_headers = '''      headers: {
                Accept: "application/json",
                ...(body ? { "Content-Type": "application/json" } : {}),'''
          new_headers = '''      headers: {
                Accept: "application/json",
                "ngrok-skip-browser-warning": "true",
                ...(body ? { "Content-Type": "application/json" } : {}),'''
          if old_headers not in client:
            raise SystemExit("Expected backend request headers were not found")
          client = client.replace(old_headers, new_headers, 1)
          client_path.write_text(client, encoding="utf-8")

          test_path = Path("tests/vercel-backend-proxy.test.mjs")
          tests = test_path.read_text(encoding="utf-8")
          config_block = '''const vercelConfig = JSON.parse(
            readFileSync(new URL("../vercel.json", import.meta.url), "utf8")
          );'''
          config_replacement = '''const vercelConfig = JSON.parse(
            readFileSync(new URL("../vercel.json", import.meta.url), "utf8")
          );
          const backendClientSource = readFileSync(
            new URL("../src/lib/clara-backend-client.js", import.meta.url),
            "utf8"
          );'''
          if config_block not in tests:
            raise SystemExit("Expected Vercel proxy test setup was not found")
          tests = tests.replace(config_block, config_replacement, 1)

          marker = '''test("native and non-Vercel runtimes keep using the direct backend URL", async () => {'''
          regression = '''test("Vercel production cannot be overridden away from the same-origin proxy", () => {
            const proxyGuard = backendClientSource.indexOf(
              "if (isVercelWebRuntime()) return VERCEL_API_PROXY_PATH;"
            );
            const configuredUrl = backendClientSource.indexOf("const configuredUrl");

            assert.ok(proxyGuard >= 0);
            assert.ok(configuredUrl > proxyGuard);
            assert.match(
              backendClientSource,
              /"ngrok-skip-browser-warning": "true"/
            );
          });

          test("native and non-Vercel runtimes keep using the direct backend URL", async () => {'''
          if marker not in tests:
            raise SystemExit("Expected native runtime test was not found")
          tests = tests.replace(marker, regression, 1)
          test_path.write_text(tests, encoding="utf-8")

      - name: Install dependencies
        run: npm ci

      - name: Run complete tests
        run: npm test

      - name: Run lint checks
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Commit verified connection fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/clara-backend-client.js tests/vercel-backend-proxy.test.mjs
          git commit -m "Connect coaching calendar through Vercel backend proxy"
          git push origin HEAD:main
