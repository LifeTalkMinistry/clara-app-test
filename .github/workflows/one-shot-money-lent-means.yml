name: One-shot Money Lent Means Score

on:
  push:
    paths:
      - ".github/workflows/one-shot-money-lent-means.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Exclude Money Lent from current Means availability
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/runtime/installClaraOrbGreeting.js")
          text = path.read_text()

          old = '''function currentAvailableMoney(wallets = []) {
  return (Array.isArray(wallets) ? wallets : []).reduce(
    (sum, wallet) => sum + walletBalance(wallet),
    0
  );
}
'''
          new = '''function isMoneyLentWallet(wallet = {}) {
  const type = normalizeLower(wallet?.type || wallet?.wallet_type || wallet?.walletType);
  return ["money_lent", "money-lent", "lent", "receivable"].includes(type);
}

function currentAvailableMoney(wallets = []) {
  return (Array.isArray(wallets) ? wallets : []).reduce(
    (sum, wallet) => (isMoneyLentWallet(wallet) ? sum : sum + walletBalance(wallet)),
    0
  );
}

function currentMoneyLentUnavailable(wallets = []) {
  return (Array.isArray(wallets) ? wallets : []).reduce(
    (sum, wallet) => (isMoneyLentWallet(wallet) ? sum + walletBalance(wallet) : sum),
    0
  );
}
'''
          if old not in text:
              raise SystemExit("Means currentAvailableMoney block not found; refusing blind patch.")
          text = text.replace(old, new, 1)

          old_snapshot = '''  const income = currentMonthIncomeFromSources(incomeSources, currentMonthKey);
  const availableNow = currentAvailableMoney(wallets);
  if (!(income > 0) && !(availableNow > 0)) return null;
'''
          new_snapshot = '''  const income = currentMonthIncomeFromSources(incomeSources, currentMonthKey);
  const availableNow = currentAvailableMoney(wallets);
  const moneyLentUnavailable = currentMoneyLentUnavailable(wallets);
  if (!(income > 0) && !(availableNow > 0) && !(moneyLentUnavailable > 0)) return null;
'''
          if old_snapshot not in text:
              raise SystemExit("Means snapshot availability block not found; refusing blind patch.")
          text = text.replace(old_snapshot, new_snapshot, 1)

          old_return = '''    horizonDate,
    availableNow,
    projectedSpending,
'''
          new_return = '''    horizonDate,
    availableNow,
    moneyLentUnavailable,
    projectedSpending,
'''
          if old_return not in text:
              raise SystemExit("Means snapshot return block not found; refusing blind patch.")
          text = text.replace(old_return, new_return, 1)

          old_signature = '''        Math.round(snapshot.availableNow || 0),
        snapshot.horizonDate || "",
'''
          new_signature = '''        Math.round(snapshot.availableNow || 0),
        Math.round(snapshot.moneyLentUnavailable || 0),
        snapshot.horizonDate || "",
'''
          if old_signature not in text:
              raise SystemExit("Means render signature availability block not found; refusing blind patch.")
          text = text.replace(old_signature, new_signature, 1)

          old_detail = '''      <span style="display:flex;justify-content:space-between;gap:16px;margin-top:5px;font-size:10px;color:rgba(255,255,255,.38)"><span>Savings goals due</span><strong style="color:rgba(255,255,255,.72)">${money(snapshot.savingsGoalUpcoming)}</strong></span>
      <span style="display:flex;justify-content:space-between;gap:16px;margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:rgba(255,255,255,.42)"><span>Projected room</span><strong style="color:${snapshot.projectedRoom >= 0 ? "#67e8c8" : "#ff7f8d"}">${snapshot.projectedRoom >= 0 ? "" : "−"}${money(Math.abs(snapshot.projectedRoom))}</strong></span>
'''
          new_detail = '''      <span style="display:flex;justify-content:space-between;gap:16px;margin-top:5px;font-size:10px;color:rgba(255,255,255,.38)"><span>Savings goals due</span><strong style="color:rgba(255,255,255,.72)">${money(snapshot.savingsGoalUpcoming)}</strong></span>
      ${snapshot.moneyLentUnavailable > 0 ? `<span style="display:flex;justify-content:space-between;gap:16px;margin-top:5px;font-size:10px;color:rgba(255,255,255,.38)"><span>Money lent · not available</span><strong style="color:rgba(255,255,255,.60)">${money(snapshot.moneyLentUnavailable)}</strong></span>` : ""}
      <span style="display:flex;justify-content:space-between;gap:16px;margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:rgba(255,255,255,.42)"><span>Projected room</span><strong style="color:${snapshot.projectedRoom >= 0 ? "#67e8c8" : "#ff7f8d"}">${snapshot.projectedRoom >= 0 ? "" : "−"}${money(Math.abs(snapshot.projectedRoom))}</strong></span>
'''
          if old_detail not in text:
              raise SystemExit("Means expanded detail block not found; refusing blind patch.")
          text = text.replace(old_detail, new_detail, 1)

          path.write_text(text)

      - name: Verify Money Lent Means wiring
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/runtime/installClaraOrbGreeting.js").read_text()
          assert 'function isMoneyLentWallet' in text
          assert 'currentMoneyLentUnavailable' in text
          assert 'isMoneyLentWallet(wallet) ? sum : sum + walletBalance(wallet)' in text
          assert 'Money lent · not available' in text
          assert 'moneyLentUnavailable' in text

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-shot-money-lent-means.yml
          git add src/runtime/installClaraOrbGreeting.js .github/workflows/one-shot-money-lent-means.yml
          git commit -m "Include Money Lent in Means Score rationale"
          git push origin HEAD:main
