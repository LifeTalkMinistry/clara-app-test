name: Apply Settings savings goal theme

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-settings-savings-goal-theme.yml"
      - ".github/scripts/apply-settings-savings-goal-theme.mjs"

permissions:
  contents: write

jobs:
  apply-settings-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply Savings Goals visual language to Settings
        run: node .github/scripts/apply-settings-savings-goal-theme.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run Settings regression checks
        run: node --test tests/settings-integrity-regression.test.mjs tests/settings-local-only-regression.test.mjs tests/dashboard-top-nav-ownership.test.mjs

      - name: Build check
        run: npm run build

      - name: Commit verified Settings theme update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx .github/scripts/apply-settings-savings-goal-theme.mjs .github/workflows/apply-settings-savings-goal-theme.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Settings theme changes were produced."
            exit 0
          fi
          git commit -m "Match Settings theme to Savings Goals"
          git pull --rebase origin main
          git push origin main

# Triggered after the workflow existed on the default branch.
