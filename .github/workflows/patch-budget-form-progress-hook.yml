name: Patch budget form progress hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-budget-form-progress-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardBudgetFormProgress into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardBudgetFormProgress from "@/components/fresh/main-dashboard/budget/useDashboardBudgetFormProgress";\n'
          import_anchor = 'import useDashboardMonthlyBudgetPlan from "@/components/fresh/main-dashboard/budget/useDashboardMonthlyBudgetPlan";\n'
          fallback_anchor = 'import useDashboardSelectedBudgetState from "@/components/fresh/main-dashboard/budget/useDashboardSelectedBudgetState";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Budget form progress import anchor not found. Refusing to patch Dashboard.jsx.")

          replacement = (
              '  const {\n'
              '    budgetFormDeclaredAmount,\n'
              '    budgetProjectedAllocated,\n'
              '    budgetProjectedUnallocated,\n'
              '    budgetProjectedOverAllocated,\n'
              '    budgetCanFinish,\n'
              '    budgetFinishHelper,\n'
              '  } = useDashboardBudgetFormProgress({\n'
              '    financeForm,\n'
              '    financeModal,\n'
              '    monthlyBudgetPlan,\n'
              '    declaredMonthlyBudgetAmount,\n'
              '  });\n\n'
          )

          if 'useDashboardBudgetFormProgress({' not in text:
              start_tokens = [
                  '  const budgetFormDeclaredAmount = useMemo(() => {',
                  '  const budgetFormDeclaredAmount = firstValidNumber(',
              ]

              start_index = -1
              for token in start_tokens:
                  start_index = text.find(token)
                  if start_index != -1:
                      break

              if start_index == -1:
                  raise SystemExit("budgetFormDeclaredAmount block start not found. Refusing to patch Dashboard.jsx.")

              end_tokens = [
                  '  const manualExpenseBudgetListItems = useMemo(',
                  '  const manualExpenseBudgetListItems = useMemo(() => {',
                  '  const openFinanceModal = useCallback(',
                  '  const closeFinanceModal = useCallback(',
                  '  const showFinanceNotice = useCallback(',
              ]

              end_index = -1
              matched_end_token = None
              for token in end_tokens:
                  candidate = text.find(token, start_index + 1)
                  if candidate != -1 and (end_index == -1 or candidate < end_index):
                      end_index = candidate
                      matched_end_token = token

              if end_index == -1:
                  raise SystemExit("budget form progress block end not found. Refusing to patch Dashboard.jsx.")

              old_block = text[start_index:end_index]
              required_tokens = [
                  'budgetFormDeclaredAmount',
                  'budgetProjectedAllocated',
                  'budgetProjectedUnallocated',
                  'budgetCanFinish',
                  'budgetFinishHelper',
              ]

              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("Budget form progress block content mismatch. Refusing to patch Dashboard.jsx.")

              if 'monthlyBudgetPlan' not in old_block or 'financeForm' not in old_block:
                  raise SystemExit("Budget form progress block missing expected dependencies. Refusing to patch Dashboard.jsx.")

              text = text[:start_index] + replacement + text[end_index:]

          if 'useDashboardBudgetFormProgress({' not in text:
              raise SystemExit("useDashboardBudgetFormProgress was not wired. Refusing to continue.")
          if 'const budgetFormDeclaredAmount = useMemo' in text:
              raise SystemExit("Old budgetFormDeclaredAmount useMemo still exists after patch. Refusing to continue.")
          if 'const budgetFormDeclaredAmount = firstValidNumber(' in text:
              raise SystemExit("Old inline budgetFormDeclaredAmount calculation still exists after patch. Refusing to continue.")
          if 'const budgetCanFinish =' in text:
              raise SystemExit("Old inline budgetCanFinish calculation still exists after patch. Refusing to continue.")
          if 'let budgetFinishHelper' in text or 'const budgetFinishHelper =' in text:
              raise SystemExit("Old inline budgetFinishHelper calculation still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-budget-form-progress-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-budget-form-progress-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire dashboard budget form progress hook"
          git push
