name: Patch finance refresh events hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-finance-refresh-events-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardFinanceRefreshEvents into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardFinanceRefreshEvents from "@/components/fresh/main-dashboard/finance-notices/useDashboardFinanceRefreshEvents";\n'
          import_anchor = 'import useDashboardOnlineStatusNotice from "@/components/fresh/main-dashboard/finance-notices/useDashboardOnlineStatusNotice";\n'
          fallback_anchor = 'import useFinanceDataErrorNotice from "@/components/fresh/main-dashboard/finance-notices/useFinanceDataErrorNotice";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Finance refresh import anchor not found. Refusing to patch Dashboard.jsx.")

          if 'useDashboardFinanceRefreshEvents({' not in text:
              markers = [
                  'window.addEventListener("clara-expenses-updated", scheduleRefresh);',
                  'window.addEventListener("clara-finance-updated", scheduleRefresh);',
                  'window.addEventListener("clara-wallets-updated", scheduleRefresh);',
                  'window.addEventListener("clara-wallet-transactions-updated", scheduleRefresh);',
                  'window.addEventListener("clara-budgets-updated", scheduleRefresh);',
                  'window.addEventListener("clara-savings-goals-updated", scheduleRefresh);',
              ]

              search_pos = 0
              matched = None
              while True:
                  start = text.find('  useEffect(() => {', search_pos)
                  if start == -1:
                      break
                  dep_marker = '\n  }, ['
                  dep_start = text.find(dep_marker, start)
                  if dep_start == -1:
                      break
                  dep_end = text.find(');', dep_start)
                  if dep_end == -1:
                      break
                  dep_end += len(');')
                  block = text[start:dep_end]

                  if all(marker in block for marker in markers):
                      if 'window.removeEventListener("clara-expenses-updated", scheduleRefresh);' not in block:
                          raise SystemExit("Finance refresh effect found but cleanup is missing. Refusing to patch Dashboard.jsx.")
                      matched = (start, dep_end, block)
                      break

                  search_pos = start + 1

              if not matched:
                  raise SystemExit("Finance refresh events effect block not found. Refusing to patch Dashboard.jsx.")

              start, end, block = matched
              replacement = (
                  '  useDashboardFinanceRefreshEvents({\n'
                  '    user,\n'
                  '    scheduleRefresh,\n'
                  '  });\n'
              )
              text = text[:start] + replacement + text[end:]

          if 'useDashboardFinanceRefreshEvents({' not in text:
              raise SystemExit("useDashboardFinanceRefreshEvents was not wired. Refusing to continue.")
          if 'window.addEventListener("clara-expenses-updated", scheduleRefresh);' in text:
              raise SystemExit("Old finance refresh listener still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-finance-refresh-events-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-finance-refresh-events-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire dashboard finance refresh events hook"
          git push
