name: Remove Wallet Title Hard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-wallet-title-hard.yml"

permissions:
  contents: write

jobs:
  remove-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Remove first-step title from data and render path
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/fresh/main-dashboard/dashboard-primitives/GuidedWalletCreationModal.jsx';
          let text = fs.readFileSync(path, 'utf8');

          text = text.replace(
            'choose_wallet: ["Where will your money live?", "Choose the wallet, bank, or money container you want to track."],',
            'choose_wallet: ["", "Choose the wallet, bank, or money container you want to track."],'
          );
          text = text.replace(
            '{step !== "choose_wallet" ? <h3 className="max-w-[340px] text-[clamp(28px,8vw,34px)] font-black leading-[0.98] tracking-[-0.055em]">{title}</h3> : null}',
            '{title ? <h3 className="max-w-[340px] text-[clamp(28px,8vw,34px)] font-black leading-[0.98] tracking-[-0.055em]">{title}</h3> : null}'
          );

          if (text.includes('Where will your money live?')) {
            throw new Error('Big wallet title still exists in guided wallet source');
          }
          fs.writeFileSync(path, text);
          NODE

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-wallet-title-hard.yml
          git add src/components/fresh/main-dashboard/dashboard-primitives/GuidedWalletCreationModal.jsx
          git commit -m "Remove wallet selection title completely"
          git pull --rebase origin main
          git push origin main
