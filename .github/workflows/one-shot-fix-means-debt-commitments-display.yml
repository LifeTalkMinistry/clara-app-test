name: One-shot fix Means debt commitments display

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-fix-means-debt-commitments-display.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair debt commitments display semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          authority = Path('src/lib/clara-means-authority.js')
          source = authority.read_text(encoding='utf-8')

          helper_anchor = '''export function buildMeansDebtOccurrences(records = [], cycleStart, cycleEnd) {
            return (Array.isArray(records) ? records : []).flatMap((record) => {
              const id = debtRecordId(record);
              const planned = nonNegative(getMonthlyDebtPayment(record));
              if (!id || !(planned > 0)) return [];
              return debtOccurrenceDates(record, cycleStart, cycleEnd)
                .filter((dueDate) => shouldIncludeDebtOccurrence(record, dueDate, cycleStart))
                .map((dueDate) => ({
                  id: `debt:${id}:${dueDate}`,
                  debtId: id,
                  date: dueDate,
                  kind: "debt",
                  amount: planned,
                  actualPaid: cumulativeActualForOccurrence(record, dueDate),
                  source: "debt_obligation",
                }));
            });
          }
          '''

          helper_replacement = helper_anchor + '''
          export function calculateMeansOutstandingDebtCommitments(
            debtOccurrences = [],
            carriedObligations = 0
          ) {
            const occurrenceRemaining = (Array.isArray(debtOccurrences) ? debtOccurrences : [])
              .filter((entry) => entry?.kind === "debt")
              .reduce((sum, entry) => {
                const planned = nonNegative(entry?.amount);
                const actualPaid = nonNegative(entry?.actualPaid ?? entry?.actual_paid);
                return sum + Math.max(planned - actualPaid, 0);
              }, 0);
            return occurrenceRemaining + nonNegative(carriedObligations);
          }
          '''

          if 'export function calculateMeansOutstandingDebtCommitments' not in source:
              if helper_anchor not in source:
                  raise SystemExit('Debt occurrence helper anchor not found')
              source = source.replace(helper_anchor, helper_replacement, 1)

          old_display = '''  const debtUpcoming = futureContributions
            .filter((entry) => entry.kind === "debt")
            .reduce((sum, entry) => sum + nonNegative(entry.amount), 0);
          '''
          new_display = '''  const debtUpcoming = calculateMeansOutstandingDebtCommitments(
            debtOccurrences,
            baselineState.carriedObligations
          );
          '''
          if old_display in source:
              source = source.replace(old_display, new_display, 1)
          elif new_display not in source:
              raise SystemExit('Debt upcoming display anchor not found')

          authority.write_text(source, encoding='utf-8')

          test = Path('tests/means-score-debt-commitments-display-regression.test.mjs')
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport fs from "node:fs";\nimport path from "node:path";\nimport vm from "node:vm";\nimport { fileURLToPath } from "node:url";\n\nconst __dirname = path.dirname(fileURLToPath(import.meta.url));\nconst authorityPath = path.join(__dirname, "../src/lib/clara-means-authority.js");\nconst source = fs.readFileSync(authorityPath, "utf8");\n\nfunction loadOutstandingDebtHelper() {\n  const start = source.indexOf("export function calculateMeansOutstandingDebtCommitments");\n  assert.notEqual(start, -1, "canonical Means authority must expose debt commitment display helper");\n  const end = source.indexOf("\\nfunction currentCycleFutureDebtActual", start);\n  assert.notEqual(end, -1, "helper must remain before current-cycle future debt actual logic");\n  const helperSource = source.slice(start, end).replace("export function", "function");\n  const context = { result: null };\n  vm.createContext(context);\n  vm.runInContext(`const nonNegative = (value) => { const parsed = Number(String(value ?? "").replace(/[^0-9.-]/g, "")); return Number.isFinite(parsed) ? Math.max(0, parsed) : 0; }; ${helperSource}; result = calculateMeansOutstandingDebtCommitments;`, context);\n  return context.result;\n}\n\ntest("ORB debt commitments include overdue/current-cycle unpaid remainder, not only future dates", () => {\n  const calculate = loadOutstandingDebtHelper();\n  const total = calculate([\n    { kind: "debt", date: "2026-08-27", amount: 3000, actualPaid: 0 },\n    { kind: "debt", date: "2026-08-29", amount: 81, actualPaid: 30 },\n    { kind: "debt", date: "2026-09-05", amount: 500, actualPaid: 500 },\n    { kind: "money_schedule", date: "2026-09-01", amount: 9999, actualPaid: 0 },\n  ], 400);\n\n  assert.equal(total, 3451);\n});\n\ntest("fully paid current-cycle debt occurrence leaves no remaining ORB debt commitment", () => {\n  const calculate = loadOutstandingDebtHelper();\n  assert.equal(calculate([{ kind: "debt", amount: 81, actualPaid: 81 }], 0), 0);\n});\n\ntest("canonical snapshot uses current-cycle debt occurrences instead of future-only debt filter", () => {\n  assert.match(source, /const debtUpcoming = calculateMeansOutstandingDebtCommitments\\(\\s*debtOccurrences,\\s*baselineState\\.carriedObligations\\s*\\);/);\n  assert.doesNotMatch(source, /const debtUpcoming = futureContributions\\s*\\.filter\\(\\(entry\\) => entry\\.kind === "debt"\\)/);\n});\n''', encoding='utf-8')
          PY

      - name: Syntax check authority
        run: node --check src/lib/clara-means-authority.js

      - name: Run focused regression
        run: |
          node --test tests/means-score-debt-commitments-display-regression.test.mjs
          node --test tests/means-score-context-baseline-regression.test.mjs
          node --test tests/means-score-final-acceptance-regression.test.mjs
          node --test tests/means-score-single-authority-regression.test.mjs

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/clara-means-authority.js tests/means-score-debt-commitments-display-regression.test.mjs
          if git diff --cached --quiet; then
            echo "Repair already present."
            exit 0
          fi
          git commit -m "Show outstanding debt commitments in Means"
          git push origin HEAD:main

# trigger after workflow exists on default branch
