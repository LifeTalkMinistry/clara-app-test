name: Patch Money Left summary hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-money-left-summary-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useMoneyLeftSummaryHandlers into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useMoneyLeftSummaryHandlers from "@/components/fresh/main-dashboard/money-summary/useMoneyLeftSummaryHandlers";\n'
          import_anchor = 'import DashboardMoneySummary from "@/components/fresh/main-dashboard/money-summary/DashboardMoneySummary";\n'

          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Money summary import anchor not found. Refusing to patch Dashboard.jsx.")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          refs_start = '  const budgetListDropdownRef = useRef(null);\n  const moneyLeftTapRef = useRef({\n'
          refs_end = '  const moneyLeftNavigateLockRef = useRef(0);\n'
          if refs_start in text:
              start_index = text.index(refs_start)
              end_index = text.index(refs_end, start_index) + len(refs_end)
              text = text[:start_index] + '  const budgetListDropdownRef = useRef(null);\n' + text[end_index:]

          handlers_start = '  const isManualExpenseOrbEvent = useCallback((event) => {\n'
          handlers_end = '  const markOnboardingCompleted = useCallback(async () => {\n'
          if handlers_start in text:
              start_index = text.index(handlers_start)
              end_index = text.index(handlers_end, start_index)
              old_block = text[start_index:end_index]
              required_tokens = [
                  'const stopMoneyLeftSummaryEvent = useCallback',
                  'const openTransactionHubFromMoneyLeft = useCallback',
                  'const handleMoneyLeftPointerDown = useCallback',
                  'const handleMoneyLeftPointerMove = useCallback',
                  'const handleMoneyLeftTapEnd = useCallback',
                  'const moneyLeftSummaryHandlers = useMemo',
              ]
              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("Money Left handler block does not match expected content. Refusing to patch Dashboard.jsx.")
              new_block = '  const moneyLeftSummaryHandlers = useMoneyLeftSummaryHandlers({ navigate });\n\n'
              text = text[:start_index] + new_block + text[end_index:]

          if 'useMoneyLeftSummaryHandlers({ navigate })' not in text:
              raise SystemExit("Money Left hook was not wired. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-money-left-summary-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-money-left-summary-hook.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Wire money left summary handlers hook"
          git push
