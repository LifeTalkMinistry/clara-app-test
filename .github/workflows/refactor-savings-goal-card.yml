name: Refactor Savings Goal card flow

on:
  push:
    branches:
      - fix/savings-goal-card-flow
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/savings-goal-card-flow
          fetch-depth: 0

      - name: Harden Savings Goal card flow
        run: python3 .github/scripts/harden-savings-goal-card.py

      - name: Install dependencies
        run: npm ci || npm ci

      - name: Run focused Savings Goal regression
        run: node --test tests/savings-goal-card-flow-regression.test.mjs

      - name: Run full regression and production build
        run: npm run build

      - name: Commit verified Savings Goal hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Savings Goal hardening changes were produced."
            exit 0
          fi
          git commit -m "Harden Savings Goal card flow"
          git pull --rebase origin fix/savings-goal-card-flow
          git push origin HEAD:fix/savings-goal-card-flow
