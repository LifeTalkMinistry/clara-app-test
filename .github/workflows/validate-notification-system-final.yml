name: Validate final CLARA notification system

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .clara-notification-final-trigger

permissions:
  contents: write

jobs:
  finalize-build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/clara-notification-system
          fetch-depth: 1

      - name: Apply final safety patch
        run: python .github/scripts/finalize-notification-system.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: build-validation-placeholder
          VITE_GEMINI_API_KEY: build-validation-placeholder
          VITE_GEMINI_MODEL: gemini-2.5-flash

      - name: Validate notification safety rules
        shell: bash
        run: |
          git diff --check
          grep -q 'hasStoredNotificationPreferences' src/hooks/useClaraNotificationRuntime.js
          grep -q 'snoozeExpired' src/hooks/useClaraNotificationRuntime.js
          ! grep -q 'modeSupportsPush' src/hooks/useClaraNotificationRuntime.js
          grep -q 'currentMinutes < scheduledMinutes + 5' supabase/functions/schedule-task-reminders/index.ts
          grep -q 'taskApplicable === true' src/components/notifications/NotificationSettingsPanel.jsx
          grep -q 'snoozedUntil: null' src/lib/notifications/localNotificationRepository.js
          test -f supabase/notification_system.sql

      - name: Package complete changed files
        shell: bash
        run: |
          zip -q clara-notification-system-complete-files.zip \
            public/clara-task-reminder-sw.js \
            src/components/fresh/main-dashboard/dashboard-panels/settings/DashboardSettingsPanel.jsx \
            src/components/fresh/main-dashboard/dashboard-settings/dashboardRuntimeSettings.js \
            src/components/fresh/main-dashboard/dashboard-settings/useDashboardNotificationSettings.js \
            src/components/notifications/NotificationSettingsPanel.jsx \
            src/hooks/useClaraNotificationRuntime.js \
            src/hooks/useNotificationPreferences.js \
            src/lib/clara-settings.js \
            src/lib/notifications/financialNotificationEvaluator.js \
            src/lib/notifications/localNotificationRepository.js \
            src/lib/notifications/notificationPreferences.js \
            src/lib/notifications/notificationRegistry.js \
            src/lib/push-notifications.js \
            src/lib/task-reminders.js \
            src/pages/Dashboard.jsx \
            src/pages/Settings.jsx \
            supabase/functions/schedule-task-reminders/index.ts \
            supabase/functions/send-task-reminders/index.ts \
            supabase/notification_system.sql

      - name: Upload complete source bundle
        uses: actions/upload-artifact@v4
        with:
          name: clara-notification-system-complete-files
          path: clara-notification-system-complete-files.zip
          retention-days: 30
          if-no-files-found: error

      - name: Remove temporary validation files
        run: |
          rm -f .clara-notification-final-trigger
          rm -f .github/scripts/finalize-notification-system.py
          rm -f .github/workflows/validate-notification-system-final.yml
          rm -f clara-notification-system-complete-files.zip

      - name: Commit validated final implementation
        shell: bash
        run: |
          git config user.name "CLARA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize CLARA notification safety rules"
          git push origin HEAD:feature/clara-notification-system
