name: Patch budget summaries hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-budget-summaries-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardBudgetSummaries into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardBudgetSummaries from "@/components/fresh/main-dashboard/budget/useDashboardBudgetSummaries";\n'
          import_anchor = 'import useDashboardMoneyLeftMetrics from "@/components/fresh/main-dashboard/money-summary/useDashboardMoneyLeftMetrics";\n'
          fallback_anchor = 'import DashboardMoneySummary from "@/components/fresh/main-dashboard/money-summary/DashboardMoneySummary";\n'

          if import_line not in text:
              if import_anchor in text:
                  text = text.replace(import_anchor, import_anchor + import_line, 1)
              elif fallback_anchor in text:
                  text = text.replace(fallback_anchor, fallback_anchor + import_line, 1)
              else:
                  raise SystemExit("Budget summaries import anchor not found. Refusing to patch Dashboard.jsx.")

          if 'useDashboardBudgetSummaries({' not in text:
              block_start = '  const budgetSummaries = useMemo(() => {\n    const monthRange = getPHMonthRange();\n'
              if block_start not in text:
                  raise SystemExit("budgetSummaries useMemo start not found. Refusing to patch Dashboard.jsx.")

              start_index = text.index(block_start)
              block_end = '  }, [budgets, expenses]);\n\n'
              end_index = text.find(block_end, start_index)
              if end_index == -1:
                  raise SystemExit("budgetSummaries useMemo end not found. Refusing to patch Dashboard.jsx.")
              end_index += len(block_end)

              old_block = text[start_index:end_index]
              required_tokens = [
                  'const activeBudgets = budgets.filter((budget) => {',
                  'return FINANCE_CATEGORIES.map((category) => {',
                  'const allocated = activeBudgets.reduce((sum, budget) => {',
                  'const used = expenses.reduce((sum, expense) => {',
                  'getExpenseCategoryKey(expense) !== category',
                  'isInPHRange(getTransactionDate(expense), monthRange.start, monthRange.end)',
                  '.filter((item) => item.allocated > 0 || item.used > 0)',
                  '.sort((a, b) => b.used - a.used || b.allocated - a.allocated)',
                  '.slice(0, 4);',
              ]

              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("budgetSummaries block content mismatch. Refusing to patch Dashboard.jsx.")

              replacement = (
                  '  const budgetSummaries = useDashboardBudgetSummaries({\n'
                  '    budgets,\n'
                  '    expenses,\n'
                  '  });\n\n'
              )

              text = text[:start_index] + replacement + text[end_index:]

          if 'useDashboardBudgetSummaries({' not in text:
              raise SystemExit("useDashboardBudgetSummaries was not wired. Refusing to continue.")
          if 'const budgetSummaries = useMemo(() => {' in text:
              raise SystemExit("Old budgetSummaries useMemo still exists after patch. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-budget-summaries-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-budget-summaries-hook.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Wire dashboard budget summaries hook"
          git push
