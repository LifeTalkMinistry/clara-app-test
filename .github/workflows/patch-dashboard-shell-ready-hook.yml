name: Patch dashboard shell ready hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard-shell-ready-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire useDashboardShellReady into Dashboard.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("src/pages/Dashboard.jsx")
          text = target.read_text()

          import_line = 'import useDashboardShellReady from "@/components/fresh/main-dashboard/shell/useDashboardShellReady";\n'
          import_anchor = 'import DashboardShell from "@/components/fresh/main-dashboard/shell/DashboardShell";\n'

          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Dashboard shell import anchor not found. Refusing to patch Dashboard.jsx.")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          state_line = '  const [dashboardShellReady, setDashboardShellReady] = useState(false);\n'
          replacement_state = '  const dashboardShellReady = useDashboardShellReady();\n'

          if state_line in text:
              text = text.replace(state_line, replacement_state, 1)
          elif replacement_state not in text:
              raise SystemExit("Dashboard shell ready state line not found and hook is not wired. Refusing to patch Dashboard.jsx.")

          block_start = '  useEffect(() => {\n    let timerId = null;\n    let frameId = null;\n\n    if (typeof window !== "undefined" && window.requestAnimationFrame) {\n'
          block_end = '  useBudgetListDropdownDismiss({\n'

          if block_start in text:
              start_index = text.index(block_start)
              end_index = text.index(block_end, start_index)
              old_block = text[start_index:end_index]
              required_tokens = [
                  'window.requestAnimationFrame(() => {',
                  'timerId = window.setTimeout(() => setDashboardShellReady(true), 80);',
                  'timerId = setTimeout(() => setDashboardShellReady(true), 80);',
                  'window.cancelAnimationFrame(frameId)',
                  'if (timerId) clearTimeout(timerId);',
              ]
              if not all(token in old_block for token in required_tokens):
                  raise SystemExit("Dashboard shell ready effect block does not match expected content. Refusing to patch Dashboard.jsx.")
              text = text[:start_index] + text[end_index:]
          elif 'setDashboardShellReady(true)' in text:
              raise SystemExit("Dashboard shell ready setter still exists but expected effect block was not found. Refusing to patch Dashboard.jsx.")

          if 'setDashboardShellReady' in text:
              raise SystemExit("setDashboardShellReady still exists after patch. Refusing to continue.")
          if 'useDashboardShellReady();' not in text:
              raise SystemExit("useDashboardShellReady was not wired. Refusing to continue.")

          target.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-dashboard-shell-ready-hook.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.jsx .github/workflows/patch-dashboard-shell-ready-hook.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Wire dashboard shell ready hook"
          git push
