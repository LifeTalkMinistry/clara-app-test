name: Move Settings Notifications into Account

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/move-settings-notifications-into-account.yml"
      - ".github/scripts/move-settings-notifications-into-account.mjs"

permissions:
  contents: write

jobs:
  update-settings-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Move Notifications into Account in the source component
        run: node .github/scripts/move-settings-notifications-into-account.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build

      - name: Commit the verified component update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Settings source changes were produced."
            exit 0
          fi
          git commit -m "Move Notifications into Account settings"
          git pull --rebase origin main
          git push origin main
