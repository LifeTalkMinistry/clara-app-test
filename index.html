<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CLARA</title>

    <!-- 🔥 PREVENT THEME FLICKER -->
    <script>
      (() => {
        try {
          const key = localStorage.getItem("clara_global_theme") || "clara-hero-red-blue";
          document.documentElement.dataset.theme = key;
          document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>

    <style>
      html, body, #root {
        min-height: 100%;
        margin: 0;
        background: #020617;
      }

      #clara-boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: sans-serif;
      }

      body.clara-message-context-open {
        overflow: hidden !important;
      }

      body.clara-message-context-open [data-bottom-nav],
      body.clara-message-context-open [data-fab],
      body.clara-message-context-open a[aria-label="Open admin panel"] {
        display: none !important;
        pointer-events: none !important;
      }

      body.clara-message-context-open .theme-page-shell,
      body.clara-message-context-open .theme-page-shell > *,
      body.clara-message-context-open .theme-page-shell main,
      body.clara-message-context-open .theme-page-shell main > * {
        transform: none !important;
        filter: none !important;
        perspective: none !important;
        contain: none !important;
      }

      body.clara-message-context-open [data-clara-message-context="true"] {
        position: fixed !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        top: var(--clara-message-context-top, 0px) !important;
        z-index: 80 !important;
        width: 100vw !important;
        max-width: none !important;
        height: auto !important;
        max-height: none !important;
        margin: 0 !important;
        border-radius: 0 !important;
        transform: none !important;
        isolation: isolate !important;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="clara-boot">CLARA is starting...</div>
    </div>

    <script>
      (() => {
        const CHAT_PLACEHOLDER = "Type a message";
        const TOP_NAV_WORDS = ["Home", "Feed", "Message", "Setting"];
        let lastOverlay = null;

        const findChatInput = () => {
          return Array.from(document.querySelectorAll("input, textarea")).find((node) => {
            const placeholder = String(node.getAttribute("placeholder") || "");
            return placeholder.includes(CHAT_PLACEHOLDER);
          });
        };

        const findMessageOverlay = (input) => {
          if (!input) return null;

          let node = input;
          while (node && node !== document.body) {
            const className = String(node.getAttribute?.("class") || "");
            const isConversationShell =
              className.includes("fixed") ||
              className.includes("h-[100dvh]") ||
              className.includes("w-screen") ||
              className.includes("overflow-hidden");

            if (isConversationShell && String(node.textContent || "").includes(CHAT_PLACEHOLDER.replace(" a", ""))) {
              return node;
            }

            node = node.parentElement;
          }

          return input.closest("div") || null;
        };

        const findDefaultTopNav = (overlay) => {
          const candidates = Array.from(document.querySelectorAll("nav, header, section, div"));
          let best = null;

          candidates.forEach((node) => {
            if (!node || node === overlay || overlay?.contains(node) || node.contains(overlay)) return;

            const text = String(node.textContent || "").replace(/\s+/g, " ").trim();
            const hasTopNavWords = TOP_NAV_WORDS.every((word) => text.includes(word));
            if (!hasTopNavWords) return;

            const rect = node.getBoundingClientRect();
            const isVisible = rect.width > 220 && rect.height > 44;
            const isTopContext = rect.top >= -2 && rect.top <= 48 && rect.bottom <= 132;
            const isWideEnough = rect.width >= Math.min(window.innerWidth * 0.7, 280);

            if (!isVisible || !isTopContext || !isWideEnough) return;

            if (!best || rect.bottom > best.getBoundingClientRect().bottom) {
              best = node;
            }
          });

          return best;
        };

        const getPerformanceModeTop = (overlay) => {
          const topNav = findDefaultTopNav(overlay);
          if (!topNav) return 0;

          const rect = topNav.getBoundingClientRect();
          const safeGap = 16;
          return Math.max(0, Math.ceil(rect.bottom + safeGap));
        };

        const applyMessageContext = (overlay) => {
          if (!overlay) return;

          const top = getPerformanceModeTop(overlay);
          document.documentElement.style.setProperty("--clara-message-context-top", `${top}px`);
          document.body.classList.add("clara-message-context-open");

          overlay.dataset.claraMessageContext = "true";
          overlay.style.position = "fixed";
          overlay.style.left = "0";
          overlay.style.right = "0";
          overlay.style.bottom = "0";
          overlay.style.top = `${top}px`;
          overlay.style.zIndex = "80";
          overlay.style.width = "100vw";
          overlay.style.maxWidth = "none";
          overlay.style.height = "auto";
          overlay.style.maxHeight = "none";
          overlay.style.margin = "0";
          overlay.style.borderRadius = "0";
          overlay.style.transform = "none";
          overlay.style.isolation = "isolate";
        };

        const clearMessageContext = () => {
          document.body.classList.remove("clara-message-context-open");
          document.documentElement.style.removeProperty("--clara-message-context-top");

          if (lastOverlay?.dataset) delete lastOverlay.dataset.claraMessageContext;
          if (lastOverlay?.style) {
            lastOverlay.style.removeProperty("position");
            lastOverlay.style.removeProperty("left");
            lastOverlay.style.removeProperty("right");
            lastOverlay.style.removeProperty("bottom");
            lastOverlay.style.removeProperty("top");
            lastOverlay.style.removeProperty("z-index");
            lastOverlay.style.removeProperty("width");
            lastOverlay.style.removeProperty("max-width");
            lastOverlay.style.removeProperty("height");
            lastOverlay.style.removeProperty("max-height");
            lastOverlay.style.removeProperty("margin");
            lastOverlay.style.removeProperty("border-radius");
            lastOverlay.style.removeProperty("transform");
            lastOverlay.style.removeProperty("isolation");
          }

          lastOverlay = null;
        };

        const syncMessageContext = () => {
          const input = findChatInput();
          const overlay = findMessageOverlay(input);

          if (!input || !overlay) {
            clearMessageContext();
            return;
          }

          lastOverlay = overlay;
          applyMessageContext(overlay);
        };

        const scheduleSync = () => requestAnimationFrame(syncMessageContext);
        new MutationObserver(scheduleSync).observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["class", "style", "placeholder"],
        });
        window.addEventListener("resize", scheduleSync);
        window.addEventListener("orientationchange", scheduleSync);
        document.addEventListener("visibilitychange", scheduleSync);
        scheduleSync();
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
