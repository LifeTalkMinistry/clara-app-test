    <!-- Hotfix for the legacy bundle: opening Settings must not force global Performance Mode. -->
    <script>
      (() => {
        if (window.__claraPremiumVisualGuardInstalled) return;
        window.__claraPremiumVisualGuardInstalled = true;

        const enforcePremiumVisuals = () => {
          const roots = [document.documentElement, document.body].filter(Boolean);
          for (const root of roots) {
            if (root.classList.contains("clara-performance-mode")) {
              root.classList.remove("clara-performance-mode");
            }
            if (!root.classList.contains("clara-premium-mode")) {
              root.classList.add("clara-premium-mode");
            }
            if (root.dataset.claraVisualMode !== "premium") {
              root.dataset.claraVisualMode = "premium";
            }
          }
        };

        const observer = new MutationObserver(enforcePremiumVisuals);
        const startGuard = () => {
          enforcePremiumVisuals();
          observer.observe(document.documentElement, {
            attributes: true,
            attributeFilter: ["class", "data-clara-visual-mode"],
          });
          if (document.body) {
            observer.observe(document.body, {
              attributes: true,
              attributeFilter: ["class", "data-clara-visual-mode"],
            });
          }
        };

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", startGuard, { once: true });
        } else {
          startGuard();
        }
        window.addEventListener("clara:visual-performance-mode-updated", enforcePremiumVisuals);
      })();
    </script>

    <div id="root"><div id="clara-boot">CLARA is starting...</div></div>

    <script>
      (() => {
        let settleTimer = null;
        const settleRoute = () => {
          clearTimeout(settleTimer);
          document.body.classList.remove("clara-route-soft-settle");
          requestAnimationFrame(() => {
            document.body.classList.add("clara-route-soft-settle");
            settleTimer = setTimeout(() => document.body.classList.remove("clara-route-soft-settle"), 260);
          });
        };
        window.addEventListener("hashchange", settleRoute);
        window.addEventListener("popstate", settleRoute);
        document.addEventListener("visibilitychange", () => { if (!document.hidden) settleRoute(); });
      })();
    </script>

    <script>
      (() => {
        const copyRules = [
          [/I[’']ll let AI interpret it and keep it as custom context for this session\./g, "I’ll use your answer to understand your situation better."],
          [/Got it\. That answer is more specific, so I[’']ll treat it as your own pattern instead of forcing it into the buttons\./g, "Got it. That gives me a clearer picture of your situation."],
          [/Thanks\. I captured (\d+) starter memory points for this session\./g, "Thanks. I’ve captured $1 personal details so far."],
          [/Permanent save is the next system we[’']ll connect, but this guided flow now covers the full CLARA Behavioral Intelligence Framework(?: with personal details)?\./g, "Later, we’ll connect this to CLARA’s saved memory. For now, this helps me understand your situation more clearly."],
          [/Here[’']s the latest captured context from this session:/g, "Here’s what I’ve understood from you so far:"],
          [/Review captured context/g, "Review what CLARA understood"],
          [/Permanent saving comes next when we connect the memory store\./g, "Once saving is connected, you’ll be able to keep this as part of your CLARA profile."],
          [/No captured context yet\./g, "I haven’t captured anything yet."],
          [/Analyzing that context\.\.\./g, "Understanding your answer..."],
          [/custom context/g, "personal context"],
          [/AI interpret/g, "understand"],
          [/for this session/g, "while we talk"],
        ];
        const makeNatural = (value) => copyRules.reduce((text, [pattern, replacement]) => text.replace(pattern, replacement), value);
        const polishTextNode = (node) => { const next = makeNatural(node.nodeValue || ""); if (next !== node.nodeValue) node.nodeValue = next; };
        const polishTree = (root = document.getElementById("root")) => {
          if (!root) return;
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          let node = walker.nextNode();
          while (node) { polishTextNode(node); node = walker.nextNode(); }
        };
        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) for (const node of mutation.addedNodes) {
            if (node.nodeType === Node.TEXT_NODE) polishTextNode(node);
            else if (node.nodeType === Node.ELEMENT_NODE) polishTree(node);
          }
        });
        document.addEventListener("DOMContentLoaded", () => {
          const root = document.getElementById("root");
          polishTree(root);
          if (root) observer.observe(root, { childList: true, subtree: true });
        });
      })();
    </script>

    <script>
      (() => {
        if (window.__claraBehavioralMemoryTrainingInstalled) return;
        window.__claraBehavioralMemoryTrainingInstalled = true;

        const memoryRules = `
CLARA BEHAVIORAL INTELLIGENCE FRAMEWORK:
- Treat Talk to CLARA as a 4-layer understanding system for the future Me page, not as a plain questionnaire.
- Layer 1 Core Identity: income pattern, living situation, responsibilities, work type, relationship status, dependents, current financial pressure, survival pressure, main goal, emotional trend.
- Layer 2 Behavioral Spending Profile: emotional triggers, stress spending habits, reward system, impulse purchases, spending weakness, coping habits, motivation style, financial fear, guilt pattern, social pressure.
- Layer 3 Life Pattern Intelligence: schedule, sleep, work exhaustion, social environment, relationship conflict, hobbies, energy trends, burnout signs.
- Layer 4 Financial Infrastructure: wallets, budgets, emergency fund, savings goals, recurring expenses, debt, subscriptions, transfers, payday cycle.
- When the user asks "you know me now?", "what do you remember about me?", or "what did CLARA understand?", summarize by these 4 layers in warm human language.
- Never expose internal keys like burnoutIndicators.prevention, wallets.primary, schema IDs, tags, JSON, database, or session.
- Translate raw answers into natural observations. Example: "GCash" becomes "GCash seems to be your main spending wallet."
- If a later money decision connects to a known pattern, reference only ONE relevant pattern naturally, then help with the current decision.
- If income cutoff dates are already known, do not ask the same payday cycle question again. Move to what happens after payday instead.
- Keep CLARA curious, observant, emotionally aware, and practical.`;

        const getVisibleClaraContext = () => {
          try {
            const text = String(document.getElementById("root")?.innerText || "").replace(/\n{3,}/g, "\n\n").trim();
            return text ? text.slice(-6200) : "No visible Talk to CLARA context found.";
          } catch { return "No visible Talk to CLARA context found."; }
        };
        const shouldPatchGemini = (input) => /generativelanguage\.googleapis\.com/i.test(typeof input === "string" ? input : input?.url || "") && /generateContent/i.test(typeof input === "string" ? input : input?.url || "");
        const addMemoryTrainingToBody = (body) => {
          if (!body?.contents?.[0]?.parts?.[0]?.text) return body;
          const currentPrompt = String(body.contents[0].parts[0].text || "");
          if (currentPrompt.includes("CLARA BEHAVIORAL INTELLIGENCE FRAMEWORK") || !currentPrompt.includes("You are CLARA")) return body;
          const addition = `\n\n${memoryRules}\n\nVISIBLE RECENT TALK TO CLARA CONTEXT, USE ONLY IF RELEVANT:\n${getVisibleClaraContext()}\n\nReminder: reply as CLARA in natural user-facing language, not system language.`;
          return { ...body, contents: body.contents.map((content, index) => index !== 0 ? content : { ...content, parts: content.parts.map((part, partIndex) => partIndex === 0 && typeof part.text === "string" ? { ...part, text: `${part.text}${addition}` } : part) }) };
        };
        const originalFetch = window.fetch?.bind(window);
        if (!originalFetch) return;
        window.fetch = async (input, init = {}) => {
          if (!shouldPatchGemini(input) || !init?.body || typeof init.body !== "string") return originalFetch(input, init);
          try { return originalFetch(input, { ...init, body: JSON.stringify(addMemoryTrainingToBody(JSON.parse(init.body))) }); }
          catch { return originalFetch(input, init); }
        };
      })();
    </script>

    <script>
      (() => {
        if (window.__claraFrameworkFlowGuardInstalled) return;
        window.__claraFrameworkFlowGuardInstalled = true;
        const rootText = () => String(document.getElementById("root")?.innerText || "");
        const findButton = (label) => [...document.querySelectorAll("button")].find((button) => button.innerText.trim().toLowerCase() === label.toLowerCase());
        const inferKnownPayday = (text) => {
          if (!/What exact cutoff dates do you usually receive income\?/i.test(text)) return "";
          if (/Every 10 and 25/i.test(text)) return "Every 10 and 25";
          if (/15 and 30/i.test(text)) return "15 and 30";
          if (/Weekly|every friday|other friday|every other friday/i.test(text)) return "Weekly";
          if (/Irregular cutoff|irregular/i.test(text)) return "Irregular";
          if (/End of month/i.test(text)) return "Once a month";
          return "";
        };
        let lastAutoClick = 0;
        const guardDuplicatePaydayQuestion = () => {
          const text = rootText();
          if (!/When is your usual payday cycle\?/i.test(text)) return;
          if (/What usually happens to your spending right after payday\?/i.test(text)) return;
          const known = inferKnownPayday(text);
          if (!known || Date.now() - lastAutoClick < 1200) return;
          const button = findButton(known);
          if (!button) return;
          lastAutoClick = Date.now();
          setTimeout(() => button.click(), 250);
        };
        const observer = new MutationObserver(guardDuplicatePaydayQuestion);
        document.addEventListener("DOMContentLoaded", () => {
          const root = document.getElementById("root");
          if (root) observer.observe(root, { childList: true, subtree: true, characterData: true });
          guardDuplicatePaydayQuestion();
        });
      })();
    </script>

    <script>
      (() => {
        if (window.__claraDailyCheckInSuccessBridgeInstalled) return;
        window.__claraDailyCheckInSuccessBridgeInstalled = true;

        const UPDATE_EVENT = "clara:daily-check-in-updated";
        const MILESTONE_TYPES = new Set([
          "streak_reset",
          "streak_7_day",
          "streak_14_day",
          "streak_30_completed",
          "new_longest_streak",
        ]);
        let activeBanner = null;

        const removeBanner = () => {
          activeBanner?.remove?.();
          activeBanner = null;
        };

        const showBanner = (streakCount) => {
          removeBanner();
          const streak = Math.max(1, Number(streakCount) || 1);
          const firstDay = streak === 1;
          const wrapper = document.createElement("div");
          wrapper.setAttribute("role", "dialog");
          wrapper.setAttribute("aria-live", "polite");
          wrapper.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:220;display:flex;justify-content:center;padding:0 12px max(18px,env(safe-area-inset-bottom));pointer-events:none;font-family:inherit;";

          const card = document.createElement("div");
          card.style.cssText = "position:relative;width:100%;max-width:404px;overflow:hidden;border-radius:28px;border:1px solid rgba(207,250,254,.16);padding:20px;color:white;background:linear-gradient(145deg,rgba(5,19,41,.97),rgba(8,24,55,.96) 52%,rgba(18,13,52,.96));box-shadow:0 26px 90px rgba(0,0,0,.62),0 0 55px rgba(34,211,238,.14);backdrop-filter:blur(24px);pointer-events:auto;box-sizing:border-box;";

          const close = document.createElement("button");
          close.type = "button";
          close.setAttribute("aria-label", "Close streak message");
          close.textContent = "×";
          close.style.cssText = "position:absolute;right:16px;top:16px;z-index:2;width:32px;height:32px;border-radius:999px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.06);color:rgba(255,255,255,.72);font-size:22px;line-height:1;cursor:pointer;";
          close.addEventListener("click", removeBanner);

          const glowA = document.createElement("div");
          glowA.style.cssText = "position:absolute;left:-64px;top:-64px;width:160px;height:160px;border-radius:999px;background:rgba(103,232,249,.14);filter:blur(48px);pointer-events:none;";
          const glowB = document.createElement("div");
          glowB.style.cssText = "position:absolute;right:-40px;bottom:-80px;width:192px;height:192px;border-radius:999px;background:rgba(129,140,248,.16);filter:blur(48px);pointer-events:none;";

          const content = document.createElement("div");
          content.style.cssText = "position:relative;z-index:1;padding-right:32px;";
          const icon = document.createElement("div");
          icon.textContent = "🔥";
          icon.style.cssText = "display:flex;width:48px;height:48px;align-items:center;justify-content:center;border-radius:16px;border:1px solid rgba(207,250,254,.15);background:rgba(103,232,249,.10);font-size:21px;box-shadow:inset 0 1px 0 rgba(255,255,255,.10);";
          const eyebrow = document.createElement("p");
          eyebrow.textContent = firstDay ? "YOUR STREAK STARTS HERE" : "YOUR STREAK CONTINUES";
          eyebrow.style.cssText = "margin:16px 0 0;font-size:9px;font-weight:900;letter-spacing:.24em;color:rgba(207,250,254,.58);";
          const title = document.createElement("h2");
          title.textContent = firstDay ? "You showed up today! 🔥" : `You showed up for ${streak} days straight! 🔥`;
          title.style.cssText = "margin:8px 0 0;font-size:21px;font-weight:900;line-height:1.2;letter-spacing:-.035em;color:#fff;";
          const body = document.createElement("p");
          body.textContent = firstDay
            ? "Day 1 is complete. You checked in, protected your money discipline, and started building the habit."
            : "Another day protected. Another promise to yourself kept. Keep building the discipline.";
          body.style.cssText = "margin:12px 0 0;font-size:12.5px;font-weight:600;line-height:1.65;color:rgba(236,254,255,.76);";
          const action = document.createElement("button");
          action.type = "button";
          action.textContent = firstDay ? "KEEP BUILDING" : "KEEP GOING";
          action.style.cssText = "margin-top:20px;width:100%;border:0;border-radius:16px;padding:12px 16px;background:#a5f3fc;color:#020617;font-size:11px;font-weight:900;letter-spacing:.15em;cursor:pointer;box-shadow:0 14px 34px rgba(0,0,0,.24);";
          action.addEventListener("click", removeBanner);

          content.append(icon, eyebrow, title, body, action);
          card.append(glowA, glowB, close, content);
          wrapper.append(card);
          document.body.append(wrapper);
          activeBanner = wrapper;
          window.setTimeout(() => action.focus?.({ preventScroll: true }), 80);
        };

        window.addEventListener(UPDATE_EVENT, (event) => {
          const detail = event?.detail || {};
          if (detail.reason !== "check_in") return;
          const state = detail.state || {};
          const pendingType = state.pendingBubble?.type || "";

          // A source build that already supports the new bubble should own the UI.
          if (pendingType === "daily_check_in_completed") return;
          // Existing milestone/reset bubbles remain higher priority and should not be duplicated.
          if (MILESTONE_TYPES.has(pendingType)) return;

          showBanner(state.currentStreak);
        });
      })();
    </script>
