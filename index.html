<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CLARA</title>

    <!-- Prevent theme flicker before React mounts. -->
    <script>
      (() => {
        try {
          const key = localStorage.getItem("clara_global_theme") || "clara-hero-red-blue";
          document.documentElement.dataset.theme = key;
          document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>

    <style>
      html, body, #root {
        min-height: 100%;
        margin: 0;
        background: #020617;
      }

      #root {
        isolation: isolate;
        background: #020617;
      }

      #clara-boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: sans-serif;
      }

      @keyframes clara-loader-reveal {
        to {
          opacity: 1;
        }
      }

      @keyframes clara-route-settle {
        0% {
          opacity: 0.985;
          transform: translate3d(0, 4px, 0) scale(0.9985);
          filter: saturate(0.98);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
          filter: saturate(1);
        }
      }

      /* Prevent split-second auth/Suspense loader flashes. Real longer loads still appear. */
      .theme-page-shell:has(.animate-spin) {
        opacity: 0;
        animation: clara-loader-reveal 1ms linear 420ms forwards;
      }

      /* Route changes settle like one continuous app surface, not hard page swaps. */
      body.clara-route-soft-settle .theme-page-shell main {
        animation: clara-route-settle 220ms cubic-bezier(.2,.8,.2,1) both;
        backface-visibility: hidden;
        will-change: transform, opacity, filter;
      }

      body.clara-route-soft-settle .theme-page-shell:has(.animate-spin) {
        animation-delay: 560ms;
      }

      .theme-page-shell:has(.animate-spin) > div {
        transform: translateZ(0);
      }

      @media (prefers-reduced-motion: reduce) {
        .theme-page-shell:has(.animate-spin),
        body.clara-route-soft-settle .theme-page-shell main {
          animation-delay: 0ms;
          animation-duration: 1ms;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="clara-boot">CLARA is starting...</div>
    </div>

    <script>
      (() => {
        let settleTimer = null;
        const settleRoute = () => {
          clearTimeout(settleTimer);
          document.body.classList.remove("clara-route-soft-settle");
          requestAnimationFrame(() => {
            document.body.classList.add("clara-route-soft-settle");
            settleTimer = setTimeout(() => {
              document.body.classList.remove("clara-route-soft-settle");
            }, 260);
          });
        };

        window.addEventListener("hashchange", settleRoute);
        window.addEventListener("popstate", settleRoute);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) settleRoute();
        });
      })();
    </script>

    <script>
      (() => {
        const copyRules = [
          [/I[’']ll let AI interpret it and keep it as custom context for this session\./g, "I’ll use your answer to understand your situation better."],
          [/Got it\. That answer is more specific, so I[’']ll treat it as your own pattern instead of forcing it into the buttons\./g, "Got it. That gives me a clearer picture of your situation."],
          [/Thanks\. I captured (\d+) starter memory points for this session\./g, "Thanks. I’ve captured $1 personal details so far."],
          [/Permanent save is the next system we[’']ll connect, but this guided flow now covers the full CLARA Behavioral Intelligence Framework(?: with personal details)?\./g, "Later, we’ll connect this to CLARA’s saved memory. For now, this helps me understand your situation more clearly."],
          [/Here[’']s the latest captured context from this session:/g, "Here’s what I’ve understood from you so far:"],
          [/Permanent saving comes next when we connect the memory store\./g, "Once saving is connected, you’ll be able to keep this as part of your CLARA profile."],
          [/No captured context yet\./g, "I haven’t captured anything yet."],
          [/Analyzing that context\.\.\./g, "Understanding your answer..."],
          [/custom context/g, "personal context"],
          [/AI interpret/g, "understand"],
          [/for this session/g, "while we talk"],
        ];

        const makeNatural = (value) => copyRules.reduce((text, [pattern, replacement]) => text.replace(pattern, replacement), value);
        const polishTextNode = (node) => {
          const next = makeNatural(node.nodeValue || "");
          if (next !== node.nodeValue) node.nodeValue = next;
        };
        const polishTree = (root = document.getElementById("root")) => {
          if (!root) return;
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          let node = walker.nextNode();
          while (node) {
            polishTextNode(node);
            node = walker.nextNode();
          }
        };

        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            for (const node of mutation.addedNodes) {
              if (node.nodeType === Node.TEXT_NODE) polishTextNode(node);
              else if (node.nodeType === Node.ELEMENT_NODE) polishTree(node);
            }
          }
        });

        document.addEventListener("DOMContentLoaded", () => {
          const root = document.getElementById("root");
          polishTree(root);
          if (root) observer.observe(root, { childList: true, subtree: true });
        });
      })();
    </script>

    <script>
      (() => {
        if (window.__claraBehavioralMemoryTrainingInstalled) return;
        window.__claraBehavioralMemoryTrainingInstalled = true;

        const memoryRules = `
CLARA BEHAVIORAL MEMORY TRAINING:
- Treat the recent Talk to CLARA conversation as personal behavioral context, not just chat history.
- When the user asks things like "you know me now?", "what do you know about me?", or "do you remember me?", do NOT answer vaguely. Summarize 4-6 real patterns from the recent conversation in warm human language.
- Do not expose internal field names such as burnoutIndicators.prevention, wallets.primary, subscriptions.auditNeed, tags, schema IDs, database, JSON, AI, or session.
- Translate any learned profile fields into natural observations. Example: "wallets.primary: GCash" becomes "GCash seems to be your main spending wallet."
- If the user talks about a new purchase, stress, debt, payday, pressure, sleep, energy, social situation, or burnout, naturally reference ONE relevant learned pattern when helpful.
- Use phrases like "Earlier you mentioned...", "From what you shared...", or "That sounds connected to..." only when it genuinely fits.
- Never overdo memory. Mention one or two patterns, then help with the current decision.
- If a learned pattern sounds sensitive, be gentle and non-judgmental.
- If the current conversation is just onboarding, continue the guided flow and avoid long summaries unless the user asks.
- Keep CLARA emotionally aware: curious, observant, and practical.`;

        const getVisibleClaraContext = () => {
          try {
            const root = document.getElementById("root");
            const text = String(root?.innerText || "")
              .replace(/\n{3,}/g, "\n\n")
              .trim();
            if (!text) return "No visible Talk to CLARA context found.";
            return text.slice(-5200);
          } catch {
            return "No visible Talk to CLARA context found.";
          }
        };

        const shouldPatchGemini = (input) => {
          const url = typeof input === "string" ? input : input?.url || "";
          return /generativelanguage\.googleapis\.com/i.test(url) && /generateContent/i.test(url);
        };

        const addMemoryTrainingToBody = (body) => {
          if (!body?.contents?.[0]?.parts?.[0]?.text) return body;
          const currentPrompt = String(body.contents[0].parts[0].text || "");
          if (currentPrompt.includes("CLARA BEHAVIORAL MEMORY TRAINING")) return body;
          if (!currentPrompt.includes("You are CLARA")) return body;

          const visibleContext = getVisibleClaraContext();
          const addition = `\n\n${memoryRules}\n\nVISIBLE RECENT TALK TO CLARA CONTEXT, USE ONLY IF RELEVANT:\n${visibleContext}\n\nReminder: reply as CLARA in natural user-facing language, not system language.`;

          return {
            ...body,
            contents: body.contents.map((content, index) => {
              if (index !== 0) return content;
              return {
                ...content,
                parts: content.parts.map((part, partIndex) =>
                  partIndex === 0 && typeof part.text === "string"
                    ? { ...part, text: `${part.text}${addition}` }
                    : part
                )
              };
            })
          };
        };

        const originalFetch = window.fetch?.bind(window);
        if (!originalFetch) return;

        window.fetch = async (input, init = {}) => {
          if (!shouldPatchGemini(input) || !init?.body || typeof init.body !== "string") {
            return originalFetch(input, init);
          }

          try {
            const parsed = JSON.parse(init.body);
            const trained = addMemoryTrainingToBody(parsed);
            return originalFetch(input, { ...init, body: JSON.stringify(trained) });
          } catch {
            return originalFetch(input, init);
          }
        };
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
