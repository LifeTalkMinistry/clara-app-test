<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CLARA</title>

    <!-- Prevent theme flicker before React mounts. -->
    <script>
      (() => {
        try {
          const key = localStorage.getItem("clara_global_theme") || "clara-hero-red-blue";
          document.documentElement.dataset.theme = key;
          document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>

    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #020617; }
      #root { isolation: isolate; background: #020617; }
      #clara-boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; font-family: sans-serif; }
      @keyframes clara-loader-reveal { to { opacity: 1; } }
      @keyframes clara-route-settle {
        0% { opacity: 0.985; transform: translate3d(0, 4px, 0) scale(0.9985); filter: saturate(0.98); }
        100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); filter: saturate(1); }
      }
      .theme-page-shell:has(.animate-spin) { opacity: 0; animation: clara-loader-reveal 1ms linear 420ms forwards; }
      body.clara-route-soft-settle .theme-page-shell main { animation: clara-route-settle 220ms cubic-bezier(.2,.8,.2,1) both; backface-visibility: hidden; will-change: transform, opacity, filter; }
      body.clara-route-soft-settle .theme-page-shell:has(.animate-spin) { animation-delay: 560ms; }
      .theme-page-shell:has(.animate-spin) > div { transform: translateZ(0); }

      /* Keep the manual-expense close control pinned to the sheet's true top-right corner. */
      .clara-manual-expense-sheet header > button[aria-label="Close log expense"],
      .clara-manual-expense-sheet header > button[aria-label="Close guide log expense preview"] {
        position: absolute !important;
        top: 16px !important;
        right: 16px !important;
        margin: 0 !important;
        z-index: 30 !important;
      }
      .clara-manual-expense-sheet header {
        padding-right: 64px !important;
      }

      @media (prefers-reduced-motion: reduce) {
        .theme-page-shell:has(.animate-spin), body.clara-route-soft-settle .theme-page-shell main { animation-delay: 0ms; animation-duration: 1ms; }
      }
    </style>
  </head>

  <body>
    <div id="root"><div id="clara-boot">CLARA is starting...</div></div>

    <script>
      (() => {
        let settleTimer = null;
        const settleRoute = () => {
          clearTimeout(settleTimer);
          document.body.classList.remove("clara-route-soft-settle");
          requestAnimationFrame(() => {
            document.body.classList.add("clara-route-soft-settle");
            settleTimer = setTimeout(() => document.body.classList.remove("clara-route-soft-settle"), 260);
          });
        };
        window.addEventListener("hashchange", settleRoute);
        window.addEventListener("popstate", settleRoute);
        document.addEventListener("visibilitychange", () => { if (!document.hidden) settleRoute(); });
      })();
    </script>

    <script>
      (() => {
        const copyRules = [
          [/I[’']ll let AI interpret it and keep it as custom context for this session\./g, "I’ll use your answer to understand your situation better."],
          [/Got it\. That answer is more specific, so I[’']ll treat it as your own pattern instead of forcing it into the buttons\./g, "Got it. That gives me a clearer picture of your situation."],
          [/Thanks\. I captured (\d+) starter memory points for this session\./g, "Thanks. I’ve captured $1 personal details so far."],
          [/Permanent save is the next system we[’']ll connect, but this guided flow now covers the full CLARA Behavioral Intelligence Framework(?: with personal details)?\./g, "Later, we’ll connect this to CLARA’s saved memory. For now, this helps me understand your situation more clearly."],
          [/Here[’']s the latest captured context from this session:/g, "Here’s what I’ve understood from you so far:"],
          [/Review captured context/g, "Review what CLARA understood"],
          [/Permanent saving comes next when we connect the memory store\./g, "Once saving is connected, you’ll be able to keep this as part of your CLARA profile."],
          [/No captured context yet\./g, "I haven’t captured anything yet."],
          [/Analyzing that context\.\.\./g, "Understanding your answer..."],
          [/custom context/g, "personal context"],
          [/AI interpret/g, "understand"],
          [/for this session/g, "while we talk"],
        ];
        const makeNatural = (value) => copyRules.reduce((text, [pattern, replacement]) => text.replace(pattern, replacement), value);
        const polishTextNode = (node) => { const next = makeNatural(node.nodeValue || ""); if (next !== node.nodeValue) node.nodeValue = next; };
        const polishTree = (root = document.getElementById("root")) => {
          if (!root) return;
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          let node = walker.nextNode();
          while (node) { polishTextNode(node); node = walker.nextNode(); }
        };
        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) for (const node of mutation.addedNodes) {
            if (node.nodeType === Node.TEXT_NODE) polishTextNode(node);
            else if (node.nodeType === Node.ELEMENT_NODE) polishTree(node);
          }
        });
        document.addEventListener("DOMContentLoaded", () => {
          const root = document.getElementById("root");
          polishTree(root);
          if (root) observer.observe(root, { childList: true, subtree: true });
        });
      })();
    </script>

    <script>
      (() => {
        if (window.__claraBehavioralMemoryTrainingInstalled) return;
        window.__claraBehavioralMemoryTrainingInstalled = true;

        const memoryRules = `
CLARA BEHAVIORAL INTELLIGENCE FRAMEWORK:
- Treat Talk to CLARA as a 4-layer understanding system for the future Me page, not as a plain questionnaire.
- Layer 1 Core Identity: income pattern, living situation, responsibilities, work type, relationship status, dependents, current financial pressure, survival pressure, main goal, emotional trend.
- Layer 2 Behavioral Spending Profile: emotional triggers, stress spending habits, reward system, impulse purchases, spending weakness, coping habits, motivation style, financial fear, guilt pattern, social pressure.
- Layer 3 Life Pattern Intelligence: schedule, sleep, work exhaustion, social environment, relationship conflict, hobbies, energy trends, burnout signs.
- Layer 4 Financial Infrastructure: wallets, budgets, emergency fund, savings goals, recurring expenses, debt, subscriptions, transfers, payday cycle.
- When the user asks "you know me now?", "what do you remember about me?", or "what did CLARA understand?", summarize by these 4 layers in warm human language.
- Never expose internal keys like burnoutIndicators.prevention, wallets.primary, schema IDs, tags, JSON, database, or session.
- Translate raw answers into natural observations. Example: "GCash" becomes "GCash seems to be your main spending wallet."
- If a later money decision connects to a known pattern, reference only ONE relevant pattern naturally, then help with the current decision.
- If income cutoff dates are already known, do not ask the same payday cycle question again. Move to what happens after payday instead.
- Keep CLARA curious, observant, emotionally aware, and practical.`;

        const getVisibleClaraContext = () => {
          try {
            const text = String(document.getElementById("root")?.innerText || "").replace(/\n{3,}/g, "\n\n").trim();
            return text ? text.slice(-6200) : "No visible Talk to CLARA context found.";
          } catch { return "No visible Talk to CLARA context found."; }
        };
        const shouldPatchGemini = (input) => /generativelanguage\.googleapis\.com/i.test(typeof input === "string" ? input : input?.url || "") && /generateContent/i.test(typeof input === "string" ? input : input?.url || "");
        const addMemoryTrainingToBody = (body) => {
          if (!body?.contents?.[0]?.parts?.[0]?.text) return body;
          const currentPrompt = String(body.contents[0].parts[0].text || "");
          if (currentPrompt.includes("CLARA BEHAVIORAL INTELLIGENCE FRAMEWORK") || !currentPrompt.includes("You are CLARA")) return body;
          const addition = `\n\n${memoryRules}\n\nVISIBLE RECENT TALK TO CLARA CONTEXT, USE ONLY IF RELEVANT:\n${getVisibleClaraContext()}\n\nReminder: reply as CLARA in natural user-facing language, not system language.`;
          return { ...body, contents: body.contents.map((content, index) => index !== 0 ? content : { ...content, parts: content.parts.map((part, partIndex) => partIndex === 0 && typeof part.text === "string" ? { ...part, text: `${part.text}${addition}` } : part) }) };
        };
        const originalFetch = window.fetch?.bind(window);
        if (!originalFetch) return;
        window.fetch = async (input, init = {}) => {
          if (!shouldPatchGemini(input) || !init?.body || typeof init.body !== "string") return originalFetch(input, init);
          try { return originalFetch(input, { ...init, body: JSON.stringify(addMemoryTrainingToBody(JSON.parse(init.body))) }); }
          catch { return originalFetch(input, init); }
        };
      })();
    </script>

    <script>
      (() => {
        if (window.__claraFrameworkFlowGuardInstalled) return;
        window.__claraFrameworkFlowGuardInstalled = true;
        const rootText = () => String(document.getElementById("root")?.innerText || "");
        const findButton = (label) => [...document.querySelectorAll("button")].find((button) => button.innerText.trim().toLowerCase() === label.toLowerCase());
        const inferKnownPayday = (text) => {
          if (!/What exact cutoff dates do you usually receive income\?/i.test(text)) return "";
          if (/Every 10 and 25/i.test(text)) return "Every 10 and 25";
          if (/15 and 30/i.test(text)) return "15 and 30";
          if (/Weekly|every friday|other friday|every other friday/i.test(text)) return "Weekly";
          if (/Irregular cutoff|irregular/i.test(text)) return "Irregular";
          if (/End of month/i.test(text)) return "Once a month";
          return "";
        };
        let lastAutoClick = 0;
        const guardDuplicatePaydayQuestion = () => {
          const text = rootText();
          if (!/When is your usual payday cycle\?/i.test(text)) return;
          if (/What usually happens to your spending right after payday\?/i.test(text)) return;
          const known = inferKnownPayday(text);
          if (!known || Date.now() - lastAutoClick < 1200) return;
          const button = findButton(known);
          if (!button) return;
          lastAutoClick = Date.now();
          setTimeout(() => button.click(), 250);
        };
        const observer = new MutationObserver(guardDuplicatePaydayQuestion);
        document.addEventListener("DOMContentLoaded", () => {
          const root = document.getElementById("root");
          if (root) observer.observe(root, { childList: true, subtree: true, characterData: true });
          guardDuplicatePaydayQuestion();
        });
      })();
    </script>

    <script>
      (() => {
        if (window.__claraCommitmentCoachingChoiceInstalled) return;
        window.__claraCommitmentCoachingChoiceInstalled = true;

        const welcomeSessionUrl = "https://forms.gle/58cJ2wJVpC4H5qFS8";
        const normalize = (value) => String(value || "").replace(/\s+/g, " ").trim();
        const openWelcomeSessionForm = () => {
          try {
            const popup = window.open(welcomeSessionUrl, "_blank", "noopener,noreferrer");
            if (popup) return;
          } catch {}
          window.location.assign(welcomeSessionUrl);
        };
        const closeWalkthroughIntro = () => document.querySelector("[data-clara-walkthrough-intro='true']")?.remove();
        const openWalkthroughIntro = () => {
          closeWalkthroughIntro();
          const overlay = document.createElement("div");
          overlay.dataset.claraWalkthroughIntro = "true";
          overlay.className = "fixed inset-0 z-[100000] flex items-center justify-center overflow-y-auto bg-[#020817] px-[clamp(16px,5vw,30px)] pb-[max(16px,env(safe-area-inset-bottom))] pt-[max(16px,env(safe-area-inset-top))] text-white";
          overlay.innerHTML = `
            <div class="pointer-events-none fixed inset-0 overflow-hidden">
              <div class="absolute -left-28 -top-32 h-80 w-80 rounded-full bg-cyan-400/[0.08] blur-3xl"></div>
              <div class="absolute -bottom-32 -right-24 h-96 w-96 rounded-full bg-violet-600/[0.11] blur-3xl"></div>
            </div>
            <section role="dialog" aria-modal="true" class="relative flex h-[calc(100dvh-32px)] max-h-[820px] w-full max-w-[430px] items-center justify-center text-white">
              <article class="relative flex h-[calc(100%_-_100px)] min-h-[520px] max-h-[716px] w-[calc(100%_-_32px)] max-w-[398px] flex-col overflow-y-auto rounded-[32px] border border-cyan-100/16 bg-[linear-gradient(150deg,rgba(7,54,71,0.96),rgba(8,20,54,0.97)_48%,rgba(34,14,79,0.97))] px-5 py-6 shadow-[inset_0_1px_0_rgba(255,255,255,0.08),0_18px_46px_rgba(0,0,0,0.28)] sm:px-6 sm:py-7">
                <div class="pointer-events-none absolute inset-0 overflow-hidden rounded-[32px]"><div class="absolute -left-20 -top-24 h-56 w-56 rounded-full bg-cyan-300/[0.09] blur-3xl"></div><div class="absolute -bottom-24 -right-16 h-60 w-60 rounded-full bg-violet-500/[0.14] blur-3xl"></div></div>
                <button type="button" data-clara-walkthrough-close="true" class="absolute right-5 top-5 z-20 inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-white/18 bg-slate-950/24 text-white/72 shadow-[inset_0_1px_0_rgba(255,255,255,0.08)] backdrop-blur-md transition hover:bg-white/[0.11] hover:text-white">×</button>
                <div class="relative z-10 flex min-h-full flex-col">
                  <div class="pr-12"><span class="inline-flex w-fit items-center rounded-full border border-cyan-100/20 bg-cyan-300/10 px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-[0.1em] text-cyan-100">Free 30-minute 1-on-1 session</span></div>
                  <h1 class="mt-5 max-w-[19rem] text-[clamp(2rem,8.5vw,2.45rem)] font-black leading-[0.98] tracking-[-0.05em] text-white">Book Your Free CLARA Walkthrough</h1>
                  <div class="mt-6 flex flex-1 flex-col justify-center gap-5">
                    <div class="rounded-[22px] bg-white/[0.045] px-4 py-5 shadow-[inset_0_1px_0_rgba(255,255,255,0.045)]"><div class="flex items-start gap-3.5"><div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[14px] bg-cyan-300/[0.1] text-cyan-100/90">⌾</div><p class="min-w-0 text-[15px] font-medium leading-[1.65] text-slate-100/86">Get a free one-on-one session with a CLARA guide who can answer your questions, help you understand the app, and show you the features most relevant to you.</p></div></div>
                    <div class="rounded-[22px] bg-white/[0.055] px-4 py-5 shadow-[inset_0_1px_0_rgba(255,255,255,0.05)]"><div class="flex items-start gap-3.5"><div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[14px] bg-cyan-300/[0.1] text-cyan-100/90">✓</div><div class="min-w-0"><h2 class="text-[22px] font-black leading-[1.05] tracking-[-0.035em] text-white">What happens next</h2><p class="mt-3 text-[14px] font-medium leading-[1.65] text-white/82">Complete a short form, tell us what you need help with, and choose your preferred schedule.</p></div></div></div>
                  </div>
                  <div class="pt-6"><div class="border-t border-white/[0.08] pt-5"><p class="text-[13px] font-medium leading-[1.6] text-slate-300/68">No payment required. You do not need to finish setting up CLARA before booking.</p><button type="button" data-clara-walkthrough-reserve="true" class="mt-5 inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-[17px] border border-cyan-100/20 bg-[linear-gradient(100deg,rgba(14,165,233,0.96),rgba(99,102,241,0.98))] px-4 text-[12px] font-extrabold tracking-[0.02em] text-white shadow-[0_14px_30px_rgba(37,99,235,0.26)] transition hover:brightness-110 active:scale-[0.99]">Reserve My Free Session ↗</button></div></div>
                </div>
              </article>
            </section>`;
          overlay.addEventListener("click", (event) => { if (event.target === overlay) closeWalkthroughIntro(); });
          overlay.querySelector("[data-clara-walkthrough-close='true']")?.addEventListener("click", closeWalkthroughIntro);
          overlay.querySelector("[data-clara-walkthrough-reserve='true']")?.addEventListener("click", () => {
            closeWalkthroughIntro();
            openWelcomeSessionForm();
          });
          document.body.appendChild(overlay);
        };
        const makeGuideButton = (extraClass = "") => {
          const guideButton = document.createElement("button");
          guideButton.type = "button";
          guideButton.dataset.claraGuideFirstButton = "true";
          guideButton.className = `${extraClass} rounded-full border border-cyan-100/20 bg-cyan-100/[0.1] px-4 py-3 text-sm font-black text-cyan-50 transition hover:bg-cyan-100/[0.14] active:scale-[0.99]`;
          guideButton.textContent = "Talk to a CLARA Guide First";
          guideButton.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            openWalkthroughIntro();
          });
          return guideButton;
        };
        const findCommitmentOffer = () => [...document.querySelectorAll("div")].find((node) => {
          const text = normalize(node.innerText);
          return text.includes("Monthly Commitment") && text.includes("CLARA Commitment") && text.includes("₱249/month");
        });
        const patchFinalBookletPage = () => {
          const startButton = [...document.querySelectorAll("button")].find((button) => {
            const text = normalize(button.innerText);
            const articleText = normalize(button.closest("article")?.innerText || "");
            return text === "Start My Commitment" && articleText.includes("Ready to Commit?") && articleText.includes("07 / FINAL PAGE");
          });
          if (!startButton || startButton.parentElement?.querySelector("[data-clara-guide-first-button='true']")) return;
          const guideButton = makeGuideButton("mt-2 w-full bg-white/[0.055] text-white/84");
          const reassurance = document.createElement("p");
          reassurance.dataset.claraCommitmentReassurance = "true";
          reassurance.className = "mt-2 text-[11px] font-bold leading-5 text-cyan-50/58";
          reassurance.textContent = "Not sure yet? Book a free 30-minute walkthrough before deciding. No payment required.";
          startButton.after(guideButton, reassurance);
        };
        const patchCommitmentOffer = () => {
          const offer = findCommitmentOffer();
          if (!offer) return;
          const headings = [...offer.querySelectorAll("h1,h2,h3")];
          const headline = headings.find((node) => /ready to commit/i.test(normalize(node.innerText)) || /ready to commit/i.test(normalize(node.textContent)) || /so\? you are ready/i.test(normalize(node.innerText)));
          if (headline) headline.textContent = "Ready to Commit?";
          const bodyCopy = [...offer.querySelectorAll("p")].find((node) => normalize(node.innerText).includes("Continue CLARA"));
          if (bodyCopy) bodyCopy.textContent = "Start CLARA Commitment now, or talk to a CLARA guide first if you want help deciding.";
          const purchaseButton = [...offer.querySelectorAll("button")].find((button) => /Continue for ₱249\/month|Start My Commitment/i.test(normalize(button.innerText)));
          if (!purchaseButton) return;
          if (/Continue for ₱249\/month/i.test(normalize(purchaseButton.innerText))) purchaseButton.textContent = "Start My Commitment — ₱249/month";
          const actionGroup = purchaseButton.parentElement;
          if (!actionGroup || actionGroup.querySelector("[data-clara-guide-first-button='true']")) return;
          if (!offer.querySelector("[data-clara-commitment-reassurance='true']")) {
            const reassurance = document.createElement("p");
            reassurance.dataset.claraCommitmentReassurance = "true";
            reassurance.className = "mt-3 rounded-[18px] border border-cyan-100/12 bg-cyan-100/[0.06] px-3 py-2 text-xs font-bold leading-5 text-cyan-50/70";
            reassurance.textContent = "Not sure yet? Book a free 30-minute walkthrough before deciding. No payment required.";
            actionGroup.before(reassurance);
          }
          purchaseButton.after(makeGuideButton(""));
        };
        const patchCommitmentChoices = () => { patchFinalBookletPage(); patchCommitmentOffer(); };
        const observer = new MutationObserver(patchCommitmentChoices);
        document.addEventListener("DOMContentLoaded", () => {
          const root = document.getElementById("root");
          if (root) observer.observe(root, { childList: true, subtree: true, characterData: true });
          patchCommitmentChoices();
        });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="/src/life-stage-opening-page-refine.js"></script>
  </body>
</html>
