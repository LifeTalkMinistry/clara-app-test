<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CLARA</title>

    <!-- Prevent theme flicker before React mounts. -->
    <script>
      (() => {
        try {
          const key = localStorage.getItem("clara_global_theme") || "clara-hero-red-blue";
          document.documentElement.dataset.theme = key;
          document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>

    <style>
      html, body, #root {
        min-height: 100%;
        margin: 0;
        background: #020617;
      }

      #root {
        isolation: isolate;
        background: #020617;
      }

      #clara-boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: sans-serif;
      }

      @keyframes clara-loader-reveal {
        to {
          opacity: 1;
        }
      }

      @keyframes clara-route-settle {
        0% {
          opacity: 0.985;
          transform: translate3d(0, 4px, 0) scale(0.9985);
          filter: saturate(0.98);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
          filter: saturate(1);
        }
      }

      /* Prevent split-second auth/Suspense loader flashes. Real longer loads still appear. */
      .theme-page-shell:has(.animate-spin) {
        opacity: 0;
        animation: clara-loader-reveal 1ms linear 420ms forwards;
      }

      /* Route changes settle like one continuous app surface, not hard page swaps. */
      body.clara-route-soft-settle .theme-page-shell main {
        animation: clara-route-settle 220ms cubic-bezier(.2,.8,.2,1) both;
        backface-visibility: hidden;
        will-change: transform, opacity, filter;
      }

      body.clara-route-soft-settle .theme-page-shell:has(.animate-spin) {
        animation-delay: 560ms;
      }

      .theme-page-shell:has(.animate-spin) > div {
        transform: translateZ(0);
      }

      @media (prefers-reduced-motion: reduce) {
        .theme-page-shell:has(.animate-spin),
        body.clara-route-soft-settle .theme-page-shell main {
          animation-delay: 0ms;
          animation-duration: 1ms;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="clara-boot">CLARA is starting...</div>
    </div>

    <script>
      (() => {
        let settleTimer = null;
        const settleRoute = () => {
          clearTimeout(settleTimer);
          document.body.classList.remove("clara-route-soft-settle");
          requestAnimationFrame(() => {
            document.body.classList.add("clara-route-soft-settle");
            settleTimer = setTimeout(() => {
              document.body.classList.remove("clara-route-soft-settle");
            }, 260);
          });
        };

        window.addEventListener("hashchange", settleRoute);
        window.addEventListener("popstate", settleRoute);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) settleRoute();
        });
      })();
    </script>

    <script>
      (() => {
        const copyRules = [
          [/I[’']ll let AI interpret it and keep it as custom context for this session\./g, "I’ll use your answer to understand your situation better."],
          [/Got it\. That answer is more specific, so I[’']ll treat it as your own pattern instead of forcing it into the buttons\./g, "Got it. That gives me a clearer picture of your situation."],
          [/Thanks\. I captured (\d+) starter memory points for this session\./g, "Thanks. I’ve captured $1 personal details so far."],
          [/Permanent save is the next system we[’']ll connect, but this guided flow now covers the full CLARA Behavioral Intelligence Framework(?: with personal details)?\./g, "Later, we’ll connect this to CLARA’s saved memory. For now, this helps me understand your situation more clearly."],
          [/Here[’']s the latest captured context from this session:/g, "Here’s what I’ve understood from you so far:"],
          [/Permanent saving comes next when we connect the memory store\./g, "Once saving is connected, you’ll be able to keep this as part of your CLARA profile."],
          [/No captured context yet\./g, "I haven’t captured anything yet."],
          [/Analyzing that context\.\.\./g, "Understanding your answer..."],
          [/custom context/g, "personal context"],
          [/AI interpret/g, "understand"],
          [/for this session/g, "while we talk"],
        ];

        const makeNatural = (value) => copyRules.reduce((text, [pattern, replacement]) => text.replace(pattern, replacement), value);
        const polishTextNode = (node) => {
          const next = makeNatural(node.nodeValue || "");
          if (next !== node.nodeValue) node.nodeValue = next;
        };
        const polishTree = (root = document.getElementById("root")) => {
          if (!root) return;
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          let node = walker.nextNode();
          while (node) {
            polishTextNode(node);
            node = walker.nextNode();
          }
        };

        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            for (const node of mutation.addedNodes) {
              if (node.nodeType === Node.TEXT_NODE) polishTextNode(node);
              else if (node.nodeType === Node.ELEMENT_NODE) polishTree(node);
            }
          }
        });

        document.addEventListener("DOMContentLoaded", () => {
          const root = document.getElementById("root");
          polishTree(root);
          if (root) observer.observe(root, { childList: true, subtree: true });
        });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
