<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>CLARA</title>
    <meta name="description" content="CLARA Financial Program - Take control of your money." />
    <meta name="theme-color" content="#020617" />

    <!-- 🔥 PRE-HYDRATE THEME TO REMOVE FLASH -->
    <script>
      (() => {
        try {
          const key = localStorage.getItem("clara_global_theme") || "clara-hero-red-blue";
          document.documentElement.dataset.theme = key;
          document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>

    <style>
      html, body, #root {
        min-height: 100%;
        margin: 0;
        background: #020617;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
